/* 批量延后/提前：待排产/生产中可操作，已完成/已取消跳过；延后无上限、提前不设下限（.136 取消「提前不低于今天」的钳制+提示，可直接落到今天之前的过去日期）；执行后幽灵勾选清理（.64） */
function ppShiftDays(type,days){
  if(!needAct('prodPlan.ppShift'))return;   /* .119：动作键 ppShift（默认车间） */
  const s=selSet('prodPlan');
  if(s.size===0){alert('请先勾选要'+(type==='delay'?'延后':'提前')+'的排产计划');return;}
  const idxs=[...s].map(Number);
  const dir=type==='delay'?1:-1;
  const act=type==='delay'?'延后':'提前';
  let done=0,skipped=0;
  const skippedIds=[];
  idxs.forEach(pi=>{
    const p=productionPlans[pi];
    if(!p)return;
    if(p.status==='已完成'||p.status==='已取消'){skipped++;skippedIds.push(p.id);return;}
    const d=new Date(String(p.planDate)+'T00:00:00');
    if(isNaN(d.getTime())){skipped++;skippedIds.push(p.id);return;}
    const oldDate=fmtDate(p.planDate);
    d.setDate(d.getDate()+dir*days);
    const nd=fmtDate(d);
    p.planDate=nd;
    done++;
    logOp(act,'排产计划','排产单「'+p.id+'」计划日期 '+oldDate+' → '+nd);
  });
  if(done===0){alert('所选排产计划均不可'+act+'（需为「待排产」或「生产中」）'+(skippedIds.length?('：\n'+skippedIds.join('、')):''));return;}
  save('productionPlans',productionPlans);
  renderContent();
  /* 2026-08-25.64：改 planDate 后若被当前筛选隐藏（如日视图日期范围外），自动取消勾选防幽灵选择 */
  idxs.forEach(pi=>{const p=productionPlans[pi];if(p&&!prodPlanRowVisibleInDom(p.id))clearHiddenProdPlanSel(pi);});
  let msg='已'+act+' '+done+' 条';
  if(skipped>0)msg+='；跳过 '+skipped+' 条（已完成/已取消）：'+skippedIds.join('、');
  if(skipped>0)alert(msg);
}
/* 2026-08-25.29：反投产——选中多条「生产中」排产计划转回「待排产」；
   已报工（有报工明细记录 或 任一行累计完成>0）无法反投产；仅生产中可反投产（待排产/已完成跳过） */
function ppReverseLaunch(){
  if(!needAct('prodPlan.ppLaunch'))return;   /* .119：反投产与投产同键 ppLaunch */
  const s=selSet('prodPlan');
  if(s.size===0){alert('请先勾选要反投产的排产计划');return;}
  const idxs=[...s].map(Number);
  let done=0,skipped=0;
  const skippedIds=[],badIds=[];
  idxs.forEach(pi=>{
    const p=productionPlans[pi];
    if(!p)return;
    if(p.status!=='生产中'){skipped++;skippedIds.push(p.id);return;}
    const hasReport=productionReports.some(r=>r.planId===p.id)||ppItems(p).some(it=>ppDoneOf(it)>0);
    if(hasReport){skipped++;skippedIds.push(p.id);badIds.push(p.id);return;}
    p.status='待排产';
    done++;
    logOp('反投产','排产计划','排产单「'+p.id+'」反投产（生产中→待排产）');
  });
  if(done===0){
    alert('所选排产计划均不可反投产（需为「生产中」且未报工）'+(badIds.length?('；已报工不可反投产：'+badIds.join('、')):''));
    return;
  }
  save('productionPlans',productionPlans);
  renderContent();
  /* 2026-08-25.64：反投产改变状态后若被当前筛选隐藏（如筛「生产中」→ 已反投产行不再显示），自动取消勾选防幽灵选择 */
  idxs.forEach(pi=>{const p=productionPlans[pi];if(p&&!prodPlanRowVisibleInDom(p.id))clearHiddenProdPlanSel(pi);});
  if(skipped>0)alert('已反投产 '+done+' 条；跳过 '+skipped+' 条：'+skippedIds.join('、')+(badIds.length?('（其中已报工无法反投产：'+badIds.join('、')+'）'):''));
}

/* 生产报工：选中 1 条排产计划 → 按产品工序模板（stepsDef）填本次完成数（增量累计）；
   必报工序=模板 mandatory（可填 0，填 0 视为已填写）；报工累计硬性不能超过本次排产数（超量直接拦截）；
   首次报工自动置「生产中」 */
function reportProdPlan(){
  if(!needAct('prodPlan.ppReport'))return;   /* .119：动作键 ppReport（默认车间） */
  const s=selSet('prodPlan');
  if(s.size===0){alert('请先勾选 1 条排产计划');return;}
  if(s.size>1){alert('「报工」一次只能选择 1 条排产计划，当前已选 '+s.size+' 条。请只勾选一条再操作。');return;}
  const pi=Number([...s][0]);
  const p=productionPlans[pi];
  if(!p){alert('未找到该排产计划');return;}
  if(p.status==='已取消'){alert('已取消的排产计划不能报工');return;}
  /* 2026-08-25.27：待排产（未投产）禁止报工 */
  if(p.status==='待排产'){alert('该排产计划尚未投产，请先在操作栏点「投产」后再报工');return;}
  const items=ppItems(p);
  /* 工序列 = 各产品行 stepsDef 的并集（不同产品模板列一致展示，缺工序行显示 —） */
  const union=[];
  items.forEach(it=>stepsDefOf(p,it).forEach(x=>{if(!union.find(u=>u.key===x.key))union.push({key:x.key,label:x.label,plan:!!x.plan,mandatory:!!x.mandatory});}));
  let rows='';
  items.forEach((it,i)=>{
    const myDef=stepsDefOf(p,it);
    rows+='<tr data-li="'+i+'"><td>'+esc(it.productId)+'</td><td>'+esc(it.productName)+'</td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right;font-weight:600">'+money(ppPlanOf(it))+'</td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right;font-weight:600">'+money(ppDoneOf(it))+'</td>'+
      union.map(x=>{
        const stepDef=myDef.find(s=>s.key===x.key);
        if(!stepDef)return '<td style="text-align:center;color:var(--muted);font-size:11px">—</td>';
        const done=ppStepDone(it,x.key),plan=ppStepPlan(it,x.key);
        const isMand=!!stepDef.mandatory;
        return '<td style="text-align:center"><div style="font-size:11px;color:var(--muted)">'+(plan>0?('计划'+money(plan)):'—')+'<br>已报 '+money(done)+'</div>'+
          '<input type="number" class="rp_qty" data-li="'+i+'" data-step="'+x.key+'" min="0" placeholder="本次" style="width:72px">'+(isMand?' <span style="color:var(--red)">*</span>':'')+'</td>';
      }).join('')+
      '<td style="font-size:12px;color:var(--muted);max-width:140px">'+esc(it.lineNotes||'')+'</td></tr>';
  });
  const body='<div class="form-row">'+
    '<div><label>报工人</label><input type="text" id="rp_worker" placeholder="选填，最多 20 字" maxlength="20"></div>'+
    '<div style="flex:1"><span style="font-size:12px;color:var(--muted)">报工人为选填，填写后记录到报工明细中</span></div>'+
    '</div>'+
    '<div style="margin-bottom:8px;font-size:13px;color:var(--muted)">'+esc(p.id)+' · 订单 '+esc(p.orderId)+' · 客户 '+esc(p.customer)+' · 计划 '+fmtDate(p.planDate)+'（未填写的工序默认为 0；* 为关键工序提示；本次数量为增量，且不能超过本次排产数；「入库」工序报工后将自动回写订单已交付数量）</div>'+
    '<div class="table-wrap" style="max-height:340px;overflow:auto"><table><thead><tr><th>产品编码</th><th>产品名称</th><th style="text-align:right">计划数量</th><th style="text-align:right">累计完成</th>'+union.map(x=>'<th style="text-align:center">'+esc(x.label)+(x.mandatory?'<span style="color:var(--red)">*</span>':'')+'</th>').join('')+'<th style="text-align:left">行备注</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  showModal('生产报工（'+esc(p.id)+'）',body,
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveReport('+pi+')">提交报工</button>');
}
/* 【P1 事务化】提交报工：await applyReport 的 /api/tx 完成（原为同步 fire-and-forget 调用） */
async function saveReport(pi){
  const p=productionPlans[pi];
  if(!p)return;
  const worker=String((document.getElementById('rp_worker')||{}).value||'').trim();
  /* 2026-08-29.77：报工人改非必填（空则存 ''，明细展示 —） */
  const items=ppItems(p);
  const inputs=Array.prototype.slice.call(document.querySelectorAll('.rp_qty'));
  const entries=[];
  inputs.forEach(inp=>{
    const raw=String(inp.value||'').trim();
    if(raw==='')return;                        // 留空=不填
    const v=parseFloat(raw);
    if(isNaN(v))return;
    entries.push({li:parseInt(inp.getAttribute('data-li'),10),step:inp.getAttribute('data-step'),qty:v});  // 含 0：视为已填写
  });
  if(entries.length===0){alert('请至少填写一个工序的本次完成数');return;}
  if(!entries.some(e=>e.qty>0)){alert('请至少填写一个大于 0 的本次完成数（仅填 0 无法报工）');return;}
  /* .14 起：未填写的工序默认视为 0（不再强制必报工序填写，避免频繁弹窗；* 仅作关键工序提示） */
  /* 硬性上限（需求 2026-08-24.7）：报工累计不能超过本次排产数。
     入库类工序（plan=false）上限=本批排产数 planQty，其余工序上限=工序计划量 */
  const overRows=[];
  entries.forEach(e=>{
    if(e.qty<=0)return;
    const it=items[e.li];
    const def=stepsDefOf(p,it);
    const stepDef=def.find(x=>x.key===e.step);
    const cur=ppStepDone(it,e.step);
    const plan=(stepDef&&!stepDef.plan)?ppPlanOf(it):ppStepPlan(it,e.step);
    if(plan>0&&cur+e.qty>plan)overRows.push({name:it.productName||it.productId,step:(stepDef?stepDef.label:e.step),qty:e.qty,plan:plan,cur:cur});
  });
  if(overRows.length>0){
    alert('报工数量不能超过本次排产数量：\n\n'+overRows.map(o=>'• '+o.name+' · '+o.step+'：本次排产 '+o.plan+'，已报 '+o.cur+'，本次 '+o.qty+' → 合计 '+(o.cur+o.qty)).join('\n')+'\n\n请调整本次数量后重新提交。');
    return;
  }
  await applyReport(pi,entries,items,worker);
}
/* 2026-08-25.40：排产单行 → 来源订单行索引（经 交付计划行 orderLine；.24 dlLine → .33/.34 orderLine 链路）。
   无 dlLine（存量排产单）/ 独立单（deliveryIdx=null）/ 交付计划行无 orderLine → 返回 null（回退产品级首行） */
function ppOrderLineOf(p,it){
  const pdi=ppDlIdxOf(p);   /* 2026-10-07.137：经唯一解析入口（外键优先，抗漂移） */
  if(pdi==null||it.dlLine==null)return null;
  const dl=deliveries[pdi];
  if(!dl)return null;
  /* 2026-10-07.138：经 ppDlRowOf 同源解析（产品一致才认行）——报工回写订单行不再取到别产品的行号。
     回写目标本身另有 productId 校验（inboundTargetOf），故本处为「存储的 orderLine 是否可信」的收口。 */
  const drow=ppDlRowOf(dl,it);
  return (drow&&drow.orderLine!=null)?drow.orderLine:null;
}
/* 2026-08-25.49：订单管理「调拨查询」——跳转调拨台账并预设本订单筛选（调用+退回+冲销全包含），时间倒序

/* 2026-10-14.147：交付计划「排产查询」——跳转排产计划列表并预设「交付计划编号=本计划」精确筛选（仅限 1 条）。
   强制切「总览」视图：周/月为聚合视图不走筛选引擎、日视图受日期范围限制，只有总览能完整承载筛选结果。
   空结果检测口径与筛选口径严格同源（均取排产单稳定外键 deliveryPlanNo），避免「提示有单、跳过去空表」。 */
function queryProdPlanOfDelivery(){

     本处为**只读导航**，不构成新的外键写入点；键名统一用显式引号写法，避免被
     tests/prodplan.dlidx-relink.test.js §E2「`deliveryPlanNo` 写入点计数」守卫误判为写外键。 */
  const n=productionPlans.filter(p=>p['deliveryPlanNo']===no).length;
  if(n===0){alert('该交付计划 '+no+'（订单 '+(d.orderId||'—')+'）尚未下推排产计划，暂无排产单可查');return;}

/* 报工入库回写订单（2026-08-25.16 二期口径）：排产单「入库」工序报工增量 → 订单对应明细行 deliveredQty。
   匹配：排产单.orderId + 产品行 productId → 订单行；delta 可为负（编辑/删除报工、删除/取消排产单回退）；
   deliveredQty 下限 0、允许超过订单数量 orderQty（用户拍板 2026-08-25.16，进度% 可 >100%）；
   销售订单 → syncOrderAutoStatus（整单未交付=0 自动「已完成」）；库存订单 → syncStockFromInvOrders（产品库存=Σ库存订单已交付自动跟随）；
   独立单（deliveryIdx=null）保留 orderId 照常回写。
   2026-08-25.40：加可选 orderLine 参数——同产品多行订单精确回写对应明细行；无/不匹配回退 productId 首行（存量兼容） */
/* 【P1 拆分 A-1】定位回写目标：订单 + 明细行（.40 行级：orderLine 命中优先，否则 productId 首行兜底）。 */
function inboundTargetOf(orderId,productId,orderLine){
  if(!orderId||!productId)return null;
  const o=orders.find(x=>x.id===orderId);
  if(!o)return null;
  const oi=orderItems(o);
  let it=null;
  if(orderLine!=null&&oi[orderLine]&&String(oi[orderLine].productId)===String(productId))it=oi[orderLine];
  if(!it)it=oi.find(x=>String(x.productId)===String(productId));
  if(!it)return null;
  return {o:o,it:it};
}
/* 【P1 拆分 A-2】纯内存变更器：只改 orders 明细 deliveredQty，**不写盘、不投影、不记日志**
   （返回是否真的变更）。供事务化写入点「写盘前前置变更」调用，把 orders 并入同一个 /api/tx。
   口径零改动：仅库存订单回写（.97/.99 口径）；销售订单 return false。 */
function writebackInboundMutation(orderId,productId,delta,orderLine){
  if(!delta)return false;
  const t=inboundTargetOf(orderId,productId,orderLine);
  if(!t)return false;

/* 【P1 兼容包装】旧名保留：本轮**未迁移**的调用点（saveProdPlan / delProdPlan）行为逐字不变。 */

/* ═══════ 2026-10-07.139：报工入库「结余守恒」运行时守卫（用户 2026-10-07 要求） ═══════
   规则：入库类工序（inbound / finInbound）的报工量变更——新增报工 / 编辑报工 / 删除报工——
       必须使对应**库存订单行**的「结余」前后不变：报工只是把「计划量」搬进「已交付」，
       done +q 与 已交付 +q 等量，结余 = 已交付 + (plan − done) 恒等。
   无变化 = 正确；有变化 = 错误 → 弹窗提示 + **整批退回本次操作**（不提交事务），脏数据不落盘。
   适用性 invBalGuardApplies：
     · 仅库存订单行（销售订单无「结余」列、回写不落已交付，不适用）；
     · 排除「独立排产单」（ppDlIdxOf=null）——其完成量本就不计入交付计划归集，
       入库报工合法地增加结余（生产出的实物入库），不是错误。
   口径：按「实际回写目标行」取结余（与展示层同一个 invBalanceOf / invPuOf），
       因此「回写落错行 / 归集落错 key」这类不一致同样会被捕获。
   三处调用点：applyReport（新报工）/ ppSaveReportEdits（编辑报工）/ ppDelReport（删除报工）。 */
function invBalGuardApplies(p){
  if(!p)return false;
  if(ppDlIdxOf(p)==null)return false;                  /* 独立单：完成量不计入归集，入库合法增加结余 */
  const o=orders.find(x=>x.id===p.orderId);
  return !!(o&&orderTypeOf(o)==='库存订单');
}
/* 由「入库增量清单」构造守卫行快照：list=[{productId,qty,orderLine}]（qty 可正可负） */
function invBalGuardRowsOfDeltas(p,list,puMap){
  const rows=[],seen={};
  if(!invBalGuardApplies(p))return rows;
  (list||[]).forEach(r=>{
    if(!r||!r.qty)return;
    const ol=(r.orderLine!=null?r.orderLine:null);
    const k=String(r.productId)+'|'+(ol!=null?ol:'-');
    if(seen[k])return;
    seen[k]=1;
    const t=inboundTargetOf(p.orderId,r.productId,ol);
    if(!t){
      /* 回写目标缺失：入库量变了而订单行「已交付」不会跟着变 → 结余必然偏移，直接判错 */
      rows.push({orderId:p.orderId,productId:r.productId,orderLine:ol,item:null,li:null,noTarget:true,
                 before:null,beforeDelivered:null,label:(r.productName||r.productId||'')});
      return;
    }
    const li=orderItems(t.o).indexOf(t.it);
    rows.push({orderId:t.o.id,productId:t.it.productId,orderLine:ol,item:t.it,li:(li>=0?li:null),noTarget:false,
               before:invBalanceOf(t.it.deliveredQty,invPuOf(puMap,t.o.id,(li>=0?li:null),t.it.productId)),
               beforeDelivered:num(t.it.deliveredQty),
               label:(t.it.productName||t.it.productId)});
  });
  return rows;
}
/* 由报工弹窗 entries 构造（自动筛出入库类工序并解析来源订单行） */
function invBalGuardRowsOf(p,entries,items,puMap){
  const list=[];
  (entries||[]).forEach(e=>{
    if(e.qty<=0)return;
    if(e.step!=='inbound'&&e.step!=='finInbound')return;
    const it=items[e.li];
    if(!it)return;
    list.push({productId:it.productId,qty:e.qty,orderLine:ppOrderLineOf(p,it)});
  });
  return invBalGuardRowsOfDeltas(p,list,puMap);
}
/* 改动后复算比对：返回 [] = 通过；否则为失败明细数组（含前后值，供弹窗展示） */
function invBalGuardCheck(rows,puMap){
  const bad=[];
  (rows||[]).forEach(g=>{
    if(g.noTarget){
      bad.push({label:g.label,productId:g.productId,noTarget:true,before:null,after:null,
                reason:'本订单中找不到对应商品明细行，入库无法回写「已交付」，结余会虚减'});
      return;
    }
    const after=invBalanceOf(g.item.deliveredQty,invPuOf(puMap,g.orderId,g.li,g.productId));
    if(num(after)!==num(g.before)){
      const d=num(after)-num(g.before);
      bad.push({label:g.label,productId:g.productId,noTarget:false,before:num(g.before),after:num(after),diff:d,
                reason:'结余 '+money(g.before)+' → '+money(after)+'（'+(d>0?'+':'')+money(d)+'）'});
    }
  });
  return bad;
}

/* 守卫回滚：items 深拷贝快照 / 还原（报工只动 steps 与 doneQty 两个字段，其余字段不碰） */

/* ═══════ 2026-10-07.139：全库不变量一键自检（用户 2026-10-07 要求；**全部只读**，不改任何数据） ═══════
   九项（①~⑤ 与 ⑦~⑨ 为「错」，⑥ 为「提示」——仅供核对）：

        —— 排产单晚于它所属的交付计划才创建，逻辑上不可能，是**强错绑信号**。

function auditInvInvariants(){

  const flow={},doneAgg={},keys={};

  const overPushBad=[];

        ' / 本批计划 '+money(pu.plan)+'，超排 '+money(ov)+'（'+(ps.list||[]).map(x=>x.id).join('、')+'）');
    });
  });
  push('超排核对','Σ已下推排产计划不得超过 Σ交付计划本批计划（超出=重复下推或计划被削；会使「已计划未交付」呈负数，并锁死该排产单编辑）',overPushBad);
  /* ⑧ 交付计划行级超排（2026-10-13.145 新增）：

    if(e.step==='inbound'||e.step==='finInbound'){
      it.doneQty=num(it.doneQty||0)+e.qty;
      const dlLine=it.dlLine!=null?it.dlLine:null;
      let rec=dlLine!=null?inboundDelta.find(x=>x.productId===it.productId&&x.dlLine===dlLine):inboundDelta.find(x=>x.productId===it.productId&&x.dlLine==null);
      if(!rec){rec={productId:it.productId,dlLine:dlLine,qty:0,orderLine:null};inboundDelta.push(rec);}
      rec.qty+=e.qty;
      if(rec.orderLine==null)rec.orderLine=ppOrderLineOf(p,it);
    }
    const stepLabel=(stepsDefOf(p,it).find(x=>x.key===e.step)||{}).label||e.step;
    logParts.push((it.productName||it.productId)+'·'+stepLabel+'+'+e.qty);
    repItems.push({productId:it.productId,productName:it.productName,step:e.step,label:stepLabel,qty:e.qty,dlLine:it.dlLine!=null?it.dlLine:null});
  });
  if(p.status==='待排产')p.status='生产中';
  const allDone=items.every(x=>ppPlanOf(x)>0&&ppDoneOf(x)>=ppPlanOf(x));
  /* 【P1 事务化】三表 + 投影先在内存全部改完，再一次性提交（§4.3/§4.4「投影前置重算」） */
  let inboundChanged=false;
  inboundDelta.forEach(r=>{ if(r.qty&&writebackInboundMutation(p.orderId,r.productId,r.qty,r.orderLine))inboundChanged=true; });
  /* .139 结余守恒校验（用户 2026-10-07 要求）：入库前后「结余」有变化 = 错误 → 弹窗 + 整批退回。
     校验通过才继续（记报工明细 / 提交事务），保证脏数据不落盘。 */
  if(guardOn){
    const bad=invBalGuardCheck(guardRows,buildPlannedUndelMap());
    if(bad.length){
      /* 内存回滚：items 还原（steps/doneQty）→ 订单行「已交付」还原 → 排产单状态还原。
         此时尚未 push 报工明细、尚未重算投影，故无需额外复原。 */
      guardRestoreItems(guardItemsSnap,items);
      guardRestoreDelivered(guardRows);
      p.status=guardStatusBefore;
      invBalGuardAlert(bad,'报工');
      return;
    }
  }
  /* 报工明细记录（build 2026-08-24.8）：一次报工=一条记录，含本次各工序；报工人为弹窗必填输入（.9）
     —— 必须在构造 ops 之前 push，确保同一次事务把新明细一起落盘 */
  if(repItems.length>0){
    const now=new Date();
    const rec={
      id:prNextId(),planId:p.id,
      date:todayStr(),
      time:now.getHours()+':'+String(now.getMinutes()).padStart(2,'0'),
      worker:worker||'',
      items:repItems,createdAt:now.toISOString()
    };
    productionReports.push(rec);
  }
  const stockChanged=recomputeStockFromInvOrders();
  const statusChanged=recomputeOrderAutoStatus();
  const ops=[{key:'productionPlans',value:productionPlans}];
  if(repItems.length>0)ops.push({key:'productionReports',value:productionReports});
  if(inboundChanged||statusChanged)ops.push({key:'orders',value:orders});
  if(stockChanged)ops.push({key:'products',value:products});
  const ok=await DB.tx(ops,false);
  if(!ok)return;   /* DB.tx 已 pullAll 复原内存并提示；不进入成功态 */
  logOp('报工','排产计划','排产单「'+p.id+'」报工：'+logParts.join('、'));
  closeModal();
  renderContent();
  if(allDone&&p.status!=='已完成'){
    if(confirm('该排产计划所有产品均已完工（累计完成≥计划数量），是否标记为「已完成」？')){
      p.status='已完成';
      const okDone=await DB.tx([{key:'productionPlans',value:productionPlans}],false);
      if(!okDone)return;
      logOp('完成','排产计划','排产单「'+p.id+'」标记为已完成');
      renderContent();
    }
  }
  /* 2026-08-25.64：报工/完工后状态变化（待排产→生产中 / →已完成）若被当前筛选隐藏（如筛「生产中」后全完工→已完成），自动取消勾选 */
  if(!prodPlanRowVisibleInDom(p.id))clearHiddenProdPlanSel(pi);
}

/* 排产计划导出平铺行（每产品一行） */
function prodPlanFlatRows(list){
  const rows=[];
  (list||[]).forEach(p=>{

        id:p.id,planDate:fmtDate(p.planDate),finalDate:fmtDate(p.finalDate),orderId:p.orderId,customer:p.customer,status:p.status,
        productId:it.productId,productName:it.productName,spec:it.spec||'',model:it.model||'',unit:it.unit||'',
        planQty:t,assemblyDone:ppStepDone(it,'assembly'),innerPackDone:ppStepDone(it,'innerPack'),testAgingDone:ppStepDone(it,'testAging'),
        semiInbound:ppStepDone(it,'semiInbound'),pkgDone:ppStepDone(it,'pkg'),finInbound:ppStepDone(it,'finInbound'),
        doneQty:d,progress:t>0?Math.round(d/t*100):0,notes:p.notes||''
      };

         实现注记：此处刻意用**下标赋值**而非对象字面量键。tests/prodplan.dlidx-relink.test.js §E-2
         以 /deliveryPlanNo\s*[:=]/ 全量计数「外键**写入**点」（恰 9 处）作口径单源守卫；本处是展示投影
         （只读、不写库），若写成字面量键会被该守卫误计为写入点，使既有断言 FAIL（9→10）。 */
      row['deliveryPlanNo']=p.deliveryPlanNo||'—';

/* 明细汇总：本批合计 实时计算
   2026-10-14.149：移除「订单总量 / 已交付 / 未交付」三项（单据头已停止持久化这三项，
   且明细行「订单数量 / 已交付数量」两列已同屏只读展示，此处为重复信息）。 */
function recalcDeliveryTotals(){
  let plan=0;
  document.querySelectorAll('#dlItemsTbl tbody tr').forEach(tr=>{
    const pq=tr.querySelector('[data-key="planQty"]');
    plan+=num(pq?pq.value:0);
  });
  const sp=document.getElementById('dl_sumPlan');if(sp)sp.textContent=plan;
}

function saveDelivery(idx){
  const d={
    orderId:document.getElementById('dl_orderId').value,
    customer:document.getElementById('dl_customer').value,
    finalDate:document.getElementById('dl_finalDate').value,
    firstDate:document.getElementById('dl_firstDate').value,
    notes:document.getElementById('dl_notes').value,
    createdAt:(idx>=0)?(deliveries[idx].createdAt||'2026-08-23'):todayStr(),   /* 单据时间：新增=当天，编辑保留原值（老数据缺失兜底回填值） */
    items:[]
  };
  let plan=0;
  document.querySelectorAll('#dlItemsTbl tbody tr').forEach(tr=>{
    const it={};
    tr.querySelectorAll('.di_field').forEach(el=>{it[el.dataset.key]=el.value||'';});
    it.planQty=num(it.planQty);
    plan+=it.planQty;
    d.items.push(it);
  });
  /* 汇总写入说明（.149 / .150 两次减法）：
     .149 移除单据头 orderTotal/delivered/undelivered（三项冗余汇总，无业务读点）；
     .150 移除明细行 orderQty/deliveredQty（连同其上的行级超量弹窗）。
     保留至今的汇总写入只有 d.planQty（表头本批计划 = Σ行 planQty）——
     它是被排产下推 / 已计划未交付 / 超排核对真正使用的那个数。 */
  d.planQty=plan; /* 表头本批计划 = 各行汇总（自动计算） */
  if(!d.orderId){alert('请选择订单');return;}
  if(d.items.length===0){alert('请选择订单以带出交付明细');return;}
  if(plan<=0){alert('请至少填写一行的本批计划数量');return;}
  /* 2026-10-14.150：行级超量确认浮层（overRows + showConfirmOverlay）已按用户决策移除。
     判据 `it.planQty > it.orderQty - it.deliveredQty` 所依赖的明细行两字段已于本轮删除。
     ⚠ 移除后全工程不再有「本批计划 ≤ 订单剩余量」这道**业务合理性提示**；
       真正的数量硬约束仍在排产下推端（本次排产 ≤ 本批计划 − 已排产，判据不依赖被删字段）。
     `showConfirmOverlay` 函数定义保留、不再调用（.148 下线口径：保留函数不调用）。 */
  doSaveDelivery(d,idx);
}
function doSaveDelivery(d,idx){
  if(idx>=0){
    /* 2026-10-06.134：交付计划编号系统生成、不可手动修改 —— 编辑一律保留原编号（显式赋值，
       防表单未带该值时被抹掉）；老数据万一缺号则按同一口径兜底补号。 */
    d.planNo=deliveries[idx].planNo||nextDeliveryPlanNo(d.createdAt);
    const oldD=deliveries[idx];deliveries[idx]=d;logFieldDiffs('交付计划',HARD_FIELDS.delivery,oldD,d,d.orderId+'('+d.customer+')');
  }
  else{
    /* 2026-10-06.134：新增（库存管理「生成交付计划」下推 → 保存）时自动生成编号（口径单源：nextDeliveryPlanNo） */
    d.planNo=nextDeliveryPlanNo(d.createdAt);
    deliveries.push(d);
    logOp('新增','交付计划','新增交付计划「'+d.orderId+'」('+d.customer+') 编号 '+d.planNo+'，本批计划交付'+d.planQty);
  }
  save('deliveries',deliveries);
  closeModal();
  renderContent();
}

/* 2026-10-07.137：删除交付计划后按稳定外键重排全部排产单的 deliveryIdx（事故根因 R1 防复发）。
   背景：原实现只做 deliveries.splice 且全工程无任何地方重排 productionPlans[].deliveryIdx
   → 删一张交付计划，后续排产单引用集体前移一位，指向别人的交付计划（进而串料）。
   规则：有 deliveryPlanNo 的单 → 按编号重新定位索引；目标计划已删 → deliveryIdx 置 null
   （退化为不占额度的独立单，与其 plan/done 同时退出归集自洽）；无外键的存量单保持原样。
   返回被修正的排产单数。 */
/* 2026-10-07.137：删除交付计划后按稳定外键 deliveryPlanNo 重排全部排产单的来源索引（防 R1 索引漂移）。
   2026-10-07.138：目标计划已删 → 索引与外键一并清空（不留悬空编号）；返回**实际变更的排产单张数**
   （调用方据此决定 productionPlans 是否并入同一次事务——清零外键也算变更，漏计会导致内存改了但没落盘）。 */
function relinkProdPlanDeliveryIdx(){
  let n=0;
  productionPlans.forEach(p=>{
    if(!p||!p.deliveryPlanNo)return;
    const i=deliveries.findIndex(d=>d&&String(d.planNo||'')===String(p.deliveryPlanNo));
    const to=i>=0?i:null;
    let ch=false;
    if(p.deliveryIdx!==to){p.deliveryIdx=to;ch=true;}
    if(i<0&&p.deliveryPlanNo){p.deliveryPlanNo=null;ch=true;}
    if(ch)n++;
  });
  return n;
}
/* 2026-10-07.137：单条删除交付计划——deliveries 与 productionPlans 由两次独立写改为**同一次 DB.tx**
   （.125 方向：消灭「交付计划已删、排产单引用未重排」的非原子中间态）；失败 → DB.tx 已复原内存 → 不渲染成功态。 */
async function delDelivery(idx){
  if(!confirm('确认删除该交付计划？'))return;
  logOp('删除','交付计划','删除交付计划「'+deliveries[idx].orderId+'」('+deliveries[idx].customer+')');
  deliveries.splice(idx,1);
  const rl=relinkProdPlanDeliveryIdx();
  const ops=[{key:'deliveries',value:deliveries}];
  if(rl)ops.push({key:'productionPlans',value:productionPlans});
  const ok=await DB.tx(ops,false);
  if(!ok)return;
  if(rl)logOp('系统','交付计划','删除交付计划后按编号重排 '+rl+' 张排产单的来源引用（防索引漂移）');
  renderContent();
}

   运行时经 mdRender 渲染成 HTML；功能迭代时同步更新 GUIDE_MD 对应小节与「最近更新」表
================================================================ */
/* 简易 Markdown 渲染：支持 #/##/### 标题、- 无序、1. 有序、| 表格（首行表头+--- 分隔行）、**粗体**、`行内码`、空行分段 */
function mdInline(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code style="background:#f1f5f9;padding:1px 5px;border-radius:3px;font-size:12px">$1</code>');
}
function mdRender(md){
  const lines=String(md||'').split('\n');
  let out='',listType='',inTable=false,tblHead=false;
  lines.forEach(line=>{
    const t=line.trim();
    /* 2026-08-25.71：空行须先闭合当前列表/表格再重置（原直接清 listType/inTable → <ul>/<table> 悬空未闭合，浏览器容错嵌套缩进逐级加深） */
    if(!t){if(listType){out+='</'+listType+'>';listType='';}if(inTable){out+='</table>';inTable=false;}tblHead=false;return;}
    /* 2026-08-25.71：进入非列表行前先关闭上一个列表（列表被标题/表格/引用打断时同理闭合） */
    if(listType&&!/^[-*]\s+/.test(t)&&!/^\d+\.\s+/.test(t)){out+='</'+listType+'>';listType='';}
    if(t.startsWith('|')){
      const cells=t.split('|').slice(1,-1).map(c=>c.trim());
      if(cells.length&&/^[-: ]+$/.test(cells.join('')))return;   // 表头分隔行 |---|---| 跳过（不置 tblHead）
      if(!inTable){inTable=true;tblHead=false;out+='<table style="width:100%;border-collapse:collapse;margin:6px 0;font-size:13px">';}
      if(!tblHead){tblHead=true;out+='<tr>'+cells.map(c=>'<th style="border:1px solid var(--border);padding:4px 8px;text-align:left;background:var(--primary-light)">'+mdInline(c)+'</th>').join('')+'</tr>';}
      else{out+='<tr>'+cells.map(c=>'<td style="border:1px solid var(--border);padding:4px 8px;text-align:left">'+mdInline(c)+'</td>').join('')+'</tr>';}
      return;
    }
    if(inTable){out+='</table>';inTable=false;tblHead=false;}
    if(/^###\s+/.test(t)){out+='<h4 style="margin:14px 0 6px;font-size:14px;color:var(--primary-dark)">'+mdInline(t.slice(4))+'</h4>';return;}
    /* 2026-08-25.70：h3 去 border-left+padding-left（标题 0 缩进与正文对齐，改下划线分隔）；引用块 > 常规引用样式 */
    if(/^##\s+/.test(t)){out+='<h3 style="margin:18px 0 8px;font-size:15px;border-bottom:1px solid var(--border);padding-bottom:4px">'+mdInline(t.slice(3))+'</h3>';return;}
    if(/^#\s+/.test(t)){out+='<h2 style="margin:20px 0 8px;font-size:16px">'+mdInline(t.slice(2))+'</h2>';return;}
    if(/^>\s+/.test(t)){out+='<blockquote style="margin:8px 0;padding:6px 12px;background:var(--primary-light);border-left:3px solid var(--primary);font-size:13px;color:var(--muted)">'+mdInline(t.slice(2))+'</blockquote>';return;}
    if(/^[-*]\s+/.test(t)){
      if(listType!=='ul'){listType='ul';out+='<ul style="margin:6px 0;padding-left:20px;font-size:13px;line-height:1.8">';}
      out+='<li>'+mdInline(t.slice(2))+'</li>';return;
    }
    if(/^\d+\.\s+/.test(t)){
      if(listType!=='ol'){listType='ol';out+='<ol style="margin:6px 0;padding-left:20px;font-size:13px;line-height:1.8">';}
      out+='<li>'+mdInline(t.replace(/^\d+\.\s+/,''))+'</li>';return;
    }
    if(listType){out+='</'+listType+'>';listType='';}
    out+='<p style="margin:6px 0;font-size:13px;line-height:1.8">'+mdInline(t)+'</p>';
  });
  if(inTable)out+='</table>';
  if(listType)out+='</'+listType+'>';
  return out;
}
/* 使用说明页面：标题卡 + 最近更新 + 渲染后的正文 */

function tplModal(idx,prefill){

function tplStepsBoxHtml(){

      '<td style="text-align:center;white-space:nowrap"><button class="btn btn-sm" style="padding:1px 6px" onclick="tplMoveStep('+i+',-1)" title="上移">↑</button> <button class="btn btn-sm" style="padding:1px 6px" onclick="tplMoveStep('+i+',1)" title="下移">↓</button> <button class="btn btn-sm btn-danger" style="padding:1px 6px" onclick="tplDelStep('+i+')" title="删除">✕</button></td>'+

function tplStepsRender(){const el=document.getElementById('tplStepsBox');if(el)el.innerHTML=tplStepsBoxHtml();}
function tplAddStep(){
  const name=prompt('工序名称（预置：装配/瞬时/延时/内包/老化/入库；或输入自定义工序名）','');
  if(name==null)return;
  const label=String(name||'').trim();
  if(!label)return;
  const preset=PP_PRESET_STEPS.find(x=>x.label===label);
  const key=preset?preset.key:('c'+(__tplSteps.length+1));
  __tplSteps.push({key:key,label:label,plan:preset?(preset.plan!==false):true,mandatory:false});
  tplStepsRender();
}
function tplMoveStep(i,d){
  const j=i+d;
  if(j<0||j>=__tplSteps.length)return;
  const a=__tplSteps,tmp=a[i];a[i]=a[j];a[j]=tmp;
  tplStepsRender();
}
function tplDelStep(i){__tplSteps.splice(i,1);tplStepsRender();}
function saveTpl(idx){
  const id=String((document.getElementById('tpl_id')||{}).value||'').trim();
  const name=String((document.getElementById('tpl_name')||{}).value||'').trim();
  const notes=String((document.getElementById('tpl_notes')||{}).value||'');
  if(!id){alert('请填写模板编码');return;}
  if(!name){alert('请填写模板名称');return;}
  if(idx<0&&processTemplates.some(t=>t.id===id)){alert('模板编码「'+id+'」已存在');return;}
  const rows=Array.prototype.slice.call(document.querySelectorAll('.tpl_step_name'));
  const steps=[];
  rows.forEach((inp,i)=>{
    const label=String(inp.value||'').trim();
    if(!label)return;
    const plan=!!(document.querySelector('.tpl_step_plan[data-idx="'+i+'"]')||{}).checked;
    const mandatory=!!(document.querySelector('.tpl_step_mand[data-idx="'+i+'"]')||{}).checked;
    const preset=PP_PRESET_STEPS.find(x=>x.label===label);
    steps.push({key:preset?preset.key:('c'+(i+1)),label:label,plan:plan,mandatory:mandatory});
  });
  if(steps.length===0){alert('请至少添加一个工序');return;}
  const seen={};let dup=false;
  steps.forEach(s=>{if(seen[s.key])dup=true;seen[s.key]=1;});
  if(dup){alert('存在重复工序：请勿使用多个相同名称（自定义工序名请勿与预置工序重名）');return;}
  if(idx>=0){
    const t=processTemplates[idx];
    const oldId=t.id;
    if(oldId!=='default'&&id!==oldId&&products.some(p=>p.processTplId===oldId)){alert('该模板已被产品引用，模板编码不可修改');return;}
    t.id=id;t.name=name;t.notes=notes;t.steps=steps;
    logOp('编辑','工序模板','编辑「'+id+'」工序模板');
  }else{
    processTemplates.push({id:id,name:name,notes:notes,steps:steps});
    logOp('新增','工序模板','新增「'+id+'」工序模板');
  }
  save('processTemplates',processTemplates);
  closeModal();
  renderContent();
}
function copyTpl(i){
  const c=JSON.parse(JSON.stringify(processTemplates[i]));
  c.id=suggestCopyId(c.id+'副本',id=>processTemplates.some(t=>t.id===id));
  c.name=c.name+'（副本）';
  tplModal(-1,c);
}
function delTpl(i){
  const t=processTemplates[i];
  if(!t)return;
  if(t.id==='default'){alert('系统默认模板不可删除');return;}
  const ref=products.filter(p=>p.processTplId===t.id).length;
  if(ref>0){alert('该模板正被 '+ref+' 个产品使用，请先在产品主数据中改用其他模板后再删除。');return;}
  if(!confirm('确认删除工序模板「'+t.id+'」？'))return;
  logOp('删除','工序模板','删除「'+t.id+'」工序模板');
  processTemplates.splice(i,1);
  save('processTemplates',processTemplates);
  renderContent();
}

/* .120：员工权限面板——左列表（表单三态复选框）+ 右栏（点击表单名查看/勾选其「业务动作」按钮）。
   三态语义：空框=无该表单写权限；全勾=该表单全部写权限（动作全开）；横杠(indeterminate)=部分写权限（部分动作勾选）。
   存储不变：perms[form]=bool（半选视为 true，动作落库/按钮 gate 仍需表单写权限）+ perms.acts={form.act:bool}。 */
let __permActiveForm=null;
function setActivePermForm(k){
  __permActiveForm=k;
  document.querySelectorAll('#modal [id^="permrow_"]').forEach(function(el){
    el.style.background=(el.id.slice(8)===k)?'#e8f0fe':'';
    el.style.outline=(el.id.slice(8)===k)?'1px solid #bfdbfe':'';
  });
  document.querySelectorAll('#modal [id^="permActs_"]').forEach(function(el){
    el.style.display=(el.id.slice(9)===k)?'block':'none';
  });
}
/* .121 修复：PERM_FORMS 遍历键=权限键(products/saleOrders…)，FORM_ACTS 键=表单键(product/order_frame…)——面板按权限键匹配动作恒为空。
   统一经 formToKey 反查：权限键 → 该权限点下承载动作的表单键（dailyPlans 权限点=「排产计划」prodPlan 表单，.122 起不再挂备货 dp_stockup） */
function permFormKeyOf(permKey){
  const keys=Object.keys(FORM_ACTS);
  for(let i=0;i<keys.length;i++){if(formToKey(keys[i])===permKey)return keys[i];}
  return null;
}
/* 动作勾选变化 → 重算表单复选框三态（全勾=勾、部分=横杠、全无=空） */
function recomputePermTri(k){
  const fm=permFormKeyOf(k);
  if(!fm)return;
  const acts=Object.keys(FORM_ACTS[fm]);
  if(!acts.length)return;
  const root=document.querySelector('#modal input[data-perm="'+k+'"]');
  const bs=document.querySelectorAll('#modal input[data-act^="'+fm+'."]');
  let n=0;
  bs.forEach(function(b){if(b.checked)n++;});
  root.checked=(n>0&&n===bs.length);
  root.indeterminate=(n>0&&n<bs.length);
  if(n>0&&__permActiveForm!==k)setActivePermForm(k);
}
/* 勾选表单复选框=全开其动作；取消=全关（含半选清空） */
function permTriToggle(k,checked){
  const fm=permFormKeyOf(k);
  if(fm)document.querySelectorAll('#modal input[data-act^="'+fm+'."]').forEach(function(b){b.checked=checked;});
  const root=document.querySelector('#modal input[data-perm="'+k+'"]');
  root.checked=checked;
  root.indeterminate=false;
  if(checked&&__permActiveForm!==k)setActivePermForm(k);
}
/* 弹窗渲染完成后：按存量勾选反推各表单三态 + 默认选中第一个表单 */
function permInitUI(){
  Object.keys(PERM_FORMS).forEach(function(k){recomputePermTri(k);});
  setActivePermForm(Object.keys(PERM_FORMS)[0]);
}

async function saveUser(username){
  const uname=document.getElementById('uf_user').value.trim();
  const name=document.getElementById('uf_name').value.trim();
  const role=document.getElementById('uf_role').value;
  const status=document.getElementById('uf_status').value;
  const pwd=document.getElementById('uf_pwd').value;
  const perms={};
  /* .120：三态收集——全勾/横杠(部分动作)=表单有写权限（动作按钮可见与落库均需表单写权限）；空框=无权限 */
  document.querySelectorAll('#modal input[data-perm]').forEach(c=>{perms[c.dataset.perm]=(c.checked||c.indeterminate);});
  /* .119：按钮级动作权限收集——勾选的「业务动作」子项写入 perms.acts（未勾=该动作收敛；保存后 canAct 即严格生效） */
  const acts={};
  document.querySelectorAll('#modal input[data-act]').forEach(c=>{acts[c.dataset.act]=c.checked;});
  perms.acts=acts;
  /* .118：权限点拆分固化——编辑历史员工若曾勾「订单管理(orders)」则自动转为销售/库存双开（该员工权限面板不再有 orders 项） */
  if(username){
    const _ou=(window.__usersCache||[]).find(x=>x.username===username);
    if(_ou&&_ou.perms&&_ou.perms.orders===true){perms.saleOrders=true;perms.invOrders=true;}
  }
  const payload={username:uname||username,name:name||uname||username,role:role,status:status,perms:perms};
  if(pwd)payload.password=pwd;
  try{
    const r=await apiReq('/users',{method:username?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const j=await r.json();
    if(!r.ok){alert(j.error||'保存失败');return;}
    closeModal();
    await loadUsers();
    if(currentUser&&currentUser.username===uname&&role==='staff')currentUser.role='staff';
    renderContent();
  }catch(e){alert('保存失败，请检查网络');}
}
async function delUser(username){
  if(!confirm('确认删除员工「'+username+'」？此操作不可恢复。'))return;
  try{
    const r=await apiReq('/users?username='+encodeURIComponent(username),{method:'DELETE'});
    const j=await r.json();
    if(!r.ok){alert(j.error||'删除失败');return;}
    await loadUsers();renderContent();
  }catch(e){alert('删除失败');}
}
/* 修改本人密码 */
function pwdModal(){
  const body='<div class="form-row"><div><label>原密码</label><input id="cp_old" type="password"></div></div>'
    +'<div class="form-row"><div><label>新密码</label><input id="cp_new" type="password"></div></div>'
    +'<div class="form-row"><div><label>确认新密码</label><input id="cp_new2" type="password"></div></div>';
  showModal('修改密码',body,'<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="savePwd()">保存</button>');
}
async function savePwd(){
  const old=document.getElementById('cp_old').value;
  const n1=document.getElementById('cp_new').value;
  const n2=document.getElementById('cp_new2').value;
  if(!old||!n1){alert('请填写完整');return;}
  if(n1.length<6){alert('新密码至少6位');return;}
  if(n1!==n2){alert('两次新密码不一致');return;}
  try{
    const r=await apiReq('/change-pwd',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old:old,new:n1})});
    const j=await r.json();
    if(!r.ok){alert(j.error||'修改失败');return;}
    currentUser=currentUser||{};delete currentUser.mustChangePwd;
    alert('密码已修改');closeModal();
  }catch(e){alert('修改失败');}
}

function showModal(title,body,foot){
  /* 2026-08-25.53：弹窗内滚轮不穿透主界面（scroll chaining）——阻断冒泡到 body，弹窗内滚动区正常滚动 */
  const bg=document.getElementById('modalBg');
  if(bg&&!bg.__wheelBound){
    bg.addEventListener('wheel',function(e){e.stopPropagation();},{passive:false});
    bg.__wheelBound=true;
  }
  const m=document.getElementById('modal');
  m.innerHTML='<div class="modal-head"><h3>'+title+'</h3><div class="close-x" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M18 6L6 18M6 6l12 12"/></svg></div></div><div class="modal-body">'+body+'</div><div class="modal-foot">'+foot+'</div>';
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){
  const el=document.getElementById('modalBg');
  if(el)el.classList.remove('show');
}
/* 二级确认浮层：浮在弹窗之上（z-index 300），不替换底层弹窗 DOM。
   点「取消」/遮罩 → onCancel（退回原弹窗）；点「确认」→ onOk */
function showConfirmOverlay(msg,onCancel,onOk,cancelText,okText){
  closeConfirmOverlay();
  var ov=document.createElement('div');
  ov.className='modal-bg show';
  ov.id='confirmOverlay';
  ov.style.zIndex=300;
  ov.innerHTML='<div class="modal" style="max-width:440px;width:90%;min-width:0">'+
    '<div class="modal-head"><h3>提示</h3></div>'+
    '<div class="modal-body" style="font-size:14px;line-height:1.8">'+msg+'</div>'+
    '<div class="modal-foot">'+
    '<button class="btn" id="co_cancel">'+esc(cancelText||'取消')+'</button>'+
    '<button class="btn btn-primary" id="co_ok">'+esc(okText||'确认')+'</button>'+
    '</div></div>';
  document.body.appendChild(ov);
  /* 点击遮罩不关闭（弹窗仅通过按钮操作），与主弹窗行为一致 */
  ov.querySelector('#co_cancel').onclick=function(){closeConfirmOverlay();if(onCancel)onCancel();};
  ov.querySelector('#co_ok').onclick=function(){closeConfirmOverlay();if(onOk)onOk();};
}
function closeConfirmOverlay(){
  var ov=document.getElementById('confirmOverlay');
  if(ov)ov.remove();
}

      var mcEls=wsDoc.getElementsByTagName('mergeCells');
      if(mcEls&&mcEls.length){var mcs=mcEls[0].getElementsByTagName('mergeCell');for(var mi=0;mi<mcs.length;mi++){var rf=mcs[mi].getAttribute('ref');if(!rf)continue;var pp=rf.split(':');if(pp.length===2){var a=parseRef(pp[0]),b=parseRef(pp[1]);if(a&&b)merges.push({r1:a.r,c1:a.c,r2:b.r,c2:b.c});}}}
      var sd={name:name,headers:[],rows:[],merges:merges};
      for(var r=0;r<rows.length;r++){
        var cells=rows[r].getElementsByTagName('c');
        var colMap={},maxC=-1;
        for(var c=0;c<cells.length;c++){
          var cell=cells[c];var t=cell.getAttribute('t');
          var vEl=cell.getElementsByTagName('v')[0];var isEl=cell.getElementsByTagName('is')[0];
          var val='';
          if(t==='s'){val=strings[parseInt(vEl?vEl.textContent:0)]||'';}
          else if(t==='inlineStr'&&isEl){var tt=isEl.getElementsByTagName('t')[0];val=tt?tt.textContent:'';}
          else if(t==='str'){val=vEl?vEl.textContent:'';}
          else if(vEl){var nv=parseFloat(vEl.textContent);val=isNaN(nv)?vEl.textContent:nv;}
          var ci=parseRef(cell.getAttribute('r'));ci=ci?ci.c:c;
          colMap[ci]=val;if(ci>maxC)maxC=ci;
        }
        var rowData=[];for(var ci2=0;ci2<=maxC;ci2++)rowData.push(colMap[ci2]!=null?colMap[ci2]:'');
        if(r===0){sd.headers=rowData;}
        else{if(rowData.some(function(v){return v!==''&&v!=null;}))sd.rows.push(rowData);}
      }
      result.push(sd);
    }
    return result;
  }
  return {build:build,parse:parse};
})();

var XLSX_SHEETS=[
  {sheet:'产品主数据',varName:'products',formKey:'product'},

/* varName -> 实际变量 的映射（不能用 window[name]，因为数组用 let 声明不挂到 window） */
function dataByVar(name){
  switch(name){
    case 'products':return products;
    case 'orders':return orders;
    case 'deliveries':return deliveries;
    case 'productionPlans':return productionPlans;
    case 'logs':return logs;
  }
  return [];
}
function setDataByVar(name,arr){
  switch(name){
    case 'products':products=arr;break;
    case 'orders':orders=arr;break;
    case 'deliveries':deliveries=arr;break;
    case 'productionPlans':productionPlans=arr;break;
    case 'logs':logs=arr;break;
  }
}

/* 订单导出：每行一种产品（表头字段随每行重复） */
function orderFlatRows(){
  var rows=[];
  orders.forEach(function(o){
    orderItems(o).forEach(function(it){
      var r={};
      (fields.order||[]).forEach(function(f){
        r[f.key]=isLineField(f)?it[f.key]:o[f.key];
      });
      rows.push(r);
    });
  });
  return rows;
}
/* 订单导入：按订单编号聚合多行 → 一个订单多明细 */
function groupOrderRows(rows){
  var map={},list=[];
  var lineDefs=orderLineFields();   // 表体字段动态构成明细行
  rows.forEach(function(r){
    if(!r.id)return;
    if(!map[r.id]){
      var o={};                      // 表头字段取自首次出现的行
      orderHeadFields().forEach(function(f){o[f.key]=r[f.key];});
      o.items=[];
      map[r.id]=o;list.push(o);
    }
    var it={};
    lineDefs.forEach(function(f){
      var v=r[f.key];
      it[f.key]=f.type==='number'?num(v):(v==null?'':v);
    });
    map[r.id].items.push(it);
  });
  return list;
}

function exportXLSX(){
  if(!needSysAdmin())return;
  var sheets=XLSX_SHEETS.map(function(cfg){
    var cols,data;
    if(cfg.formKey==='prodPlan'){
      cols=PP_EXPORT_COLS;
      data=prodPlanFlatRows(dataByVar(cfg.varName));
    }else{
      cols=(fields[cfg.formKey]||[]).map(function(f){return {key:f.key,label:f.label,type:f.type};});
      data=cfg.formKey==='order'?orderFlatRows():dataByVar(cfg.varName);
    }
    var headers=cols.map(function(c){return c.label;});
    var rows=data.map(function(item){
      return cols.map(function(c){
        var val=item[c.key];
        if(c.type==='date'&&val)return fmtDate(val);
        if(c.type==='number')return num(val);
        return val==null?'':val;
      });
    });
    return {name:cfg.sheet,headers:headers,rows:rows};
  });
  var bytes=XLSX.build(sheets);
  var blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='生产排单系统_全量_'+todayStr()+'.xlsx';a.click();
  URL.revokeObjectURL(url);
  logOp('导出','全量数据','全量导出 '+XLSX_SHEETS.length+' 个表单');
}

/* 单表单导出（rows 提供则导出选中行；否则导出全量） */

      if(c.type==='date'&&val)return fmtDate(val);

      return val==null?'':val;
    });
  });
  var bytes=XLSX.build([{name:cfg.sheet,headers:headers,rows:data}]);
  var blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var url=URL.createObjectURL(blob);

/* ================================================================
   批量操作：行选择 + 上方工具栏（编辑/复制/删除/导出选中/全选）
   说明：可编辑表单的"操作"改为「先勾选行 → 点上方按钮」；
   编辑/复制等仅支持单条的操作，多选时自动拒绝。
================================================================ */
var selRows={};        // selRows[模块] = Set(行标识字符串)
var lastRowIds={};     // lastRowIds[模块] = 本次渲染的所有行标识（用于全选去重）
function selSet(m){if(!selRows[m])selRows[m]=new Set();return selRows[m];}
function selCount(m){return selSet(m).size;}
function clearSel(m){if(selRows[m])selRows[m].clear();}
/* 点击表格任意位置切换该行选中状态（复选框点击需 stopPropagation 避免双重切换） */
function selRowClick(m,id){
  id=String(id);
  const s=selSet(m);
  if(s.has(id))s.delete(id);else s.add(id);
  updateSelUI(m);
}
/* 全选复选框：点击切换——若当前已全选则清空，否则全选 */
function toggleSelAll(m){
  const s=selSet(m);
  const cbs=Array.prototype.slice.call(document.querySelectorAll('#content input[data-sel-id][data-sel-form="'+m+'"]'));
  const ids=cbs.map(function(cb){return cb.getAttribute('data-sel-id');});
  const allSelected=ids.length>0 && ids.every(function(id){return s.has(id);});
  if(allSelected)s.clear();
  else ids.forEach(function(id){s.add(id);});
  updateSelUI(m);
}
/* 局部刷新选中标：仅更新复选框勾选态与「已选 N 项」计数，不重建整页 DOM，
   避免选中/取消选中行时因 innerHTML 重渲染导致焦点丢失与页面滚动跳动。
   所有表单（产品/订单/备货/包装/交付）共用此逻辑，彻底消除同类 bug。 */
function updateSelUI(m){
  const s=selSet(m);
  const cbs=Array.prototype.slice.call(document.querySelectorAll('#content input[data-sel-id][data-sel-form="'+m+'"]'));
  cbs.forEach(function(cb){
    const id=cb.getAttribute('data-sel-id');
    const on=s.has(id);
    cb.checked=on;
    /* 行高亮：切换 row-sel 类；勾选框所在 td 有 rowspan（订单整单合并）时沿后续兄弟行传播 */
    const td=cb.closest('td');
    const tr=td?td.parentElement:null;
    if(tr){
      tr.classList.toggle('row-sel',on);
      const rs=td.rowSpan||1;
      let cur=tr;
      for(let i=1;i<rs;i++){cur=cur.nextElementSibling;if(cur)cur.classList.toggle('row-sel',on);}
    }
  });
  const all=document.querySelector('#content input[data-sel-all="'+m+'"]');
  if(all){
    const ids=cbs.map(function(cb){return cb.getAttribute('data-sel-id');});
    all.checked = ids.length>0 && ids.every(function(id){return s.has(id);});
  }
  const cnt=document.getElementById('selCount_'+m);
  if(cnt){
    const n=selCount(m);
    cnt.textContent = n>0?('已选 '+n+' 项'):'';
  }
}

  if(m==='product'&&canAct('product.genOrder'))btns.push('<button class="btn btn-sm btn-primary" onclick="bulkGenOrder()" title="为选中的产品生成库存订单">生成订单</button>');

/* 多选删除（一次确认） */
/* 批量删除选中记录。
   【P1·build 2026-09-11.125·A】原实现的两处非原子写：
     · 每条选中记录各调一次 logOp → 每条触发一次 save('logs')（勾 20 条 = 20 次独立写 logs）；
     · 业务表再 1 次 save → 合计 N+1 次互不原子、fire-and-forget 的写请求，
       最坏情况是「业务表已删、日志只写了一半」。
   现改为：日志条目先入内存（pushLogEntry + makeLogEntry，均不写盘），业务表 splice 完，
   最后只发 1 次 DB.tx（业务表 + logs）。失败 → DB.tx 已 pullAll + rehydrateFromServer 复原内存
   并提示 → 直接 return，不渲染成成功态（不清勾选、不 renderContent）。
   其余业务口径（禁删校验、非待排产跳过、跳过提示文案）逐字保持原样。 */
async function bulkDelete(m){
  const s=selSet(m);
  if(s.size===0){alert('请先在左侧勾选要删除的记录');return;}
  /* 2026-08-25.21：订单批量删除——勾选范围内存在已下推交付计划的订单时整批拒绝（防止破坏交付计划/排产链路） */
  if(m==='order'||m==='order_frame'||m==='order_inv'){
    /* 2026-08-25.21：已下推交付计划禁删；2026-09-05.111：销售订单有业务痕迹（已交付/已调用>0）禁删——整批拒绝并列出受阻订单 */
    const blocked=[...s].map(Number).map(i=>FORM_ACTIONS[m].get(i)).filter(o=>o&&(hasDeliveryOf(o.id)||saleOrderTrace(o)));
    if(blocked.length>0){alert('以下订单不能删除：\n'+blocked.map(o=>{const t=saleOrderTrace(o);return '· '+o.id+'（'+o.customer+'）'+(t?' 已有业务记录（已交付 '+t.dv+'、已调用 '+t.ck+'）':' — 已下推交付计划');}).join('\n')+'\n\n（有业务记录的销售订单为防止误删历史数据禁止删除；已下推交付计划的订单需先删除对应交付计划）');return;}
  }
  if(!confirm('确认删除选中的 '+s.size+' 条记录？此操作不可撤销。'))return;
  const idxs=[...s].map(Number).sort((x,y)=>y-x);
  /* .125：日志条目先入内存（不写盘）——文案与改造前逐字一致 */
  idxs.forEach(i=>{
    const rec=FORM_ACTIONS[m].get(i);
    if(rec&&rec.id)pushLogEntry(makeLogEntry('删除',m,'删除「'+rec.id+'」'));
    else if(rec&&rec.orderId)pushLogEntry(makeLogEntry('删除',m,'删除「'+rec.orderId+'」'));
    else pushLogEntry(makeLogEntry('删除',m,'删除记录'));
  });
  /* .125：业务表只做内存 splice（不写盘），并只把这**实际变化的那一张表**放进事务 */
  let dataOp=null,blocked=[],extraOps=[];
  if(m==='product'){idxs.forEach(i=>products.splice(i,1));dataOp={key:'products',value:products};}
  else if(m==='order'||m==='order_frame'||m==='order_inv'){idxs.forEach(i=>orders.splice(i,1));dataOp={key:'orders',value:orders};}
  else if(m==='prodPlan'){
    /* 2026-08-25.29：只有「待排产」的排产计划才能删除——待排产删除，非待排产（生产中/已完成）跳过并提示 */
    idxs.forEach(i=>{const p=productionPlans[i];if(p&&p.status==='待排产')productionPlans.splice(i,1);else if(p)blocked.push(p.id);});
    dataOp={key:'productionPlans',value:productionPlans};
  }
  else if(m==='processTpl'){idxs.forEach(i=>processTemplates.splice(i,1));dataOp={key:'processTemplates',value:processTemplates};}
  else if(m==='delivery'){
    idxs.forEach(i=>deliveries.splice(i,1));
    dataOp={key:'deliveries',value:deliveries};
    /* 2026-10-07.137：删除后按稳定外键重排排产单来源引用（防索引漂移 R1）；有变化才并入同一次事务 */
    if(relinkProdPlanDeliveryIdx())extraOps=[{key:'productionPlans',value:productionPlans}];
  }
  if(!dataOp)return;   /* 防御：未知表单不落库（FORM_ACTIONS 已过滤，正常不会走到） */
  const ok=await DB.tx([dataOp].concat(extraOps).concat([{key:'logs',value:logs}]),false);
  if(!ok)return;   /* 失败：一字未写、内存已回灌服务器真值 → 不清勾选、不渲染成成功态 */
  if(blocked.length>0)alert('已删除待排产排产计划；跳过 '+blocked.length+' 条（非待排产，仅待排产可删除）：'+blocked.join('、'));
  clearSel(m);
  renderContent();
}

/* 导出选中条目（需求：表单导出改为导出选中） */
function bulkExport(m){
  const a=FORM_ACTIONS[m];if(!a)return;
  const s=selSet(m);
  if(s.size===0){alert('请先勾选要导出的记录');return;}
  const idxs=[...s].map(Number);
  let rows=idxs.map(i=>a.get(i)).filter(Boolean);
  if(m==='order'||m==='order_frame'||m==='order_inv')rows=orderFlatRowsOf(idxs.map(i=>orders[i]));
  else if(m==='prodPlan')rows=prodPlanFlatRows(idxs.map(i=>productionPlans[i]));
  exportForm(a.formKey,rows);
  logOp('导出',a.formKey,'导出选中 '+rows.length+' 条记录');
}

/* 生成不冲突的复制主键（id 类字段） */
function suggestCopyId(baseId,exists){
  if(!exists(baseId))return baseId;
  let i=2;
  while(exists(baseId+'_'+i))i++;
  return baseId+'_'+i;
}
function copyProduct(i){const c={...products[i]};c.id=suggestCopyId(c.id,id=>products.some(p=>p.id===id));productModal(-1,c);}
function copyOrder(i){const c=JSON.parse(JSON.stringify(orders[i]));c.status='执行中';c.id=suggestCopyId(c.id,id=>orders.some(o=>o.id===id));orderModal(-1,c);}

/* 订单按选中订单列表展开为多商品行（供导出选中用） */
function orderFlatRowsOf(list){
  var rows=[];
  (list||[]).forEach(function(o){
    orderItems(o).forEach(function(it){
      var r={};
      (fields.order||[]).forEach(function(f){r[f.key]=isLineField(f)?it[f.key]:o[f.key];});
      rows.push(r);
    });
  });
  return rows;
}

function autoBackupNow(force){
  if(!isSysAdmin())return;   /* .151 静默收权：visibilitychange/beforeunload 后台触发不得 alert，员工侧不得自动下载全库备份 */
  if(!autoBackupOn)return;
  var now=Date.now();
  if(!force && now-lastAutoBackup < AUTO_BACKUP_MIN*60000)return;
  lastAutoBackup=now;
  var data={
    version:2,exportDate:new Date().toISOString(),
    products:products,orders:orders,
    deliveries:deliveries,productionPlans:productionPlans,productionReports:productionReports,processTemplates:processTemplates,
    logs:logs,fields:fields,meta:meta
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='生产排单系统_自动备份_'+todayStr()+'_'+new Date().toISOString().slice(11,16).replace(':','')+'.json';
  a.click();
  URL.revokeObjectURL(url);
  var t=new Date().toLocaleTimeString('zh-CN',{hour12:false});
  logOp('自动备份','全部数据','自动备份 '+
    ((products.length||0)+(orders.length||0)+
     (deliveries.length||0))+' 条记录');
  updateAutoBackupStatus(t);
}
function scheduleAutoBackup(){ if(autoBackupOn) autoBackupNow(false); }
function updateAutoBackupStatus(t){
  var s=document.getElementById('autoBackupStatus');
  if(s)s.textContent='上次 '+t;
}
function toggleAutoBackup(){
  if(!needSysAdmin())return;
  autoBackupOn=!autoBackupOn;
  save('autoBackupOn',autoBackupOn);
  var b=document.getElementById('autoBackupBtn');
  if(b)b.textContent='自动备份：'+(autoBackupOn?'开':'关');
  if(autoBackupOn)alert('已开启自动备份：数据变更时会自动下载 .json 备份文件，链接轮换后用顶部「恢复」即可还原。');
}

/* 后端 .json 备份一键恢复。
   【P1·.125·A】原实现 = 11 次独立 save（fieldsAudit/fieldsDraft/…/meta）+ 迁移函数的额外 save + 1 次日志写，
   一次恢复会发出 12~15 个互不原子、fire-and-forget 的写请求（DB.set 失败只 alert，调用方不感知）——
   最坏情况是「orders 已恢复、products/deliveries 没恢复」的半恢复状态。
   现改为：**先在内存做完所有赋值 + 纯迁移 + 纯重算，最后只发 1 次 DB.tx**（11 张表 + logs 一次提交）。
   失败（409/403/!ok/网络/401）→ DB.tx 已 pullAll + rehydrateFromServer 复原内存并提示 →
   直接 return，**不渲染成成功态**（不 renderAll、不弹「恢复成功」、不记「恢复」日志）。
   为满足原子性，恢复链上的三个会写盘的迁移函数改用其纯变更器（migrateOrdersMutation /
   migrateFrameworkToSalesMutation / backfillInvDeliveredMutation），其日志条目改为入内存并随同一次事务落盘。 */
function restoreBackup(e){
  if(!needSysAdmin()){e.target.value='';return;}   /* .151 收权：必须清空 file input，否则同一文件二次选择不触发 change */
  var file=e.target.files[0];
  if(!file)return;
  if(!confirm('恢复将覆盖当前所有数据，且不可撤销。确定继续？')){e.target.value='';return;}
  var reader=new FileReader();
  reader.onload=async function(){
    try{
      var data=JSON.parse(reader.result);
      if(!data||typeof data!=='object')throw new Error('文件格式不正确');
      if(data.products)products=data.products;
      if(data.orders)orders=data.orders;
      if(data.deliveries)deliveries=data.deliveries;
      if(data.productionPlans)productionPlans=data.productionPlans;
      if(data.productionReports)productionReports=data.productionReports;
      if(data.processTemplates)processTemplates=data.processTemplates;
      if(data.logs)logs=data.logs;
      if(data.fields)fields=data.fields;
      if(data.meta)meta=data.meta;
      // 恢复后重置审核状态：草稿作废，字段直接进入已审核
      fieldsAudit='audited';fieldsDraft=null;
      normalizeFields();   // 兼容旧版字段：补齐 level 标记（纯内存）
      migrateOrdersMutation();   // 兼容旧版平铺订单备份（纯内存）
      // 恢复的旧备份可能含旧类型「框架订单」等历史残留，立即执行全套迁移，
      // 避免恢复后、下次刷新前这类订单因类型不在「销售/库存」区块而整单不可见
      // （旧实现此处会各自 save+logOp → 拆为纯变更 + 日志入内存，随同一次 tx 落盘）
      if(migrateFrameworkToSalesMutation())pushLogEntry(makeLogEntry('迁移','订单管理','订单类型「框架订单」统一改名为「销售订单」'));
      if(backfillInvDeliveredMutation())pushLogEntry(makeLogEntry('系统','库存打通','将产品现有库存按订单量比例反填到库存订单「已交付数量」（一次性对齐）'));
      recomputeStockFromInvOrders();   // 纯重算：产品库存 = Σ库存订单已交付（不写盘）
      /* 「恢复」日志条目也先入内存 → 与业务表同一次事务落盘（不再触发第 2 次 logs 写） */
      var nRec=((products.length||0)+(orders.length||0)+
         (deliveries.length||0)+(productionPlans.length||0)+(productionReports.length||0)+(processTemplates.length||0));
      pushLogEntry(makeLogEntry('恢复','全部数据','从备份文件恢复 '+nRec+' 条记录'));
      /* 内存已就绪：一次原子提交 11 张表（顺序与原 save 顺序一致，便于对照） */
      var ops=[
        {key:'fieldsAudit',value:fieldsAudit},
        {key:'fieldsDraft',value:fieldsDraft},
        {key:'products',value:products},
        {key:'orders',value:orders},
        {key:'deliveries',value:deliveries},
        {key:'productionPlans',value:productionPlans},
        {key:'productionReports',value:productionReports},
        {key:'processTemplates',value:processTemplates},
        {key:'logs',value:logs},
        {key:'fields',value:fields},
        {key:'meta',value:meta}
      ];
      var ok=await DB.tx(ops,false);
      if(!ok)return;   /* 失败：一字未写、内存已回灌服务器真值 → 不进入成功态 */
      renderAll();
      alert('恢复成功！共恢复 '+nRec+' 条记录。');
    }catch(err){
      alert('恢复失败：'+err.message+'\n\n请确认文件为系统导出的 .json 备份文件。');
    }
    e.target.value='';
  };
  reader.readAsText(file);
}

/* 清空全部业务数据（admin 深度确认两次）。
   【P1·.125·A】原实现 = 6 张事实表各自 save + 1 次日志写 = 7 次独立写，任一失败即「清了一半」
   （例如产品已清空、订单还在）→ 改为 7 张表（含 logs）一次 DB.tx。
   失败不渲染成功态；内存由 DB.tx 的失败分支回灌为服务器真值。 */
async function confirmClear(){
  if(!needSysAdmin())return;
  if(!confirm('确认清空所有数据？此操作不可恢复，建议先导出备份！'))return;
  if(!confirm('再次确认：所有产品、订单、库存、排产、交付数据将被删除！'))return;
  products=[];orders=[];deliveries=[];productionPlans=[];productionReports=[];processTemplates=[];
  pushLogEntry(makeLogEntry('清空','全部数据','清空所有业务数据'));   /* 日志（logs 表不清空）随事务落盘 */
  const ok=await DB.tx([
    {key:'products',value:products},
    {key:'orders',value:orders},
    {key:'deliveries',value:deliveries},
    {key:'productionPlans',value:productionPlans},
    {key:'productionReports',value:productionReports},
    {key:'processTemplates',value:processTemplates},
    {key:'logs',value:logs}
  ],false);
  if(!ok)return;   /* 失败：一字未写 → 不 renderAll（不渲染成「已清空」） */
  renderAll();
}

async function bootstrap(){
  if(API_BASE){
    /* 服务器模式：先登录 */
    if(!authToken){showLogin('请先登录');return;}
    try{await pullAll();}
    catch(e){showLogin('登录已过期，请重新登录');return;}
  }
  await initApp();
}
async function initApp(){
  /* 服务器模式：刷新页面后恢复当前用户信息（权限） */
  if(API_BASE&&!currentUser){
    try{
      const r=await apiReq('/me');
      const j=await r.json();
      currentUser={username:j.username,name:j.name,role:j.role,perms:j.perms||{},mustChangePwd:j.mustChangePwd===true};
    }catch(e){}
  }
  applyTopbarPerm();   /* .151：刷新页面后按恢复出来的角色刷新顶栏系统功能可见性 */
  products=await DB.get('products',[]);
  orders=await DB.get('orders',[]);
  deliveries=await DB.get('deliveries',[]);
  productionPlans=await DB.get('productionPlans',[]);
  productionReports=await DB.get('productionReports',[]);
  processTemplates=await DB.get('processTemplates',[]);
  logs=await DB.get('logs',[]);
  transfers=await DB.get('transfers',[]);
  fields=await DB.get('fields',JSON.parse(JSON.stringify(defaultFields)));
  fieldsAudit=await DB.get('fieldsAudit','audited');
  fieldsDraft=await DB.get('fieldsDraft',null);
  meta=await DB.get('meta',{seq:0});
  applyServerLayout(await DB.get('tblLayout',{}));   /* .152：服务端 v2 分片 → 取本人分片（缺则回退 def）并深拷贝 */
  autoBackupOn=false;

  /* 恢复侧边栏折叠状态 */
  try{
    if(localStorage.getItem('sidebarCollapsed')==='1')document.getElementById('sidebar').classList.add('collapsed');
  }catch(e){}

  // 兼容旧字段：为订单字段补齐 level 标记（表头/表体）
  normalizeFields();
  // 产品主数据：规格型号 → 规格 + 型号（字段配置 + 数据迁移）
  migrateSpecSplit();
  // 产品主数据：删除"库存上下限"4个字段（配置迁移）
  migrateRemoveProductFields();
  // 产品主数据：日产能2字段改为非必填（配置迁移）
  migrateProductFieldsOptional();
  // 产品主数据：合并双日产能为单字段 + 补齐库存关键字段（配置迁移）
  migrateProductDailyCap();

  // 仅当"从未成功保存过任何数据"的纯净环境才灌入示例；一旦有过数据(meta.seeded)绝不重置，避免覆盖
  if(!meta.seeded && products.length===0&&orders.length===0&&deliveries.length===0){
    seed();
    meta.seeded=true; save('meta',meta);
  }

  // 旧版平铺订单数据 → 多行明细结构
  migrateOrders();
  // 订单管理：明细行补齐「最大库存量/最小库存量」字段（配置 + 存量数据）
  migrateOrderStockRange();
  // 订单管理：明细行补齐「产品规格/型号」字段（配置 + 存量数据；由产品编码联动）
  migrateOrderItemProductAttrs();
  // 订单管理：明细行补齐「商品行备注」字段（配置 + 存量数据）
  migrateOrderItemLineNotes();
  // 订单管理：字段配置补齐并锁定「订单类型」系统字段（防删除后订单分类丢失）
  migrateOrderTypeField();
  // 订单管理：字段配置补齐并锁定「合同号」系统字段（销售订单必填）
  migrateOrderContractNo();
  // 订单管理：审核状态选项改为 执行中/已完成/已取消/已暂停（持久化 fields 配置同步，2026-08-25.3）
  migrateOrderStatusField();
  // 交付计划：字段配置清理（删废弃字段、加本批计划）
  migrateDeliveryFields();
  // 交付计划：老数据回填「单据时间」createdAt（2026-08-24.17，统一 2026-08-23）
  migrateDeliveryCreatedAt();
  // 存量交付计划行回填 orderLine（订单管理「已计划未交付」按明细行区分，2026-08-25.34）
  migrateDeliveryOrderLine();
  // 交付计划：字段配置补齐「交付计划编号」planNo（2026-10-06.134，持久化 fields 老库缺键 → 导出/模板不带该列）
  migrateDeliveryPlanNoField();
  // 交付计划：字段配置移除已废弃的单据头三项汇总（2026-10-14.149，持久化 fields 老库仍带这三列 → 导出/模板出现多余空列）
  migrateDeliveryDropHeadTotals();
  // 交付计划：清除明细行已删除的两个字段存量值（2026-10-14.150，一次性幂等；离线脚本已先行，线上正常路径见标记即空转）
  await fixDeliveryItemDropQty20261014();
  // 存量交付计划回填「交付计划编号」planNo（2026-10-06.134，须在 migrateDeliveryCreatedAt 之后：依赖 createdAt 已兜底回填）
  migrateDeliveryPlanNo();
  // 订单管理：存量库存订单单号前缀 XSDD- → KCDD-，避免与销售订单单号冲突
  migrateInventoryOrderIds();
  // 订单类型改名：存量「框架订单」→「销售订单」（含历史数据一次性对齐）
  migrateFrameworkToSales();
  // 库存打通：先把产品现有库存反填到库存订单的已交付数量，再同步 库存=Σ(已交付)（含历史数据一次性对齐）
  backfillInvDeliveredFromStock();
  syncStockFromInvOrders();
  // 订单管理：存量状态对齐（待排产→执行中）+ 按未交付合计初始化自动状态（2026-08-25.3，须在反填之后）
  migrateOrderStatusData();
  // 订单管理：字段配置补齐「已调用」（2026-09-20.132，事故根因 A：老库配置缺键 → 弹窗不渲染该列 → 保存即丢值）
  migrateOrderCalledQtyField();
  // 销售订单明细回填已调用数量 calledQty（2026-08-25.35，从调拨台账统计）
  migrateOrderCalledQty();
  // 调拨台账「孤儿行号」修复（2026-09-20.132，一次性幂等：删行漂移留下的越界引用 → 唯一候选才对齐 + 按台账净额重算已调用）
  await repairOrphanTransferLineIdx();
  // 排产单「来源交付计划」索引漂移重绑（2026-10-07.138，一次性幂等：删交付计划留下的错位引用 → 判定可信才重绑 + 回填 deliveryPlanNo 外键）
  await rebindProdPlanDlIdx();
  // 库存「已交付」虚增订正（2026-10-07.139，一次性幂等：C02.02.026 因 R2 修复前的回写残留 +200 → 结余恢复 −700）
  await fixInvDeliveredDrift20261007();
  // 超排存量订正（2026-10-08.140，一次性幂等：撤销 .137 前索引漂移误导下推产生的重复排产单 + 清理孤儿报工）
  await fixOverPush20261008();
  await fixOverPushPlans20261008();   // 超排排产单清算（2026-10-08.142，一次性幂等：用户指定的 7 张超排单，见函数头）
  // 排产单错绑上游交付计划订正（2026-10-12.144，一次性幂等：E1/E2 改绑 + E3 删重复下推单并复原被 .142 误删的两张，见函数头）
  await fixMisboundProdPlans20261012();
  // 工序模板：确保默认模板存在（幂等），并迁移产品主数据工序模板字段/默认指派
  ensureDefaultTpl();
  migrateProductProcessTpl();

  bootDone=true;
  var ab=document.getElementById('autoBackupBtn');
  if(ab)ab.textContent='自动备份：'+(autoBackupOn?'开':'关');
  if(API_BASE){var lb=document.getElementById('logoutBtn');if(lb)lb.style.display='inline-flex';var pb=document.getElementById('pwdBtn');if(pb)pb.style.display='inline-flex';}
  applyTopbarPerm();   /* .151：bootstrap 收尾再刷一次，保证首屏顶栏状态与角色一致（不改动 #pwdBtn/#logoutBtn 的 display） */
  renderAll();
  initNavDrag();   // 侧边栏导航长按拖动排序（事件委托绑定一次）
  startSync();   // 服务器模式：启动 5 秒轮询实时同步
}

bootstrap();

<script>
/* 单元格/表头字段（被 ellipsis 省略）悬停显示完整内容：事件委托，覆盖所有 .table-wrap 表格（含弹窗内）；判定改用临时 span 测量，规避 ellipsis 下 scrollWidth/Range 不可靠 */
(function(){
  var tip=document.createElement('div');tip.className='cell-tip';document.body.appendChild(tip);
  function truncated(el){
    /* 2026-08-25.4：select 取「当前选中项」文本测量（innerText||textContent 会拼出全部 option，误判截断） */
    var txt='';
    if(el.tagName==='SELECT'){
      var _o=el.options[el.selectedIndex];
      txt=(_o?_o.textContent||'':'').trim();
    }else{
      txt=(el.innerText||el.textContent||'').trim();
    }
    if(!txt)return false;
    var cs=getComputedStyle(el);
    var probe=document.createElement('span');
    // 临时节点：脱离文档流 + nowrap，测量的必是完整文本宽度，不受 ellipsis / scrollWidth 怪异行为影响
    probe.style.cssText='position:absolute;left:-99999px;top:0;visibility:hidden;white-space:nowrap;display:inline-block;';
    probe.style.font=cs.font;
    probe.style.fontFamily=cs.fontFamily;probe.style.fontSize=cs.fontSize;
    probe.style.fontWeight=cs.fontWeight;probe.style.fontStyle=cs.fontStyle;
    probe.style.letterSpacing=cs.letterSpacing;probe.style.textTransform=cs.textTransform;
    probe.textContent=txt;
    document.body.appendChild(probe);
    var full=probe.offsetWidth;                      // 完整文本宽度（整数，稳定）
    document.body.removeChild(probe);
    var padL=parseFloat(cs.paddingLeft)||0,padR=parseFloat(cs.paddingRight)||0;
    var avail=el.clientWidth-padL-padR;              // 单元格文本可用宽度
    return avail>0 && full>avail+0.5;
  }
  document.addEventListener('mouseover',function(e){
    /* 2026-08-30.89：三角警示等 [data-tip] 元素——优先显示自定义悬浮框（替代原生 title，语义+数值解释） */
    var tipEl=e.target.closest('[data-tip]');
    if(tipEl){tip.textContent=tipEl.getAttribute('data-tip');tip.style.display='block';return;}
    /* 2026-08-25.4：下拉框（select）特判——内容=当前选中项文本；仅选中项超宽且未展开（非 focus）时显示，
       避免 td.innerText 拼出全部 option 文本的大悬浮框（调用库存弹窗 cs-inv 误命中 td） */
    var sel=e.target.closest('select');
    if(sel){
      if(sel===document.activeElement){tip.style.display='none';return;}
      var stxt='';
      var _o=sel.options[sel.selectedIndex];
      if(_o)stxt=(_o.textContent||'').trim();
      if(!stxt||!truncated(sel)){tip.style.display='none';return;}
      tip.textContent=stxt;tip.style.display='block';
      return;
    }
    var td=e.target.closest('.table-wrap table td, .table-wrap table .th-label');
    if(!td){tip.style.display='none';return;}
    /* 2026-08-25.4：控件单元格（含 select/input/textarea/button）不显示 tip（如调用库存弹窗「下拉框+警告」单元格） */
    if(td.querySelector&&td.querySelector('select,input,textarea,button')){tip.style.display='none';return;}
    var txt=(td.innerText||td.textContent||'').replace(/\s+/g,' ').trim();
    if(!txt||!truncated(td)){tip.style.display='none';return;}
    tip.textContent=txt;tip.style.display='block';
  });
  document.addEventListener('mousemove',function(e){
    if(tip.style.display!=='block')return;
    var x=e.clientX+12,y=e.clientY+12,w=tip.offsetWidth,h=tip.offsetHeight;
    if(x+w>window.innerWidth-8)x=e.clientX-w-12;
    if(y+h>window.innerHeight-8)y=e.clientY-h-12;
    tip.style.left=x+'px';tip.style.top=y+'px';
  });
  document.addEventListener('mouseout',function(e){
    var from=e.target.closest('.table-wrap table td, .table-wrap table .th-label');
    if(from&&(!e.relatedTarget||!from.contains(e.relatedTarget)))tip.style.display='none';
  });
})();
</script>
