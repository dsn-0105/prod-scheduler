var __bsWrap=null;   // 最近一次被操作的横向溢出表格
var __bsWraps=[];    // 当前页面内所有横向溢出的可见表格（底部滚动条统一驱动）
var __bsRange=0;     // 这些表格中最大的可滚动距离，作为底部条的滚动范围
/* 收集页面内所有横向溢出的表格，让底部固定滚动条统一驱动它们（多表并存时均可左右移动） */
function syncBottomScrollbar(){
  const sb=document.getElementById('bottomScrollbar');
  const inner=document.getElementById('bottomScrollbarInner');
  if(!sb||!inner)return;
  const wraps=Array.prototype.slice.call(document.querySelectorAll('#content .table-wrap'));
  const targets=[];
  for(let i=0;i<wraps.length;i++){
    const w=wraps[i];
    if(w.offsetParent===null)continue;              // 隐藏（如折叠区块）跳过
    if(w.scrollWidth>w.clientWidth+2)targets.push(w);
  }
  if(!targets.length){
    sb.style.display='none';__bsWraps=[];__bsRange=0;__bsWrap=null;return;
  }
  let range=0;
  targets.forEach(function(w){const r=w.scrollWidth-w.clientWidth;if(r>range)range=r;});
  __bsWraps=targets;__bsRange=range;
  sb.style.display='block';
  /* 滚动条可滚动范围 = 各表最大可滚动距离（均以「视口宽 + 最大可滚动距离」铺 inner），
     保证底部条与所有表格按相同比例一一对应 */
  inner.style.width=(sb.clientWidth+range)+'px';
  /* 首次绑定底部条拖动事件（只绑一次） */
  if(!sb._barBound){sb._barBound=true;sb.addEventListener('scroll',function(){
    if(sb._sync)return;sb._sync=true;
    const R=__bsRange||1;
    __bsWraps.forEach(function(w){
      const wr=w.scrollWidth-w.clientWidth;
      if(wr>0)w.scrollLeft=Math.round((sb.scrollLeft/R)*wr);
    });
    sb._sync=false;
  });}
  /* 用最近操作的（或第一个）表格位置来定位底部滚动条 */
  const active=(__bsWrap&&targets.indexOf(__bsWrap)>=0)?__bsWrap:targets[0];
  __bsWrap=active;
  if(sb._sync)return;sb._sync=true;
  const ar=active.scrollWidth-active.clientWidth;
  sb.scrollLeft=ar>0?(active.scrollLeft/ar)*range:0;
  sb._sync=false;
}
/* 2026-08-25.38：统一恢复表格横向/纵向滚动位置——双 rAF + 150ms 兜底（布局完全稳定后精确设回，
   避免 applyTableLayout 切 fixed/重设列宽后 scrollWidth 未稳定导致浏览器提前钳制 scrollLeft 跳最前；
   程序设回触发 scroll 事件自动联动表头/表体/底部条）。records=[{el,left,top}] */
function restoreTableScroll(records){
  if(!records||!records.length)return;
  const apply=function(){
    records.forEach(function(r){
      if(!r.el)return;
      if(r.left!=null)r.el.scrollLeft=r.left;
      if(r.top!=null)r.el.scrollTop=r.top;
    });
    syncBottomScrollbar();
  };
  requestAnimationFrame(function(){
    apply();
    requestAnimationFrame(function(){
      apply();
      setTimeout(apply,150);   /* 兜底：字体/图片/悬停态等延迟 reflow 后再校正一次 */
    });
  });
}

/* 任一表格自身横向滚动（capture 捕获不冒泡的 scroll）→ 回写底部滚动条 */
document.addEventListener('scroll',function(e){
  const t=e.target;
  if(!t||!t.classList||!t.classList.contains('table-wrap'))return;
  /* 2026-08-25.8：订单表体横向滚动 → 表头容器跟随（双表结构列对齐） */
  const hd=t.previousElementSibling;
  if(hd&&hd.classList.contains('sticky-head')){
    const hs=hd.querySelector('.head-scroll');
    if(hs&&hs.scrollLeft!==t.scrollLeft)hs.scrollLeft=t.scrollLeft;
  }
  const sb=document.getElementById('bottomScrollbar');
  if(sb&&sb.style.display==='block'&&__bsWraps&&__bsWraps.indexOf(t)>=0){
    __bsWrap=t;
    if(sb._sync)return;sb._sync=true;
    const wr=t.scrollWidth-t.clientWidth;
    sb.scrollLeft=(__bsRange>0&&wr>0)?(t.scrollLeft/wr)*__bsRange:0;
    sb._sync=false;
  }
},true);
window.addEventListener('resize',function(){syncBottomScrollbar();syncHeadBody();fixStickyHeadTop();});

/* 2026-08-25.9：sticky-head 吸附位置 = 顶栏 + 操作栏实际高度（避免与 bulk-bar 同 top:58 重叠被盖住；操作栏换行时自适应）
   2026-08-25.16：存在筛选条（.tbl-fbar）时也吸附在 操作栏与表头 之间（三者连成一条吸附带） */
function fixStickyHeadTop(){
  var base=window.innerWidth<=768?48:58;
  document.querySelectorAll('#content .sticky-head').forEach(function(hd){
    var bb=hd.previousElementSibling;
    while(bb&&!bb.classList.contains('bulk-bar'))bb=bb.previousElementSibling;
    var top=base;
    if(bb){
      var mT=parseFloat(getComputedStyle(bb).marginTop)||0;
      var mB=parseFloat(getComputedStyle(bb).marginBottom)||0;
      /* 2026-08-25.11：sticky top 是 margin box 顶 → 顶栏+操作栏上下margin+高度，贴住操作栏边框盒底。
         2026-08-25.14：订单/卡片区块操作栏 margin-bottom 已为 0（CSS 覆盖），此公式 mB=0 精确贴住；负 margin 方案已废弃 */
      top+=mT+bb.offsetHeight+mB;
      /* 2026-08-25.16：筛选条（bulk-bar 与 sticky-head 之间，可能隔着 stats 汇总卡）同样吸附在操作栏下方 */
      var fbar=bb.nextElementSibling;
      while(fbar&&fbar!==hd&&!fbar.classList.contains('tbl-fbar'))fbar=fbar.nextElementSibling;
      if(fbar&&fbar!==hd&&fbar.classList.contains('tbl-fbar')){
        fbar.style.position='sticky';
        fbar.style.margin='0';    /* 2026-08-25.19：去掉上下 margin（原 8px 吸附时上下间距过大），贴住操作栏与表头 */
        fbar.style.top=top+'px';
        fbar.style.zIndex=30;
        var fT=parseFloat(getComputedStyle(fbar).marginTop)||0;
        var fB=parseFloat(getComputedStyle(fbar).marginBottom)||0;
        top+=fT+fbar.offsetHeight+fB;
      }
    }
    hd.style.top=top+'px';
  });
}

/* 2026-08-25.8：订单表头/表体列宽同步——表头表 th 实际宽度写入表体表 colgroup，
   并令表体表总宽=表头表总宽（table-layout:fixed 下两表列宽一致，保证滚动对齐） */
function syncHeadBody(){
  document.querySelectorAll('#content .sticky-head').forEach(function(hd){
    var ht=hd.querySelector('table.head-tbl');
    var bw=hd.nextElementSibling;
    if(!bw||!bw.classList.contains('table-wrap'))return;
    var bt=bw.querySelector('table.body-tbl');
    if(!ht||!bt)return;
    var hc=ht.tHead&&ht.tHead.rows[0]?Array.prototype.slice.call(ht.tHead.rows[0].cells):[];
    var cg=bt.querySelector('colgroup');
    if(!cg||!hc.length)return;
    var cols=cg.querySelectorAll('col');
    var total=0;
    hc.forEach(function(th,i){
      var w=th.offsetWidth||0;
      if(cols[i])cols[i].style.width=w+'px';
      total+=w;
    });
    if(total>0)bt.style.width=total+'px';
  });
}

/* 2026-09-05.112：表格合计行生成器（需求：每个表单最下方一行合计，只统计上方数字的总数）。
   口径：①合计范围=当前筛选后全量行（分页前传入）；②仅 schema type:'number' 的列求和；
   ③比率/进度列（_pct/_balPct）与文本列留空；④「合计」标签放首个 schema 列。
   返回整行 <tr>…</tr>；preTd=勾选/展开列前缀 td（如 '<td class="sel-col"></td>'）；rows 为空返回 ''。 */
const SUM_SKIP_KEYS={_pct:1,_balPct:1};
/* 2026-09-05.113：合计行「合计」标签列 = 当前列布局（layoutOf(m).order，用户拖拽后的可见顺序）
   中第一个非数字列——标签随布局首个业务列显示（如单据日期/商品编码），避免挂在 schema 首列上
   被拖到表格角落（销售订单 schema[0]=预计交货日期常被拖至末列）。 */
function sumLabelKey(m,schema){
  const ord=layoutOf(m).order||[];
  for(const k of ord){const c=schema.find(x=>x.key===k);if(c&&c.type!=='number')return k;}
  for(const c of schema){if(c.type!=='number')return c.key;}
  return schema.length?schema[0].key:null;
}
function sumRowHtml(schema,rows,preTd,rowStyle,labelKey){
  if(!rows||rows.length===0)return '';
  const sums={};
  schema.forEach(c=>{if(c.type==='number'&&!SUM_SKIP_KEYS[c.key])sums[c.key]=0;});
  rows.forEach(r=>{schema.forEach(c=>{if(sums[c.key]!=null)sums[c.key]+=num(c.get?c.get(r):r[c.key]);});});
  /* 2026-09-05.113 修复（用户报告 .112 合计数字全歪）：合计行改为与数据行逐列同构——
     每个 schema 列输出一个带 data-key 的 td（含文本/比率等空占位列）。
     .112 原实现输出 colspan 标签格 + 无 data-key 空 td，而 applyTableLayout 只按 data-key 重排行内 td
     （表头/数据行全部带 key，随用户拖拽列布局移动），合计行无 key 的占位列不参与、仅数字列被挪至行尾 → 数字错位。
     现合计行所有 td 带 key，与数据行一样随列布局重排移动，任何拖拽顺序下都对齐。 */
  let h=preTd||'';
  schema.forEach((c,i)=>{
    const has=sums[c.key]!=null;
    const isLabel=c.key===labelKey||(!labelKey&&i===0);
    h+='<td data-key="'+c.key+'"'+(has||isLabel?' style="font-variant-numeric:tabular-nums;'+(has?'text-align:right;':'')+'font-weight:600"':'')+'>'+
      (isLabel?'合计':(has?money(sums[c.key]):''))+'</td>';
  });
  return '<tr style="'+(rowStyle||'font-weight:600;background:var(--primary-light)')+'">'+h+'</tr>';
}

  const _opts=(f.options||[]).map(String);

function orderUndelTotal(o){return orderItems(o).reduce((s,i)=>s+Math.max(0,(o.orderType==='库存订单'&&i.stockMax!=null&&i.stockMax!==''?num(i.stockMax):num(i.orderQty))-num(i.deliveredQty)),0);}
/* 订单状态自动规则（2026-08-25.3）：
   仅对「执行中/已完成」生效；「已取消/已暂停」为手动状态，自动规则不覆盖。
   整单未交付合计 = 0（全部交付完成）→ 已完成；否则 → 执行中。
   变更落库并记操作日志（silent=true 用于存量初始化，仅统计不逐条记）。 */
/* 【P1 拆分】纯重算：只改内存 orders.status + 记日志，**不写盘**（返回变更单数）。
   供事务化写入点「写盘前前置重算」调用，把状态投影并入同一个 /api/tx（设计 §4.4）。 */
function recomputeOrderAutoStatus(silent){
  const changed=[];
  orders.forEach(o=>{
    if(o.status==='已取消'||o.status==='已暂停')return;
    const target=orderUndelTotal(o)<=0?'已完成':'执行中';
    if(o.status!==target){changed.push({id:o.id,from:o.status,to:target});o.status=target;}
  });
  if(changed.length&&!silent)changed.forEach(c=>logOp('状态变更','订单管理','订单「'+c.id+'」'+c.from+' → '+c.to+'（系统自动）'));
  return changed.length;
}
/* 【P1 兼容包装】行为与改造前一致：重算 + 变更时落盘 orders（非事务路径仍可用）。 */
function syncOrderAutoStatus(silent){
  const n=recomputeOrderAutoStatus(silent);
  if(n)save('orders',orders);
  return n;
}

const ORDER_CALLED_KEY='calledQty';

  [fields,fieldsDraft].forEach(cfg=>{

/* 【口径唯一来源】销售订单「已调用」净额：call 累加 / return 扣减，不设下限（调用方按需 max 0）；
   已冲销原记录不计（冲销生成的反向 call/return 记录正常参与）。
   方向读取走 trSide 同源规则：新结构 call 销售在调入侧(in)、return 销售在调出侧(out)；旧结构销售恒在 salesOrderId。
   返回 map: orderId|lineIdx → 净额。.132 起被 migrateOrderCalledQty（存量回填）与
   repairOrphanTransferLineIdx（孤儿行号修复）共用——本口径**只此一处**，禁止再抄第二份。 */
function calledQtyNetMap(){
  const map={};
  (Array.isArray(transfers)?transfers:[]).forEach(t=>{
    if(t.reversed)return;                       /* 已冲销原记录不计；冲销生成的反向记录（revType）正常参与 */
    const ty=t.type;
    if(ty!=='call'&&ty!=='return')return;       /* .115：conv/move/冲销反向不涉及销售 calledQty */
    let so=null,sl=null;
    if(t.outOrderId!=null){                     /* .115 方向模型：call 销售在调入侧(in)、return 销售在调出侧(out) */
      const side=(ty==='call')?'in':'out';
      if(t[side+'OrderType']==='sales'){so=t[side+'OrderId'];sl=t[side+'LineIdx'];}
    }else{                                      /* 旧结构（迁移前防御）：销售恒在 salesOrderId */
      so=t.salesOrderId;sl=t.salesLineIdx;
    }
    if(!so||sl==null)return;
    const k=so+'|'+sl;
    map[k]=(map[k]||0)+(ty==='call'?num(t.qty):-num(t.qty));
  });
  return map;
}
/* 2026-08-25.35：存量销售订单明细行回填 calledQty（已调用=调用库存累计）。
   从调拨台账（未冲销 reversed=false 记录）统计：type=call 累加、type=return 扣减，下限 0；幂等（已有 calledQty 的行跳过）。 */
function migrateOrderCalledQty(){
  if(!Array.isArray(transfers)||!transfers.length)return;
  const map=calledQtyNetMap();   // orderId|lineIdx → 净额（口径见 calledQtyNetMap）
  let changed=false;
  orders.forEach(o=>{
    if(!Array.isArray(o.items))return;
    o.items.forEach((it,li)=>{
      if(it.calledQty!=null&&it.calledQty!=='')return;      /* 已有不覆盖 */
      const v=Math.max(0,map[o.id+'|'+li]||0);
      if(v>0){it.calledQty=v;changed=true;}
      else if(it.deliveredQty!=null){it.calledQty=0;changed=true;}   /* 无调拨记录也补 0 兜底（已交付行为主） */
    });
  });
  if(changed){save('orders',orders);logOp('系统','订单管理','系统迁移：销售订单明细回填已调用数量 calledQty');}
}
/* 2026-09-20.132：孤儿台账行号修复（一次性·幂等·事故数据修复）。
   事故第 4 步留下的疤：删行后行索引漂移，而台账 out/inLineIdx 存的仍是旧行号 →
   指向不存在/料号不符的行（越界），applyTransfers 前置校验（transfer.js）要求 items[lineIdx] 存在
   → 该记录**无法用 UI 冲销/退回**；刷新时的台账回填也因键 orderId|lineIdx 不匹配而落空。
   修复规则（保守，宁可不动也不猜）：
     ① 仅非冲销记录；仅销售侧（订单行号只属于销售订单明细）
     ② 该侧 lineIdx 指向的行「不存在」或「料号 ≠ 台照料号」→ 判为孤儿
     ③ 候选 = 本单中料号与台照料号**完全一致**的行；**唯一候选才改写**，多候选/零候选原样保留并记日志
     ④ 被改写的行按 calledQtyNetMap（唯一口径）重算「已调用」，不碰其它行
     ⑤ meta.fixOrphanLineIdx20260920 标记一次性；orders+transfers 一次 DB.tx 原子提交 */
async function repairOrphanTransferLineIdx(){
  if(!meta)return;
  if(meta.fixOrphanLineIdx20260920)return;
  const fixed=[],skipped=[];
  transfers.forEach(t=>{
    if(t.reversed)return;
    ['out','in'].forEach(side=>{
      const s=trSide(t,side);
      if(!s.orderId||s.orderType!=='sales')return;
      if(s.lineIdx==null||s.lineIdx<0)return;
      const o=orders.find(x=>x.id===s.orderId);
      if(!o||!Array.isArray(o.items))return;
      const want=String(s.productId==null?'':s.productId);
      if(!want)return;
      const cur=o.items[s.lineIdx];
      if(cur&&String(cur.productId==null?'':cur.productId)===want)return;   /* 行号指向正确 → 非孤儿 */
      const cands=[];
      o.items.forEach((it,li)=>{ if(String(it.productId==null?'':it.productId)===want)cands.push(li); });
      if(cands.length!==1){skipped.push(t.id+'（'+s.orderId+' 行'+s.lineIdx+' 料号 '+want+' 候选 '+cands.length+' 行）');return;}
      const to=cands[0];
      if(t[side+'OrderId']!=null&&t[side+'OrderType']!=null)t[side+'LineIdx']=to;   /* 新结构（方向模型） */
      else t.salesLineIdx=to;                                                       /* 旧结构（销售侧恒在 sales*） */
      fixed.push({id:t.id,order:s.orderId,from:s.lineIdx,to:to});
    });
  });
  /* 重算口径必须基于「改写之后」的台账：改写前键是旧行号，按新行号取值会取不到而误写成 0 */
  const net=calledQtyNetMap();
  let cq=0;
  fixed.forEach(f=>{
    const o=orders.find(x=>x.id===f.order),it=o&&o.items[f.to];
    if(!it)return;
    const v=Math.max(0,net[f.order+'|'+f.to]||0);      /* 下限 0：与 .35 回填口径一致 */
    if(num(it.calledQty)!==v){it.calledQty=v;cq++;}
  });
  meta.fixOrphanLineIdx20260920=true;
  if(!fixed.length&&!cq){save('meta',meta);return;}
  const ok=await DB.tx([{key:'orders',value:orders},{key:'transfers',value:transfers}],true);
  if(!ok){meta.fixOrphanLineIdx20260920=false;return;}   /* 事务失败：标记复位，下次启动幂等重试 */
  save('meta',meta);
  logOp('系统','调拨台账','系统修复：孤儿台账行号对齐 '+fixed.length+' 条（'+fixed.map(f=>f.id+' '+f.order+' 行'+f.from+'→'+f.to).join('；')+'）'+(cq?('；按台账净额重算已调用 '+cq+' 行'):''));
  if(skipped.length)logOp('系统','调拨台账','系统修复：以下孤儿台账行号无法唯一确定，保留原样待人工核对——'+skipped.join('；'));
}
/* 2026-10-07.138：排产单「来源交付计划」索引漂移修复（一次性·幂等·事故数据修复）。

async function rebindProdPlanDlIdx(){

    const head=moves.slice(0,20).join('；')+(moves.length>20?('；…等共 '+moves.length+' 张'):'');

function migrateDeliveryOrderLine(){

  deliveries.forEach(d=>{
    if(!Array.isArray(d.items)||!d.items.length)return;
    const o=orders.find(x=>x.id===d.orderId);
    if(!o||!Array.isArray(o.items)||!o.items.length)return;
    const oItems=orderItems(o);
    const cnt={};
    d.items.forEach((it,li)=>{
      if(it.orderLine!=null&&it.orderLine!=='')return;   /* 已有不覆盖 */
      let ol=null;
      if(oItems[li]&&(oItems[li].productId||'')===(it.productId||''))ol=li;   /* ① 索引直配 */
      if(ol==null){                                                             /* ② 同 productId 顺序消费 */
        const pid=it.productId||'';
        const n=cnt[pid]=(cnt[pid]||0)+1;
        let seen=0;
        for(let k=0;k<oItems.length;k++){
          if((oItems[k].productId||'')===pid){seen++;if(seen===n){ol=k;break;}}
        }
      }
      if(ol!=null){it.orderLine=ol;changed=true;}
    });
  });
  if(changed){save('deliveries',deliveries);logOp('系统','交付计划','系统迁移：存量交付计划行回填来源订单行索引 orderLine');}

         不会带上「交付计划编号」列（与 .132 的 calledQty 事故同型：改模板漏改存量配置）。
   逻辑：确保持久化 fields.delivery 首位含 planNo；缺失则 unshift 到首位；已存在但定义不符则逐项纠正。幂等。 */
function migrateDeliveryPlanNoField(){
  if(!fields||!Array.isArray(fields.delivery))return;
  const DEF={key:'planNo',label:'交付计划编号',type:'text',required:true,locked:true};
  let changed=false;
  const i=fields.delivery.findIndex(f=>f&&f.key==='planNo');
  if(i<0){
    fields.delivery.unshift(JSON.parse(JSON.stringify(DEF)));
    changed=true;
  }else{
    const f=fields.delivery[i];
    ['label','type','required','locked'].forEach(k=>{if(f[k]!==DEF[k]){f[k]=DEF[k];changed=true;}});
    if(i!==0){fields.delivery.splice(i,1);fields.delivery.unshift(f);changed=true;}   /* 列序对齐：编号恒为首列 */
  }
  if(changed){save('fields',fields);logOp('系统','交付计划','系统迁移：字段配置补齐「交付计划编号」');}
}
/* 迁移（2026-10-14.149）：交付计划**字段配置**移除已废弃的单据头三项冗余汇总。
   背景：与 .134 的 planNo 事故**同型**——fields 是**持久化**的。只改 defaultFields 而不清理线上
         已落库的 fields.delivery，导出 / 导入模板仍会带「订单总量 / 已交付 / 未交付」三列

   逻辑：过滤掉 fields.delivery 中的 orderTotal / delivered / undelivered；有变化才落盘。幂等。 */
function migrateDeliveryDropHeadTotals(){

  const DROP=['orderTotal','delivered','undelivered'];

/* 一次性存量订正（2026-10-14.150）：清除交付计划明细行已删除的两个字段（orderQty / deliveredQty）。
   背景：明细行「订单数量 / 已交付」两列已从字段、界面、导出移除，用户 2026-10-14 决定**存量值一并清掉**。
   安全性：该两字段无任何业务下游依赖（全量调用面核对见代码内 12:52 与 .150 注释）——
          排产下推 / 已计划未交付 / 超排核对只读 planQty；结余与库存投影读**订单**的 deliveredQty。
          ⚠ 本订正**不可逆**（历史快照永久丢失，且信息不再有界面入口）。
   幂等：meta.fixDeliveryItemDropQty20261014 一次性标记。无字段可清时只置标记（不产生日志噪音）。
   原子：deliveries + meta 一次 DB.tx 提交；失败 → 内存由 DB.tx 的 pullAll 复原（含标记复位）→ 下次启动幂等重试。
   执行顺序（订正铁律「数据先到位」）：离线 _apply_150_dropqty.js 先生成并上传 data.json → 重启 prod-server
          → 再部署本前端。故线上正常路径下本函数**见标记即空转**，保留仅为兜底与口径同源。 */
async function fixDeliveryItemDropQty20261014(){
  if(!meta||meta.fixDeliveryItemDropQty20261014)return 0;
  let n=0,rows=0;
  deliveries.forEach(d=>{
    (Array.isArray(d.items)?d.items:[]).forEach(it=>{
      if(!it||typeof it!=='object')return;
      rows++;
      if(Object.prototype.hasOwnProperty.call(it,'orderQty')){delete it.orderQty;n++;}
      if(Object.prototype.hasOwnProperty.call(it,'deliveredQty')){delete it.deliveredQty;n++;}
    });
  });
  meta.fixDeliveryItemDropQty20261014=true;
  if(!n){save('meta',meta);return 0;}                    /* 已是干净数据：仅置标记，不写日志 */
  const ok=await DB.tx([{key:'deliveries',value:deliveries},{key:'meta',value:meta}],false);
  if(!ok)return 0;                                       /* 失败：内存已复原，下次启动重试 */
  logOp('系统','交付计划','系统订正：清除交付计划明细行已删除的「订单数量/已交付数量」存量值（'+rows+' 行，共 '+n+' 个字段值）');
  return n;
}

/* 订单管理：存量库存订单单号前缀 XSDD- → KCDD-，避免与销售订单单号冲突（已为 KCDD- 的跳过；自定义单号按 startDate 重排） */
function migrateInventoryOrderIds(){
  var changed=false;
  // 第一遍：XSDD- 前缀直接替换为 KCDD-（保留日期与序号，确保唯一）
  orders.forEach(function(o){
    if(orderTypeOf(o)!=='库存订单')return;
    var id=o.id||'';
    if(id.indexOf('XSDD-')===0){o.id='KCDD-'+id.slice(5);changed=true;}
  });
  // 第二遍：非 KCDD- 的库存订单（自定义单号），按 startDate 重新生成 KCDD-YYYYMMDD-XXXXX，序号递增防重
  var invMax={};
  function kcSeq(dateStr){
    if(invMax[dateStr]==null){
      var max=0;
      orders.forEach(function(o){
        if(orderTypeOf(o)==='库存订单'&&o.id&&typeof o.id==='string'&&o.id.indexOf('KCDD-'+dateStr+'-')===0){
          var n=parseInt(o.id.slice(('KCDD-'+dateStr+'-').length),10);
          if(!isNaN(n)&&n>max)max=n;
        }
      });
      invMax[dateStr]=max;
    }
    invMax[dateStr]++;
    return String(invMax[dateStr]).padStart(5,'0');
  }
  orders.forEach(function(o){
    if(orderTypeOf(o)!=='库存订单')return;
    var id=o.id||'';
    if(id.indexOf('KCDD-')===0)return;
    var d=String(o.startDate||todayStr()).replace(/-/g,'');
    o.id='KCDD-'+d+'-'+kcSeq(d);
    changed=true;
  });
  if(changed){save('orders',orders);logOp('迁移','订单管理','存量库存订单单号前缀 XSDD- 统一改为 KCDD-');}
}

/* 已计划未交付预计算（2026-08-25.17 新口径，用户拍板）：
   已计划未交付 = Σ(该订单该产品交付计划.planQty) − Σ(名下排产单该产品入库累计 doneQty，排除已取消)。
   只跟「生产入库」走：调拨/导入初始的订单行 deliveredQty 不再参与减数；独立单（deliveryIdx=null）不占交付计划额度不计入；
   排产单删除/取消后其入库自动移出减数（与 .16 全链路反向同步自洽）。返回 orderId|productId → {plan,done} */
/* 2026-08-25.17 新口径：已计划未交付 = Σ交付计划.planQty − Σ名下排产单入库累计（排除已取消，只跟生产入库走）。
   .33 行级化：交付计划行带 orderLine（来源订单行索引）→ key=orderId|L{orderLine} 按明细行区分（同产品多行各自正确）；
   交付计划行无 orderLine（存量）→ 回退产品级 key（orderId|productId），行为不变。
   排产单行经 dlLine → 交付计划行 orderLine 归行级；无 dlLine/无 orderLine → 产品级。
   已知风险（同 .24 dlLine 同款）：订单编辑增删行后订单行索引漂移，orderLine 可能错位。
   2026-10-07.137（事故修复）：① 归属判定改走 ppDlIdxOf（稳定外键优先，抗交付计划索引漂移 R1）；
   ② dlLine 取交付行**必须校验产品一致**（R2）——否则用错行的 orderLine 生成归集键，
   会把别产品的完成量灌进本行（线上 C04.03.008 / C02.02.026 失真的直接成因）。 */
function buildPlannedUndelMap(){
  const m={};
  deliveries.forEach((d,di)=>{
    deliveryItems(d).forEach(x=>{
      const k=x.orderLine!=null&&x.orderLine!==''?(d.orderId+'|L'+x.orderLine):(d.orderId+'|'+(x.productId||''));
      if(!m[k])m[k]={plan:0,done:0};
      m[k].plan+=num(x.planQty);
    });
    productionPlans.forEach(pp=>{
      if(ppDlIdxOf(pp)!==di||pp.status==='已取消')return;
      ppItems(pp).forEach(y=>{
        /* 行解析口径（dlLine 命中且产品一致 → 否则产品唯一匹配 → 否则退化产品级）已收敛到 ppDoneKeyOf（prodplan-core.js）：
           .54 修「交付计划行带 orderLine 而存量排产单 done 归产品级 → 两侧 key 不匹配 → 已计划未交付不减少」；
           .138 修根因 R2「dlLine 取行不校验产品 → 别产品完成量灌进本行（C04.03.008 事故）」。
           两侧同源，**禁止在此再写一份行解析**。 */
        const k=ppDoneKeyOf(d,y);
        if(!m[k])m[k]={plan:0,done:0};
        m[k].done+=ppDoneOf(y);
      });
    });
  });
  return m;
}
/* 2026-09-18.127：销售订单「已调用」列跨料替代警示——归集未冲销的跨料号 call 记录。
   判定：transfers 中 type==='call' 且 !reversed，且调出侧料号 ≠ 调入侧料号。
   必须经 trSide(t,'out') / trSide(t,'in') 读取双方：线上存量含大量旧结构 call（无 outOrderId / inOrderId 等字段），
   直读字段会漏判；trSide 对旧结构按 type 推导兜底（js/transfer.js，页面先于本脚本加载）。
   call 方向语义：out = 库存订单行（实际出货的替代物料，含编码/名称/型号/规格）、in = 销售订单行（被履行替换的原始料号）。
   归集键 = 调入订单id + '|L' + 调入行号（与 renderOrderTable 行键 r.__li 同口径）。
   数量口径 = 毛量：每条命中的 call 的 t.qty 直接列出，不合并、不扣减退回。
   返回 Map<key, Array<{code,name,model,spec,qty,src}>>；src = 来源库存订单号（调出侧订单号）。 */
function buildCrossCallMap(){
  const map=new Map();
  if(!Array.isArray(transfers)||!transfers.length)return map;
  /* 预建索引，避免循环内 orders.find / products.find */
  const orderMap={};
  (orders||[]).forEach(function(o){if(o&&o.id!=null)orderMap[o.id]=o;});
  const prodMap={};
  (products||[]).forEach(function(p){if(p&&p.id!=null)prodMap[p.id]=p;});
  transfers.forEach(function(t){
    if(!t||t.type!=='call'||t.reversed)return;      /* 仅未冲销的调用记录 */
    const oS=trSide(t,'out'),iS=trSide(t,'in');
    if(!iS.orderId)return;                          /* 无调入订单无法归集 */
    const outPid=String(oS.productId==null?'':oS.productId);
    const inPid=String(iS.productId==null?'':iS.productId);
    if(outPid===inPid)return;                       /* 同料号=正常调用，不警示 */
    /* 替代物料四项字段：优先取调出（库存）订单行快照，缺失回退产品主数据 */
    const oo=orderMap[oS.orderId];
    const it=(oo&&Array.isArray(oo.items))?oo.items[oS.lineIdx]:null;
    const code=outPid||(it&&it.productId?String(it.productId):'');
    const pr=prodMap[code]||{};
    const rec={
      code:code,
      name:(it&&it.productName)||pr.name||'',
      model:(it&&it.model)||pr.model||'',
      spec:(it&&it.spec)||pr.spec||'',
      qty:num(t.qty),
      src:oS.orderId||''
    };
    const key=iS.orderId+'|L'+iS.lineIdx;
    if(!map.has(key))map.set(key,[]);
    map.get(key).push(rec);
  });
  return map;
}
/* 2026-09-18.127：跨料替代悬浮框文本（多行；每行一条；行末附来源库存订单号）。字段缺失优雅降级。 */
function crossCallTip(recs){
  if(!Array.isArray(recs)||!recs.length)return '';
  let s='调用库存为其他物料替代（'+recs.length+' 项）：';
  recs.forEach(function(r,i){
    let line=(i+1)+'. '+r.code;
    if(r.name)line+=' '+r.name;
    const ms=[];

/* 销售订单编号：XSDD-YYYYMMDD-XXXXX（销售订单大写-日期-5位序号，每日从 00001 刷新） */
/* 订单编号生成：销售订单 XSDD-YYYYMMDD-XXXXX，库存订单 KCDD-YYYYMMDD-XXXXX（前缀区分，防止两类单号冲突） */
function nextOrderNo(dateStr,type){
  const d=String(dateStr||todayStr()).replace(/-/g,'');
  const prefix=(type==='库存订单'?'KCDD-':'XSDD-')+d+'-';
  let max=0;
  (orders||[]).forEach(o=>{
    if(o.id&&typeof o.id==='string'&&o.id.indexOf(prefix)===0){
      const n=parseInt(o.id.slice(prefix.length),10);
      if(!isNaN(n)&&n>max)max=n;
    }
  });
  return prefix+String(max+1).padStart(5,'0');
}

/* 交付计划编号：JFJH-YYYYMMDD-XXXXX（JFJH 固定前缀 · 单据时间去横线 · 当日 5 位序号左补零，每日从 00001 刷新）
   口径单源：新增保存 / 存量回填迁移 / 导入补号**一律**复用本函数，工程内不得出现第二份编号公式副本。
   生成策略与既有 nextOrderNo 完全同款：同前缀 max+1；另加去重兜底，防脏数据撞号。
   【2026-10-06.134 返工 P-2】日期格式守卫：dateStr 不匹配 /^\d{4}-\d{2}-\d{2}$/ 时兜底为 '2026-08-23'
       （项目既有「未知单据时间」哨兵值，同 saveDelivery / migrateDeliveryCreatedAt 口径）。原因：
       'abc' → JFJH-abc-00001、'2026-8-5' → JFJH-202685-00001（形似合法、语义是「2026 年 85 月」），
       都会产出不匹配 /^JFJH-\d{8}-\d{5}$/ 的脏编号。正常路径（saveDelivery 传 todayStr()）恒合法，行为零变化。
   【2026-10-06.134 返工 I8b·用户批准】读取侧容错：max 扫描与去重集合在比较前先 String(...).trim()，
       使带外围空白的存量编号（'  JFJH-20260823-00042  '）被正确计数——否则同桶新单会另起 00001，
       待同桶长到第 42 条时又会生成「trim 后与存量完全相同」的可见重号。
       ⚠️ 只容错**读取路径**：不 trim 存量数据、不改迁移清洗口径（migrateDeliveryPlanNo 仍只把「纯空白」
          判为缺号并覆盖，非空含外围空白的既有编号一字不改）。正常路径（编号全干净）行为零变化。 */
function nextDeliveryPlanNo(dateStr){
  const _ds=String(dateStr==null?'':dateStr);
  const d=(/^\d{4}-\d{2}-\d{2}$/.test(_ds)?_ds:'2026-08-23').replace(/-/g,'');
  const prefix='JFJH-'+d+'-';
  let max=0;
  (deliveries||[]).forEach(x=>{
    const v=(x&&x.planNo!=null)?String(x.planNo).trim():'';   /* I8b：比较/解析前先 trim（不改存量） */
    if(v.indexOf(prefix)===0){
      const n=parseInt(v.slice(prefix.length),10);
      if(!isNaN(n)&&n>max)max=n;
    }
  });
  let n=max+1;
  /* 去重兜底：编号已存在于 deliveries 的 planNo 集合中则继续 +1，直到不冲突（防御脏数据导致的撞号）；
     I8b：集合同样以 trim 后的值构建，保证「trim 后等值」不会被重复发号。 */
  const used={};
  (deliveries||[]).forEach(x=>{if(x&&x.planNo!=null){const v=String(x.planNo).trim();if(v)used[v]=1;}});
  while(used[prefix+String(n).padStart(5,'0')])n++;
  return prefix+String(n).padStart(5,'0');
}

/* 交付弹窗：明细行已调用/已交付/未交付只读 + 本次交付可填；行级≤未交付、整单≤Σ已调用 */
/* .108：行级可调用余量 = 已调用 − 超出期初直接交付基数的已交付（下限 0）。
   口径演进（版本 .100 → .108）：.100 用 calledQty−deliveredQty，把全部已交付都当作已消耗调用额度；
   .108 起期初直接交付（directDelivered=无调用支撑的历史已交付，.97 迁移/金蝶导入带入）不消耗调用额度——
   只有超出 directDelivered 的已交付才从 calledQty 中扣减（directDelivered 缺省/为 0 时等价 .100 公式）。 */
function saleMaxCallable(it){
  return Math.max(0,num(it.calledQty)-Math.max(0,num(it.deliveredQty)-num(it.directDelivered)));
}
/* 2026-09-21.133：销售订单「剩余可调用量」唯一口径入口（调用库存弹窗三处填充 + 确认校验共用）。
   语义 = 客户还要的（未交付） − 已调用但还没发出去的（在库未交付 saleMaxCallable）。
   未交付 = max(0, 订单数量 − 已交付)；saleMaxCallable = 已调用 − 超出期初直接交付基数的已交付（.108）。
   与 .108 交付侧 / .129 退回侧同源；本式只在本函数出现，任何模块不得复制。 */
function saleRemainCallable(it){
  const undel=Math.max(0,num(it.orderQty)-num(it.deliveredQty));
  return Math.max(0,undel-saleMaxCallable(it));
}

function saleDeliverFill(type){

  const updates=[];
  document.querySelectorAll('#saleDeliverTbl tbody tr').forEach(function(tr){
    const li=Number(tr.querySelector('.sd-qty').dataset.li);
    const it=(o.items||[])[li];
    const qty=num(tr.querySelector('.sd-qty').value);
    /* .108：行级校验——本次交付 ≤ 未交付 且 ≤ 该行可调用余量（saleMaxCallable：已调用−超出期初直接交付基数的已交付，与 .99 填充口径一致） */
    const maxD=Math.max(0,num(it.orderQty)-num(it.deliveredQty));
    const maxC=saleMaxCallable(it);
    const maxRow=Math.min(maxD,maxC);
    if(qty>0){
      if(qty>maxRow){
        if(qty>maxD)overRows.push('「'+(it.productName||it.productId)+'」本次交付 '+qty+' > 该行未交付 '+maxD);
        else overRows.push('「'+(it.productName||it.productId)+'」本次交付 '+qty+' > 该行可调用余量 '+maxC+'（已调用'+num(it.calledQty)+'−已交付'+num(it.deliveredQty)+'，期初直接交付'+num(it.directDelivered)+'豁免）');
      }
      updates.push({li:li,qty:qty});total+=qty;
    }
  });
  if(updates.length===0){alert('请至少填写一行的本次交付数量');return;}
  if(overRows.length>0){alert('以下行本次交付超过可交付上限：\n'+overRows.join('\n'));return;}
  updates.forEach(function(u){o.items[u.li].deliveredQty=num(o.items[u.li].deliveredQty)+u.qty;});
  save('orders',orders);
  syncOrderAutoStatus();
  logOp('新增','销售订单','交付「'+o.id+'」'+updates.reduce(function(s,u){return s+u.qty;},0)+' 台（'+updates.length+' 行）');
  closeModal();
  renderContent();
}
/* 退货弹窗：明细行已交付/可退货只读 + 退货数量可填；退货 ≤ 可退货（=当前已交付，.109 增可退货列明示上限） */

function saleReturnSave(orderId){
  const o=orders.find(function(x){return x.id===orderId;});
  if(!o)return;
  let total=0,overRows=[];
  const updates=[];
  document.querySelectorAll('#saleReturnTbl tbody tr').forEach(function(tr){
    const li=Number(tr.querySelector('.sr-qty').dataset.li);
    const it=(o.items||[])[li];
    const qty=num(tr.querySelector('.sr-qty').value);
    const maxR=Math.max(0,num(it.deliveredQty)); /* .109：可退货=当前已交付，文案随列名 */
    if(qty>0){
      if(qty>maxR)overRows.push('「'+(it.productName||it.productId)+'」退货 '+qty+' > 可退货 '+maxR);
      updates.push({li:li,qty:qty});total+=qty;
    }
  });
  if(updates.length===0){alert('请至少填写一行的退货数量');return;}
  if(overRows.length>0){alert('以下行退货数量超过已交付：\n'+overRows.join('\n'));return;}
  updates.forEach(function(u){
    const _it=o.items[u.li];
    _it.deliveredQty=Math.max(0,num(_it.deliveredQty)-u.qty);
    /* .108：退货使已交付跌至期初直接交付基数以下 → 基数同步下调至新已交付（防负基数/超额豁免） */
    if(_it.directDelivered!=null&&_it.directDelivered!=='')_it.directDelivered=Math.min(num(_it.directDelivered),num(_it.deliveredQty));
  });
  save('orders',orders);
  syncOrderAutoStatus();
  logOp('新增','销售订单','退货「'+o.id+'」'+total+' 台（'+updates.length+' 行）');
  closeModal();
  renderContent();
}

/* 产品主数据：「生成订单」——选中产品生成库存订单（.87：跳转库存管理页签 inv 并打开新增弹窗，明细预填选中商品；原跳订单管理 order 为 .65 模块移动遗留错误） */

function orderModal(idx,prefill){

    if(f.key==='orderType'||(_invModal&&(f.key==='deadline'||f.key==='contractNo')))return;

         已取消/已暂停→仅可改回执行中；已完成→禁用（不可手动更改） */
      const stOpts=statusLocked?['已完成']:((o.status==='已取消'||o.status==='已暂停')?[o.status,'执行中']:['执行中','已取消','已暂停']);

  body+='<div style="display:flex;align-items:center;gap:10px;margin:18px 0 8px"><b style="font-size:14px">订单明细</b><span style="font-size:12px;color:var(--muted)">每行一种产品，一单可含多种开关'+(o.orderType==='库存订单'?'；数量=最大库存量（自动）':'')+'</span>'+(locked?'':'<button class="btn btn-sm" style="margin-left:auto" onclick="batchPickProducts()">批量选择产品</button><button class="btn btn-sm btn-primary" onclick="addOrderItemRow()">+ 添加产品行</button>')+'</div>';
  /* 2026-08-30.92：库存订单弹窗隐藏「数量」输入列（数量=最大库存量）——全局标志供添加行/批量选择复用（_invModal 定义见 headCols 前） */
  window.__orderModalInv=_invModal;
  body+='<div class="table-wrap"><table id="orderItemsTbl"><thead><tr>'+
    /* .92/.94：库存隐藏数量+已调用；.96：销售隐藏最大/最小库存量（库存订单保留——数量=最大库存量需填） */
    orderLineFields().filter(f=>!(_invModal&&(f.key==='orderQty'||f.key==='calledQty'))&&!(!_invModal&&(f.key==='stockMax'||f.key==='stockMin'))).map(f=>'<th>'+esc(f.label)+(f.required?' *':'')+'</th>').join('')+

  showModal(idx!=null?'编辑订单':'新增订单',body,

function orderLineCols(){return orderLineFields();}
function orderItemRow(it,locked,isInv){
  let h='<tr>';
  const refKeys=refKeysOf('order');
  const _inv=(isInv===true||window.__orderModalInv===true);   /* .92：库存订单隐藏数量列（含添加行/批量选择的新行） */
  orderLineCols().forEach(f=>{
    if(_inv&&(f.key==='orderQty'||f.key==='calledQty'))return;   /* .92：库存订单无独立数量（=最大库存量）；.94：已调用=销售订单字段，库存隐藏 */
    if(!_inv&&(f.key==='stockMax'||f.key==='stockMin'))return;   /* .96：销售订单隐藏最大/最小库存量（库存核心字段，库存保留） */
    const v=it[f.key]!=null?it[f.key]:'';

      h+='<td style="display:flex;gap:4px;align-items:center"><input type="text" class="oi_field" data-key="productId" value="'+esc(v)+'" placeholder="产品编码" style="flex:1;min-width:80px"'+(locked?' readonly':'')+' onchange="orderItemIdChange(this)" onblur="orderItemIdChange(this)">'+(locked?'':'<button type="button" class="btn btn-sm" onclick="openProductPicker(this)" title="从产品库选择">选</button>')+'</td>';
    }else if(f.key==='spec'||f.key==='model'||f.key==='calledQty'||f.key==='deliveredQty'){
      /* 由系统联动写入（规格/型号←产品编码；已调用←调用库存；已交付←交付/退货/调用库存登记，.116 起不再手动编辑），不可编辑 */
      h+='<td><input type="'+(f.key==='calledQty'||f.key==='deliveredQty'?'number':'text')+'" class="oi_field" data-key="'+f.key+'" value="'+esc(v)+'" readonly style="width:100%;background:#f6f8fa;color:var(--muted)"></td>';
    }else if(f.type==='ref'){
      h+='<td><input type="text" class="oi_field ref-field" data-key="'+f.key+'" data-ref-form="'+esc(f.refForm||'')+'" data-ref-match="'+esc(f.refMatch||'')+'" data-ref-field="'+esc(f.refField||'')+'" data-ref-key="'+esc(f.refKey||'')+'" value="'+esc(v)+'" readonly style="width:100%;background:#f6f8fa;color:var(--muted)"></td>';
    }else{
      const tp=f.type==='number'?'number':(f.type==='date'?'date':'text');
      h+='<td><input type="'+tp+'" class="oi_field" data-key="'+f.key+'" value="'+esc(f.type==='date'?fmtDate(v):v)+'"'+(locked?' readonly':'')+' style="width:100%"></td>';
    }
  });
  h+='<td style="text-align:center">'+(locked?'':'<button class="btn btn-sm btn-danger" onclick="removeOrderItemRow(this)" title="删除此行">✕</button>')+'</td></tr>';
  return h;

/* 列头：列名 + 漏斗筛选图标（与 thCol 一致风格） */
function ppTh(col){
  const f=window.__ppFilterState[col.key];

    '</th>';

/* 筛选弹窗（参考产品主数据 openFilter：复选 ≤15项 / 关键字 + 模式 / 数值 + 模式） */
function ppOpenFilter(btn,key){
  closeFiltPop();
  const col=(window.__ppSchema||PP_SCHEMA).find(function(c){return c.key===key;});if(!col)return;
  const uniques=window.__ppUniques[key]||[];
  const f=window.__ppFilterState[key]||{mode:'contains',val:'',vals:[]};

      '<input type="number" id="fp_val" value="'+(f.val!=null?esc(f.val):'')+'" placeholder="输入数值">';
  }else{
    inner+='<select id="fp_mode">'+[['contains','包含'],['eq','等于'],['neq','不等于']].map(function(x){return '<option value="'+x[0]+'" '+(f.mode===x[0]?'selected':'')+'>'+x[1]+'</option>';}).join('')+'</select>'+
      '<input type="text" id="fp_val" value="'+esc(f.val||'')+'" placeholder="输入关键字">';
  }
  const pop=document.createElement('div');
  pop.className='filt-pop';
  pop.innerHTML='<div class="fp-title">筛选：'+esc(col.label)+'</div>'+inner+
    '<div class="fp-btns"><button class="btn btn-sm" onclick="closeFiltPop()">取消</button><button class="btn btn-sm" onclick="ppClearFilt(\''+key+'\')">清除</button><button class="btn btn-sm btn-primary" onclick="ppApplyFilt(\''+key+'\','+useChecks+')">确定</button></div>';
  document.body.appendChild(pop);
  pop.addEventListener('click',function(e){e.stopPropagation();});
  const r=btn.getBoundingClientRect();
  let left=r.left;if(left+240>window.innerWidth-8)left=window.innerWidth-248;if(left<8)left=8;
  pop.style.left=left+'px';
  pop.style.top=(r.bottom+6+window.scrollY)+'px';
  filtPop=pop;
  const inp=pop.querySelector('#fp_val');if(inp)inp.focus();
}

function ppClearFilt(key){delete window.__ppFilterState[key];closeFiltPop();ppRenderRows();ppUpdateHeader();}

function ppRenderRows(){
  const tbody=document.getElementById('pp_tbody');if(!tbody)return;
  const fs=window.__ppFilterState;
  const rows=window.__ppRows||[];
  const schema=window.__ppSchema||PP_SCHEMA;
  const visible=rows.filter(function(p){
    for(const k in fs){
      const f=fs[k];if(!f)continue;
      const col=schema.find(function(c){return c.key===k;});if(!col)continue;
      const v=String(col.get?col.get(p):(p[col.key]!=null?p[col.key]:''));
      if(f.mode==='in' && f.vals && f.vals.length){
        if(f.vals.indexOf(v)<0)return false;
      }else if(f.val!=='' && f.val!=null){
        const fv=String(f.val);
        if(f.mode==='contains' && v.toLowerCase().indexOf(fv.toLowerCase())<0)return false;
        if(f.mode==='eq' && v!==fv)return false;
        if(f.mode==='neq' && v===fv)return false;
        if(f.mode==='gte' && num(v)<num(fv))return false;
        if(f.mode==='lte' && num(v)>num(fv))return false;
      }
    }
    return true;
  });
  const opts=window.__ppOpts||{};
  const mode=opts.mode||'multi';
  const preSet=new Set(opts.preselected||[]);
  /* 2026-08-25.51：行标识 uid||id——库存候选用 invOrderId#invLineIdx 唯一键 */
  const uidOf=function(p){return p.uid!=null?p.uid:p.id;};
  if(!visible.length){
    tbody.innerHTML='<tr><td colspan="'+(schema.length+1)+'" style="text-align:center;padding:18px;color:var(--muted)">无匹配记录</td></tr>';
    return;
  }
  let html='';
  visible.forEach(function(p){
    const uid=uidOf(p);
    const checked=preSet.has(uid);
    const inputCtrl=mode==='single'
      ?'<input type="radio" class="pp_radio" name="pp_single" value="'+esc(uid)+'" '+(checked?'checked':'')+'>'
      :'<input type="checkbox" class="pp_chk" data-id="'+esc(uid)+'" '+(checked?'checked':'')+'>';
    html+='<tr data-id="'+esc(uid)+'"'+(opts.clickSelect?' style="cursor:pointer" onclick="ppPickRow(this)"':'')+'><td>'+inputCtrl+'</td>';
    schema.forEach(function(col){
      const v=col.get?col.get(p):(p[col.key]!=null?p[col.key]:'');
      html+='<td>'+esc(v)+'</td>';
    });
    html+='</tr>';
  });
  tbody.innerHTML=html;
}

/* ================================================================
   2026-09-20.132：订单明细「内部字段保全」+「行号漂移重映射」（编辑保存前置）
   ----------------------------------------------------------------
   根因 B：saveOrder 按弹窗表单 .oi_field **重建** items，凡「不在字段配置里」的行内字段
     （calledQty / directDelivered / origProduct）一律收集不到 → 保存即丢。
     丢 calledQty 的连锁：列表「已调用」变 0 → saleMaxCallable=0 → 该行交付/退回被
     「可调用余量 0」卡死。
   根因 D'：删行/插行使订单行索引漂移，而调拨台账 out/inLineIdx、交付计划行 orderLine
     存的都是**行号**——漂移后指向不存在的行（越界）或错行。
   本组函数在保存前一次处理：①保序匹配新旧行 ②拒存仍有引用的被删行 ③回带内部字段
     ④按映射改写台账/交付计划行号。纯函数（只改入参对象），便于单测。
   ================================================================ */

/* 内部行字段：不进字段配置、不进弹窗表单，但必须随行保留（丢失 = 数量口径错 / 溯源断链） */
const ORDER_INTERNAL_LINE_KEYS=['calledQty','directDelivered','origProduct'];

/* 新旧明细行「保序匹配」：返回 src[]（下标=新行号，值=旧行号，-1=新行无来源）。
   料号相同且相对顺序一致即视为同一行（贪心向前推进）——删行/插行/整体重排都能对上；
   换品改码的行匹配不上（src=-1，不臆造字段，是否允许由引用守卫判定）。 */
function matchOrderLines(oldLines,newLines){
  const src=[];
  for(let i=0;i<newLines.length;i++)src.push(-1);
  if(!Array.isArray(oldLines)||!oldLines.length)return src;
  const pidOf=x=>String((x&&x.productId!=null)?x.productId:'');
  let p=0;
  newLines.forEach((it,ni)=>{
    if(!pidOf(it))return;
    for(let oi=p;oi<oldLines.length;oi++){
      if(pidOf(oldLines[oi])===pidOf(it)){src[ni]=oi;p=oi+1;return;}
    }
  });
  return src;
}

/* 回带内部字段：src 命中的新行，从旧行复制表单收集不到的键。返回回带条数。
   **表单已带值的键以表单为准**（.132 起 calledQty 起已是只读表单列，A 迁移补配置后由表单带出）。 */
function carryInternalLineFields(oldLines,items,src){
  if(!Array.isArray(oldLines))return 0;
  let n=0;
  items.forEach((it,ni)=>{
    const oi=src[ni];
    if(oi<0)return;
    const old=oldLines[oi];
    if(!old)return;
    ORDER_INTERNAL_LINE_KEYS.forEach(k=>{
      if(it[k]!==undefined)return;
      if(old[k]===undefined)return;
      it[k]=old[k];n++;
    });
  });
  return n;
}

/* 被删行引用守卫：src 未命中的旧行（含换品改码）若仍被「未冲销调拨台账」或「交付计划行」
   引用 → 返回提示文案（调用方拒存）；无引用 → null（可安全删除）。
   与 .111 订单级删除守卫同风格：给出**可执行的清零路径**，绝不静默丢值。 */
function guardRemovedOrderLines(o,src){
  const kept={};
  src.forEach(oi=>{ if(oi>=0)kept[oi]=1; });
  const probs=[];
  (o.items||[]).forEach((it,oi)=>{
    if(kept[oi])return;
    const nm=(it.productName||'')+(it.productId?('（'+it.productId+'）'):'');
    const label='产品「'+(nm||('第'+(oi+1)+'行'))+'」（原第'+(oi+1)+'行）';
    let tr=0,dl=0;
    transfers.forEach(t=>{
      if(t.reversed)return;                    /* 已冲销原记录数量口径为 0，不拦 */
      ['out','in'].forEach(side=>{
        const s=trSide(t,side);
        if(s.orderId===o.id&&s.orderType==='sales'&&Number(s.lineIdx)===oi)tr++;
      });
    });
    deliveries.forEach(d=>{
      if(d.orderId!==o.id)return;
      deliveryItems(d).forEach(x=>{
        if(x.orderLine==null||x.orderLine==='')return;
        if(Number(x.orderLine)===oi)dl++;
      });
    });
    if(tr||dl)probs.push('　· '+label+(tr?('｜未冲销调拨台账 '+tr+' 条'):'')+(dl?('｜交付计划行 '+dl+' 条'):''));
  });
  if(!probs.length)return null;
  return '订单「'+o.id+'」以下明细行仍有业务引用，不能直接删除或改产品编码：\n'+probs.join('\n')+
    '\n\n如需删除/改码：请先到「调拨台账」冲销这些行的调用/退回记录；已下推交付计划的，请先删除对应交付计划行，再回到本弹窗保存。';
}

/* 行号重映射：由 src（新行→旧行）推出「旧行→新行」，改写以订单行号为键的关联数据：
     ① 调拨台账 out/inLineIdx（新结构直改；旧结构销售侧写回 salesLineIdx）
     ② 交付计划行 orderLine（排产单经 dlLine→交付计划行 orderLine 自动跟随，无需改）
   返回 {oldToNew, tr, dl}（tr/dl = 实际改写条数）。仅在编辑订单时调用。 */
function remapOrderLineRefs(o,src){
  const oldToNew={};
  src.forEach((oi,ni)=>{ if(oi>=0)oldToNew[oi]=ni; });
  let tr=0,dl=0;
  transfers.forEach(t=>{
    ['out','in'].forEach(side=>{
      const s=trSide(t,side);
      if(s.orderId!==o.id||s.orderType!=='sales')return;
      if(s.lineIdx==null||s.lineIdx<0)return;
      const ni=oldToNew[s.lineIdx];
      if(ni===undefined||ni===s.lineIdx)return;
      if(t[side+'OrderId']!=null&&t[side+'OrderType']!=null)t[side+'LineIdx']=ni;   /* 新结构（方向模型） */
      else t.salesLineIdx=ni;                                                       /* 旧结构：销售侧恒在 sales* */
      tr++;
    });
  });
  deliveries.forEach(d=>{
    if(d.orderId!==o.id)return;
    deliveryItems(d).forEach(x=>{
      if(x.orderLine==null||x.orderLine==='')return;
      const ni=oldToNew[Number(x.orderLine)];
      if(ni===undefined||ni===Number(x.orderLine))return;
      x.orderLine=ni;dl++;
    });
  });
  return {oldToNew:oldToNew,tr:tr,dl:dl};
}

function saveOrder(idx){
  const cols=fields.order;
  const o={};
  cols.forEach(f=>{
    if(isLineField(f))return;
    const el=document.getElementById('of_'+f.key);
    if(!el)return;   /* .93 修复：隐藏控件（订单类型 .88 隐藏后无 of_orderType）跳过——值由下方兜底补回，避免 null.value 崩溃 */
    o[f.key]=f.type==='number'?num(el.value):el.value;
  });
  /* .93 修复：orderType 控件隐藏后未收集——从上下文补回（编辑=原单、新增=pendingOrderType、兜底销售），保证 .25 校验链完整 */
  if(!o.orderType){
    if(idx>=0&&orders[idx]&&orders[idx].orderType)o.orderType=orders[idx].orderType;
    else if(pendingOrderType)o.orderType=pendingOrderType;
    else o.orderType='销售订单';
  }
  if(!o.id){alert('请填写订单编号');return;}
  if(!o.customer){alert('请填写客户名称');return;}
  if(o.orderType==='销售订单'&&(!o.contractNo||!String(o.contractNo).trim())){alert('销售订单请填写合同号');return;}
  /* 2026-08-25.3：审核状态状态机校验（弹窗选项已限制，此处兜底防篡改）：
     已完成不可手动改；已取消/已暂停仅可改回执行中；执行中不可手动设已完成（由系统自动判定） */
  if(idx>=0){
    const oldStatus=orders[idx]&&orders[idx].status;
    const newStatus=o.status;
    if(oldStatus==='已完成'&&newStatus!=='已完成'){alert('订单已「已完成」，状态由系统自动判定（全部交付完成），不可手动更改');return;}
    if((oldStatus==='已取消'||oldStatus==='已暂停')&&newStatus!=='执行中'&&newStatus!==oldStatus){alert('订单已「'+oldStatus+'」，仅可改回「执行中」');return;}
    if(oldStatus==='执行中'&&newStatus==='已完成'){alert('「已完成」由系统自动判定（整单未交付数量为 0），不可手动设置');return;}
  }
  const items=[];
  /* 2026-08-30.92：库存订单数量=最大库存量（校验/过滤以 stockMax 为准） */
  const _oqOf=function(it){return num((o.orderType==='库存订单'&&it.stockMax!=null&&it.stockMax!=='')?it.stockMax:it.orderQty);};
  /* .132：旧明细行引用——内部字段保全 / 行号重映射 / 被删行守卫 统一在下方 .132 块处理
     （替换 .108 只补 directDelivered 的按索引补丁：该补丁在「删前面行」时索引已漂移，
       既不命中、又无任何提示，是本次 calledQty 静默归零的同一条漏链） */
  const _oldLines=(idx>=0&&orders[idx]&&orders[idx].items)?orders[idx].items:null;
  document.querySelectorAll('#orderItemsTbl tbody tr').forEach((tr,li)=>{
    const it={};
    tr.querySelectorAll('.oi_field').forEach(el=>{
      const f=cols.find(c=>c.key===el.dataset.key);
      it[el.dataset.key]=(f&&f.type==='number')?num(el.value):(el.value||'');
    });
    if(it.productId||_oqOf(it)>0)items.push(it);
  });
  if(items.length===0){alert('请至少填写一行产品明细（选择产品并填写'+(o.orderType==='库存订单'?'最大库存量':'订单数量')+'）');return;}
  const bad=items.find(it=>!it.productId||_oqOf(it)<=0);
  if(bad){alert('存在"未选产品或'+(o.orderType==='库存订单'?'最大库存量':'数量')+'为0"的明细行，请补全或删除该行');return;}
  /* .132：编辑保存前置——①保序匹配新旧行 ②拒存仍有引用的被删行 ③回带内部字段 ④台账/交付计划行号重映射。
     顺序不可换：先守卫（拒存则一字不写）→ 再回带 → 最后重映射（重映射会改 transfers/deliveries，须在守卫之后）。 */
  if(_oldLines){
    const _src=matchOrderLines(_oldLines,items);
    const _blk=guardRemovedOrderLines(orders[idx],_src);
    if(_blk){alert(_blk);return;}
    carryInternalLineFields(_oldLines,items,_src);
    const _rm=remapOrderLineRefs(orders[idx],_src);
    if(_rm.tr||_rm.dl){
      if(_rm.tr)save('transfers',transfers);
      if(_rm.dl)save('deliveries',deliveries);
      logOp('编辑','订单管理','订单「'+o.id+'」明细行号对齐：调拨台账 '+_rm.tr+' 条、交付计划行 '+_rm.dl+' 条改指新行号');
    }
  }
  // 引用字段重算（基于关联键实时取值，确保存储正确）
  orderHeadFields().forEach(f=>{ if(f.type==='ref'){ o[f.key]=lookupRef(f.refForm,f.refMatch,o[f.refKey],f.refField); } });
  orderLineFields().forEach(f=>{ if(f.type==='ref'){ items.forEach(it=>{ it[f.key]=lookupRef(f.refForm,f.refMatch,it[f.refKey],f.refField); }); } });
  o.items=items;
  // 新增订单时，强制使用打开弹窗时记录的意图分类，避免串到其它分类
  if(idx<0&&pendingOrderType){o.orderType=pendingOrderType;}
  /* orderType 兜底：若字段配置缺失（被字段设置删除）导致收集不到，
     编辑时保留原订单类型，避免「库存订单」被默认归为「销售订单」 */
  if(!o.orderType){
    if(idx>=0&&orders[idx]&&orders[idx].orderType)o.orderType=orders[idx].orderType;
    else o.orderType='销售订单';
  }
  pendingOrderType=null;
  if(idx>=0){
    const oldO=orders[idx];
    // 保留字段配置未覆盖的扩展字段（如金蝶导入标记 src/srcFile），编辑时不得丢失
    ['src','srcFile'].forEach(function(k){if(oldO&&oldO[k]!==undefined&&o[k]===undefined)o[k]=oldO[k];});
    orders[idx]=o;
    const rl=o.id+'('+esc(o.customer)+')';
    logFieldDiffs('订单管理',orderHeadFields(),oldO,o,rl);
    logOrderLineDiffs('订单管理',oldO.items,o.items,rl);
  }else{
    if(orders.find(x=>x.id===o.id)){alert('订单编号已存在');return;}
    orders.push(o);
    logOp('新增','订单管理','新增订单「'+o.id+'」('+esc(o.customer)+')，'+items.length+' 行明细');
  }
  save('orders',orders);
  syncOrderAutoStatus();   // 2026-08-25.3：按未交付合计自动判定状态（已完成不可手动设，此处兜底校正）
  if(o.orderType==='库存订单')syncStockFromInvOrders();   // 库存订单已交付数量 → 产品库存
  closeModal();
  renderContent();

/* 2026-08-25.21：订单是否已下推交付计划（存在关联交付计划即视为已下推，禁止删除；对应交付计划删除后自动恢复可删） */
function hasDeliveryOf(orderId){return deliveries.some(d=>d.orderId===orderId);}
/* 2026-09-05.111：销售订单业务痕迹判定——已交付合计>0 或 已调用合计>0（含期初直接交付 directDelivered 历史）视为有业务记录，禁止删除防误删发货/占库历史。
   返回 null=无痕迹可删；否则 {dv,ck}。非销售订单恒返回 null（库存订单维持原删除语义：删除后 syncStockFromInvOrders 重算库存）。 */
function saleOrderTrace(o){
  if(orderTypeOf(o)!=='销售订单')return null;
  const dv=orderDeliveredOf(o);
  const ck=orderItems(o).reduce(function(s,i){return s+num(i.calledQty);},0);
  return (dv>0||ck>0)?{dv:dv,ck:ck}:null;
}
function delOrder(idx){
  /* 2026-08-25.21：已下推交付计划的订单禁止删除（删除订单会破坏交付计划/排产关联链路） */
  if(hasDeliveryOf(orders[idx].id)){alert('订单「'+orders[idx].id+'」已下推交付计划，不能删除；如需删除请先删除对应的交付计划');return;}
  /* 2026-09-05.111：销售订单有业务痕迹（已交付/已调用>0，含期初直接交付历史）禁删 */
  const _tr=saleOrderTrace(orders[idx]);
  if(_tr){
    const _st=(orders[idx].status==='已取消'||orders[idx].status==='已暂停');
    const _ways=[];
    if(_tr.ck>0)_ways.push('已调用额度可到调拨台账「冲销」还原');
    if(_tr.dv>0&&!_st)_ways.push('已交付记录可「退货」清零');
    let _msg='订单「'+orders[idx].id+'」已有业务记录（已交付 '+_tr.dv+'、已调用 '+_tr.ck+'），为防止误删历史数据不能删除。';
    _msg+=_ways.length>0?('如需清零后再删：'+_ways.join('；')+'。'):('该订单处于「'+orders[idx].status+'」且存在无法在界面清零的历史记录，如需删除请走数据维护流程。');
    alert(_msg);return;
  }
  if(!confirm('确认删除订单「'+orders[idx].id+'」？'))return;
  const del=orders[idx];
  logOp('删除','订单管理','删除订单「'+orders[idx].id+'」('+orders[idx].customer+')');
  orders.splice(idx,1);
  save('orders',orders);
  if(del&&orderTypeOf(del)==='库存订单')syncStockFromInvOrders();   // 删除库存订单后重算产品库存
  renderContent();
}

/* ================================================================
   调拨：调用库存 / 退回库存 / 冲销（写入调拨台账 transfers）
   调用库存：库存订单已交付数量↓、销售订单已交付数量↑（库存随之回落）
   退回库存：反向
   冲销：生成一条反向补偿记录，不删原记录
   >>> 批次5a(2026-09-01)：实现已拆出至 js/transfer.js

/* 库存打通（一次性迁移）：把产品主数据现有「库存/已交付数量」反填到对应库存订单的
   「已交付数量」，使 库存 = Σ(库存订单已交付) 在存量数据上立即成立，避免同步后库存被清零。
   仅对「当前已交付合计为 0 且库存>0」的产品执行；已有交付或库存≤0 的跳过（幂等）。
   【P1·.125·A】拆为「纯变更器 + 兼容包装」：restoreBackup 用纯变更器（orders 并入同一次 DB.tx）。 */
function backfillInvDeliveredMutation(){
  let changed=false;
  products.forEach(p=>{
    if(p.stock==null||num(p.stock)<=0)return;
    const pid=p.id;
    const lines=[];
    orders.forEach(o=>{
      if(orderTypeOf(o)!=='库存订单')return;
      orderItems(o).forEach(it=>{ if(it.productId===pid) lines.push(it); });
    });
    if(!lines.length)return;
    const totalDel=lines.reduce((s,it)=>s+num(it.deliveredQty),0);
    if(totalDel>0)return;                // 已有交付记录，不覆盖（幂等）
    const target=num(p.stock);
    const sumQty=lines.reduce((s,it)=>s+num(it.orderQty),0);
    if(sumQty>0){
      let assigned=0;
      lines.forEach((it,i)=>{
        const d=(i===lines.length-1)?(target-assigned):Math.round(target*num(it.orderQty)/sumQty);
        it.deliveredQty=Math.max(0,d); assigned+=it.deliveredQty;
      });
    }else{
      const base=Math.floor(target/lines.length);
      lines.forEach((it,i)=>{ it.deliveredQty=base+(i===0?(target-base*lines.length):0); });
    }
    changed=true;
  });
  return changed;
}
/* 【P1 兼容包装】行为与改造前逐字一致：变更时落盘 orders + 记日志（initApp 迁移链仍走此处）。 */
function backfillInvDeliveredFromStock(){
  if(backfillInvDeliveredMutation()){
    save('orders',orders);
    logOp('系统','库存打通','将产品现有库存按订单量比例反填到库存订单「已交付数量」（一次性对齐）');
  }
}

/* 库存同步：产品「库存/已交付数量」= 全部「库存订单」明细已交付数量之和。
   业务口径（2026-08-23 用户确认）：库存完全由库存订单驱动——所有库存必须由库存订单支撑；
   无库存订单的产品库存一律归零（期初库存经 backfillInvDeliveredFromStock 反填进订单后走本口径）；
   删除/恢复回滚库存订单后，产品库存自动对齐，杜绝残留孤儿库存。
   后续「销售订单调用库存」功能将在此基础上扣减。 */
/* 【P1 拆分】纯重算：只改内存 products.stock，**不写盘**（返回是否变化）。
   供事务化写入点「写盘前前置重算」调用，把库存投影并入同一个 /api/tx（设计 §4.4）。
   口径零改动：全量对齐（无库存订单的产品 → 0），仅 if-changed。 */
function recomputeStockFromInvOrders(){
  const map={};
  orders.forEach(o=>{
    if(orderTypeOf(o)!=='库存订单')return;
    orderItems(o).forEach(it=>{
      if(it.productId)map[it.productId]=(map[it.productId]||0)+num(it.deliveredQty);
    });
  });
  let changed=false;
  products.forEach(p=>{
    const v=map[p.id]||0;            // 全量对齐：无库存订单的产品 → 0
    if(num(p.stock)!==v){p.stock=v;changed=true;}
  });
  return changed;
}
/* 【P1 兼容包装】行为与改造前一致：重算 + 变化时落盘 products。 */
function syncStockFromInvOrders(){
  if(recomputeStockFromInvOrders())save('products',products);
}

function getWeekStart(d){

  date.setDate(date.getDate()-day+1);

}

}

    deliveries.forEach(d=>dlListRows(d).forEach(x=>rows.push({d,it:x.it,li:x.li,di:deliveries.indexOf(d)})));
    /* 2026-08-25.23：单据级汇总字段（订单总量/本批计划/已排产）拆到明细行——单据级仅保留单据属性 7 列；
       明细级新增「已排产」行级字段（ppPlannedOf 该单据+该产品已排产，排除已取消，不落库实时计算） */
    /* 2026-10-06.134：单据头新增「交付计划编号」planNo，置于**第 1 列**（勾选框之后、单据时间之前）。
       ⚠️ 列集合三处必须严格一致：本 schema 前 HEAD_COLS 项 ↔ HEAD_COLS ↔ headHtml 的前 HEAD_COLS 个 <td>。 */
    TBL_SCHEMAS.delivery=[

      {key:'orderId',label:'订单编号',type:'text',get:r=>r.d.orderId},
      {key:'customer',label:'客户',type:'text',get:r=>r.d.customer},

      {key:'finalDate',label:'最终交付期',type:'date',get:r=>r.d.finalDate},

         依据：三项只在交付计划本页被显示/排序/筛选/超量提醒使用；排产下推、已计划未交付、超排核对、
         库存、结余、订单状态一律只读 planQty（详见 12:52 全量调用面核对）。行级列 10 → 7。

      {key:'_planQty',label:'本批计划',type:'number',get:r=>r.it.planQty},

    });
    if(dAll.length>0)html+=sumRowHtml(TBL_SCHEMAS.delivery,dAll,'<td class="sel-col"></td>','',sumLabelKey('delivery',TBL_SCHEMAS.delivery));   /* 2026-09-05.112：底部合计（订单数量/已交付/未交付/本批计划/已排产求和，口径=筛选后全量）；.113 标签随列布局首列 */
    html+='</tbody></table></div>';
  }

  html+='</div>';
  return html;
}

/* 保存报工明细编辑：更新 worker/qty 并按新数量重算排产单累计（超量拦截；已完成不全完成回退生产中）
   【P1 事务化】写入收尾改为一次 /api/tx（§4.3）：事实表 productionPlans/productionReports/orders
   与派生投影 products 前置重算后同事务提交，消除「三处独立 save + 回写再两处」的不一致窗口。 */
async function ppSaveReportEdits(planId){
  if(!ensureWrite('prodPlan'))return;
  const p=productionPlans.find(x=>x.id===planId);
  if(!p)return;
  const reps=ppReportsOf(planId);
  if(reps.length===0)return;
  /* 读取每行输入：worker + 各工序新数量 */
  const updates=reps.map((r,i)=>{
    const worker=String((document.getElementById('rp_w_'+i)||{}).value||'').trim();
    const qtyMap={};
    (r.items||[]).forEach((x,j)=>{
      const el=document.getElementById('rp_q_'+i+'_'+j);
      const v=el?parseFloat(el.value):NaN;
      qtyMap[x.step]=isNaN(v)?num(x.qty):v;
    });
    return {idx:productionReports.indexOf(r),worker:worker,qtyMap:qtyMap};
  });
  for(let i=0;i<updates.length;i++){
    /* 2026-08-29.77：报工人改非必填（移除必填校验） */
    /* 2026-08-25.41：单道工序数量可改 0（≥0 整数）；一条报工至少保留一道工序 >0（全 0=删除该条，走删除按钮） */
    let anyQ=0;
    for(const step in updates[i].qtyMap){
      const q=updates[i].qtyMap[step];
      if(!isFinite(q)||q<0||Math.round(q)!==q){alert('第 '+(i+1)+' 条报工的工序数量无效（须为不小于 0 的整数）');return;}
      if(q>0)anyQ=1;
    }
    if(!anyQ){alert('第 '+(i+1)+' 条报工不能所有工序都为 0（如需撤销该条报工，请点击该行的「删除」按钮）');return;}
  }
  /* 按产品行×工序聚合新累计，并检查是否超过本次排产数。
     2026-08-25.40：行级化——key=productId(+#dlLine)，同产品多行各自聚合（依赖 .40 起报工记录带 dlLine；存量记录回退产品级） */
  const lineKey=x=>(x.productId||'')+(x.dlLine!=null?'#'+x.dlLine:'');
  const itMap={};
  ppItems(p).forEach(it=>{itMap[lineKey(it)]=it;});
  const oldInbound={};                         // 2026-08-25.16：应用前各产品行旧入库累计（doneQty=唯一完成口径）
  ppItems(p).forEach(it=>{oldInbound[lineKey(it)]=ppDoneOf(it);});
  const agg={};
  updates.forEach(u=>{
    const rec=productionReports[u.idx];
    (rec.items||[]).forEach(x=>{
      const k=lineKey(x);
      if(!agg[k])agg[k]={};
      agg[k][x.step]=(agg[k][x.step]||0)+num(u.qtyMap[x.step]);
    });
  });
  const overMsg=[];
  for(const k in agg){
    const it=itMap[k];
    if(!it)continue;
    const def=stepsDefOf(p,it);
    for(const step in agg[k]){
      const stepDef=def.find(s=>s.key===step);
      const limit=(stepDef&&!stepDef.plan)?ppPlanOf(it):ppStepPlan(it,step);
      if(limit>0&&agg[k][step]>limit)overMsg.push('「'+(it.productName||it.productId)+'」'+(stepDef?stepDef.label:step)+'：修改后累计 '+agg[k][step]+' / 本次排产 '+limit);
    }
  }
  if(overMsg.length>0){
    alert('修改后报工累计超过本次排产数：\n'+overMsg.join('\n')+'\n\n请调整后重新保存。');
    return;
  }
  /* .139 结余守恒守卫：改动前快照（增量清单与下文 inboundDelta 同口径——入库类工序按 productId+dlLine 归行） */
  const gList=[];
  for(const k in agg){
    const it=itMap[k];
    if(!it)continue;
    let d=0;
    for(const step in agg[k]){ if(step==='inbound'||step==='finInbound')d+=(num(agg[k][step])-num(oldInbound[k])); }
    if(d)gList.push({productId:it.productId,qty:d,orderLine:ppOrderLineOf(p,it)});
  }
  const guardOn=gList.length>0&&invBalGuardApplies(p);
  const guardItemsSnap=guardOn?guardSnapItems(ppItems(p)):null;
  const guardStatusBefore=p.status;
  const guardRows=guardOn?invBalGuardRowsOfDeltas(p,gList,buildPlannedUndelMap()):null;
  const guardReportsSnap=guardOn?JSON.parse(JSON.stringify(updates.map(u=>productionReports[u.idx]))):null;
  /* 应用：覆盖累计 + 更新记录 */
  const inboundDelta=[];                       // 2026-08-25.16：入库累计 新−旧 → 回写订单；.40 行级化
  for(const k in agg){
    const it=itMap[k];
    if(!it)continue;
    const st=ppSteps(it);
    for(const step in agg[k]){
      if(st[step]===undefined)ppEnsureSteps(it,stepsDefOf(p,it));
      if(typeof st[step]==='object')st[step].done=agg[k][step];else st[step]=agg[k][step];
      if(step==='inbound'||step==='finInbound'){
        it.doneQty=agg[k][step];
        const dlLine=it.dlLine!=null?it.dlLine:null;
        let rec=dlLine!=null?inboundDelta.find(x=>x.productId===it.productId&&x.dlLine===dlLine):inboundDelta.find(x=>x.productId===it.productId&&x.dlLine==null);
        if(!rec){rec={productId:it.productId,dlLine:dlLine,qty:0,orderLine:ppOrderLineOf(p,it)};inboundDelta.push(rec);}
        rec.qty+=(agg[k][step]-num(oldInbound[k]));
      }
    }
  }
  updates.forEach(u=>{
    const rec=productionReports[u.idx];
    rec.worker=u.worker;
    (rec.items||[]).forEach(x=>{x.qty=num(u.qtyMap[x.step]);});
  });
  const allDone=ppItems(p).every(z=>ppPlanOf(z)>0&&ppDoneOf(z)>=ppPlanOf(z));
  if(p.status==='已完成'&&!allDone)p.status='生产中';
  /* 【P1 事务化】入库回写（.40 行级）+ 库存投影先在内存算完，再与事实表一次提交（§4.3/§4.4）：
     事实表 productionPlans/productionReports 必然在事务内；orders 仅真有回写时伴随；products 仅投影变化时伴随。 */
  let inboundChanged=false;
  inboundDelta.forEach(r=>{ if(r.qty&&writebackInboundMutation(p.orderId,r.productId,r.qty,r.orderLine))inboundChanged=true; });
  /* .139 结余守恒校验（用户 2026-10-07 要求）：入库前后「结余」有变化 = 错误 → 弹窗 + 整批退回 */
  if(guardOn){
    const bad=invBalGuardCheck(guardRows,buildPlannedUndelMap());
    if(bad.length){
      /* 内存回滚：报工明细（worker/qty）→ 排产单累计（steps/doneQty）→ 订单行「已交付」→ 排产单状态 */
      updates.forEach((u,i)=>{
        const rec=productionReports[u.idx],s=guardReportsSnap[i];
        if(!rec||!s)return;
        rec.worker=s.worker;
        (rec.items||[]).forEach((x,j)=>{ if(s.items&&s.items[j])x.qty=s.items[j].qty; });
      });
      guardRestoreItems(guardItemsSnap,ppItems(p));
      guardRestoreDelivered(guardRows);
      p.status=guardStatusBefore;
      invBalGuardAlert(bad,'编辑报工');
      return;
    }
  }
  const stockChanged=recomputeStockFromInvOrders();
  const statusChanged=recomputeOrderAutoStatus();
  const ops=[{key:'productionPlans',value:productionPlans},{key:'productionReports',value:productionReports}];
  if(inboundChanged||statusChanged)ops.push({key:'orders',value:orders});
  if(stockChanged)ops.push({key:'products',value:products});
  const ok=await DB.tx(ops,false);
  if(!ok)return;   /* DB.tx 已 pullAll 复原内存并提示；不进入成功态（不 closeModal/不渲染成功） */
  logOp('编辑报工','排产计划','编辑排产单「'+p.id+'」报工明细（报工人/数量）');
  closeModal();
  renderContent();
  /* 2026-08-25.64：编辑报工后状态可能回退（已完成→生产中）导致被筛选隐藏，自动取消勾选 */
  const _rpi=productionPlans.indexOf(p);
  if(_rpi>=0&&!prodPlanRowVisibleInDom(p.id))clearHiddenProdPlanSel(_rpi);
}
/* 删除一条报工明细：同步回退排产单对应工序累计完成数；已完成后回退则状态回到生产中
   【P1 事务化】写入收尾改为一次 /api/tx（§4.3，与 ppSaveReportEdits 同构）。 */
async function ppDelReport(id){
  if(!ensureWrite('prodPlan'))return;
  if(!needAct('prodPlan.ppReportEdit'))return;   /* .119：删除单条报工与编辑报工同键 ppReportEdit（默认车间） */
  const idx=productionReports.findIndex(r=>r.id===id);
  if(idx<0){alert('未找到该报工记录');return;}
  const rec=productionReports[idx];
  const p=productionPlans.find(x=>x.id===rec.planId);
  const labelParts=(rec.items||[]).map(x=>x.label+'-'+money(x.qty)).join('、');
  if(!confirm('删除该条报工（'+(rec.date||'')+' '+(rec.time||'')+' '+(rec.worker||'')+'：'+labelParts+'）？\n\n将同步回退排产单「'+rec.planId+'」的累计完成数，此操作不可撤销。'))return;
  /* .139 结余守恒守卫：改动前快照（扣回量口径与下文 inboundDelta 完全一致：
     dec = min(本次报工量, 当前工序累计)，按 productId 归并） */
  const gList=[];
  if(p&&invBalGuardApplies(p)){
    const gd={};
    (rec.items||[]).forEach(x=>{
      if(x.step!=='inbound'&&x.step!=='finInbound')return;
      const it=ppItems(p).find(z=>(z.productId||'')===(x.productId||''));
      if(!it)return;
      const st0=ppSteps(it);
      const dec=Math.min(num(x.qty),num(typeof st0[x.step]==='object'?st0[x.step].done:st0[x.step]));
      if(dec)gd[it.productId||'']=(gd[it.productId||'']||0)-dec;
    });
    Object.keys(gd).forEach(pid=>{ if(gd[pid])gList.push({productId:pid,qty:gd[pid],orderLine:null}); });
  }
  const guardOn=gList.length>0;
  const guardItemsSnap=guardOn?guardSnapItems(ppItems(p)):null;
  const guardStatusBefore=p?p.status:null;
  const guardRows=guardOn?invBalGuardRowsOfDeltas(p,gList,buildPlannedUndelMap()):null;
  const guardRecSnap=guardOn?JSON.parse(JSON.stringify(rec)):null;
  const inboundDelta={};                       // 2026-08-25.16：删除报工 → 扣回订单已交付
  if(p){
    (rec.items||[]).forEach(x=>{
      const it=ppItems(p).find(z=>(z.productId||'')===(x.productId||''));
      if(!it)return;
      const st=ppSteps(it);
      if(st[x.step]===undefined)ppEnsureSteps(it,stepsDefOf(p,it));   // 防御：确保工序键存在
      const v=st[x.step];
      const cur=num(typeof v==='object'?v.done:v);
      const dec=Math.min(num(x.qty),cur);
      if(typeof v==='object')v.done=Math.max(0,cur-dec);else st[x.step]=Math.max(0,cur-dec);
      if(x.step==='inbound'||x.step==='finInbound'){
        it.doneQty=Math.max(0,num(it.doneQty||0)-dec);   // 兼容老 finInbound 记录
        inboundDelta[it.productId||'']=(inboundDelta[it.productId||'']||0)-dec;
      }
    });
    const allDone=ppItems(p).every(z=>ppPlanOf(z)>0&&ppDoneOf(z)>=ppPlanOf(z));
    if(p.status==='已完成'&&!allDone)p.status='生产中';
  }
  productionReports.splice(idx,1);
  /* 【P1 事务化】回写订单（扣回已交付）与两个投影先在内存算完，再与事实表一次提交（§4.3/§4.4） */
  let inboundChanged=false;
  if(p)for(const pid in inboundDelta){ if(inboundDelta[pid]&&writebackInboundMutation(p.orderId,pid,inboundDelta[pid]))inboundChanged=true; }
  /* .139 结余守恒校验（用户 2026-10-07 要求）：入库前后「结余」有变化 = 错误 → 弹窗 + 整批退回 */
  if(guardOn){
    const bad=invBalGuardCheck(guardRows,buildPlannedUndelMap());
    if(bad.length){
      /* 内存回滚：报工记录放回 → 排产单累计还原 → 订单行「已交付」还原 → 排产单状态还原 */
      if(p){
        productionReports.splice(idx,0,guardRecSnap);
        guardRestoreItems(guardItemsSnap,ppItems(p));
        p.status=guardStatusBefore;
      }
      guardRestoreDelivered(guardRows);
      invBalGuardAlert(bad,'删除报工');
      return;
    }
  }
  const stockChanged=recomputeStockFromInvOrders();
  const statusChanged=recomputeOrderAutoStatus();
  const ops=[];
  if(p)ops.push({key:'productionPlans',value:productionPlans});
  ops.push({key:'productionReports',value:productionReports});
  if(inboundChanged||statusChanged)ops.push({key:'orders',value:orders});
  if(stockChanged)ops.push({key:'products',value:products});
  const ok=await DB.tx(ops,false);
  if(!ok)return;   /* DB.tx 已 pullAll 复原内存并提示；不进入成功态 */
  logOp('删除报工','排产计划','删除排产单「'+rec.planId+'」报工 '+(rec.date||'')+' '+(rec.time||'')+'：'+labelParts+'（累计已回退）');
  closeModal();
  renderContent();
  /* 2026-08-25.64：删除报工后状态可能回退（已完成→生产中）导致被筛选隐藏，自动取消勾选 */
  if(p){
    const _dpi=productionPlans.indexOf(p);
    if(_dpi>=0&&!prodPlanRowVisibleInDom(p.id))clearHiddenProdPlanSel(_dpi);
  }
}

function ppShiftDate(delta){
  if(planView==='all')return;      // 总览模式：无日期可移动
  if(planView==='day'){
    if(planDateFrom<planDateTo)return;      // 时间段模式：上/下一天禁用
    const d=new Date(planDateFrom);
    d.setDate(d.getDate()+delta);
    const nd=fmtDate(d);
    planDateFrom=nd;planDateTo=nd;planViewDate=nd;
  }else{
    const d=new Date(planViewDate);
    if(planView==='month'){d.setMonth(d.getMonth()+delta);planViewDate=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';}
    else if(planView==='week'){d.setDate(d.getDate()+delta*7);planViewDate=fmtDate(d);}
    else{d.setDate(d.getDate()+delta);planViewDate=fmtDate(d);}
  }
  renderContent();
}

/* 周/月聚合视图：按产品汇总计划量/完成量/进度 */
function ppInRange(p,view){
  const d=fmtDate(p.planDate);
  if(view==='week'){const w=ppWeekRange(planViewDate);return d>=w[0]&&d<=w[1];}
  return d.slice(0,7)===planViewDate.slice(0,7);
}
function renderProdPlanAgg(view,writable){
  const inRange=productionPlans.filter(p=>ppInRange(p,view));
  if(inRange.length===0)return '<div class="empty" style="padding:18px">'+(view==='week'?('本周（'+ppWeekRange(planViewDate)[0]+' ~ '+ppWeekRange(planViewDate)[1]+'）'):(planViewDate.slice(0,7)+' 月'))+'无排产计划</div>';
  const agg={};
  inRange.forEach(p=>{ppItems(p).forEach(it=>{
    const pid=it.productId||'';
    /* 2026-08-29.83：周/月聚合视图新增「型号」「规格」（取排产明细行 it.model/it.spec，同产品多行一致） */
    if(!agg[pid])agg[pid]={productId:pid,productName:it.productName||'',model:it.model||'',spec:it.spec||'',planQty:0,doneQty:0,count:0};
    agg[pid].planQty+=ppPlanOf(it);agg[pid].doneQty+=ppDoneOf(it);agg[pid].count++;
  });});
  const list=Object.values(agg).sort((a,b)=>b.planQty-a.planQty);
  const tPlan=list.reduce((s,a)=>s+a.planQty,0),tDone=list.reduce((s,a)=>s+a.doneQty,0);
  let html='<div class="stats">'+
    statCard(inRange.length,'排产单数','blue')+
    statCard(tPlan,'计划总量','blue')+
    statCard(tDone,'累计完成','amber')+
    statCard(tPlan>0?Math.round(tDone/tPlan*100):0,'整体进度%','')+
    '</div>';
  html+='<div class="table-wrap"><table><thead><tr><th>产品编码</th><th>产品名称</th><th>型号</th><th>规格</th><th style="text-align:right">计划数量</th><th style="text-align:right">累计完成</th><th style="text-align:right">进度</th><th style="text-align:right">排产单数</th></tr></thead><tbody>';
  list.forEach(a=>{
    const pct=a.planQty>0?Math.round(a.doneQty/a.planQty*100):0;
    html+='<tr><td>'+esc(a.productId)+'</td><td>'+esc(a.productName)+'</td>'+
      '<td>'+esc(a.model||'')+'</td><td>'+esc(a.spec||'')+'</td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right">'+money(a.planQty)+'</td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right;font-weight:600">'+money(a.doneQty)+'</td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right">'+(a.planQty>0&&a.doneQty>=a.planQty?'<span class="tag tag-green">100%</span>':pct+'%')+'</td>'+
      '<td style="text-align:right">'+a.count+'</td></tr>';
  });
  html+='</tbody></table></div>';
  return html;
}

/* 交付计划 → 下推排产计划（仅限 1 条；planQty=0 行跳过；可重复下推支持分批生产） */
function genProdPlan(){
  if(!needAct('delivery.delPushPlan'))return;   /* .119：动作键 delPushPlan（默认 PMC） */
  const s=selSet('delivery');
  if(s.size===0){alert('请先勾选 1 条交付计划');return;}
  if(s.size>1){alert('「下推排产计划」一次只能选择 1 条交付计划，当前已选 '+s.size+' 条。请只勾选一条再操作。');return;}
  const di=Number([...s][0]);
  const d=deliveries[di];
  if(!d){alert('未找到该交付计划');return;}
  /* 2026-08-25.24：逐行记录 dlLine（交付计划 items 原索引）——同产品多行明细下推时按行区分，数量不再被聚合/取首行 */
  const items=deliveryItems(d).map((it,li)=>({it,li})).filter(x=>num(x.it.planQty)>0).map(x=>{
    const it=x.it,li=x.li;
    const prod=products.find(p=>p.id===it.productId)||{};
    const q=num(it.planQty);
    /* 工序模板（.11）：按产品主数据 processTplId 取模板，固化工序快照 stepsDef + 初始化 steps */
    const tpl=prod.processTplId?tplOf(prod.processTplId):null;
    const def=(tpl&&Array.isArray(tpl.steps)&&tpl.steps.length)?tpl.steps:DEFAULT_TPL_STEPS;
    const stepsDef=def.map(x=>({key:x.key,label:x.label,plan:!!x.plan,mandatory:!!x.mandatory}));
    const steps={};
    def.forEach(x=>{steps[x.key]=x.plan?{plan:q,done:0}:0;});
    return {productId:it.productId||'',productName:it.productName||'',spec:it.spec||prod.spec||'',model:it.model||prod.model||'',unit:prod.unit||'',planQty:q,doneQty:0,lineNotes:it.lineNotes||'',dlLine:li,stepsDef:stepsDef,steps:steps};
  });
  if(items.length===0){alert('该交付计划无「本批计划>0」的明细行，无法下推');return;}
  /* 2026-08-29.86：全部下推=已排产覆盖全部计划量→拦截（alert 无法下推）；部分下推=还有未排数量→直接继续（去掉分批确认框，分批为常态操作） */
  if(ppDeliveryStatus(di)==='全部下推'){alert('该交付计划已全部下推，无法再下推排产计划。');return;}
  /* 2026-10-07.137：下推即写入稳定外键 deliveryPlanNo（取自交付计划编号），此后归属不再依赖数组索引（防漂移 R1） */
  const np={id:ppNextId(),deliveryIdx:di,deliveryPlanNo:(deliveries[di]&&deliveries[di].planNo)||'',orderId:d.orderId,customer:d.customer||'',finalDate:fmtDate(d.finalDate),planDate:fmtDate(d.finalDate)||todayStr(),status:'待排产',notes:'',items:items};
  window.__ppPending=np;
  switchTab('prodPlan');
  prodPlanModal(-1,np);
}
function ppNextId(){
  const today=todayStr().replace(/-/g,'');
  const re=new RegExp('^PSCD-'+today+'-(\\d+)$');
  let max=0;
  productionPlans.forEach(p=>{
    const m=String(p.id||'').match(re);
    if(m)max=Math.max(max,parseInt(m[1],10));
  });
  return 'PSCD-'+today+'-'+String(max+1).padStart(3,'0');
}

/* 排产计划编辑弹窗（下推确认 / 编辑）：明细只读，可改计划日期/交付期/状态/备注 */
function prodPlanModal(idx,prefill){
  if(!ensureWrite('prodPlan'))return;
  const isNew=(prefill!=null);
  const p=isNew?prefill:(idx!=null?JSON.parse(JSON.stringify(productionPlans[idx])):null);
  if(!p)return;
  const items=ppItems(p);
  /* 明细行：总计划数=交付计划行 planQty；已排产=同交付计划同产品其他排产单之和（编辑排除自身）；
     未排产=总−已排产；本次排产数可编辑（默认：下推/复制=未排产，编辑=当前 planQty；独立单不限制显示 —） */
  let rows='';
  const pdi=ppDlIdxOf(p);   /* 2026-10-07.137：来源交付计划索引经唯一解析入口（外键优先，抗漂移） */
  items.forEach((it,i)=>{
    const stepsDef=stepsDefOf(p,it);
    /* 2026-08-25.24：同产品多行明细时按行级 dlLine 计算总计划/已排产（存量无 dlLine 自动回退产品级） */
    const dlLine=it.dlLine!=null?it.dlLine:null;
    const total=ppTotalOfLine(pdi,dlLine,it.productId);
    const already=ppPlannedOfLine(pdi,dlLine,it.productId,idx>=0?idx:null);
    const remain=(total!=null)?Math.max(0,total-already):null;
    let defVal;
    if(!isNew)defVal=ppPlanOf(it);                      // 编辑已有单：当前数量
    else if(remain!=null)defVal=remain>0?remain:0;      // 下推：默认=未排产
    else defVal=ppPlanOf(it);                           // 独立单（复制）：原数量
    /* 2026-10-08.140（D4/P1）：输入框上限。编辑已有单放宽为 max(未排产, 本行当前计划量)——
       超排使「未排产」算成 0 时，仍可保持原量/缩小（**不许放大**），编辑弹窗不再被锁死。
       下推（isNew）严格 ≤ 未排产；独立单（remain=null）不加 max，行为同前。 */
    const capIn=(remain!=null)?(isNew?remain:Math.max(remain,ppPlanOf(it))):null;
    rows+='<tr>'+
      '<td>'+esc(it.productId)+'</td><td>'+esc(it.productName)+'</td><td>'+esc(it.model||'')+'</td><td>'+esc(it.spec||'')+'</td><td>'+esc(it.unit||'')+'</td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right">'+(total!=null?money(total):'—')+'</td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right">'+(total!=null?money(already):'—')+'</td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right;font-weight:600">'+(remain!=null?money(remain):'—')+'</td>'+
      '<td style="text-align:center"><input type="number" class="pp_qty" data-li="'+i+'" min="0" '+(capIn!=null?('max="'+capIn+'"'):'')+' value="'+defVal+'" style="width:88px"></td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right;font-weight:600">'+money(ppDoneOf(it))+'</td>'+
      stepsDef.map(x=>'<td style="font-variant-numeric:tabular-nums;text-align:right;font-size:12px">'+money(ppStepDone(it,x.key))+'</td>').join('')+
      '<td style="font-size:12px;color:var(--muted);max-width:160px">'+esc(it.lineNotes||'')+'</td></tr>';
  });
  const srcTxt=(pdi!=null)?('#'+(pdi+1)+' · 订单 '+esc(p.orderId)):'';
  const body='<div class="form-row">'+
    '<div><label>排产单号'+(isNew?'（保存后自动生成）':'')+' *</label><input type="text" id="pp_id" value="'+(isNew?'待生成':esc(p.id))+'" readonly style="background:#f6f8fa;color:var(--muted)"></div>'+
    '<div><label>来源交付计划</label><input type="text" value="'+srcTxt+'" readonly style="background:#f6f8fa;color:var(--muted)"></div>'+
    '<div><label>客户</label><input type="text" value="'+esc(p.customer)+'" readonly style="background:#f6f8fa;color:var(--muted)"></div>'+
    '</div><div class="form-row">'+
    '<div><label>计划生产日期 *</label><input type="date" id="pp_planDate" value="'+fmtDate(p.planDate)+'"></div>'+
    '<div><label>物料齐套时间</label><input type="date" id="pp_materialReadyDate" value="'+fmtDate(p.materialReadyDate)+'" title="选填，预计物料齐备可投产的日期"></div>'+
    '<div><label>交付期</label><input type="date" id="pp_finalDate" value="'+fmtDate(p.finalDate)+'"></div>'+
    '<div><label>状态（系统自动）</label><input type="text" value="'+esc(p.status)+'" readonly style="background:#f6f8fa;color:var(--muted)"></div>'+
    '</div><div class="form-row">'+
    '<div style="flex:1"><label>备注</label><input type="text" id="pp_notes" value="'+esc(p.notes)+'"></div>'+
    '</div>'+
    '<div style="margin-bottom:6px;font-size:12px;color:var(--muted)">本次排产数量可修改（留空或 0 = 该行本次不排）；同一交付计划多次排产合计不能超过「未排产」数<br><b style="color:var(--primary)">下推保存后：每个「本次排产数量>0」的明细行将生成一张独立排产单（单号自动区分）</b></div>'+
    '<div class="table-wrap" style="max-height:300px;overflow:auto"><table><thead><tr><th>产品编码</th><th>产品名称</th><th>型号</th><th>规格</th><th>单位</th>'+
      '<th style="text-align:right">总计划数</th><th style="text-align:right">已排产</th><th style="text-align:right">未排产</th><th style="text-align:center">本次排产数量</th><th style="text-align:right">累计完成</th>'+
      (items.length?stepsDefOf(p,items[0]).map(x=>'<th style="text-align:right;font-size:12px">'+esc(x.label)+'<br>完成</th>').join(''):'')+'<th style="text-align:left;font-size:12px">行备注</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  showModal(isNew?'下推排产计划（确认）':'编辑排产计划',body,
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveProdPlan('+(idx!=null?idx:-1)+')">保存</button>');
}
function saveProdPlan(idx){
  const id=(document.getElementById('pp_id')||{}).value;
  if(!id){alert('排产单号缺失');return;}
  const planDate=document.getElementById('pp_planDate').value;
  if(!planDate){alert('请填写计划生产日期');return;}
  const finalDate=document.getElementById('pp_finalDate').value;
  const materialReadyDate=(document.getElementById('pp_materialReadyDate')||{}).value||'';   /* 2026-08-29.81：物料齐套时间（选填，默认空） */
  const notes=document.getElementById('pp_notes').value;
  const p=(idx>=0)?productionPlans[idx]:(window.__ppPending||null);
  if(!p){alert('下推数据缺失，请重新操作');return;}
  const status=p.status;   /* 2026-08-25.27：状态不可手动编辑，由系统自动转变（投产/报工完工） */
  const pdi=ppDlIdxOf(p);   /* 2026-10-07.137：来源交付计划索引经唯一解析入口（外键优先，抗漂移） */
  const srcItems=ppItems(p);
  /* 逐行读取本次排产数量：留空/0=该行本次不排；校验 ≤ 未排产、且不能低于已完成数 */
  const finalItems=[];
  for(let i=0;i<srcItems.length;i++){
    const it=srcItems[i];
    const el=document.querySelector('.pp_qty[data-li="'+i+'"]');
    const raw=el?String(el.value||'').trim():'';
    if(raw==='')continue;
    const q=parseFloat(raw);
    if(isNaN(q)||q<=0)continue;
    /* 2026-08-25.24：同产品多行明细时按行级 dlLine 校验（存量无 dlLine 自动回退产品级） */
    const dlLine=it.dlLine!=null?it.dlLine:null;
    const total=ppTotalOfLine(pdi,dlLine,it.productId);
    const already=ppPlannedOfLine(pdi,dlLine,it.productId,idx>=0?idx:null);
    const remain=(total!=null)?Math.max(0,total-already):null;
    /* 2026-10-08.140（D4/P1）：编辑已有单时上限放宽为 max(未排产, 本行当前计划量)。
       背景：超排（重复下推）使「未排产」算成 0，而输入框默认回填当前 planQty → 保存必被拦，
       该排产单被彻底锁死（连改备注都不行，线上 21 张）。
       口径：**不许放大**（q 不得超过当前计划量），允许保持或缩小；下推（idx<0）仍严格 ≤ 未排产。 */
    const cap=(remain!=null)?((idx>=0)?Math.max(remain,ppPlanOf(it)):remain):null;
    if(cap!=null&&q>cap){
      alert('产品「'+(it.productName||it.productId)+'」本次排产 '+money(q)+' 超过可用上限 '+money(cap)+
        (idx>=0?('（未排产 '+money(remain)+'；编辑已有单最多保持当前计划量 '+money(ppPlanOf(it))+'）'):'')+
        '，请调整（同一交付计划多次排产合计不能超过总计划数）。');
      return;
    }
    const stepsDef=stepsDefOf(p,it);
    for(let k=0;k<stepsDef.length;k++){
      const d=ppStepDone(it,stepsDef[k].key);
      if(d>q){
        alert('产品「'+(it.productName||it.productId)+'」本次排产 '+money(q)+' 低于该工序「'+stepsDef[k].label+'」已完成 '+money(d)+'，请调整。');
        return;
      }
    }
    const ni=JSON.parse(JSON.stringify(it));
    ni.planQty=q;
    if(!ni.steps)ni.steps={};
    ppEnsureSteps(ni,stepsDef);
    if(!ni.stepsDef)ni.stepsDef=stepsDef.map(x=>({key:x.key,label:x.label,plan:!!x.plan,mandatory:!!x.mandatory}));
    stepsDef.forEach(x=>{ if(x.plan&&typeof ni.steps[x.key]==='object')ni.steps[x.key].plan=q; });
    finalItems.push(ni);
  }
  if(finalItems.length===0){alert('请至少保留一行「本次排产数量>0」的明细');return;}
  if(idx>=0){
    const old=JSON.parse(JSON.stringify(p));
    /* 2026-08-25.16：改为「已取消」→ 扣回已回写的订单交付（已取消不占交付额度）；恢复（已取消→非取消）→ 重新加回 */
    if(status!==old.status){
      const cancelTo=(status==='已取消'),cancelFrom=(old.status==='已取消');
      ppItems(old).forEach(it=>{
        const d=ppDoneOf(it);
        if(d>0&&(cancelTo||cancelFrom))writebackInbound(p.orderId,it.productId,cancelTo?-d:d,ppOrderLineOf(p,it));
      });
    }
    p.planDate=planDate;p.finalDate=finalDate;p.status=status;p.notes=notes;p.materialReadyDate=materialReadyDate;p.items=finalItems;
    /* 2026-10-07.137：保存时按当前解析结果刷新稳定外键（存量无外键单首次编辑即补上；来源计划已删则清空） */
    p.deliveryPlanNo=(pdi!=null&&deliveries[pdi]&&deliveries[pdi].planNo)?deliveries[pdi].planNo:'';
    logFieldDiffs('排产计划',HARD_FIELDS.prodPlan,old,p,p.id);
    logOp('编辑','排产计划','排产单「'+p.id+'」调整排产数量/信息');
  }else{
    /* 2026-08-25.25：下推拆单——每个「本次排产数量>0」的明细行生成一张独立排产单（单号连续递增区分） */
    p.planDate=planDate;p.finalDate=finalDate;p.status=status;p.notes=notes;p.materialReadyDate=materialReadyDate;
    const today=todayStr().replace(/-/g,'');
    const re=new RegExp('^PSCD-'+today+'-(\\d+)$');
    let maxSeq=0;
    productionPlans.forEach(pp=>{const m=String(pp.id||'').match(re);if(m)maxSeq=Math.max(maxSeq,parseInt(m[1],10));});
    finalItems.forEach(it=>{
      maxSeq++;
      const np={id:'PSCD-'+today+'-'+String(maxSeq).padStart(3,'0'),
        deliveryIdx:p.deliveryIdx,deliveryPlanNo:p.deliveryPlanNo||'',orderId:p.orderId,customer:p.customer||'',
        finalDate:fmtDate(finalDate),planDate:fmtDate(planDate),status:status,notes:notes,
        items:[it]};
      productionPlans.push(np);
      logOp('新增','排产计划','新增「'+np.id+'」（订单'+p.orderId+'）');
    });
    window.__ppPending=null;
  }
  save('productionPlans',productionPlans);
  closeModal();
  renderContent();
  /* 2026-08-25.64：编辑后若被当前筛选/排序隐藏（如改了计划日期/数量），自动取消勾选防幽灵选择（下推新单 idx<0 无需处理） */
  if(idx>=0&&!prodPlanRowVisibleInDom(p.id))clearHiddenProdPlanSel(idx);
}
function copyProdPlan(i){
  const c=JSON.parse(JSON.stringify(productionPlans[i]));
  c.id=ppNextId();
  c.planDate=todayStr();
  c.status='待排产';
  c.notes='';
  c.deliveryIdx=null;   /* 复制单为独立排产（不占原交付计划额度，本次排产数量可自由调整） */
  c.deliveryPlanNo='';  /* 2026-10-07.137：独立单必须清空稳定外键（否则 ppDlIdxOf 会把独立单重新绑回原交付计划） */
  c.items.forEach(it=>{
    const q=num(it.planQty);
    const def=Array.isArray(it.stepsDef)&&it.stepsDef.length?it.stepsDef:DEFAULT_TPL_STEPS;
    it.doneQty=0;
    it.steps={};
    def.forEach(x=>{it.steps[x.key]=x.plan?{plan:q,done:0}:0;});
  });
  window.__ppPending=c;
  prodPlanModal(-1,c);
}
/* 2026-08-25.27：排产计划禁止复制/新增，只能从交付计划下推——copyProdPlan 保留定义无入口（FORM_ACTIONS 无 copy 映射、批量栏无复制按钮） */
/* 【P1·.125·A】原实现经 writebackInbound 旧包装 → save(orders) + save(products) + save(logs)
   + 自身 logOp + save(productionPlans) = 5 次互不原子的独立写。
   现改为：纯变更（writebackInboundMutation）+ 纯重算（recomputeStockFromInvOrders）全在内存完成，
   日志条目入内存，最后只发 1 次 DB.tx（productionPlans + orders? + products? + logs）。
   失败 → DB.tx 已 pullAll + rehydrateFromServer 复原内存并提示 → return，不渲染成功态。
   注：writebackInbound 包装器本身**未改动**（外部语义照旧），saveProdPlan 仍走它（本轮不迁移）。 */
async function delProdPlan(i){
  if(!needAct('prodPlan.ppDel'))return;   /* .119：动作键 prodPlan.ppDel（默认 PMC 删整单） */
  const rec=productionPlans[i];
  if(!rec)return;
  /* 2026-08-25.29：只有「待排产」的排产计划才能删除（生产中/已完成禁止，防破坏报工/订单回写） */
  if(rec.status!=='待排产'){alert('仅「待排产」的排产计划可以删除（当前：'+rec.status+'）');return;}
  if(!confirm('确认删除该排产计划「'+rec.id+'」？'))return;
  const p=rec;
  /* 2026-08-25.16：删除已报工（有入库累计）的排产单 → 扣回已回写的订单交付（防虚增交付）；.40 行级扣回。
     .125：改为纯内存变更 + 日志入内存（不再经 writebackInbound 逐条 save/logOp） */
  let ordersChanged=false;
  ppItems(p).forEach(it=>{
    const d=ppDoneOf(it);
    if(d>0&&writebackInboundMutation(p.orderId,it.productId,-d,ppOrderLineOf(p,it))){
      ordersChanged=true;
      const tgt=inboundTargetOf(p.orderId,it.productId,ppOrderLineOf(p,it));
      pushLogEntry(makeLogEntry('系统','库存打通','报工入库回写订单「'+p.orderId+'」'+((tgt&&tgt.it.productName)||it.productId)+' 已交付 -'+d));
    }
  });
  const stockChanged=ordersChanged?recomputeStockFromInvOrders():false;   /* 纯重算：库存投影 */
  pushLogEntry(makeLogEntry('删除','排产计划','删除「'+p.id+'」'));
  productionPlans.splice(i,1);
  const ops=[{key:'productionPlans',value:productionPlans}];
  if(ordersChanged)ops.push({key:'orders',value:orders});
  if(stockChanged)ops.push({key:'products',value:products});
  ops.push({key:'logs',value:logs});
  const ok=await DB.tx(ops,false);
  if(!ok)return;   /* 失败：一字未写、内存已回灌 → 不渲染、不清勾选 */
  renderContent();
  /* 2026-08-25.64：删除后清理勾选，防 splice 索引漂移幽灵选择 */
  selSet('prodPlan').delete(String(i));
}

/* 2026-08-25.27/28：投产——支持多选批量投产（选中多条「待排产」排产计划 → 置「生产中」）；
   非待排产（生产中/已完成）自动跳过并在完成后提示；全部不可投产则拦截 */
function ppLaunch(){
  if(!needAct('prodPlan.ppLaunch'))return;   /* .119：动作键 ppLaunch（默认车间） */
  const s=selSet('prodPlan');
  if(s.size===0){alert('请先勾选要投产的排产计划');return;}
  const idxs=[...s].map(Number);
  let launched=0,skipped=0;
  const skippedIds=[];
  idxs.forEach(pi=>{
    const p=productionPlans[pi];
    if(!p)return;
    if(p.status!=='待排产'){skipped++;skippedIds.push(p.id);return;}
    p.status='生产中';
    launched++;
    logOp('投产','排产计划','排产单「'+p.id+'」投产（待排产→生产中）');
  });
  if(launched===0){alert('所选排产计划均不可投产（需为「待排产」状态）'+(skippedIds.length?('：\n'+skippedIds.join('、')):''));return;}
  save('productionPlans',productionPlans);
  renderContent();
  /* 2026-08-25.64：投产改变状态后若被当前筛选隐藏（如筛「待排产」→ 已投产行不再显示），自动取消勾选防幽灵选择 */
  idxs.forEach(pi=>{const p=productionPlans[pi];if(p&&!prodPlanRowVisibleInDom(p.id))clearHiddenProdPlanSel(pi);});
  if(skipped>0)alert('已投产 '+launched+' 条；跳过 '+skipped+' 条（非待排产）：'+skippedIds.join('、'));
}

/* ================================================================

   主按钮=±1 天，▾ 下拉=3 天/7 天/自定义（1~365）；多选；已完成/已取消跳过；延后无上限、提前不设下限（可直接落到今天之前的过去日期；.136 起取消「提前不低于今天」的钳制与提示）
================================================================ */
/* 延后/提前融合按钮（.30/.31 规范）；plain=true 为白底常规样式（2026-08-29.74：提前/报工按钮白色化） */
function ppShiftBtnHtml(type,label,plain){
  const act=type==='delay'?'延后':'提前';
  const menuId=type==='delay'?'ppDelayMenu':'ppAdvanceMenu';
  const wrapId=type==='delay'?'ppDelayWrap':'ppAdvanceWrap';
  const wrapStyle=plain?'position:relative;display:inline-flex;align-items:stretch;background:#fff;border:1px solid var(--border);border-radius:6px;vertical-align:middle':'position:relative;display:inline-flex;align-items:stretch;background:var(--primary);border:1px solid var(--primary);border-radius:6px;vertical-align:middle';
  const btnStyle=plain?'border:none;border-radius:5px 0 0 5px;margin:0;color:var(--text);background:transparent;padding:5px 10px':'border:none;border-radius:5px 0 0 5px;margin:0;color:#fff;background:transparent;padding:5px 10px';
  const sepStyle=plain?'width:1px;background:rgba(0,0,0,.12)':'width:1px;background:rgba(255,255,255,.45)';
  const arrowStyle=plain?'border:none;border-radius:0 5px 5px 0;margin:0;color:var(--text);background:transparent;padding:5px 7px':'border:none;border-radius:0 5px 5px 0;margin:0;color:#fff;background:transparent;padding:5px 7px';
  const itemCls=plain?'btn btn-sm':'btn btn-sm btn-primary';

    '<button class="'+itemCls+'" style="display:block;width:100%;border-radius:6px;text-align:left;padding:6px 10px" onclick="event.stopPropagation();ppToggleShiftMenu(\''+type+'\');ppShiftDays(\''+type+'\',7)">'+act+' 7 天</button>'+

/* 延后/提前菜单开关（互斥：打开一个关闭另一个） */
function ppToggleShiftMenu(type){
  ['delay','advance'].forEach(function(t){
    const el=document.getElementById(t==='delay'?'ppDelayMenu':'ppAdvanceMenu');
    if(el)el.style.display=(t===type&&el.style.display!=='block')?'block':'none';

/* 点击延后/提前菜单以外区域自动关闭（全局注册一次） */
if(!window.__ppShiftMenuBound){window.__ppShiftMenuBound=true;document.addEventListener('click',function(e){

    const menu=document.getElementById(t==='delay'?'ppDelayMenu':'ppAdvanceMenu');

/* 自定义天数：1~365 正整数校验 */
function ppShiftCustom(type,inp){
  const v=parseInt(inp.value,10);
  if(isNaN(v)||v<1||v>365){alert('请输入 1~365 的整数天数');inp.focus();return;}
  ppShiftDays(type,v);
