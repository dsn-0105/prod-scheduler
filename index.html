<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>生产排单与报表系统</title>
<style>
:root{
  --primary:#4f46e5;--primary-light:#eef2ff;--primary-dark:#4338ca;
  --bg:#f1f5f9;--card:#fff;--text:#1e293b;--muted:#94a3b8;--border:#e2e8f0;
  --green:#10b981;--green-bg:#ecfdf5;--red:#ef4444;--red-bg:#fef2f2;
  --amber:#f59e0b;--amber-bg:#fffbeb;--blue:#3b82f6;--blue-bg:#eff6ff;
  --teal:#14b8a6;--purple:#8b5cf6;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --r:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
/* layout */
.app{display:flex;min-height:100vh}
.sidebar{width:210px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s}
.sidebar-header{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.sidebar-header .sub{font-size:11px;color:var(--muted);margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:13px;color:var(--text);border-left:3px solid transparent;transition:all .15s}
.nav-item:hover{background:var(--primary-light)}
.nav-item.active{background:var(--primary-light);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600}
.main{flex:1;margin-left:210px;min-width:0}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:12px;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar h2{font-size:16px;font-weight:700}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.content{padding:16px 20px 80px;max-width:1400px}
/* mobile */
.mobile-header{display:none;background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:60}
.mobile-header h1{font-size:15px;font-weight:700}
.hamburger{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer}
.hamburger svg{width:20px;height:20px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
.overlay.show{display:block}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);width:240px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .mobile-header{display:flex}
  .content{padding:12px 12px 60px}
}
/* components */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title .desc{font-size:12px;color:var(--muted);font-weight:400}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:13px;cursor:pointer;color:var(--text);transition:all .15s;min-height:36px;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark);color:#fff}
.btn-danger{color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:4px 10px;min-height:30px;font-size:12px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--primary)}
.btn-ghost:hover{background:var(--primary-light)}
input,select,textarea{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);width:100%;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
input[type=checkbox]{width:auto}
input[type=number]{font-variant-numeric:tabular-nums}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.form-row>div{flex:1;min-width:120px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--primary-light);color:var(--primary);font-weight:600;text-align:left;padding:8px 10px;white-space:nowrap;border-bottom:2px solid var(--border)}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:#f8fafc}
.op-col{position:sticky;right:0;z-index:5;background:#ffffff;border-left:2px solid #e5e7eb}
thead .op-col{background:#eef2ff;z-index:6}
.sel-col{position:sticky;left:0;z-index:5;background:#fff;text-align:center;width:44px;vertical-align:middle;padding:6px 4px}
thead .sel-col{background:#eef2ff;z-index:6}
.sel-col input{cursor:pointer;width:16px;height:16px}
.table-wrap tbody tr{cursor:pointer}
.table-wrap tbody tr:hover{background:#f5f7ff}
.bulk-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 6px}
.bulk-bar .sel-count{font-size:12px;color:var(--primary);margin-left:2px}
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
.table-wrap::-webkit-scrollbar{height:10px}
.table-wrap::-webkit-scrollbar-thumb{background:#c7cdd8;border-radius:5px;border:2px solid #fff}
.table-wrap::-webkit-scrollbar-thumb:hover{background:#a8b1c0}
.table-wrap::-webkit-scrollbar-track{background:transparent}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.tag-green{background:var(--green-bg);color:var(--green)}
.tag-red{background:var(--red-bg);color:var(--red)}
.tag-amber{background:var(--amber-bg);color:var(--amber)}
.tag-blue{background:var(--blue-bg);color:var(--blue)}
.tag-gray{background:#f1f5f9;color:var(--muted)}
/* modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1}
.modal-head h3{font-size:16px;font-weight:700}
.modal-body{padding:18px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--card)}
.close-x{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px;color:var(--muted)}
.close-x:hover{background:#f1f5f9}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);border-left:4px solid var(--primary)}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.stat.green{border-left-color:var(--green)} .stat.red{border-left-color:var(--red)} .stat.amber{border-left-color:var(--amber)} .stat.blue{border-left-color:var(--blue)}
/* alert */
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px}
.alert-red{background:var(--red-bg);color:var(--red);border:1px solid #fecaca}
.alert-amber{background:var(--amber-bg);color:var(--amber);border:1px solid #fde68a}
.alert-blue{background:var(--blue-bg);color:var(--blue);border:1px solid #bfdbfe}
.alert svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
/* section headers in daily plan */
.sec-header{font-size:13px;font-weight:700;padding:8px 12px;border-radius:8px;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.sec-stockup{background:var(--blue-bg);color:var(--blue)}
.sec-packaging{background:var(--amber-bg);color:var(--amber)}
/* field settings */
.fs-layout{display:flex;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.fs-menu{width:200px;border-right:1px solid var(--border);background:#f8fafc;padding:8px}
.fs-menu-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.fs-menu-item:hover{background:var(--primary-light)}
.fs-menu-item.active{background:var(--primary);color:#fff;font-weight:600}
.fs-menu-item svg{width:16px;height:16px}
.fs-body{flex:1;padding:14px}
.fs-menu-item .dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:auto}
.fs-menu-item.active .dot{background:#fff}
@media(max-width:640px){
  .fs-layout{flex-direction:column}
  .fs-menu{width:100%;border-right:none;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:8px}
  .fs-menu-item{white-space:nowrap;margin-bottom:0;margin-right:2px}
}
.lock{width:14px;height:14px;display:inline;vertical-align:-2px;color:var(--muted)}
.fs-auditbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.fs-audit-actions{display:flex;gap:8px;flex-wrap:wrap}
.audit-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 12px;border-radius:20px}
.audit-badge.audited{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.audit-badge.draft{background:#fef3c7;color:#b45309;border:1px solid #fcd34d}
.hide{display:none!important}
.backup-warn{background:var(--amber-bg);border:1px solid #fde68a;color:var(--amber);padding:8px 14px;border-radius:8px;font-size:12px;margin-bottom:10px}
.progress-wrap{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.progress-bar{height:100%;background:var(--primary);border-radius:3px;transition:width .3s}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:13px}
.empty svg{width:40px;height:40px;margin-bottom:8px;opacity:.4}
/* 表格筛选/排序 */
.th-sort{cursor:pointer;user-select:none;white-space:nowrap}
.th-sort:hover{filter:brightness(.96)}
.sort-ico{font-size:9px;margin-left:3px;color:#c7d2fe;display:inline-block}
.sort-ico.on{color:var(--primary)}
.filt-ico{margin-left:5px;display:inline-flex;vertical-align:-2px;cursor:pointer;opacity:.4;border-radius:4px;padding:1px}
.filt-ico:hover{opacity:1;background:rgba(79,70,229,.15)}
.filt-ico.on{opacity:1;color:var(--primary);background:var(--primary-light)}
/* 列头拖拽调序 + 拖拽调宽 */
.th-rs{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;z-index:2}
.th-rs::after{content:'';position:absolute;right:3px;top:25%;bottom:25%;width:2px;border-radius:1px;background:transparent}
.th-sort:hover .th-rs::after,.th-rs:hover::after{background:var(--primary)}
th.th-sort{position:relative}
th.th-dragging{opacity:.45}
th.th-drop-before{box-shadow:inset 3px 0 0 0 var(--primary)}
th.th-drop-after{box-shadow:inset -3px 0 0 0 var(--primary)}
body.col-resizing{cursor:col-resize;user-select:none}
body.col-dragging{cursor:grabbing;user-select:none}
.filt-pop{position:absolute;z-index:300;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:12px;width:230px;font-size:12px}
.filt-pop .fp-title{font-weight:700;margin-bottom:8px;color:var(--text)}
.filt-pop select,.filt-pop input{font-size:12px;padding:5px 8px;margin-bottom:8px}
.filt-pop .fp-opts{max-height:190px;overflow-y:auto;margin-bottom:8px;border:1px solid var(--border);border-radius:6px;padding:4px 6px}
.filt-pop .fp-opt{display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer;font-size:12px}
.filt-pop .fp-opt:hover{color:var(--primary)}
.filt-pop .fp-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.tbl-fbar{display:flex;align-items:center;gap:6px;margin:8px 0;flex-wrap:wrap;font-size:12px}
.fchip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-light);color:var(--primary);border-radius:12px;padding:3px 10px;font-weight:600}
.fchip b{cursor:pointer;font-weight:700;margin-left:2px}
.fchip b:hover{color:var(--red)}
</style>

<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;color:var(--primary)"><path d="M2 20h20M5 20V8l7-5 7 5v12M9 20v-6h6v6"/></svg>生产排单系统</h1>
      <div class="sub">智能断路器 · 辰微</div>

    <nav class="nav" id="nav"></nav>

        <button class="btn btn-sm" onclick="exportXLSX()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>全量导出</button>
        <button class="btn btn-sm" onclick="triggerImport()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>全量导入</button>

<script>
/* ================================================================
   DB 异步数据层 — 服务器就绪
   现在：localStorage  |  将来：把 API_BASE 填上服务器地址，
   DB.get/set 内部换成 fetch 即可，前端其余逻辑无需改动。
================================================================ */
const API_BASE=''; // 服务器部署时填: 'http://192.168.x.x:3000/api'
const KEY='wb_cb_prod_';
const DB={
  async get(k,def){
    if(API_BASE){
      // const r=await fetch(API_BASE+'/'+k); return await r.json();
    }
    try{const v=localStorage.getItem(KEY+k);return v?JSON.parse(v):def;}catch(e){return def;}
  },
  async set(k,v){
    if(API_BASE){
      // await fetch(API_BASE+'/'+k,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});
    }
    localStorage.setItem(KEY+k,JSON.stringify(v));
    return v;
  }
};
/* 兼容包装：旧代码 save/load 同步调用 */
function save(k,v){
  DB.set(k,v);
  // 业务数据变更后自动备份（仅在启动完成后，避免启动期误触发下载）
  if(bootDone && ['products','orders','inventory','dailyPlans','dailyPkgs','deliveries','fields'].indexOf(k)>=0){
    try{scheduleAutoBackup();}catch(e){}
  }
  return v;
}
function load(k,def){try{const v=localStorage.getItem(KEY+k);return v?JSON.parse(v):def;}catch(e){return def;}}
// 自动备份状态（可携式 .json 文件，用于链接轮换后一键恢复）
let autoBackupOn=false, bootDone=false, lastAutoBackup=0;
const AUTO_BACKUP_MIN=15; // 两次自动备份最小间隔(分钟)

/* ================================================================
   常量
================================================================ */
const TYPES=['text','number','date','select','textarea','ref'];
const PROCESS_STEPS=['assembly','innerPack','testAging','semiInbound'];
const PROCESS_LABELS={assembly:'装配',innerPack:'内包',testAging:'调试老化',semiInbound:'半成品入库'};
const PKG_STEPS=['packaging','finishedInbound'];
const PKG_LABELS={packaging:'包装',finishedInbound:'成品入库'};
const STOCK_STATUS={normal:{label:'正常',cls:'tag-green'},low:{label:'低于下限',cls:'tag-red'},high:{label:'高于上限',cls:'tag-amber'}};
const ORDER_STATUS=['待排产','执行中','已完成','已取消'];
const DELIVERY_FREQ=['每周一次(周一)','每周一次(周五)','每三天一次','每日'];
const LOCK='<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

/* ================================================================
   引用字段引擎（字段可引用其它表单的某个字段，录入时自动带出）
================================================================ */
const FORM_DATA={
  product:()=>products,
  order:()=>orders,
  inventory:()=>inventory,
  dailyPlan:()=>dailyPlans,
  dailyPkg:()=>dailyPkgs,
  delivery:()=>deliveries
};
const REF_FORM_LABELS={product:'产品主数据',order:'订单管理',inventory:'半成品库存',dailyPlan:'日排产-备货',dailyPkg:'日排产-包装',delivery:'交付计划'};
/* 支持引用字段的表单（其余表单的录入界面为固定结构，暂不在字段设置中开放引用） */
const REF_ENABLED=['product','order'];

/* 在 refForm 中找到 refMatch 字段值等于 keyVal 的记录，返回 refField 的值 */
function lookupRef(refForm,refMatch,keyVal,refField){
  if(!refForm||!refField)return '';
  const data=(FORM_DATA[refForm]&&FORM_DATA[refForm]())||[];
  if(keyVal==null||keyVal==='')return '';
  const rec=data.find(r=>String(r[refMatch]!=null?r[refMatch]:'')===String(keyVal));
  return rec?rec[refField]:'';
}
/* 当前 sec 中，被某个 ref 字段用作关联键(refKey)的字段 key 集合 */
function refKeysOf(sec){
  const set=new Set();
  ((fields[sec]||[]).filter(f=>f.type==='ref')).forEach(f=>{ if(f.refKey)set.add(f.refKey); });
  return set;
}
function fieldLabel(sec,key){
  const f=(fields[sec]||[]).find(x=>x.key===key);
  return f?f.label:key;
}
function refDesc(f,sec){
  if(!f.refForm)return '未配置引用';
  const tf=REF_FORM_LABELS[f.refForm]||f.refForm;
  const refFieldLabel=fieldLabel(f.refForm,f.refField);
  const refKeyLabel=fieldLabel(sec,f.refKey);
  return '引用 '+tf+' · '+refFieldLabel+'（按「'+refKeyLabel+'」匹配）';
}
/* 通用控件生成：支持 ref 类型（只读带出）与关联键 onchange 绑定 */
function genControl(f,prefix,val,sec){
  const id=prefix+f.key;
  const isRefKey=(sec&&refKeysOf(sec).has(f.key));
  const onch=isRefKey?' onchange="refKeyTrigger(this)"':'';
  if(f.type==='ref'){
    return '<input type="text" id="'+id+'" class="ref-field" data-key="'+f.key+'" data-ref-form="'+esc(f.refForm||'')+'" data-ref-match="'+esc(f.refMatch||'')+'" data-ref-field="'+esc(f.refField||'')+'" data-ref-key="'+esc(f.refKey||'')+'" value="'+esc(val)+'" readonly style="background:#f6f8fa;color:var(--muted)">';
  }
  if(f.type==='select'){
    return '<select id="'+id+'"'+onch+'>'+(f.options||[]).map(o=>'<option '+(o===val?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  }
  if(f.type==='textarea'){
    return '<textarea id="'+id+'" rows="2"'+onch+'>'+esc(val)+'</textarea>';
  }
  const tp=f.type==='number'?'number':(f.type==='date'?'date':'text');
  return '<input type="'+tp+'" id="'+id+'" value="'+esc(f.type==='date'?fmtDate(val):val)+'"'+(f.required?' required':'')+onch+'>';
}
/* 关联键变化时，带出同容器内所有依赖它的引用字段 */
function refKeyTrigger(el){
  const root=el.closest('tr')||el.closest('form')||el.closest('.modal-body')||el.parentElement;
  const key=el.getAttribute('data-key');
  if(!root||!key)return;
  root.querySelectorAll('.ref-field').forEach(rf=>{
    if(rf.getAttribute('data-ref-key')===key){
      const refForm=rf.getAttribute('data-ref-form');
      const refMatch=rf.getAttribute('data-ref-match');
      const refField=rf.getAttribute('data-ref-field');
      const kvEl=root.querySelector('[data-key="'+key+'"]');
      const kv=kvEl?kvEl.value:'';
      rf.value=lookupRef(refForm,refMatch,kv,refField);
    }
  });
}

  save('logs',logs);
}

function fmtLogVal(v){ if(v===undefined||v===null||v==='')return '空'; return String(v); }
function logFieldEdit(formLabel,fieldLabel,oldv,newv,recLabel){
  var d='记录「'+(recLabel||'')+'」：'+fmtLogVal(oldv)+' → '+fmtLogVal(newv);
  logOp('编辑',formLabel,d,fieldLabel,oldv,newv);

/* 逐字段对比旧/新记录并记录变更 */
function logFieldDiffs(formLabel,fieldDefs,oldRec,newRec,recLabel){
  if(!fieldDefs||!fieldDefs.length)return;
  fieldDefs.forEach(f=>{
    var k=f.key;
    var ov=oldRec&&oldRec[k]!=null?oldRec[k]:'';
    var nv=newRec&&newRec[k]!=null?newRec[k]:'';
    if(String(ov)!==String(nv)) logFieldEdit(formLabel,f.label,ov,nv,recLabel);
  });
}
/* 订单明细行逐行对比 */
function logOrderLineDiffs(formLabel,oldItems,newItems,recLabel){
  var lineDefs=orderLineFields();
  var n=Math.max(oldItems?oldItems.length:0,newItems?newItems.length:0);
  for(var i=0;i<n;i++){
    var oldIt=oldItems&&oldItems[i]?oldItems[i]:null;
    var newIt=newItems&&newItems[i]?newItems[i]:null;
    var prefix='第'+(i+1)+'行·';
    if(!oldIt&&newIt){ logFieldEdit(formLabel,prefix+'明细', '', '(新增明细行)', recLabel); continue; }
    if(oldIt&&!newIt){ logFieldEdit(formLabel,prefix+'明细', '(删除明细行)', '', recLabel); continue; }
    lineDefs.forEach(f=>{
      var k=f.key;
      var ov=oldIt[k]!=null?oldIt[k]:'';
      var nv=newIt[k]!=null?newIt[k]:'';
      if(String(ov)!==String(nv)) logFieldEdit(formLabel,prefix+f.label,ov,nv,recLabel);
    });
  }
}

/* ================================================================
   表格筛选/排序引擎（所有表格通用）
   - 点击列头：排序（升 → 降 → 取消）
   - 点击列头漏斗：弹出筛选面板
================================================================ */
var tblState={};      // tblState[模块]={sort:{key,dir},filters:{key:{mode,val,vals}}}
var TBL_SCHEMAS={};   // 每个表格的列定义（渲染时注册）
var TBL_ROWS={};      // 每个表格当前数据（渲染时注册，供筛选面板取唯一值）

function tState(m){if(!tblState[m])tblState[m]={sort:null,filters:{}};return tblState[m];}
function colVal(col,r){return col.get?col.get(r):(r[col.key]!=null?r[col.key]:'');}

function filterRows(m,rows){
  const s=tState(m),schema=TBL_SCHEMAS[m]||[];
  return rows.filter(r=>{
    for(const key of Object.keys(s.filters)){
      const f=s.filters[key];if(!f)continue;
      const hasVals=f.vals&&f.vals.length>0;
      const hasVal=f.val!==''&&f.val!=null;
      if(!hasVals&&!hasVal)continue;
      const col=schema.find(c=>c.key===key);if(!col)continue;
      const v=colVal(col,r);
      if(col.type==='number'){
        const nv=num(v);
        if(hasVals){if(f.vals.map(x=>num(x)).indexOf(nv)<0)return false;}
        else{
          const fv=num(f.val);
          if(f.mode==='gte'&&!(nv>=fv))return false;
          if(f.mode==='lte'&&!(nv<=fv))return false;
          if(f.mode==='eq'&&nv!==fv)return false;
          if(f.mode==='neq'&&nv===fv)return false;
        }
      }else if(col.type==='date'){
        const dv=fmtDate(v);
        if(hasVals){if(f.vals.indexOf(dv)<0)return false;}
        else{
          if(f.mode==='gte'&&!(dv>=f.val))return false;
          if(f.mode==='lte'&&!(dv<=f.val))return false;
          if(f.mode==='eq'&&dv!==f.val)return false;
          if(f.mode==='neq'&&dv===f.val)return false;
        }
      }else{
        const sv=String(v);
        if(hasVals){if(f.vals.indexOf(sv)<0)return false;}
        else{
          const fv=String(f.val);
          if(f.mode==='eq'&&sv!==fv)return false;
          if(f.mode==='neq'&&sv===fv)return false;
          if((f.mode==='contains'||!f.mode)&&sv.toLowerCase().indexOf(fv.toLowerCase())<0)return false;
        }
      }
    }
    return true;
  });
}

function sortRows(m,rows){
  const s=tState(m);
  if(!s.sort)return rows;
  const col=(TBL_SCHEMAS[m]||[]).find(c=>c.key===s.sort.key);
  if(!col)return rows;
  const dir=s.sort.dir;
  return [...rows].sort((a,b)=>{
    let va=colVal(col,a),vb=colVal(col,b);
    if(col.type==='number')return (num(va)-num(vb))*dir;
    if(col.type==='date'){va=fmtDate(va);vb=fmtDate(vb);return va<vb?-dir:(va>vb?dir:0);}
    va=String(va);vb=String(vb);
    return va.localeCompare(vb,'zh-CN')*dir;
  });
}

function applyTable(m,rows){return sortRows(m,filterRows(m,rows));}

/* 可点击列头（排序+筛选图标） */
var FILT_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>';
function thCol(m,col,style){
  const s=tState(m);
  const sorted=s.sort&&s.sort.key===col.key;
  const dir=sorted?(s.sort.dir===1?'▲':'▼'):'⇅';
  const f=s.filters[col.key];
  const act=f&&((f.vals&&f.vals.length>0)||(f.val!==''&&f.val!=null));
  return '<th class="th-sort" data-m="'+m+'" data-key="'+col.key+'"'+(style?' style="'+style+'"':'')+' onclick="toggleSort(\''+m+'\',\''+col.key+'\')" title="点击排序，按住左右拖动调整列顺序，右缘拖动调宽">'+esc(col.label)+
    (col.locked?' '+LOCK:'')+
    '<span class="sort-ico'+(sorted?' on':'')+'">'+dir+'</span>'+
    '<span class="filt-ico'+(act?' on':'')+'" onclick="event.stopPropagation();openFilter(this,\''+m+'\',\''+col.key+'\')" title="筛选">'+FILT_SVG+'</span>'+
    '<span class="th-rs" title="拖动调整列宽"></span></th>';
}

function toggleSort(m,key){
  if(Date.now()-(window.__colDragTS||0)<350)return;   // 刚完成拖拽/调宽，忽略误触 click
  const s=tState(m);
  if(!s.sort||s.sort.key!==key)s.sort={key:key,dir:1};
  else if(s.sort.dir===1)s.sort.dir=-1;
  else s.sort=null;
  renderContent();
}

/* 筛选面板 */
var filtPop=null;
function closeFiltPop(){if(filtPop){filtPop.remove();filtPop=null;}}
document.addEventListener('click',function(e){if(filtPop&&!filtPop.contains(e.target))closeFiltPop();});

function openFilter(el,m,key){
  closeFiltPop();
  const col=(TBL_SCHEMAS[m]||[]).find(c=>c.key===key);if(!col)return;
  const rows=TBL_ROWS[m]||[];
  const s=tState(m);
  const f=s.filters[key]||{mode:'contains',val:''};
  let inner='';
  const uniques=[...new Set(rows.map(r=>{const v=colVal(col,r);return col.type==='date'?fmtDate(v):String(v);}))].filter(v=>v!=='');
  uniques.sort();
  const useChecks=col.type!=='number'&&col.type!=='date'&&(col.select||uniques.length<=15);
  if(useChecks){
    const sel=f.vals||[];
    inner+='<div class="fp-opts">'+uniques.map(v=>'<label class="fp-opt"><input type="checkbox" value="'+esc(v)+'" '+(sel.indexOf(v)>=0?'checked':'')+'>'+esc(v)+'</label>').join('')+'</div>'+
      '<div style="display:flex;gap:6px"><button class="btn btn-sm" onclick="filtCheckAll(this,true)">全选</button><button class="btn btn-sm" onclick="filtCheckAll(this,false)">全不选</button></div>';
  }else if(col.type==='number'){
    inner+='<select id="fp_mode">'+[['gte','大于等于'],['lte','小于等于'],['eq','等于'],['neq','不等于']].map(x=>'<option value="'+x[0]+'" '+(f.mode===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select>'+
      '<input type="number" id="fp_val" value="'+(f.val!=null?f.val:'')+'" placeholder="输入数值">';
  }else if(col.type==='date'){
    inner+='<select id="fp_mode">'+[['gte','晚于等于'],['lte','早于等于'],['eq','等于'],['neq','不等于']].map(x=>'<option value="'+x[0]+'" '+(f.mode===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select>'+
      '<input type="date" id="fp_val" value="'+(f.val!=null?f.val:'')+'">';
  }else{
    inner+='<select id="fp_mode">'+[['contains','包含'],['eq','等于'],['neq','不等于']].map(x=>'<option value="'+x[0]+'" '+(f.mode===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select>'+
      '<input type="text" id="fp_val" value="'+esc(f.val||'')+'" placeholder="输入关键字">';
  }
  const pop=document.createElement('div');
  pop.className='filt-pop';
  pop.innerHTML='<div class="fp-title">筛选：'+esc(col.label)+'</div>'+inner+
    '<div class="fp-btns"><button class="btn btn-sm" onclick="clearFilt(\''+m+'\',\''+key+'\')">清除</button><button class="btn btn-sm btn-primary" onclick="applyFilt(\''+m+'\',\''+key+'\','+useChecks+')">确定</button></div>';
  document.body.appendChild(pop);
  pop.addEventListener('click',e=>e.stopPropagation());
  const r=el.getBoundingClientRect();
  let left=r.left;
  if(left+240>window.innerWidth-8)left=window.innerWidth-248;
  if(left<8)left=8;
  pop.style.left=left+'px';
  pop.style.top=(r.bottom+6+window.scrollY)+'px';
  filtPop=pop;
  const inp=pop.querySelector('#fp_val');
  if(inp)inp.focus();
}

function filtCheckAll(btn,on){
  btn.closest('.filt-pop').querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=on);
}
function clearFilt(m,key){delete tState(m).filters[key];closeFiltPop();renderContent();}
function clearAllFilt(m){tState(m).filters={};closeFiltPop();renderContent();}
function applyFilt(m,key,useChecks){
  const f={mode:'contains',val:''};
  if(useChecks){
    const vals=[];
    filtPop.querySelectorAll('input[type=checkbox]:checked').forEach(c=>vals.push(c.value));
    f.vals=vals;f.mode='in';
  }else{
    f.mode=document.getElementById('fp_mode').value;
    f.val=document.getElementById('fp_val').value;
  }
  tState(m).filters[key]=f;
  closeFiltPop();renderContent();
}

/* 筛选状态条（有筛选时显示在表格上方） */
function filterBar(m){
  const s=tState(m);
  const schema=TBL_SCHEMAS[m]||[];
  const MODE_NAME={contains:'包含',eq:'=',neq:'≠',gte:'≥',lte:'≤',in:''};
  const keys=Object.keys(s.filters).filter(k=>{const f=s.filters[k];return f&&(f.vals&&f.vals.length>0||(f.val!==''&&f.val!=null));});
  if(!keys.length)return '';
  const chips=keys.map(k=>{
    const col=schema.find(c=>c.key===k);if(!col)return '';
    const f=s.filters[k];
    const txt=(f.vals&&f.vals.length)?col.label+'：'+f.vals.length+'项':col.label+' '+(MODE_NAME[f.mode]||'')+f.val;
    return '<span class="fchip">'+esc(txt)+' <b onclick="clearFilt(\''+m+'\',\''+k+'\')" title="移除该筛选">×</b></span>';
  }).join('');
  return '<div class="tbl-fbar">'+chips+'<button class="btn btn-sm" onclick="clearAllFilt(\''+m+'\')">清除全部</button></div>';
}

/* 空筛选结果行 */
function noMatchRow(m,colspan){

}

/* ================================================================
   列布局引擎：表头左右拖拽调序 + 右缘拖拽调宽（每表独立记忆）
================================================================ */
var tblLayout={};   // tblLayout[模块]={order:[key...],widths:{key:px}}
function layoutOf(m){if(!tblLayout[m])tblLayout[m]={order:null,widths:{}};return tblLayout[m];}
function saveLayout(){DB.set('tblLayout',tblLayout);}

/* 渲染后调用：按已保存的顺序/宽度重排 DOM 中所有带 data-m 的表格 */
function applyTableLayout(){
  document.querySelectorAll('#content table').forEach(function(tbl){
    var thead=tbl.tHead;if(!thead||!thead.rows.length)return;
    var headCells=[...thead.rows[0].cells];
    var firstM=null;
    headCells.forEach(function(th){if(!firstM&&th.getAttribute&&th.getAttribute('data-m'))firstM=th.getAttribute('data-m');});
    if(!firstM)return;
    var lo=layoutOf(firstM);
    /* 需要重排的可拖列槽位（列索引） */
    var slots=[];
    headCells.forEach(function(th,i){if(th.getAttribute&&th.getAttribute('data-key'))slots.push(i);});
    if(slots.length<2)return;
    var curKeys=slots.map(function(i){return headCells[i].getAttribute('data-key');});
    /* 目标顺序 = 已存顺序(过滤仍存在的) + 新增列按当前顺序 */
    var order=(lo.order||[]).filter(function(k){return curKeys.indexOf(k)>=0;});
    curKeys.forEach(function(k){if(order.indexOf(k)<0)order.push(k);});
    /* 重排所有行（含表头），只动可拖列槽位，静态列(如"操作")位置不变 */
    [...tbl.rows].forEach(function(row){
      if(row.cells.length!==headCells.length)return;
      var cells=[...row.cells];
      var keyedCells=slots.map(function(i){return cells[i];});
      slots.forEach(function(slot,j){
        var key=order[j];
        var src=curKeys.indexOf(key);
        if(row.cells[slot]!==keyedCells[src])row.replaceChild(keyedCells[src],row.cells[slot]);
      });
    });
    /* 应用列宽和表格最小宽度（撑开时出横向滚动条） */
    headCells.forEach(function(th){
      var k=th.getAttribute('data-key');
      if(k&&lo.widths&&lo.widths[k])th.style.width=lo.widths[k]+'px';
    });
    if(lo.minW)tbl.style.minWidth=lo.minW+'px';
  });
}

/* 统一鼠标交互入口：右缘手柄=调宽，其余=拖拽调序 */
document.addEventListener('mousedown',function(e){
  if(e.button!==0)return;
  var th=e.target.closest?e.target.closest('th.th-sort'):null;
  if(!th||!th.getAttribute('data-key'))return;
  if(e.target.classList&&e.target.classList.contains('th-rs')){startColResize(e,th);return;}
  if(e.target.closest&&e.target.closest('.filt-ico'))return;
  startColDrag(e,th);
});

/* ---- 拖拽调序 ---- */
var colDrag=null;
function startColDrag(e,th){
  colDrag={th:th,m:th.getAttribute('data-m'),key:th.getAttribute('data-key'),x:e.clientX,moved:false,targets:[],marker:null};
  var move=function(ev){
    if(!colDrag)return;
    if(!colDrag.moved&&Math.abs(ev.clientX-colDrag.x)<6)return;
    if(!colDrag.moved){
      colDrag.moved=true;
      document.body.classList.add('col-dragging');
      th.classList.add('th-dragging');
      colDrag.targets=[...document.querySelectorAll('#content th.th-sort[data-m="'+colDrag.m+'"][data-key]')];
    }
    /* 清除旧指示 */
    colDrag.targets.forEach(function(t){t.classList.remove('th-drop-before','th-drop-after');});
    var el=document.elementFromPoint(ev.clientX,ev.clientY);
    var t=el&&el.closest?el.closest('th.th-sort[data-m="'+colDrag.m+'"]'):null;
    if(t&&t!==th){
      var r=t.getBoundingClientRect();
      var before=(ev.clientX-r.left)<r.width/2;
      t.classList.add(before?'th-drop-before':'th-drop-after');
      colDrag.marker={key:t.getAttribute('data-key'),before:before};
    }else colDrag.marker=null;
  };
  var up=function(){
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    if(colDrag&&colDrag.moved&&colDrag.marker){
      var mk=colDrag.marker;
      /* 从当前 DOM 顺序计算新顺序 */
      var curOrder=[...document.querySelectorAll('#content thead th.th-sort[data-m="'+colDrag.m+'"][data-key]')].map(function(t){return t.getAttribute('data-key');});
      /* 注意库存表等多表同模块：以第一张表为准 */
      var idx=curOrder.indexOf(colDrag.key);
      if(idx>=0)curOrder.splice(idx,1);
      var ti=curOrder.indexOf(mk.key);
      if(ti<0)ti=curOrder.length;
      curOrder.splice(mk.before?ti:ti+1,0,colDrag.key);
      layoutOf(colDrag.m).order=curOrder;
      saveLayout();
      applyTableLayout();
    }
    if(colDrag){
      colDrag.targets.forEach(function(t){t.classList.remove('th-drop-before','th-drop-after');});
      th.classList.remove('th-dragging');
    }
    if(colDrag&&colDrag.moved)window.__colDragTS=Date.now();
    document.body.classList.remove('col-dragging');
    colDrag=null;
  };
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
}

/* ---- 拖拽调宽 ---- */
function startColResize(e,th){
  e.preventDefault();e.stopPropagation();
  var m=th.getAttribute('data-m'),key=th.getAttribute('data-key');
  var tbl=th.closest('table');
  var startX=e.clientX,startW=th.offsetWidth;
  var baseW=tbl?tbl.scrollWidth:0;   // 拖动前的表格总宽，用于同步撑开表格
  document.body.classList.add('col-resizing');
  var move=function(ev){
    var w=Math.max(50,startW+ev.clientX-startX);
    th.style.width=w+'px';
    /* 表格加宽超出容器 → .table-wrap 出横向滚动条；收窄则同步收回 */
    if(tbl)tbl.style.minWidth=Math.max(0,baseW+(w-startW))+'px';
  };
  var up=function(){
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    document.body.classList.remove('col-resizing');
    window.__colDragTS=Date.now();
    layoutOf(m).widths[key]=Math.round(th.getBoundingClientRect().width);
    if(tbl){
      var mw=tbl.style.minWidth;
      layoutOf(m).minW=Math.round(parseFloat(mw)||0);
      if(!layoutOf(m).minW)tbl.style.minWidth='';
    }
    saveLayout();
  };
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
}

/* 恢复默认列布局 */
function resetTableLayout(m){
  if(!m){tblLayout={};}
  else delete tblLayout[m];
  saveLayout();
  renderContent();
}

/* 滚轮横向滚动：页面已滚到顶/底时，在表格上滚动滚轮=左右滚动（页面可滚时优先滚页面） */
document.addEventListener('wheel',function(e){
  var wrap=e.target.closest?e.target.closest('.table-wrap'):null;
  if(!wrap||wrap.scrollWidth<=wrap.clientWidth+2)return;   // 没有横向溢出
  if(e.deltaX)return;                                       // 触控板横向手势，交给浏览器
  var doc=document.documentElement;
  var canPageDown=(window.innerHeight+window.scrollY)<doc.scrollHeight-2;
  var canPageUp=window.scrollY>2;
  if((e.deltaY>0&&canPageDown)||(e.deltaY<0&&canPageUp))return;  // 页面还能滚，优先垂直滚动
  wrap.scrollLeft+=e.deltaY;
  e.preventDefault();
},{passive:false});

function countAlerts(){
  let n=0;
  // 库存低于下限
  const latestInv=getLatestInventory();
  latestInv.forEach(i=>{if(i.closing<i.stockMin)n++;});
  // 订单逾期
  orders.forEach(o=>{if(o.status==='执行中'&&o.deadline&&fmtDate(o.deadline)<todayStr())n++;});
  // 交付计划近期
  deliveries.forEach(d=>{
    if(d.batches){
      d.batches.forEach(b=>{
        if(b.status==='待交付'&&fmtDate(b.date)<=todayStr())n++;
      });
    }
  });
  return n;
}

function getLatestInventory(){
  const byProduct={};
  inventory.forEach(i=>{
    if(!byProduct[i.productId]||fmtDate(i.date)>fmtDate(byProduct[i.productId].date)){
      byProduct[i.productId]=i;
    }
  });
  return Object.values(byProduct);
}

function saveProduct(idx){
  const cols=fields.product;
  const p={};
  cols.forEach(f=>{
    const el=document.getElementById('pf_'+f.key);
    p[f.key]=f.type==='number'?num(el.value):el.value;

/* ---- 订单多行明细支持 ---- */
const ORDER_LINE_KEYS=['productId','productName','orderQty','deliveredQty'];  // 明细行级字段（每行一种产品）
/* 行级字段判定：字段设置中标记 level:'line' 即为表体字段，否则为表头字段 */
function isLineField(f){return f&&f.level==='line';}
function orderLineFields(){return (fields.order||[]).filter(isLineField);}
function orderHeadFields(){return (fields.order||[]).filter(f=>!isLineField(f));}
/* 兼容旧数据：已保存的字段若没有 level 标记，按默认行级 key 推断 */
function normalizeFields(){
  if(fields&&fields.order)fields.order.forEach(f=>{
    if(!f.level)f.level=ORDER_LINE_KEYS.indexOf(f.key)>=0?'line':'head';
  });
}
/* 产品主数据迁移：规格型号 → 规格 + 型号（字段配置 + 数据） */
function migrateSpecSplit(){
  let cfgChanged=false,dataChanged=false;
  [fields,fieldsDraft].forEach(cfg=>{
    if(!cfg||!cfg.product)return;
    const arr=cfg.product;
    const i=arr.findIndex(f=>f.key==='spec');
    if(i>=0 && arr[i].label==='规格型号'){
      arr[i].label='规格';
      if(!arr.some(f=>f.key==='model')){
        arr.splice(i+1,0,{key:'model',label:'型号',type:'text',required:false,locked:false});
      }
      cfgChanged=true;
    }
  });
  products.forEach(p=>{
    if(p.model===undefined){ p.model=''; dataChanged=true; }
  });
  if(cfgChanged){
    if(fieldsAudit!=='draft'){ save('fields',fields); }
    if(fieldsDraft){ save('fieldsDraft',fieldsDraft); }
    logOp('字段设置','产品主数据','系统迁移：「规格型号」拆分为「规格」+「型号」');
  }
  if(dataChanged){
    save('products',products);
    logOp('系统','产品主数据','已补全现有产品的「型号」字段（规格沿用原规格型号值，型号待补充）');
  }
}
/* 产品主数据：移除"库存上下限"4个字段（含已保存配置迁移） */
const REMOVE_PRODUCT_KEYS=['stockMinUnpkg','stockMaxUnpkg','stockMinFin','stockMaxFin'];
function migrateRemoveProductFields(){
  let changed=false;
  [fields,fieldsDraft].forEach(cfg=>{
    if(!cfg||!Array.isArray(cfg.product))return;
    const before=cfg.product.length;
    cfg.product=cfg.product.filter(f=>REMOVE_PRODUCT_KEYS.indexOf(f.key)<0);
    if(cfg.product.length!==before)changed=true;
  });
  if(changed){
    if(fieldsAudit!=='draft'){ save('fields',fields); }
    if(fieldsDraft){ save('fieldsDraft',fieldsDraft); }
    logOp('字段设置','产品主数据','系统迁移：删除「未包库存下限/上限、成品库存下限/上限」共4个字段');
  }
}
const OPTIONAL_PRODUCT_KEYS=['dailyCapUnpkg','dailyCapPkg'];
function migrateProductFieldsOptional(){
  let changed=false;
  [fields,fieldsDraft].forEach(cfg=>{
    if(!cfg||!Array.isArray(cfg.product))return;
    cfg.product.forEach(f=>{
      if(OPTIONAL_PRODUCT_KEYS.indexOf(f.key)>=0 && f.required){
        f.required=false; changed=true;
      }
    });
  });
  if(changed){
    if(fieldsAudit!=='draft'){ save('fields',fields); }
    if(fieldsDraft){ save('fieldsDraft',fieldsDraft); }
    logOp('字段设置','产品主数据','系统迁移：将「日产能(未包)、日产能(包装)」改为非必填');
  }
}
function orderItems(o){
  return Array.isArray(o.items)&&o.items.length?o.items:
    [{productId:o.productId,productName:o.productName,orderQty:num(o.orderQty),deliveredQty:num(o.deliveredQty)}];
}
function orderQtyOf(o){return orderItems(o).reduce((s,i)=>s+num(i.orderQty),0);}
function orderDeliveredOf(o){return orderItems(o).reduce((s,i)=>s+num(i.deliveredQty),0);}
function orderProductNames(o){
  const names=[...new Set(orderItems(o).map(i=>i.productName||i.productId).filter(Boolean))];
  return names.join('、');
}
/* 旧数据迁移：平铺字段 → items[] */
function migrateOrders(){
  let changed=false;
  orders.forEach(o=>{
    if(!Array.isArray(o.items)||!o.items.length){
      o.items=[{productId:o.productId||'',productName:o.productName||'',orderQty:num(o.orderQty),deliveredQty:num(o.deliveredQty)}];
      changed=true;
    }
  });
  if(changed)save('orders',orders);
}
/* 订单×明细行 展开的下拉选项（包装排产/交付计划选单用） */
function orderItemOptions(selOrderId,selProductId){
  let out='';
  orders.forEach(o=>{
    orderItems(o).forEach((it,i)=>{
      const sel=(o.id===selOrderId)&&(it.productId===selProductId||(!selProductId&&i===0));
      out+='<option value="'+esc(o.id)+'" data-customer="'+esc(o.customer)+'" data-product="'+esc(it.productId)+'" data-pname="'+esc(it.productName)+'" data-total="'+num(it.orderQty)+'" data-delivered="'+num(it.deliveredQty)+'" '+(sel?'selected':'')+'>'+esc(o.id)+' - '+esc(o.customer)+' · '+esc(it.productName||it.productId)+'</option>';
    });
  });
  return out;
}

    orders.forEach((o,oi)=>{orderItems(o).forEach(it=>rows.push({order:o,item:it,orderIdx:oi}));});
    TBL_SCHEMAS.order=[
      {key:'deadline',label:'预计交货日期',type:'date',get:r=>r.order.deadline},
      {key:'startDate',label:'单据日期',type:'date',get:r=>r.order.startDate},
      {key:'id',label:'单据编号',type:'text',get:r=>r.order.id},
      {key:'customer',label:'客户',type:'text',get:r=>r.order.customer},
      {key:'status',label:'审核状态',type:'text',select:true,get:r=>r.order.status},
      {key:'productId',label:'商品编码',type:'text',get:r=>r.item.productId},
      {key:'productName',label:'商品名称',type:'text',get:r=>r.item.productName||(r.item.productId&&prodMap[r.item.productId]?prodMap[r.item.productId].name:'')},
      {key:'model',label:'型号',type:'text',get:r=>{const p=prodMap[r.item.productId];return p?p.model:'';}},
      {key:'spec',label:'规格',type:'text',get:r=>{const p=prodMap[r.item.productId];return p?p.spec:'';}},
      {key:'unit',label:'单位',type:'text',get:r=>{const p=prodMap[r.item.productId];return p?p.unit:'';}},
      {key:'orderQty',label:'数量',type:'number',get:r=>r.item.orderQty},
      {key:'deliveredQty',label:'已交付',type:'number',get:r=>r.item.deliveredQty},
      {key:'_undel',label:'未交付',type:'number',get:r=>num(r.item.orderQty)-num(r.item.deliveredQty)},
      {key:'_pct',label:'进度%',type:'number',get:r=>{const t=num(r.item.orderQty);return t>0?Math.round(num(r.item.deliveredQty)/t*100):0;}},
      {key:'notes',label:'商品行备注',type:'text',get:r=>r.item.notes||r.order.notes||''}
    ];
    TBL_ROWS.order=rows;
    let shown=applyTable('order',rows);
    /* 订单级列合并：前 5 列（预计交货日期/单据日期/单据编号/客户/审核状态）按订单合并。
       仅当未按商品级列排序时才合并，避免排序后同一订单行被打散导致 rowspan 断裂。 */
    const HEAD_COLS=5;
    const sortKey=tState('order').sort?tState('order').sort.key:null;
    const lineKeys=TBL_SCHEMAS.order.slice(HEAD_COLS).map(c=>c.key);
    const shouldMerge=!sortKey||!lineKeys.includes(sortKey);
    if(shouldMerge)shown=[...shown].sort((a,b)=>a.order.id.localeCompare(b.order.id,'zh-CN'));
    const groupMap=new Map();
    shown.forEach((r,i)=>{if(!groupMap.has(r.order.id))groupMap.set(r.order.id,{start:i,count:0});groupMap.get(r.order.id).count++;});
    lastRowIds.order=shown.map(r=>r.orderIdx);
    html+=bulkBar('order');
    html+=filterBar('order');
    html+='<div class="table-wrap"><table><thead><tr><th class="sel-col"></th>'+TBL_SCHEMAS.order.map(c=>thCol('order',c)).join('')+'</tr></thead><tbody>';
    if(shown.length===0){html+=noMatchRow('order',TBL_SCHEMAS.order.length+1);}
    shown.forEach((r,i)=>{
      const o=r.order, it=r.item, oi=r.orderIdx;
      const oq=num(it.orderQty), dq=num(it.deliveredQty);
      const undel=oq-dq;
      const pct=oq>0?Math.round(dq/oq*100):0;
      const today=todayStr();
      const overdue=o.status==='执行中'&&o.deadline&&fmtDate(o.deadline)<today;
      const statusCls=o.status==='执行中'?'tag-blue':o.status==='已完成'?'tag-green':'tag-gray';
      const grp=groupMap.get(r.order.id);
      const isFirst=grp.start===i;
      const rs=grp.count;
      const selChecked=selSet('order').has(String(oi))?'checked':'';
      const selCell=shouldMerge?(isFirst?'<td class="sel-col" rowspan="'+rs+'"><input type="checkbox" '+selChecked+' onclick="event.stopPropagation();selRowClick(\'order\','+oi+')"></td>':''):'<td class="sel-col"><input type="checkbox" '+selChecked+' onclick="event.stopPropagation();selRowClick(\'order\','+oi+')"></td>';
      let headCells='';
      if(shouldMerge){
        if(isFirst){
          headCells=
            '<td rowspan="'+rs+'"'+(overdue?' style="color:var(--red);font-weight:600"':'')+'>'+fmtDate(o.deadline)+(overdue?' ⚠':'')+'</td>'+
            '<td rowspan="'+rs+'">'+fmtDate(o.startDate)+'</td>'+
            '<td rowspan="'+rs+'" style="font-weight:600">'+esc(o.id)+'</td>'+
            '<td rowspan="'+rs+'">'+esc(o.customer)+'</td>'+
            '<td rowspan="'+rs+'"><span class="tag '+statusCls+'">'+esc(o.status)+'</span></td>';
        }
      }else{
        headCells=
          '<td'+(overdue?' style="color:var(--red);font-weight:600"':'')+'>'+fmtDate(o.deadline)+(overdue?' ⚠':'')+'</td>'+
          '<td>'+fmtDate(o.startDate)+'</td>'+
          '<td style="font-weight:600">'+esc(o.id)+'</td>'+
          '<td>'+esc(o.customer)+'</td>'+
          '<td><span class="tag '+statusCls+'">'+esc(o.status)+'</span></td>';
      }
      html+='<tr'+(overdue?' style="background:var(--red-bg)"':'')+' onclick="selRowClick(\'order\','+oi+')">'+selCell+headCells+
        '<td>'+esc(it.productId)+'</td>'+
        '<td>'+esc(it.productName||(it.productId&&prodMap[it.productId]?prodMap[it.productId].name:''))+'</td>'+
        '<td>'+esc(prodMap[it.productId]?prodMap[it.productId].model:'')+'</td>'+
        '<td>'+esc(prodMap[it.productId]?prodMap[it.productId].spec:'')+'</td>'+
        '<td>'+esc(prodMap[it.productId]?prodMap[it.productId].unit:'')+'</td>'+
        '<td style="font-variant-numeric:tabular-nums;text-align:right">'+money(oq)+'</td>'+
        '<td style="font-variant-numeric:tabular-nums;text-align:right">'+money(dq)+'</td>'+
        '<td style="font-variant-numeric:tabular-nums;text-align:right">'+money(undel)+'</td>'+
        '<td style="min-width:90px"><div style="display:flex;align-items:center;gap:4px"><div class="progress-wrap" style="flex:1;min-width:50px"><div class="progress-bar" style="width:'+pct+'%"></div></div><span style="font-size:11px">'+pct+'%</span></div></td>'+
        '<td>'+esc(it.notes||o.notes||'')+'</td>'+
        '</tr>';
    });
    html+='</tbody></table></div>';
  }
  html+='</div>';
  return html;
}

function orderModal(idx,prefill){
  const src=prefill!=null?prefill:(idx!=null?orders[idx]:null);
  const o=src?JSON.parse(JSON.stringify(src)):{status:'执行中',startDate:todayStr(),items:[]};
  const headCols=fields.order.filter(f=>!isLineField(f));
  let body='<div class="form-row">';
  headCols.forEach((f,i)=>{
    if(i>0&&i%2===0)body+='</div><div class="form-row">';
    const val=o[f.key]!=null?o[f.key]:'';
    const ctrl=genControl(f,'of_',val,'order');
    body+='<div><label>'+esc(f.label)+(f.required?' *':'')+'</label>'+ctrl+'</div>';
  });
  body+='</div>';
  body+='<div style="display:flex;align-items:center;gap:10px;margin:18px 0 8px"><b style="font-size:14px">订单明细</b><span style="font-size:12px;color:var(--muted)">每行一种产品，一单可含多种开关</span><button class="btn btn-sm" style="margin-left:auto" onclick="addOrderItemRow()">+ 添加产品行</button></div>';
  body+='<div class="table-wrap"><table id="orderItemsTbl"><thead><tr>'+

    '<th style="width:56px">操作</th></tr></thead><tbody>';
  orderItems(o).forEach(it=>body+=orderItemRow(it));
  body+='</tbody></table></div>';
  showModal(idx!=null?'编辑订单':'新增订单',body,
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveOrder('+(idx!=null?idx:-1)+')">保存</button>'
  );
}

/* 明细行渲染（按字段设置中的行级字段动态生成） */
function orderLineCols(){return orderLineFields();}
function orderItemRow(it){
  let h='<tr>';
  const refKeys=refKeysOf('order');
  orderLineCols().forEach(f=>{
    const v=it[f.key]!=null?it[f.key]:'';
    if(f.key==='productId'){
      h+='<td><select class="oi_field" data-key="productId" onchange="orderItemPick(this)'+(refKeys.has('productId')?';refKeyTrigger(this)':'')+'" style="width:100%"><option value="">请选择</option>'+products.map(p=>'<option value="'+esc(p.id)+'" data-name="'+esc(p.name)+'" '+(p.id===v?'selected':'')+'>'+esc(p.id)+' - '+esc(p.name)+'</option>').join('')+'</select></td>';
    }else if(f.type==='ref'){
      h+='<td><input type="text" class="oi_field ref-field" data-key="'+f.key+'" data-ref-form="'+esc(f.refForm||'')+'" data-ref-match="'+esc(f.refMatch||'')+'" data-ref-field="'+esc(f.refField||'')+'" data-ref-key="'+esc(f.refKey||'')+'" value="'+esc(v)+'" readonly style="width:100%;background:#f6f8fa;color:var(--muted)"></td>';
    }else{
      const tp=f.type==='number'?'number':(f.type==='date'?'date':'text');
      h+='<td><input type="'+tp+'" class="oi_field" data-key="'+f.key+'" value="'+esc(f.type==='date'?fmtDate(v):v)+'" style="width:100%"></td>';
    }
  });
  h+='<td style="text-align:center"><button class="btn btn-sm btn-danger" onclick="removeOrderItemRow(this)" title="删除此行">✕</button></td></tr>';
  return h;
}
function addOrderItemRow(){
  const tb=document.querySelector('#orderItemsTbl tbody');
  if(tb)tb.insertAdjacentHTML('beforeend',orderItemRow({}));
}
function removeOrderItemRow(btn){
  const tb=btn.closest('tbody');
  btn.closest('tr').remove();
  if(tb&&!tb.rows.length)addOrderItemRow();
}
function orderItemPick(sel){
  const opt=sel.options[sel.selectedIndex];
  if(opt&&opt.dataset.name){
    const nameInp=sel.closest('tr').querySelector('[data-key="productName"]');
    if(nameInp&&!nameInp.value)nameInp.value=opt.dataset.name;
  }
}

function saveOrder(idx){
  const cols=fields.order;
  const o={};
  cols.forEach(f=>{
    if(isLineField(f))return;
    const el=document.getElementById('of_'+f.key);
    o[f.key]=f.type==='number'?num(el.value):el.value;
  });
  if(!o.id){alert('请填写订单编号');return;}
  if(!o.customer){alert('请填写客户名称');return;}
  const items=[];
  document.querySelectorAll('#orderItemsTbl tbody tr').forEach(tr=>{
    const it={};
    tr.querySelectorAll('.oi_field').forEach(el=>{
      const f=cols.find(c=>c.key===el.dataset.key);
      it[el.dataset.key]=(f&&f.type==='number')?num(el.value):(el.value||'');
    });
    if(it.productId||num(it.orderQty)>0)items.push(it);
  });
  if(items.length===0){alert('请至少填写一行产品明细（选择产品并填写订单数量）');return;}
  const bad=items.find(it=>!it.productId||num(it.orderQty)<=0);
  if(bad){alert('存在"未选产品或数量为0"的明细行，请补全或删除该行');return;}
  // 引用字段重算（基于关联键实时取值，确保存储正确）
  orderHeadFields().forEach(f=>{ if(f.type==='ref'){ o[f.key]=lookupRef(f.refForm,f.refMatch,o[f.refKey],f.refField); } });
  orderLineFields().forEach(f=>{ if(f.type==='ref'){ items.forEach(it=>{ it[f.key]=lookupRef(f.refForm,f.refMatch,it[f.refKey],f.refField); }); } });
  o.items=items;
  if(idx>=0){
    const oldO=orders[idx];
    orders[idx]=o;
    const rl=o.id+'('+esc(o.customer)+')';
    logFieldDiffs('订单管理',orderHeadFields(),oldO,o,rl);
    logOrderLineDiffs('订单管理',oldO.items,o.items,rl);
  }else{
    if(orders.find(x=>x.id===o.id)){alert('订单编号已存在');return;}
    orders.push(o);
    logOp('新增','订单管理','新增订单「'+o.id+'」('+esc(o.customer)+')，'+items.length+' 行明细');
  }
  save('orders',orders);
  closeModal();
  renderContent();
}

function delOrder(idx){
  if(!confirm('确认删除订单「'+orders[idx].id+'」？'))return;
  logOp('删除','订单管理','删除订单「'+orders[idx].id+'」('+orders[idx].customer+')');
  orders.splice(idx,1);
  save('orders',orders);
  renderContent();
}

/* ================================================================
   半成品库存台账
================================================================ */
function renderInventory(){
  let html='<div class="card"><div class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;color:var(--primary)"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>未包半成品库存台账 <span class="desc">记录每日出入库及库存余额 · 自动判断库存状态</span> <button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="inventoryModal()">新增记录</button></div>';

  // 表格筛选/排序
  TBL_SCHEMAS.inventory=[
    {key:'date',label:'日期',type:'date'},
    {key:'productId',label:'产品编码',type:'text'},
    {key:'productName',label:'产品名称',type:'text'},
    {key:'opening',label:'期初库存',type:'number'},
    {key:'inbound',label:'入库(装配产出)',type:'number'},
    {key:'outbound',label:'出库(包装消耗)',type:'number'},
    {key:'closing',label:'期末库存',type:'number'},
    {key:'stockMin',label:'下限',type:'number'},
    {key:'stockMax',label:'上限',type:'number'},
    {key:'status',label:'状态',type:'text',select:true,get:r=>{const c=num(r.closing);return c<num(r.stockMin)?STOCK_STATUS.low.label:(c>num(r.stockMax)?STOCK_STATUS.high.label:STOCK_STATUS.normal.label);}}
  ];
  TBL_ROWS.inventory=inventory;
  const filteredInv=filterRows('inventory',inventory);

  // 按日期分组
  const dates=[...new Set(filteredInv.map(i=>fmtDate(i.date)))].sort().reverse();

  if(dates.length===0){
    html+=inventory.length>0?'<div class="empty" style="display:flex;align-items:center;justify-content:center;gap:8px">无匹配数据 <button class="btn btn-sm" onclick="clearAllFilt(\'inventory\')">清除筛选</button></div>':'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><br>暂无库存数据</div>';
  }else{
    lastRowIds.inventory=[];
    html+=bulkBar('inventory');
    html+=filterBar('inventory');
    dates.forEach(d=>{
      const rows=sortRows('inventory',filteredInv.filter(i=>fmtDate(i.date)===d));
      html+='<h3 style="font-size:14px;margin:12px 0 6px;color:var(--text)">'+d+'</h3>';
      html+='<div class="table-wrap"><table><thead><tr><th class="sel-col"></th>'+TBL_SCHEMAS.inventory.map(c=>thCol('inventory',c)).join('')+'</tr></thead><tbody>';
      rows.forEach((r,idx)=>{
        const realIdx=inventory.indexOf(r);
        lastRowIds.inventory.push(realIdx);
        const selChecked=selSet('inventory').has(String(realIdx))?'checked':'';
        const st=num(r.closing)<num(r.stockMin)?STOCK_STATUS.low:(num(r.closing)>num(r.stockMax)?STOCK_STATUS.high:STOCK_STATUS.normal);
        html+='<tr onclick="selRowClick(\'inventory\','+realIdx+')"><td class="sel-col"><input type="checkbox" '+selChecked+' onclick="event.stopPropagation();selRowClick(\'inventory\','+realIdx+')"></td><td>'+esc(r.productId)+'</td><td>'+esc(r.productName)+'</td><td style="text-align:right">'+r.opening+'</td><td style="text-align:right;color:var(--green)">+'+r.inbound+'</td><td style="text-align:right;color:var(--red)">-'+r.outbound+'</td><td style="text-align:right;font-weight:600">'+r.closing+'</td><td>'+r.stockMin+'</td><td>'+r.stockMax+'</td><td><span class="tag '+st.cls+'">'+st.label+'</span></td></tr>';
      });
      // 小计
      const sumIn=rows.reduce((s,r)=>s+num(r.inbound),0);
      const sumOut=rows.reduce((s,r)=>s+num(r.outbound),0);
      html+='<tr style="font-weight:600;background:var(--primary-light)"><td class="sel-col"></td><td colspan="2">小计</td><td></td><td style="text-align:right">+'+sumIn+'</td><td style="text-align:right">-'+sumOut+'</td><td colspan="4"></td></tr>';
      html+='</tbody></table></div>';
    });
  }
  html+='</div>';
  return html;
}

    '<div><label>出库(包装消耗)</label><input type="number" id="inv_outbound" value="'+r.outbound+'" onchange="calcClosing()"></div>'+

function autoFillInv(){
  const sel=document.getElementById('inv_productId');
  const opt=sel.options[sel.selectedIndex];
  if(opt){
    document.getElementById('inv_productName').value=opt.dataset.name||'';
  }
}

function calcClosing(){
  const o=num(document.getElementById('inv_opening').value);
  const i=num(document.getElementById('inv_inbound').value);
  const out=num(document.getElementById('inv_outbound').value);
  document.getElementById('inv_closing').value=o+i-out;
}

function saveInventory(idx){
  const r={
    date:document.getElementById('inv_date').value,
    productId:document.getElementById('inv_productId').value,
    productName:document.getElementById('inv_productName').value,
    opening:num(document.getElementById('inv_opening').value),
    inbound:num(document.getElementById('inv_inbound').value),
    outbound:num(document.getElementById('inv_outbound').value),
    closing:num(document.getElementById('inv_closing').value),
    stockMin:num(document.getElementById('inv_stockMin').value),
    stockMax:num(document.getElementById('inv_stockMax').value),
    status:''
  };
  if(!r.productId){alert('请选择产品');return;}
  r.status=r.closing<r.stockMin?'低于下限':(r.closing>r.stockMax?'高于上限':'正常');
  if(idx>=0){const oldR=inventory[idx];inventory[idx]=r;logFieldDiffs('半成品库存',HARD_FIELDS.inventory,oldR,r,r.productName+' '+fmtDate(r.date));}
  else{inventory.push(r);logOp('新增','半成品库存','新增库存记录「'+r.productName+'」'+fmtDate(r.date));}
  save('inventory',inventory);
  closeModal();
  renderContent();
}

function delInventory(idx){
  if(!confirm('确认删除该库存记录？'))return;
  logOp('删除','半成品库存','删除库存记录「'+inventory[idx].productName+'」'+fmtDate(inventory[idx].date));
  inventory.splice(idx,1);
  save('inventory',inventory);
  renderContent();
}

/* ================================================================
   日排产计划
================================================================ */
function renderDailyPlan(){
  let html='<div class="card"><div class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;color:var(--primary)"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>日排产计划 <span class="desc">备货排产(包装前) + 包装排产(按订单)</span></div>';

  // 日期选择
  html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">'+
    '<label style="margin:0"><input type="date" id="planDate" value="'+planDate+'" onchange="changePlanDate()" style="width:auto"></label>'+
    '<button class="btn btn-sm" onclick="shiftPlanDate(-1)">前一天</button>'+
    '<button class="btn btn-sm" onclick="shiftPlanDate(1)">后一天</button>'+
    '<button class="btn btn-sm" onclick="planDate=todayStr();document.getElementById(\'planDate\').value=todayStr();renderContent()">今天</button>'+
    '</div>';

  const dayPlans=dailyPlans.filter(p=>fmtDate(p.date)===planDate);

function autoFillPlan(){
  const sel=document.getElementById('sp_productId');
  const opt=sel.options[sel.selectedIndex];
  if(opt){
    document.getElementById('sp_productName').value=opt.dataset.name||'';
    const cap=opt.dataset.cap;
    if(cap&&!document.getElementById('sp_assemblyPlan').value){
      document.getElementById('sp_assemblyPlan').value=cap;
      document.getElementById('sp_innerPackPlan').value=cap;
      document.getElementById('sp_testAgingPlan').value=cap;
    }
  }
}

function autoFillOrder(){
  const sel=document.getElementById('pk_orderId');
  const opt=sel.options[sel.selectedIndex];
  if(opt){
    document.getElementById('pk_productId').value=opt.dataset.product||'';
    document.getElementById('pk_productName').value=opt.dataset.pname||'';
    document.getElementById('pk_orderTotal').value=opt.dataset.total||'';
    document.getElementById('pk_delivered').value=opt.dataset.delivered||'';
    const undel=num(opt.dataset.total)-num(opt.dataset.delivered);
    document.getElementById('pk_undelivered').value=undel;
  }
}

function savePlan(idx){
  const p={
    date:document.getElementById('sp_date').value,
    productId:document.getElementById('sp_productId').value,
    productName:document.getElementById('sp_productName').value,
    assemblyPlan:num(document.getElementById('sp_assemblyPlan').value),
    assemblyDone:num(document.getElementById('sp_assemblyDone').value),
    innerPackPlan:num(document.getElementById('sp_innerPackPlan').value),
    innerPackDone:num(document.getElementById('sp_innerPackDone').value),
    testAgingPlan:num(document.getElementById('sp_testAgingPlan').value),
    testAgingDone:num(document.getElementById('sp_testAgingDone').value),
    semiInbound:num(document.getElementById('sp_semiInbound').value),
    notes:document.getElementById('sp_notes').value
  };
  if(!p.productId){alert('请选择产品');return;}
  if(idx>=0){const oldP=dailyPlans[idx];dailyPlans[idx]=p;logFieldDiffs('备货排产',HARD_FIELDS.dailyPlan,oldP,p,p.productName+' '+fmtDate(p.date));}
  else{dailyPlans.push(p);logOp('新增','备货排产','新增「'+p.productName+'」'+fmtDate(p.date)+'排产');}
  save('dailyPlans',dailyPlans);
  closeModal();
  renderContent();
}

function savePkg(idx){
  const p={
    date:document.getElementById('pk_date').value,
    productId:document.getElementById('pk_productId').value,
    productName:document.getElementById('pk_productName').value,
    orderId:document.getElementById('pk_orderId').value,
    pkgPlan:num(document.getElementById('pk_pkgPlan').value),
    pkgDone:num(document.getElementById('pk_pkgDone').value),
    finInbound:num(document.getElementById('pk_finInbound').value),
    orderTotal:num(document.getElementById('pk_orderTotal').value),
    delivered:num(document.getElementById('pk_delivered').value),
    undelivered:num(document.getElementById('pk_undelivered').value),
    notes:document.getElementById('pk_notes').value
  };
  if(!p.orderId){alert('请选择关联订单');return;}
  if(idx>=0){const oldP=dailyPkgs[idx];dailyPkgs[idx]=p;logFieldDiffs('包装排产',HARD_FIELDS.dailyPkg,oldP,p,p.productName+' 订单'+p.orderId);}
  else{dailyPkgs.push(p);logOp('新增','包装排产','新增「'+p.productName+'」订单'+p.orderId+'包装排产');}
  save('dailyPkgs',dailyPkgs);
  closeModal();
  renderContent();
}

function delPlan(idx){
  if(!confirm('确认删除该备货排产记录？'))return;
  logOp('删除','备货排产','删除「'+dailyPlans[idx].productName+'」'+fmtDate(dailyPlans[idx].date)+'排产');
  dailyPlans.splice(idx,1);
  save('dailyPlans',dailyPlans);
  renderContent();
}
function delPkg(idx){
  if(!confirm('确认删除该包装排产记录？'))return;
  logOp('删除','包装排产','删除「'+dailyPkgs[idx].productName+'」订单'+dailyPkgs[idx].orderId+'包装排产');

  save('dailyPkgs',dailyPkgs);

   生产日报
================================================================ */
function renderDailyReport(){
  let html='<div class="card"><div class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;color:var(--primary)"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>生产日报 <span class="desc">按产品统计每日各工序完成数量</span></div>';

  html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">'+
    '<label style="margin:0"><input type="date" id="reportDate" value="'+reportDate+'" onchange="changeReportDate()" style="width:auto"></label>'+
    '<button class="btn btn-sm" onclick="shiftReportDate(-1)">前一天</button>'+
    '<button class="btn btn-sm" onclick="shiftReportDate(1)">后一天</button>'+
    '</div>';

  // 汇总当日备货+包装数据
  const dayPlans=dailyPlans.filter(p=>fmtDate(p.date)===reportDate);
  const dayPkgs=dailyPkgs.filter(p=>fmtDate(p.date)===reportDate);

  // 合并产品维度
  const productMap={};
  dayPlans.forEach(p=>{
    if(!productMap[p.productId])productMap[p.productId]={productId:p.productId,productName:p.productName,assemblyDone:0,innerPackDone:0,testAgingDone:0,semiInbound:0,packagingDone:0,finishedInbound:0,orderId:''};
    productMap[p.productId].assemblyDone+=num(p.assemblyDone);
    productMap[p.productId].innerPackDone+=num(p.innerPackDone);
    productMap[p.productId].testAgingDone+=num(p.testAgingDone);
    productMap[p.productId].semiInbound+=num(p.semiInbound);
  });
  dayPkgs.forEach(p=>{
    if(!productMap[p.productId])productMap[p.productId]={productId:p.productId,productName:p.productName,assemblyDone:0,innerPackDone:0,testAgingDone:0,semiInbound:0,packagingDone:0,finishedInbound:0,orderId:p.orderId};
    productMap[p.productId].packagingDone+=num(p.pkgDone);
    productMap[p.productId].finishedInbound+=num(p.finInbound);
    if(p.orderId)productMap[p.productId].orderId=p.orderId;
  });

  let rows=Object.values(productMap);
  if(rows.length===0){
    html+='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg><br>当日无生产数据，请先在「日排产」中录入</div>';
  }else{
    TBL_SCHEMAS.report=[
      {key:'productId',label:'产品编码',type:'text'},
      {key:'productName',label:'产品名称',type:'text'},
      {key:'assemblyDone',label:'装配完成',type:'number'},
      {key:'innerPackDone',label:'内包完成',type:'number'},
      {key:'testAgingDone',label:'调试老化完成',type:'number'},
      {key:'semiInbound',label:'半成品入库',type:'number'},
      {key:'packagingDone',label:'包装完成',type:'number'},
      {key:'finishedInbound',label:'成品入库',type:'number'},
      {key:'orderId',label:'关联订单',type:'text'}
    ];
    TBL_ROWS.report=rows;
    rows=applyTable('report',rows);
    html+=filterBar('report');
    html+='<div class="table-wrap"><table><thead><tr>'+TBL_SCHEMAS.report.map(c=>thCol('report',c)).join('')+'</tr></thead><tbody>';
    if(rows.length===0){html+=noMatchRow('report',9);}
    let sumA=0,sumI=0,sumT=0,sumS=0,sumP=0,sumF=0;
    rows.forEach(r=>{
      html+='<tr><td>'+esc(r.productId)+'</td><td>'+esc(r.productName)+'</td>'+
        '<td style="text-align:right">'+r.assemblyDone+'</td>'+
        '<td style="text-align:right">'+r.innerPackDone+'</td>'+
        '<td style="text-align:right">'+r.testAgingDone+'</td>'+
        '<td style="text-align:right">'+r.semiInbound+'</td>'+
        '<td style="text-align:right;font-weight:600">'+r.packagingDone+'</td>'+
        '<td style="text-align:right;font-weight:600">'+r.finishedInbound+'</td>'+
        '<td>'+esc(r.orderId)+'</td></tr>';
      sumA+=r.assemblyDone;sumI+=r.innerPackDone;sumT+=r.testAgingDone;sumS+=r.semiInbound;sumP+=r.packagingDone;sumF+=r.finishedInbound;
    });
    html+='<tr style="font-weight:600;background:var(--primary-light)"><td colspan="2">日合计</td><td style="text-align:right">'+sumA+'</td><td style="text-align:right">'+sumI+'</td><td style="text-align:right">'+sumT+'</td><td style="text-align:right">'+sumS+'</td><td style="text-align:right">'+sumP+'</td><td style="text-align:right">'+sumF+'</td><td></td></tr>';
    html+='</tbody></table></div>';
  }
  html+='</div>';

  // 周合计
  const weekStart=getWeekStart(reportDate);
  const weekEnd=getWeekEnd(reportDate);
  const weekPlans=dailyPlans.filter(p=>{const d=fmtDate(p.date);return d>=weekStart&&d<=weekEnd;});
  const weekPkgs=dailyPkgs.filter(p=>{const d=fmtDate(p.date);return d>=weekStart&&d<=weekEnd;});
  const wA=weekPlans.reduce((s,p)=>s+num(p.assemblyDone),0);
  const wI=weekPlans.reduce((s,p)=>s+num(p.innerPackDone),0);
  const wT=weekPlans.reduce((s,p)=>s+num(p.testAgingDone),0);
  const wS=weekPlans.reduce((s,p)=>s+num(p.semiInbound),0);
  const wP=weekPkgs.reduce((s,p)=>s+num(p.pkgDone),0);
  const wF=weekPkgs.reduce((s,p)=>s+num(p.finInbound),0);
  html+='<div class="card"><div class="card-title">本周合计（'+weekStart+' ~ '+weekEnd+'）</div>';
  html+='<div class="stats">'+
    statCard(wA,'装配完成','blue')+
    statCard(wI,'内包完成','blue')+
    statCard(wT,'调试老化完成','blue')+
    statCard(wS,'半成品入库','')+
    statCard(wP,'包装完成','amber')+
    statCard(wF,'成品入库','amber')+
    '</div></div>';

  return html;
}

function getWeekStart(d){
  const date=new Date(d);
  const day=date.getDay()||7;
  date.setDate(date.getDate()-day+1);
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}
function getWeekEnd(d){
  const date=new Date(d);
  const day=date.getDay()||7;
  date.setDate(date.getDate()-day+7);
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}

  reportDate=document.getElementById('reportDate').value;

  const d=new Date(reportDate);
  d.setDate(d.getDate()+delta);
  reportDate=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function saveDelivery(idx){
  const d={
    orderId:document.getElementById('dl_orderId').value,
    customer:document.getElementById('dl_customer').value,
    productId:document.getElementById('dl_productId').value,
    productName:document.getElementById('dl_productName').value,
    orderTotal:num(document.getElementById('dl_orderTotal').value),
    delivered:num(document.getElementById('dl_delivered').value),
    undelivered:num(document.getElementById('dl_undelivered').value),

    batchCount:num(document.getElementById('dl_batchCount').value),
    perBatch:document.getElementById('dl_perBatch').value,
    notes:document.getElementById('dl_notes').value
  };
  if(!d.orderId){alert('请选择订单');return;}
  if(idx>=0){const oldD=deliveries[idx];d.batches=oldD.batches;deliveries[idx]=d;logFieldDiffs('交付计划',HARD_FIELDS.delivery,oldD,d,d.orderId+'('+d.customer+')');}
  else{deliveries.push(d);logOp('新增','交付计划','新增交付计划「'+d.orderId+'」('+d.customer+')');}
  save('deliveries',deliveries);

function delDelivery(idx){
  if(!confirm('确认删除该交付计划？'))return;
  logOp('删除','交付计划','删除交付计划「'+deliveries[idx].orderId+'」('+deliveries[idx].customer+')');
  deliveries.splice(idx,1);
  save('deliveries',deliveries);
  renderContent();

function genBatches(idx){
  const d=deliveries[idx];
  if(!d){return;}
  if(!d.finalDate||!d.firstDate){alert('请先填写最终交付期和首次交付日');return;}
  if(d.undelivered<=0){alert('未交付量为0，无需生成排期');return;}

  // 计算间隔天数
  let interval=7;
  if(d.freq.includes('三天'))interval=3;
  else if(d.freq.includes('每日'))interval=1;
  else if(d.freq.includes('周一'))interval=7;
  else if(d.freq.includes('周五'))interval=7;

  // 计算批次
  const batchCount=Math.max(1,Math.ceil(d.undelivered/Math.ceil(d.undelivered/(d.batchCount||Math.ceil(d.undelivered/50)))));
  const perBatch=Math.floor(d.undelivered/batchCount);
  const remainder=d.undelivered%batchCount;

  const batches=[];
  let cumulative=0;
  let currentDate=new Date(d.firstDate);
  const finalDate=new Date(d.finalDate);
  const weekdays=['周日','周一','周二','周三','周四','周五','周六'];

  for(let i=0;i<batchCount;i++){
    const qty=i===batchCount-1?perBatch+remainder:perBatch;
    cumulative+=qty;
    const wd=weekdays[currentDate.getDay()];
    const dateStr=currentDate.getFullYear()+'-'+String(currentDate.getMonth()+1).padStart(2,'0')+'-'+String(currentDate.getDate()).padStart(2,'0');
    batches.push({
      seq:i+1,
      date:dateStr,
      weekday:wd,
      planQty:qty,
      cumulative:cumulative,
      remaining:d.undelivered-cumulative,
      actualQty:'',
      status:'待交付',
      diff:'',
      notes:''
    });
    currentDate.setDate(currentDate.getDate()+interval);
    if(currentDate>finalDate&&i<batchCount-1){
      // 如果超过最终交付期，缩短间隔
      currentDate=new Date(d.finalDate);
      currentDate.setDate(currentDate.getDate()-interval*(batchCount-i-1));
    }
  }

  d.batches=batches;
  d.batchCount=batchCount;
  d.perBatch=perBatch+(remainder>0?'(末批'+(perBatch+remainder)+')':'');
  save('deliveries',deliveries);
  logOp('生成排期','交付计划','订单「'+d.orderId+'」生成'+batchCount+'批交付排期');
  renderContent();
}

function updateActual(orderId,seq,val){
  const d=deliveries.find(x=>x.orderId===orderId);
  if(!d||!d.batches)return;
  const b=d.batches.find(x=>x.seq===seq);
  if(!b)return;
  b.actualQty=val;
  b.status=val!==''?'已交付':'待交付';
  b.diff=val!==''?num(val)-num(b.planQty):'';
  save('deliveries',deliveries);
  logOp('填报','交付计划','订单「'+orderId+'」第'+seq+'批实际交付'+val);
  renderContent();
}

    html+='<div class="fs-note" style="font-size:12px;color:var(--muted);margin-top:8px">说明：表头字段每个订单只填一次；表体字段在「订单明细」中按产品逐行填写，可按需在表体下新增自定义列（如单价、行备注）。</div>';
  }else{
    if(REF_ENABLED.indexOf(sec)<0){
      html+='<div class="fs-note" style="font-size:12px;color:#b45309;margin-bottom:8px">提示：该表单的录入弹窗为固定结构，本页的字段增删改仅影响「导入/导出」的表头列，录入界面暂不受字段设置控制。引用字段请使用「产品主数据」或「订单管理」。</div>';
    }
    html+=fieldGroupHtml(sec,null,null,null);
  }
  body.innerHTML=html;
}

/* 字段分组表格（订单分为表头/表体；其余表单单组） */
function fieldGroupHtml(sec, level, title, note){
  let html='';
  if(title){
    html+='<div style="font-weight:700;font-size:13.5px;margin:16px 0 4px"><span style="background:var(--primary-light);color:var(--primary);padding:3px 10px;border-radius:6px">'+title+'</span></div>';
    if(note)html+='<div style="font-size:12px;color:var(--muted);margin-bottom:6px">'+note+'</div>';
  }
  const ro=fieldsAudit==='audited';
  html+='<div class="table-wrap"><table><thead><tr><th style="min-width:130px">字段名称</th><th>类型</th><th style="text-align:center">必填</th><th style="min-width:150px">选项 / 引用设置</th><th>操作</th></tr></thead><tbody>';
  const typesFor=(REF_ENABLED.indexOf(sec)>=0)?TYPES:TYPES.filter(function(t){return t!=='ref';});
  curFields()[sec].forEach((f,idx)=>{
    if(level && f.level!==level)return;
    const dis=(ro||f.locked)?' disabled':'';
    const typeCtrl=f.locked?'<span style="color:var(--muted)">'+esc(f.type)+'</span>':'<select'+dis+' onchange="updField(\''+sec+'\','+idx+',\'type\',this.value)">'+typesFor.map(function(t){return '<option '+(t===f.type?'selected':'')+'>'+t+'</option>';}).join('')+'</select>';
    const reqCtrl=(f.locked||ro)?(f.required?'<span style="color:var(--muted)">必填</span>':'<span style="color:var(--muted)">否</span>'):'<input type="checkbox" '+(f.required?'checked':'')+dis+' onchange="updField(\''+sec+'\','+idx+',\'required\',this.checked)">';
    let optCtrl='<span style="color:#bbb">—</span>';
    if(f.type==='select'){
      optCtrl='<input'+dis+' value="'+esc((f.options||[]).join(','))+'" onchange="updField(\''+sec+'\','+idx+',\'options\',this.value.split(\',\').map(s=>s.trim()).filter(Boolean))" placeholder="逗号分隔" style="font-size:12px">';
    }else if(f.type==='ref'){
      optCtrl='<span style="font-size:11px;color:var(--primary)"><span title="'+esc(refDesc(f,sec))+'">'+esc(refDesc(f,sec))+'</span><br><button class="btn-sm"'+dis+' style="cursor:pointer;margin-top:2px" onclick="refConfigModal(\''+sec+'\','+idx+')">配置引用</button></span>';
    }
    const labelCell=(f.locked||ro)?(esc(f.label)+' '+LOCK):'<input value="'+esc(f.label)+'"'+dis+' onchange="updField(\''+sec+'\','+idx+',\'label\',this.value)">';
    const delBtn=(f.locked||ro)?'<button disabled style="min-height:30px;padding:4px 10px;font-size:12px;border-radius:8px;border:1px solid var(--border);background:#f3f4f6;color:#bbb;cursor:not-allowed">删除</button>':'<button class="btn-danger btn-sm" style="cursor:pointer" onclick="delField(\''+sec+'\','+idx+')">删除</button>';
    html+='<tr><td>'+labelCell+'</td><td>'+typeCtrl+'</td><td style="text-align:center">'+reqCtrl+'</td><td>'+optCtrl+'</td><td>'+delBtn+'</td></tr>';
  });
  html+='</tbody></table></div>';
  html+='<button class="btn btn-ghost btn-sm" '+(ro?'disabled':'')+' style="margin-top:10px;cursor:'+(ro?'not-allowed':'pointer')+'" onclick="addField(\''+sec+'\''+(level?',\''+level+'\'':'')+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>新增'+(level?(level==='line'?'表体':'表头'):'')+'字段</button>';
  return html;
}

/* 引用字段配置弹窗 */
function refConfigModal(sec,idx){
  const f=curFields()[sec][idx];
  const cur=f.refForm||'product';
  const tcols=fields[cur]||[];
  const keyOpts=(curFields()[sec]||[]).map(function(x){return '<option value="'+esc(x.key)+'" '+(x.key===f.refKey?'selected':'')+'>'+esc(x.label)+'</option>';}).join('');
  const matchOpts=tcols.map(function(x){return '<option value="'+esc(x.key)+'" '+(x.key===f.refMatch?'selected':'')+'>'+esc(x.label)+'</option>';}).join('');
  const fieldOpts=tcols.map(function(x){return '<option value="'+esc(x.key)+'" '+(x.key===f.refField?'selected':'')+'>'+esc(x.label)+'</option>';}).join('');
  let body='<div class="form-row">'+
    '<div><label>引用表单</label><select id="rc_form" onchange="rcReload(\''+sec+'\','+idx+')">'+Object.keys(REF_FORM_LABELS).map(function(k){return '<option value="'+k+'" '+(k===cur?'selected':'')+'>'+REF_FORM_LABELS[k]+'</option>';}).join('')+'</select></div>'+
    '<div><label>本表关联键（用于匹配）</label><select id="rc_key">'+keyOpts+'</select></div>'+
    '</div><div class="form-row">'+
    '<div><label>目标匹配字段</label><select id="rc_match">'+matchOpts+'</select></div>'+
    '<div><label>引用字段（要带出的值）</label><select id="rc_field">'+fieldOpts+'</select></div>'+
    '</div>'+
    '<div class="fs-note" style="font-size:12px;color:var(--muted);margin-top:6px">作用：录入本表单时，当「关联键」的值确定后，系统自动从「引用表单」中找到匹配记录，把「引用字段」的值带出并保存到本条记录（例如订单明细选了产品编码后，自动带出产品的规格、单位或单价）。</div>';
  showModal('配置引用字段「'+esc(f.label)+'」',body,
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveRefConfig(\''+sec+'\','+idx+')">保存</button>'
  );
}
function rcReload(sec,idx){
  const form=document.getElementById('rc_form').value;
  const tcols=fields[form]||[];
  const opts=tcols.map(function(x){return '<option value="'+esc(x.key)+'">'+esc(x.label)+'</option>';}).join('');
  document.getElementById('rc_match').innerHTML=opts;
  document.getElementById('rc_field').innerHTML=opts;
}
function saveRefConfig(sec,idx){
  const f=curFields()[sec][idx];
  f.type='ref';
  f.refForm=document.getElementById('rc_form').value;
  f.refKey=document.getElementById('rc_key').value;
  f.refMatch=document.getElementById('rc_match').value;
  f.refField=document.getElementById('rc_field').value;
  saveFieldsEdit();
  logOp('字段设置',REF_FORM_LABELS[sec]||sec,'配置引用字段「'+f.label+'」→ '+refDesc(f,sec), f.label);
  closeModal();
  renderFieldBody();
}

function addField(sec, level){
  if(fieldsAudit==='audited')return;
  curFields()[sec].push({key:'field_'+Date.now(),label:'新字段',type:'text',required:false,locked:false,level:level||'head'});
  saveFieldsEdit();
  logOp('字段设置',REF_FORM_LABELS[sec]||sec,'新增'+(level==='line'?'表体':'表头')+'字段「新字段」','新字段');
  renderFieldBody();
}
function updField(sec,idx,key,val){
  if(fieldsAudit==='audited')return;
  var oldVal=curFields()[sec][idx][key];
  curFields()[sec][idx][key]=val;
  saveFieldsEdit();
  if(key==='label')logOp('字段设置',REF_FORM_LABELS[sec]||sec,'字段改名「'+oldVal+'」→「'+val+'」', val, oldVal, val);
  renderFieldBody();
}
function delField(sec,idx){
  if(fieldsAudit==='audited')return;
  if(!confirm('确认删除字段「'+curFields()[sec][idx].label+'」？已有数据中该字段的值将丢失。'))return;
  logOp('字段设置',REF_FORM_LABELS[sec]||sec,'删除字段「'+curFields()[sec][idx].label+'」', curFields()[sec][idx].label);
  curFields()[sec].splice(idx,1);
  saveFieldsEdit();
  renderFieldBody();
}
