/* 某分类下的明细表格（合并单元格 + 批量操作/筛选，formKey 独立） */
/* 已计划未交付预计算（2026-08-25.17 新口径，用户拍板）：
   已计划未交付 = Σ(该订单该产品交付计划.planQty) − Σ(名下排产单该产品入库累计 doneQty，排除已取消)。
   只跟「生产入库」走：调拨/导入初始的订单行 deliveredQty 不再参与减数；独立单（deliveryIdx=null）不占交付计划额度不计入；
   排产单删除/取消后其入库自动移出减数（与 .16 全链路反向同步自洽）。返回 orderId|productId → {plan,done} */
/* 2026-08-25.17 新口径：已计划未交付 = Σ交付计划.planQty − Σ名下排产单入库累计（排除已取消，只跟生产入库走）。
   .33 行级化：交付计划行带 orderLine（来源订单行索引）→ key=orderId|L{orderLine} 按明细行区分（同产品多行各自正确）；
   交付计划行无 orderLine（存量）→ 回退产品级 key（orderId|productId），行为不变。
   排产单行经 dlLine → 交付计划行 orderLine 归行级；无 dlLine/无 orderLine → 产品级。
   已知风险（同 .24 dlLine 同款）：订单编辑增删行后订单行索引漂移，orderLine 可能错位。 */
function buildPlannedUndelMap(){
  const m={};
  deliveries.forEach((d,di)=>{
    deliveryItems(d).forEach(x=>{
      const k=x.orderLine!=null&&x.orderLine!==''?(d.orderId+'|L'+x.orderLine):(d.orderId+'|'+(x.productId||''));
      if(!m[k])m[k]={plan:0,done:0};
      m[k].plan+=num(x.planQty);
    });
    productionPlans.forEach(pp=>{
      if(pp.deliveryIdx!==di||pp.status==='已取消')return;
      ppItems(pp).forEach(y=>{
        /* 2026-08-25.54：存量排产单（无 dlLine）按 productId 反查该交付计划行（唯一匹配时取 orderLine 归行级，多行歧义保持产品级）——
           修复：交付计划行带 orderLine（.33）而存量排产单 done 归产品级，两侧 key 不匹配导致「已计划未交付」不减少 */
        let dlRow=null;
        if(y.dlLine!=null&&deliveryItems(d)[y.dlLine])dlRow=deliveryItems(d)[y.dlLine];
        if(!dlRow){
          const _rows=deliveryItems(d).filter(function(x){return String(x.productId)===String(y.productId);});
          if(_rows.length===1)dlRow=_rows[0];
        }
        const k=dlRow&&dlRow.orderLine!=null&&dlRow.orderLine!==''?(d.orderId+'|L'+dlRow.orderLine):(d.orderId+'|'+(y.productId||''));
        if(!m[k])m[k]={plan:0,done:0};
        m[k].done+=ppDoneOf(y);
      });
    });
  });
  return m;
}
function renderOrderTable(formKey,typeOrders,prodMap){
  const rows=[];
  typeOrders.forEach(({o,i})=>{orderItems(o).forEach((it,li)=>rows.push({order:o,item:it,orderIdx:i,__li:li}));});
  const puMap=buildPlannedUndelMap();          // 2026-08-25.17：新口径已计划未交付预计算
  TBL_SCHEMAS[formKey]=[
    /* 2026-08-30.94：库存订单删除「预计交货日期/合同号」列（销售订单保留） */
    ...(formKey!=='order_inv'?[{key:'deadline',label:'预计交货日期',type:'date',get:r=>r.order.deadline}]:[]),
    {key:'startDate',label:'单据日期',type:'date',get:r=>r.order.startDate},
    {key:'id',label:'单据编号',type:'text',get:r=>r.order.id},
    {key:'customer',label:'客户',type:'text',get:r=>r.order.customer},
    {key:'status',label:'审核状态',type:'text',select:true,options:ORDER_STATUS,get:r=>r.order.status},   /* 2026-08-25.58：筛选显示全部审核状态 */
    ...(formKey!=='order_inv'?[{key:'contractNo',label:'合同号',type:'text',get:r=>r.order.contractNo}]:[]),
    {key:'productId',label:'商品编码',type:'text',get:r=>r.item.productId},
    {key:'productName',label:'商品名称',type:'text',get:r=>r.item.productName||(r.item.productId&&prodMap[r.item.productId]?prodMap[r.item.productId].name:'')},
    {key:'model',label:'型号',type:'text',get:r=>{const p=prodMap[r.item.productId];return p?p.model:'';}},
    {key:'spec',label:'规格',type:'text',get:r=>{const p=prodMap[r.item.productId];return p?p.spec:'';}},
    {key:'unit',label:'单位',type:'text',get:r=>{const p=prodMap[r.item.productId];return p?p.unit:'';}},
    /* 2026-08-30.92：库存订单删除「数量」列（数量=最大库存量）；销售订单保留 */
    ...(formKey!=='order_inv'?[{key:'orderQty',label:'数量',type:'number',get:r=>r.item.orderQty}]:[]),
    /* 2026-08-30.96：销售订单删除「最大库存量/最小库存量/已计划未交付」列（库存订单保留——库存上下限为库存核心字段） */
    ...(formKey!=='order_frame'?[{key:'stockMax',label:'最大库存量',type:'number',get:r=>r.item.stockMax}]:[]),
    ...(formKey!=='order_frame'?[{key:'stockMin',label:'最小库存量',type:'number',get:r=>r.item.stockMin}]:[]),
    {key:'deliveredQty',label:'已交付',type:'number',get:r=>r.item.deliveredQty},
    /* 2026-08-30.94：库存订单删除「已调用/未交付」列（已调用=销售订单调用累计，库存恒 0；未交付计算保留在统计层） */
    ...(formKey!=='order_inv'?[{key:'calledQty',label:'已调用',type:'number',get:r=>r.item.calledQty}]:[]),   /* 2026-08-25.35：调用库存累计 */
    ...(formKey!=='order_inv'?[{key:'_undel',label:'未交付',type:'number',get:r=>invQtyOf(r.order,r.item)-num(r.item.deliveredQty)}]:[]),
    ...(formKey!=='order_frame'?[{key:'_plannedUndel',label:'已计划未交付',type:'number',get:r=>{
       /* 2026-08-25.17 新口径：Σ交付计划.planQty − Σ名下排产单入库累计(排除已取消)，只跟生产入库走（调拨/导入初始不参与）。
          .33 行级：优先按订单行索引 orderLine 查行级 key，无则回退产品级 */
       const pu=puMap[r.order.id+'|L'+(r.__li!=null?r.__li:'-')]||puMap[r.order.id+'|'+(r.item.productId||'')];
       return pu?Math.max(0,pu.plan-pu.done):0; }}]:[]),
    /* 2026-08-25.60：结余=已交付+已计划未交付（纯计算列，仅库存订单显示；销售订单共用模板不含此列） */
    ...(formKey==='order_inv'?[{key:'_balance',label:'结余',type:'number',get:r=>{
       const pu=puMap[r.order.id+'|L'+(r.__li!=null?r.__li:'-')]||puMap[r.order.id+'|'+(r.item.productId||'')];
       return num(r.item.deliveredQty)+(pu?Math.max(0,pu.plan-pu.done):0); }}]:[]),
    /* 2026-08-25.61：结余进度=结余/订单数量（仅库存订单，放结余后；与进度列同款百分比口径，可>100%） */
    ...(formKey==='order_inv'?[{key:'_balPct',label:'结余进度',type:'number',get:r=>{
       const pu=puMap[r.order.id+'|L'+(r.__li!=null?r.__li:'-')]||puMap[r.order.id+'|'+(r.item.productId||'')];
       const bal=num(r.item.deliveredQty)+(pu?Math.max(0,pu.plan-pu.done):0);
       const t=invQtyOf(r.order,r.item);
       return t>0?Math.round(bal/t*100):0; }}]:[]),
    {key:'_pct',label:(formKey==='order_inv')?'交付进度':'进度%',type:'number',get:r=>{const t=invQtyOf(r.order,r.item);return t>0?Math.round(num(r.item.deliveredQty)/t*100):0;}},
    {key:'lineNotes',label:'商品行备注',type:'text',get:r=>r.item.lineNotes!=null?r.item.lineNotes:(r.item.notes||'')}
  ];
  TBL_ROWS[formKey]=rows;
  let shown=applyTable(formKey,rows);
  /* 订单级列合并：前 5 列（预计交货日期/单据日期/单据编号/客户/审核状态）按订单合并。
     仅当未按商品级列排序时才合并，避免排序后同一订单行被打散导致 rowspan 断裂。 */
  const HEAD_COLS=5;
  const manualSort=tState(formKey).sort;
  const sortKey=manualSort?manualSort.key:null;
  const lineKeys=TBL_SCHEMAS[formKey].slice(HEAD_COLS).map(c=>c.key);
  const shouldMerge=!sortKey||!lineKeys.includes(sortKey);
  /* 2026-08-29.80 修复：无手动排序时的默认排序必须发生在分页之前——原逻辑在分页切片后排序只排当前页：
     每页 1000 时新单在最上（一页全装下），切 100 条/页后新单先被原始顺序切片到第 2 页，排序不生效。
     手动排序分支保持分页后原位（历史行为不变，不引入回归）。 */
  if(shouldMerge&&!manualSort){
    if(formKey==='order_frame') shown=[...shown].sort((a,b)=>b.order.id.localeCompare(a.order.id,'zh-CN',{numeric:true})); // 销售订单默认：单据编号降序（数字感知，.79）
    else if(formKey==='order_inv') shown=[...shown].sort((a,b)=>a.order.id.localeCompare(b.order.id,'zh-CN')); // 库存：id 升序（保持原行为）
  }
  /* 2026-08-25.66/.68：金蝶式分页（order_frame/order_inv）——整单不拆（groupKey=r.order.id）；页码越界自动回 1（排序/筛选后见 toggleSort/applyFilt 重置） */
  if(PAGED_FORMS[formKey]&&shown.length>0)shown=slicePaged(formKey,shown,pageSizeOf(formKey),r=>r.order.id).rows;
  if(shouldMerge&&manualSort) shown=[...shown].sort((a,b)=>a.order.id.localeCompare(b.order.id,'zh-CN')); // 手动排序后聚合保序（历史行为）
  const groupMap=new Map();
  shown.forEach((r,i)=>{if(!groupMap.has(r.order.id))groupMap.set(r.order.id,{start:i,count:0});groupMap.get(r.order.id).count++;});
  lastRowIds[formKey]=shown.map(r=>r.orderIdx);
  let html=bulkBar(formKey);
  html+=filterBar(formKey);
  /* 2026-08-25.8：订单表头/表体双表结构——表头独立表置于 sticky 容器随页面滚动固定，表体表承载 rowspan 整单合并；
     两表各带 colgroup，列宽由 syncHeadBody 从表头 th 实际宽度对齐 */
  const _colN=TBL_SCHEMAS[formKey].length+1;
  const _colg='<colgroup>'+Array(_colN).fill('<col>').join('')+'</colgroup>';
  html+='<div class="sticky-head"><div class="head-scroll"><table class="head-tbl">'+_colg+'<thead><tr><th class="sel-col"></th>'+TBL_SCHEMAS[formKey].map(c=>thCol(formKey,c)).join('')+'</tr></thead></table></div></div>';
  html+='<div class="table-wrap"><table class="body-tbl">'+_colg+'<tbody>';
  if(shown.length===0){html+=noMatchRow(formKey,TBL_SCHEMAS[formKey].length+1);}
  shown.forEach((r,i)=>{
    const o=r.order, it=r.item, oi=r.orderIdx;
    /* 2026-08-30.92：库存订单数量=最大库存量（stockMax 优先，历史行回退 orderQty）；交付进度/未交付/结余进度分母自动跟随 */
    const oq=num((formKey==='order_inv'&&it.stockMax!=null&&it.stockMax!=='')?it.stockMax:it.orderQty), dq=num(it.deliveredQty);
    const undel=oq-dq;
    const pct=oq>0?Math.round(dq/oq*100):0;
    /* 已计划未交付（2026-08-25.17 新口径，.33 行级）= Σ交付计划.planQty − Σ名下排产单入库累计，排除已取消（与 schema 计算列同口径） */
    const pu=puMap[o.id+'|L'+(r.__li!=null?r.__li:'-')]||puMap[o.id+'|'+(it.productId||'')];
    const plannedUndel=pu?Math.max(0,pu.plan-pu.done):0;
    /* 2026-08-25.60：结余=已交付+已计划未交付（仅库存订单），同款三角警示——低于最小库存→红、高于最大库存→黄 */
    const balance=num(dq)+plannedUndel;
    /* 2026-08-25.61：结余进度=结余/订单数量（仅库存订单，同进度列口径，可>100%） */
    const balPct=oq>0?Math.round(balance/oq*100):0;
    const today=todayStr();
    const overdue=o.status==='执行中'&&o.deadline&&fmtDate(o.deadline)<today;
    const statusCls=o.status==='执行中'?'tag-blue':o.status==='已完成'?'tag-green':o.status==='已暂停'?'tag-amber':'tag-gray';
    /* 2026-08-25.63：库存订单 4 档状态（已交付/结余 各自独立）——感叹号+进度条颜色同档位：red 红/amber 黄/green 绿无感叹号/gray 灰 */
    const lvD=invStockLevel(dq,it.stockMin,it.stockMax);
    const lvB=invStockLevel(balance,it.stockMin,it.stockMax);
    /* 2026-08-30.91：三角警示悬浮框=行一句话总结（.90 总结列改悬浮；已交付/结余警示标 hover 均显示完整总结句） */
    const sumTxt=(formKey==='order_inv')?invRowSummary(dq,balance,it.stockMin,it.stockMax,lvD,lvB):'';
    const _lvCls=function(lv){return lv==='red'?';background:var(--red)':lv==='amber'?';background:var(--amber)':lv==='green'?';background:var(--green)':lv==='gray'?';background:#9ca3af':'';};
    const pctBarCls=(formKey==='order_inv')?_lvCls(lvD):(pct<0?';background:var(--red)':'');   /* 销售订单进度条保持默认蓝（已交付恒非负） */
    const pctTxtCls=(formKey==='order_inv')?(lvD==='red'?';color:var(--red)':''):(pct<0?';color:var(--red)':'');
    const balBarCls=_lvCls(lvB);
    const balTxtCls=(lvB==='red'?';color:var(--red)':'');
    const grp=groupMap.get(r.order.id);
    const isFirst=grp.start===i;
    const rs=grp.count;
    const selChecked=selSet(formKey).has(String(oi))?'checked':'';
    const selCell=shouldMerge?(isFirst?'<td class="sel-col" rowspan="'+rs+'"><input type="checkbox" '+selChecked+' data-sel-id="'+oi+'" data-sel-form="'+formKey+'" onclick="event.stopPropagation();selRowClick(\''+formKey+'\','+oi+')"></td>':''):'<td class="sel-col"><input type="checkbox" '+selChecked+' data-sel-id="'+oi+'" data-sel-form="'+formKey+'" onclick="event.stopPropagation();selRowClick(\''+formKey+'\','+oi+')"></td>';
    let headCells='';
    const _noInvHead=(formKey!=='order_inv');   /* 2026-08-30.94：库存订单不渲染预计交货日期/合同号单据级列 */
    if(shouldMerge){
      if(isFirst){
        headCells=
          (_noInvHead?('<td data-key="deadline" rowspan="'+rs+'"'+(overdue?' style="color:var(--red);font-weight:600"':'')+'>'+fmtDate(o.deadline)+(overdue?' ⚠':'')+'</td>'):'')+
          '<td data-key="startDate" rowspan="'+rs+'">'+fmtDate(o.startDate)+'</td>'+
          '<td data-key="id" rowspan="'+rs+'" style="font-weight:600">'+esc(o.id)+'</td>'+
          '<td data-key="customer" rowspan="'+rs+'">'+esc(o.customer)+'</td>'+
          '<td data-key="status" rowspan="'+rs+'"><span class="tag '+statusCls+'">'+esc(o.status)+'</span></td>'+
          (_noInvHead?('<td data-key="contractNo" rowspan="'+rs+'">'+esc(o.contractNo||'')+'</td>'):'');
      }
    }else{
      headCells=
        (_noInvHead?('<td data-key="deadline"'+(overdue?' style="color:var(--red);font-weight:600"':'')+'>'+fmtDate(o.deadline)+(overdue?' ⚠':'')+'</td>'):'')+
        '<td data-key="startDate">'+fmtDate(o.startDate)+'</td>'+
        '<td data-key="id" style="font-weight:600">'+esc(o.id)+'</td>'+
        '<td data-key="customer">'+esc(o.customer)+'</td>'+
        '<td data-key="status"><span class="tag '+statusCls+'">'+esc(o.status)+'</span></td>'+
        (_noInvHead?('<td data-key="contractNo">'+esc(o.contractNo||'')+'</td>'):'');
    }
    html+='<tr onclick="selRowClick(\''+formKey+'\','+oi+')">'+selCell+headCells+
      '<td data-key="productId">'+esc(it.productId)+'</td>'+
      '<td data-key="productName">'+esc(it.productName||(it.productId&&prodMap[it.productId]?prodMap[it.productId].name:''))+'</td>'+
      '<td data-key="model">'+esc(prodMap[it.productId]?prodMap[it.productId].model:'')+'</td>'+
      '<td data-key="spec">'+esc(prodMap[it.productId]?prodMap[it.productId].spec:'')+'</td>'+
      '<td data-key="unit">'+esc(prodMap[it.productId]?prodMap[it.productId].unit:'')+'</td>'+
      '<td data-key="orderQty" style="font-variant-numeric:tabular-nums;text-align:right">'+money(oq)+'</td>'+
      (formKey!=='order_frame'?'<td data-key="stockMax" style="font-variant-numeric:tabular-nums;text-align:right">'+(it.stockMax!=null&&it.stockMax!==''?money(it.stockMax):'')+'</td>':'')+
      (formKey!=='order_frame'?'<td data-key="stockMin" style="font-variant-numeric:tabular-nums;text-align:right">'+(it.stockMin!=null&&it.stockMin!==''?money(it.stockMin):'')+'</td>':'')+
      '<td data-key="deliveredQty" style="font-variant-numeric:tabular-nums;text-align:right">'+(lvD==='red'?warnTriSvg('#ef4444',sumTxt):(lvD==='amber'?warnTriSvg('#f59e0b',sumTxt):(lvD==='gray'?warnTriSvg('#9ca3af',sumTxt):'')))+money(dq)+'</td>'+
      (formKey!=='order_inv'?'<td data-key="calledQty" style="font-variant-numeric:tabular-nums;text-align:right">'+(num(it.calledQty)>0?money(it.calledQty):'')+'</td>':'')+
      (formKey!=='order_inv'?'<td data-key="_undel" style="font-variant-numeric:tabular-nums;text-align:right">'+money(undel)+'</td>':'')+
      (formKey!=='order_frame'?'<td data-key="_plannedUndel" style="font-variant-numeric:tabular-nums;text-align:right">'+money(plannedUndel)+'</td>':'')+
      (formKey==='order_inv'?'<td data-key="_balance" style="font-variant-numeric:tabular-nums;text-align:right">'+(lvB==='red'?warnTriSvg('#ef4444',sumTxt):(lvB==='amber'?warnTriSvg('#f59e0b',sumTxt):(lvB==='gray'?warnTriSvg('#9ca3af',sumTxt):'')))+money(balance)+'</td>':'')+
      /* 2026-08-25.61：结余进度（进度条+百分比，同交付进度列样式）；.63 起颜色随 4 档状态（红/黄/绿/灰） */
      (formKey==='order_inv'?'<td data-key="_balPct" style="min-width:90px"><div style="display:flex;align-items:center;gap:4px"><div class="progress-wrap" style="flex:1;min-width:50px"><div class="progress-bar" style="width:'+Math.abs(balPct)+'%'+balBarCls+'"></div></div><span style="font-size:11px'+balTxtCls+'">'+balPct+'%</span></div></td>':'')+
      /* 2026-08-25.62：负值宽度按绝对值；.63 起库存订单进度条颜色随 4 档状态，销售订单保持默认蓝 */
      '<td data-key="_pct" style="min-width:90px"><div style="display:flex;align-items:center;gap:4px"><div class="progress-wrap" style="flex:1;min-width:50px"><div class="progress-bar" style="width:'+Math.abs(pct)+'%'+pctBarCls+'"></div></div><span style="font-size:11px'+pctTxtCls+'">'+pct+'%</span></div></td>'+
      '<td data-key="lineNotes">'+esc(it.lineNotes!=null?it.lineNotes:(it.notes||''))+'</td>'+
      '</tr>';
  });
  html+='</tbody></table></div>';
  return html;
}

function addOrderOfType(type){if(!ensureWrite('order'))return;pendingOrderType=type;orderModal(null,{status:'执行中',orderType:type,startDate:todayStr(),items:[]});}

/* 销售订单编号：XSDD-YYYYMMDD-XXXXX（销售订单大写-日期-5位序号，每日从 00001 刷新） */
/* 订单编号生成：销售订单 XSDD-YYYYMMDD-XXXXX，库存订单 KCDD-YYYYMMDD-XXXXX（前缀区分，防止两类单号冲突） */
function nextOrderNo(dateStr,type){
  const d=String(dateStr||todayStr()).replace(/-/g,'');
  const prefix=(type==='库存订单'?'KCDD-':'XSDD-')+d+'-';
  let max=0;
  (orders||[]).forEach(o=>{
    if(o.id&&typeof o.id==='string'&&o.id.indexOf(prefix)===0){
      const n=parseInt(o.id.slice(prefix.length),10);
      if(!isNaN(n)&&n>max)max=n;
    }
  });
  return prefix+String(max+1).padStart(5,'0');
}

/* 产品主数据：「生成订单」——选中产品生成库存订单（.87：跳转库存管理页签 inv 并打开新增弹窗，明细预填选中商品；原跳订单管理 order 为 .65 模块移动遗留错误） */
function bulkGenOrder(){
  const s=selSet('product');
  if(s.size===0){alert('请先在左侧勾选要生成订单的产品');return;}
  const items=[];
  Array.from(s).map(Number).sort(function(a,b){return a-b;}).forEach(function(i){
    const p=products[i];if(!p)return;
    items.push({productId:p.id,productName:p.name||'',spec:p.spec||'',model:p.model||'',orderQty:'',stockMax:'',stockMin:'',deliveredQty:'',lineNotes:''});
  });
  switchTab('inv');
  pendingOrderType='库存订单';
  orderModal(null,{
    id:nextOrderNo(todayStr(),'库存订单'),
    customer:'库存',
    status:'执行中',
    orderType:'库存订单',
    startDate:todayStr(),
    deadline:'',
    notes:'',
    items:items
  });
}

function orderModal(idx,prefill){
  const src=prefill!=null?prefill:(idx!=null?orders[idx]:null);
  const o=src?JSON.parse(JSON.stringify(src)):{status:'执行中',orderType:'销售订单',startDate:todayStr(),items:[]};
  // 新增订单：按订单类型自动预填单号（库存订单 KCDD- / 销售订单 XSDD-），用户可手动修改
  if(idx==null && !o.id){o.id=nextOrderNo(todayStr(),o.orderType);}
  /* 2026-08-25.3：审核状态状态机编辑限制——
     locked：已取消/已暂停订单仅「审核状态」可改（只能改回执行中），其余字段只读；
     statusLocked：已完成订单状态禁用（系统自动判定）。 */
  const locked=idx!=null&&(o.status==='已取消'||o.status==='已暂停');
  const statusLocked=idx!=null&&o.status==='已完成';
  /* 2026-08-30.92/.94：库存订单隐藏 head 控件（订单类型 .88/预计交货日期+合同号 .94）——保存侧 .93 空保护已就位 */
  const _invModal=(o.orderType==='库存订单');
  const headCols=fields.order.filter(f=>!isLineField(f));
  let body='<div class="form-row">';
  headCols.forEach((f,i)=>{
    /* 2026-08-30.88：订单类型隐藏——由页面上下文决定（订单管理=销售订单、库存管理=库存订单；编辑/复制保持原类型，.25 强制逻辑已就位），杜绝串类
       .94：库存订单同时隐藏预计交货日期/合同号（销售订单保留） */
    if(f.key==='orderType'||(_invModal&&(f.key==='deadline'||f.key==='contractNo')))return;
    if(i>0&&i%2===0)body+='</div><div class="form-row">';
    const val=o[f.key]!=null?o[f.key]:'';
    let ctrl;
    if(f.key==='status'){
      /* 状态机选项：执行中/新增→可改已取消/已暂停（不提供已完成，系统自动判定）；
         已取消/已暂停→仅可改回执行中；已完成→禁用（不可手动更改） */
      const stOpts=statusLocked?['已完成']:((o.status==='已取消'||o.status==='已暂停')?[o.status,'执行中']:['执行中','已取消','已暂停']);
      ctrl='<select id="of_status"'+(statusLocked?' disabled':'')+'>'+stOpts.map(x=>'<option '+(x===o.status?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>';
    }else{
      ctrl=genControl(f,'of_',val,'order',locked);
    }
    body+='<div><label>'+esc(f.label)+(f.required?' *':'')+'</label>'+ctrl+'</div>';
  });
  body+='</div>';
  body+='<div style="display:flex;align-items:center;gap:10px;margin:18px 0 8px"><b style="font-size:14px">订单明细</b><span style="font-size:12px;color:var(--muted)">每行一种产品，一单可含多种开关'+(o.orderType==='库存订单'?'；数量=最大库存量（自动）':'')+'</span>'+(locked?'':'<button class="btn btn-sm" style="margin-left:auto" onclick="batchPickProducts()">批量选择产品</button><button class="btn btn-sm btn-primary" onclick="addOrderItemRow()">+ 添加产品行</button>')+'</div>';
  /* 2026-08-30.92：库存订单弹窗隐藏「数量」输入列（数量=最大库存量）——全局标志供添加行/批量选择复用（_invModal 定义见 headCols 前） */
  window.__orderModalInv=_invModal;
  body+='<div class="table-wrap"><table id="orderItemsTbl"><thead><tr>'+
    /* .92/.94：库存隐藏数量+已调用；.96：销售隐藏最大/最小库存量（库存订单保留——数量=最大库存量需填） */
    orderLineFields().filter(f=>!(_invModal&&(f.key==='orderQty'||f.key==='calledQty'))&&!(!_invModal&&(f.key==='stockMax'||f.key==='stockMin'))).map(f=>'<th>'+esc(f.label)+(f.required?' *':'')+'</th>').join('')+
    '<th style="width:56px">操作</th></tr></thead><tbody>';
  orderItems(o).forEach(it=>body+=orderItemRow(it,locked,_invModal));
  body+='</tbody></table></div>';
  showModal(idx!=null?'编辑订单':'新增订单',body,
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveOrder('+(idx!=null?idx:-1)+')">保存</button>'
  );
}

/* 明细行渲染（按字段设置中的行级字段动态生成；.92：isInv=库存订单，隐藏「数量」输入列，数量=最大库存量） */
function orderLineCols(){return orderLineFields();}
function orderItemRow(it,locked,isInv){
  let h='<tr>';
  const refKeys=refKeysOf('order');
  const _inv=(isInv===true||window.__orderModalInv===true);   /* .92：库存订单隐藏数量列（含添加行/批量选择的新行） */
  orderLineCols().forEach(f=>{
    if(_inv&&(f.key==='orderQty'||f.key==='calledQty'))return;   /* .92：库存订单无独立数量（=最大库存量）；.94：已调用=销售订单字段，库存隐藏 */
    if(!_inv&&(f.key==='stockMax'||f.key==='stockMin'))return;   /* .96：销售订单隐藏最大/最小库存量（库存核心字段，库存保留） */
    const v=it[f.key]!=null?it[f.key]:'';
    if(f.key==='productId'){
      h+='<td style="display:flex;gap:4px;align-items:center"><input type="text" class="oi_field" data-key="productId" value="'+esc(v)+'" placeholder="产品编码" style="flex:1;min-width:80px"'+(locked?' readonly':'')+' onchange="orderItemIdChange(this)" onblur="orderItemIdChange(this)">'+(locked?'':'<button type="button" class="btn btn-sm" onclick="openProductPicker(this)" title="从产品库选择">选</button>')+'</td>';
    }else if(f.key==='spec'||f.key==='model'||f.key==='calledQty'){
      /* 由系统联动写入（规格/型号←产品编码；已调用←调用库存操作），不可编辑 */
      h+='<td><input type="'+(f.key==='calledQty'?'number':'text')+'" class="oi_field" data-key="'+f.key+'" value="'+esc(v)+'" readonly style="width:100%;background:#f6f8fa;color:var(--muted)"></td>';
    }else if(f.type==='ref'){
      h+='<td><input type="text" class="oi_field ref-field" data-key="'+f.key+'" data-ref-form="'+esc(f.refForm||'')+'" data-ref-match="'+esc(f.refMatch||'')+'" data-ref-field="'+esc(f.refField||'')+'" data-ref-key="'+esc(f.refKey||'')+'" value="'+esc(v)+'" readonly style="width:100%;background:#f6f8fa;color:var(--muted)"></td>';
    }else{
      const tp=f.type==='number'?'number':(f.type==='date'?'date':'text');
      h+='<td><input type="'+tp+'" class="oi_field" data-key="'+f.key+'" value="'+esc(f.type==='date'?fmtDate(v):v)+'"'+(locked?' readonly':'')+' style="width:100%"></td>';
    }
  });
  h+='<td style="text-align:center">'+(locked?'':'<button class="btn btn-sm btn-danger" onclick="removeOrderItemRow(this)" title="删除此行">✕</button>')+'</td></tr>';
  return h;
}
function addOrderItemRow(){
  const tb=document.querySelector('#orderItemsTbl tbody');
  if(tb)tb.insertAdjacentHTML('beforeend',orderItemRow({}));
}
function removeOrderItemRow(btn){
  const tb=btn.closest('tbody');
  btn.closest('tr').remove();
  if(tb&&!tb.rows.length)addOrderItemRow();
}
/* 产品编码改变/失焦：根据产品编码回填产品名称/规格/型号 */
function orderItemIdChange(inp){
  const tr=inp.closest('tr');
  const v=(inp.value||'').trim();
  const p=products.find(x=>x.id===v);
  fillOrderItemByProduct(tr,p);
}
function fillOrderItemByProduct(tr,p){
  const nameInp=tr.querySelector('[data-key="productName"]');
  const specInp=tr.querySelector('[data-key="spec"]');
  const modelInp=tr.querySelector('[data-key="model"]');
  if(p){
    if(nameInp && !nameInp.value) nameInp.value=p.name||'';
    if(specInp) specInp.value=p.spec||'';
    if(modelInp) modelInp.value=p.model||'';
  }else{
    if(specInp) specInp.value='';
    if(modelInp) modelInp.value='';
  }
}
/* 行级：打开产品库选择（复选多选；与表头「批量选择产品」行为一致：当前行 productId 预选，未存在的追加为新明细行） */
/* 移除订单明细中的空行（产品编码为空即删，兼容数量为 0 的旧空行）。兜底补空行由调用方在追加完成后执行，避免误补 */
function removeEmptyOrderItems(){
  const tb=document.querySelector('#orderItemsTbl tbody');
  if(!tb)return;
  Array.from(tb.rows).forEach(function(tr){
    const idInp=tr.querySelector('[data-key="productId"]');
    const idV=idInp?(idInp.value||'').trim():'';
    if(!idV)tr.remove();
  });
}
/* 兜底：明细表无任何行时补一行空行（供手动录入） */
function ensureOrderItemRow(){
  const tb=document.querySelector('#orderItemsTbl tbody');
  if(tb&&!tb.rows.length)tb.insertAdjacentHTML('beforeend',orderItemRow({}));
}
function openProductPicker(btn){
  productPickerModal({
    mode:'multi',
    preselected:[],
    onConfirm:function(ids){
      removeEmptyOrderItems();
      ids.forEach(function(pid){
        const p=products.find(function(x){return x.id===pid;});
        if(!p)return;
        const it={productId:p.id,productName:p.name||'',spec:p.spec||'',model:p.model||'',orderQty:'',stockMax:'',stockMin:'',deliveredQty:'',lineNotes:''};
        document.querySelector('#orderItemsTbl tbody').insertAdjacentHTML('beforeend',orderItemRow(it));
      });
      ensureOrderItemRow();
    }
  });
}

/* 产品复选/单选弹窗：列头筛选（参考产品主数据表格样式）+ 行内 checkbox/radio（不响应行点击，避免双翻转） */

  {key:'model',label:'型号',type:'text',get:function(p){return p.model||'';}},
  {key:'unit',label:'单位',type:'text',get:function(p){return p.unit||'';}},
  {key:'dailyCap',label:'日产能',type:'number',get:function(p){return p.dailyCap==null?'':p.dailyCap;}},
  {key:'stock',label:'库存/已交付数量',type:'number',get:function(p){return p.stock==null?'':p.stock;}},
  {key:'status',label:'状态',type:'select',options:['启用','停用'],get:function(p){return p.status||'';}}
];
function productPickerModal(opts){
  window.__ppOpts=opts;

  /* 2026-08-25.51：数据源/列定义参数化——调用/退回库存弹窗复用本选择器（rows=cands、schema=库存候选列） */
  window.__ppRows=opts.rows||products;
  window.__ppSchema=opts.schema||PP_SCHEMA;
  /* 收集各列唯一值，供筛选弹窗用（2026-08-25.51 补丁：兼容无 get 的列，取值回退 p[key]） */
  window.__ppUniques={};
  window.__ppSchema.forEach(function(col){
    window.__ppUniques[col.key]=[...new Set(window.__ppRows.map(function(p){return String(col.get?col.get(p):(p[col.key]!=null?p[col.key]:''));}))].filter(function(v){return v!=='';}).sort();
  });
  const mode=opts.mode||'multi';

  /* 二级浮层：不替换底层弹窗 DOM，保证「新增订单」表头输入与明细保留 */
  const ov=document.createElement('div');
  ov.className='modal-bg';
  ov.id='ppOverlay';
  ov.style.zIndex='250';
  ov.style.background='rgba(0,0,0,.35)';
  ov.innerHTML='<div class="modal">'
    +'<div class="modal-head"><h3>'+(opts.title||(mode==='single'?'选择产品':'批量选择产品（可多选）'))+'</h3><div class="close-x" onclick="ppCancel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M18 6L6 18M6 6l12 12"/></svg></div></div>'
    +'<div class="modal-body">'+body+'</div>'
    +'<div class="modal-foot"><button class="btn" onclick="ppCancel()">取消</button><button class="btn btn-primary" onclick="ppConfirm()">确定</button></div>'
    +'</div>';
  document.body.appendChild(ov);
  /* 2026-08-25.53：选择器浮层内滚轮不穿透主界面（弹窗内列表滚动正常，仅阻断冒泡） */
  ov.addEventListener('wheel',function(e){e.stopPropagation();},{passive:false});
  requestAnimationFrame(function(){ov.classList.add('show');});
  ppRenderRows();
}
/* 列头：列名 + 漏斗筛选图标（与 thCol 一致风格） */
function ppTh(col){
  const f=window.__ppFilterState[col.key];
  const act=f&&((f.vals&&f.vals.length>0)||(f.val!==''&&f.val!=null));
  return '<th style="white-space:nowrap">'+esc(col.label)+
    '<span class="filt-ico'+(act?' on':'')+'" style="margin-left:4px" onclick="event.stopPropagation();ppOpenFilter(this,\''+col.key+'\')" title="筛选">'+FILT_SVG+'</span>'+
    '</th>';
}
/* 筛选弹窗（参考产品主数据 openFilter：复选 ≤15项 / 关键字 + 模式 / 数值 + 模式） */
function ppOpenFilter(btn,key){
  closeFiltPop();
  const col=(window.__ppSchema||PP_SCHEMA).find(function(c){return c.key===key;});if(!col)return;
  const uniques=window.__ppUniques[key]||[];
  const f=window.__ppFilterState[key]||{mode:'contains',val:'',vals:[]};
  let inner='';
  const useChecks=col.type!=='number'&&(col.select||uniques.length<=15);
  if(useChecks){
    const sel=f.vals||[];
    /* 2026-08-25.58：选择器弹窗筛选同口径——options 全部选项优先，uniques 兜底 */
    const opts=(col.options&&col.options.length)?col.options:uniques;
    inner+='<div class="fp-opts">'+opts.map(function(v){return '<label class="fp-opt"><input type="checkbox" value="'+esc(v)+'" '+(sel.indexOf(v)>=0?'checked':'')+'>'+esc(v)+'</label>';}).join('')+'</div>'+
      '<div style="display:flex;gap:6px"><button class="btn btn-sm" onclick="ppFiltCheckAll(this,true)">全选</button><button class="btn btn-sm" onclick="ppFiltCheckAll(this,false)">全不选</button></div>';
  }else if(col.type==='number'){
    inner+='<select id="fp_mode">'+[['gte','大于等于'],['lte','小于等于'],['eq','等于'],['neq','不等于']].map(function(x){return '<option value="'+x[0]+'" '+(f.mode===x[0]?'selected':'')+'>'+x[1]+'</option>';}).join('')+'</select>'+
      '<input type="number" id="fp_val" value="'+(f.val!=null?esc(f.val):'')+'" placeholder="输入数值">';
  }else{
    inner+='<select id="fp_mode">'+[['contains','包含'],['eq','等于'],['neq','不等于']].map(function(x){return '<option value="'+x[0]+'" '+(f.mode===x[0]?'selected':'')+'>'+x[1]+'</option>';}).join('')+'</select>'+
      '<input type="text" id="fp_val" value="'+esc(f.val||'')+'" placeholder="输入关键字">';
  }
  const pop=document.createElement('div');
  pop.className='filt-pop';
  pop.innerHTML='<div class="fp-title">筛选：'+esc(col.label)+'</div>'+inner+
    '<div class="fp-btns"><button class="btn btn-sm" onclick="closeFiltPop()">取消</button><button class="btn btn-sm" onclick="ppClearFilt(\''+key+'\')">清除</button><button class="btn btn-sm btn-primary" onclick="ppApplyFilt(\''+key+'\','+useChecks+')">确定</button></div>';
  document.body.appendChild(pop);
  pop.addEventListener('click',function(e){e.stopPropagation();});
  const r=btn.getBoundingClientRect();
  let left=r.left;if(left+240>window.innerWidth-8)left=window.innerWidth-248;if(left<8)left=8;
  pop.style.left=left+'px';
  pop.style.top=(r.bottom+6+window.scrollY)+'px';
  filtPop=pop;
  const inp=pop.querySelector('#fp_val');if(inp)inp.focus();
}
function ppFiltCheckAll(btn,on){btn.closest('.filt-pop').querySelectorAll('input[type=checkbox]').forEach(function(c){c.checked=on;});}
function ppClearFilt(key){delete window.__ppFilterState[key];closeFiltPop();ppRenderRows();ppUpdateHeader();}
function ppApplyFilt(key,useChecks){
  const f={mode:'contains',val:'',vals:[]};
  if(useChecks){
    const vals=[];filtPop.querySelectorAll('input[type=checkbox]:checked').forEach(function(c){vals.push(c.value);});
    f.vals=vals;f.mode='in';
  }else{
    f.mode=document.getElementById('fp_mode').value;
    f.val=document.getElementById('fp_val').value;
  }
  window.__ppFilterState[key]=f;
  closeFiltPop();ppRenderRows();ppUpdateHeader();
}
function ppUpdateHeader(){
  /* 刷新表头筛选图标状态（高亮有筛选的列） */
  PP_SCHEMA.forEach(function(col){
    const f=window.__ppFilterState[col.key];
    const act=f&&((f.vals&&f.vals.length>0)||(f.val!==''&&f.val!=null));
    const th=document.querySelector('#pp_table thead th .filt-ico[onclick*="'+col.key+'"]');
    if(th)th.className='filt-ico'+(act?' on':'');
  });
}
function ppRenderRows(){
  const tbody=document.getElementById('pp_tbody');if(!tbody)return;
  const fs=window.__ppFilterState;
  const rows=window.__ppRows||[];
  const schema=window.__ppSchema||PP_SCHEMA;
  const visible=rows.filter(function(p){
    for(const k in fs){
      const f=fs[k];if(!f)continue;
      const col=schema.find(function(c){return c.key===k;});if(!col)continue;
      const v=String(col.get?col.get(p):(p[col.key]!=null?p[col.key]:''));
      if(f.mode==='in' && f.vals && f.vals.length){
        if(f.vals.indexOf(v)<0)return false;
      }else if(f.val!=='' && f.val!=null){
        const fv=String(f.val);
        if(f.mode==='contains' && v.toLowerCase().indexOf(fv.toLowerCase())<0)return false;
        if(f.mode==='eq' && v!==fv)return false;
        if(f.mode==='neq' && v===fv)return false;
        if(f.mode==='gte' && num(v)<num(fv))return false;
        if(f.mode==='lte' && num(v)>num(fv))return false;
      }
    }
    return true;
  });
  const opts=window.__ppOpts||{};
  const mode=opts.mode||'multi';
  const preSet=new Set(opts.preselected||[]);
  /* 2026-08-25.51：行标识 uid||id——库存候选用 invOrderId#invLineIdx 唯一键 */
  const uidOf=function(p){return p.uid!=null?p.uid:p.id;};
  if(!visible.length){
    tbody.innerHTML='<tr><td colspan="'+(schema.length+1)+'" style="text-align:center;padding:18px;color:var(--muted)">无匹配记录</td></tr>';
    return;
  }
  let html='';
  visible.forEach(function(p){
    const uid=uidOf(p);
    const checked=preSet.has(uid);
    const inputCtrl=mode==='single'
      ?'<input type="radio" class="pp_radio" name="pp_single" value="'+esc(uid)+'" '+(checked?'checked':'')+'>'
      :'<input type="checkbox" class="pp_chk" data-id="'+esc(uid)+'" '+(checked?'checked':'')+'>';
    html+='<tr data-id="'+esc(uid)+'"'+(opts.clickSelect?' style="cursor:pointer" onclick="ppPickRow(this)"':'')+'><td>'+inputCtrl+'</td>';
    schema.forEach(function(col){
      const v=col.get?col.get(p):(p[col.key]!=null?p[col.key]:'');
      html+='<td>'+esc(v)+'</td>';
    });
    html+='</tr>';
  });
  tbody.innerHTML=html;
}

function saveOrder(idx){
  const cols=fields.order;
  const o={};
  cols.forEach(f=>{
    if(isLineField(f))return;
    const el=document.getElementById('of_'+f.key);
    if(!el)return;   /* .93 修复：隐藏控件（订单类型 .88 隐藏后无 of_orderType）跳过——值由下方兜底补回，避免 null.value 崩溃 */
    o[f.key]=f.type==='number'?num(el.value):el.value;
  });
  /* .93 修复：orderType 控件隐藏后未收集——从上下文补回（编辑=原单、新增=pendingOrderType、兜底销售），保证 .25 校验链完整 */
  if(!o.orderType){
    if(idx>=0&&orders[idx]&&orders[idx].orderType)o.orderType=orders[idx].orderType;
    else if(pendingOrderType)o.orderType=pendingOrderType;
    else o.orderType='销售订单';
  }
  if(!o.id){alert('请填写订单编号');return;}
  if(!o.customer){alert('请填写客户名称');return;}
  if(o.orderType==='销售订单'&&(!o.contractNo||!String(o.contractNo).trim())){alert('销售订单请填写合同号');return;}
  /* 2026-08-25.3：审核状态状态机校验（弹窗选项已限制，此处兜底防篡改）：
     已完成不可手动改；已取消/已暂停仅可改回执行中；执行中不可手动设已完成（由系统自动判定） */
  if(idx>=0){
    const oldStatus=orders[idx]&&orders[idx].status;
    const newStatus=o.status;
    if(oldStatus==='已完成'&&newStatus!=='已完成'){alert('订单已「已完成」，状态由系统自动判定（全部交付完成），不可手动更改');return;}
    if((oldStatus==='已取消'||oldStatus==='已暂停')&&newStatus!=='执行中'&&newStatus!==oldStatus){alert('订单已「'+oldStatus+'」，仅可改回「执行中」');return;}
    if(oldStatus==='执行中'&&newStatus==='已完成'){alert('「已完成」由系统自动判定（整单未交付数量为 0），不可手动设置');return;}
  }
  const items=[];
  /* 2026-08-30.92：库存订单数量=最大库存量（校验/过滤以 stockMax 为准） */
  const _oqOf=function(it){return num((o.orderType==='库存订单'&&it.stockMax!=null&&it.stockMax!=='')?it.stockMax:it.orderQty);};
  document.querySelectorAll('#orderItemsTbl tbody tr').forEach(tr=>{
    const it={};
    tr.querySelectorAll('.oi_field').forEach(el=>{
      const f=cols.find(c=>c.key===el.dataset.key);
      it[el.dataset.key]=(f&&f.type==='number')?num(el.value):(el.value||'');
    });
    if(it.productId||_oqOf(it)>0)items.push(it);
  });
  if(items.length===0){alert('请至少填写一行产品明细（选择产品并填写'+(o.orderType==='库存订单'?'最大库存量':'订单数量')+'）');return;}
  const bad=items.find(it=>!it.productId||_oqOf(it)<=0);
  if(bad){alert('存在"未选产品或'+(o.orderType==='库存订单'?'最大库存量':'数量')+'为0"的明细行，请补全或删除该行');return;}
  // 引用字段重算（基于关联键实时取值，确保存储正确）
  orderHeadFields().forEach(f=>{ if(f.type==='ref'){ o[f.key]=lookupRef(f.refForm,f.refMatch,o[f.refKey],f.refField); } });
  orderLineFields().forEach(f=>{ if(f.type==='ref'){ items.forEach(it=>{ it[f.key]=lookupRef(f.refForm,f.refMatch,it[f.refKey],f.refField); }); } });
  o.items=items;
  // 新增订单时，强制使用打开弹窗时记录的意图分类，避免串到其它分类
  if(idx<0&&pendingOrderType){o.orderType=pendingOrderType;}
  /* orderType 兜底：若字段配置缺失（被字段设置删除）导致收集不到，
     编辑时保留原订单类型，避免「库存订单」被默认归为「销售订单」 */
  if(!o.orderType){
    if(idx>=0&&orders[idx]&&orders[idx].orderType)o.orderType=orders[idx].orderType;
    else o.orderType='销售订单';
  }
  pendingOrderType=null;
  if(idx>=0){
    const oldO=orders[idx];
    // 保留字段配置未覆盖的扩展字段（如金蝶导入标记 src/srcFile），编辑时不得丢失
    ['src','srcFile'].forEach(function(k){if(oldO&&oldO[k]!==undefined&&o[k]===undefined)o[k]=oldO[k];});
    orders[idx]=o;
    const rl=o.id+'('+esc(o.customer)+')';
    logFieldDiffs('订单管理',orderHeadFields(),oldO,o,rl);
    logOrderLineDiffs('订单管理',oldO.items,o.items,rl);
  }else{
    if(orders.find(x=>x.id===o.id)){alert('订单编号已存在');return;}
    orders.push(o);
    logOp('新增','订单管理','新增订单「'+o.id+'」('+esc(o.customer)+')，'+items.length+' 行明细');
  }
  save('orders',orders);
  syncOrderAutoStatus();   // 2026-08-25.3：按未交付合计自动判定状态（已完成不可手动设，此处兜底校正）
  if(o.orderType==='库存订单')syncStockFromInvOrders();   // 库存订单已交付数量 → 产品库存
  closeModal();
  renderContent();
  /* 编辑场景：若该订单被当前筛选/排序条件隐藏（如改了审核状态/日期/数量），
     顶部浮条提示数据已保存，并提供一键清除筛选/排序恢复显示 */
  if(idx>=0){
    const fk=orderTypeOf(o)==='库存订单'?'order_inv':'order_frame';
    /* 2026-08-25.5：订单被筛选/排序隐藏（如改「已暂停」后不在「执行中」筛选内）→ 自动取消其勾选，防幽灵选择 */
    if(!orderRowVisibleInDom(o.id))clearHiddenOrderSel(idx);
    maybeWarnHiddenOrder(fk,o.id);
  }
}

function maybeWarnHiddenOrder(formKey,id){

    '<button class="btn btn-sm" onclick="clearOrderFilters(\''+formKey+'\')">清除筛选/排序</button>');

/* 2026-08-25.21：订单是否已下推交付计划（存在关联交付计划即视为已下推，禁止删除；对应交付计划删除后自动恢复可删） */
function hasDeliveryOf(orderId){return deliveries.some(d=>d.orderId===orderId);}
function delOrder(idx){
  /* 2026-08-25.21：已下推交付计划的订单禁止删除（删除订单会破坏交付计划/排产关联链路） */
  if(hasDeliveryOf(orders[idx].id)){alert('订单「'+orders[idx].id+'」已下推交付计划，不能删除；如需删除请先删除对应的交付计划');return;}
  if(!confirm('确认删除订单「'+orders[idx].id+'」？'))return;
  const del=orders[idx];
  logOp('删除','订单管理','删除订单「'+orders[idx].id+'」('+orders[idx].customer+')');
  orders.splice(idx,1);
  save('orders',orders);
  if(del&&orderTypeOf(del)==='库存订单')syncStockFromInvOrders();   // 删除库存订单后重算产品库存
  renderContent();
}

/* ================================================================
   调拨：调用库存 / 退回库存 / 冲销（写入调拨台账 transfers）
   调用库存：库存订单已交付数量↓、销售订单已交付数量↑（库存随之回落）
   退回库存：反向
   冲销：生成一条反向补偿记录，不删原记录
================================================================ */
let __csCands=[],__csLines=[],__csMode='call',__csOrder=null;
/* 2026-08-25.51：打开库存订单选择弹窗（单选，复用 productPickerModal 参数化版，列表可筛选） */
function csPickInv(li){
  const schema=[
    {key:'invOrderId',label:'库存订单',type:'text'},
    {key:'productId',label:'编码',type:'text'},
    {key:'productName',label:'名称',type:'text'},
    {key:'model',label:'型号',type:'text'},
    {key:'spec',label:'规格',type:'text'},
    {key:'available',label:'可用量',type:'number'}
  ];
  productPickerModal({
    mode:'single', title:'选择库存订单', clickSelect:true,   /* 2026-08-29.84：点击行直接选中（立即确认回填） */
    rows:__csCands, schema:schema,
    onConfirm:function(ids){
      const c=ids&&ids.length?__csCands.find(function(x){return x.uid===ids[0];}):null;
      csSetInv(li,c||null);
    }
  });
}
/* 回填选择框：显示 库存订单号 · 编码 名称 [型号 / 规格] 可用 N */
function csSetInv(li,c){
  const box=document.querySelector('.cs-inv-box[data-li="'+li+'"]');
  if(!box)return;
  box.dataset.ci=c?String(__csCands.indexOf(c)):'';
  box.innerHTML=c
    ?('<b>'+esc(c.invOrderId)+'</b> · '+esc(c.productId||'')+(c.productName?' '+esc(c.productName):'')+((c.model||c.spec)?' ['+esc([c.model,c.spec].filter(Boolean).join(' / '))+']':'')+' <span style="color:var(--muted)">可用'+c.available+'</span>')
    :'<span style="color:var(--muted)">'+(__csMode==='call'?'（不调用）':'（不退回）')+'</span>';
  csWarn(li);
}
function csClearInv(li){csSetInv(li,null);}
function csAttach(){
  document.querySelectorAll('.cs-inv-box').forEach(function(box){csWarn(Number(box.dataset.li));});
}
function csWarn(li){
  const box=document.querySelector('.cs-inv-box[data-li="'+li+'"]');
  const warn=document.querySelector('.cs-warn[data-li="'+li+'"]');
  const qinp=document.querySelector('.cs-qty[data-li="'+li+'"]');
  if(!box)return;
  const ci=box.dataset.ci==='' ? -1 : Number(box.dataset.ci);
  if(ci<0){if(warn)warn.textContent='';return;}
  const c=__csCands[ci];
  const line=__csLines.find(function(l){return l.i===li;});
  if(!c||!line)return;
  if(c.productId!==line.productId){if(warn)warn.textContent='⚠ 跨料号替代：将用【'+esc(c.productId)+'】库存履行【'+esc(line.productId)+'】';}
  else if(warn)warn.textContent='';
  if(qinp){
    /* 2026-08-25.20：调用数量上限=销售未交付（放开库存可用量，可超调=欠货）；退回上限=销售已交付 */
    const max=__csMode==='call'?(line.orderQty-line.deliveredQty):line.deliveredQty;
    qinp.max=max;
  }
}
/* 自动填充：将每行调用/退回数量填为该行所选库存订单的可用最大值（按已分配量扣减，避免超额）。未选择库存订单的行填 0。 */
function csAutoFill(){
  if(!__csLines||!__csCands)return;
  const used={};
  document.querySelectorAll('.cs-qty').forEach(function(inp){
    const li=Number(inp.dataset.li);
    const box=document.querySelector('.cs-inv-box[data-li="'+li+'"]');
    if(!box||box.dataset.ci===''){inp.value=0;return;}
    const ci=Number(box.dataset.ci);
    const c=__csCands[ci];if(!c){inp.value=0;return;}
    const line=__csLines.find(function(l){return l.i===li;});if(!line){inp.value=0;return;}
    const cap=__csMode==='call'?(line.orderQty-line.deliveredQty):line.deliveredQty;
    const curAvail=c.available-(used[ci]||0);
    const q=Math.max(0,Math.min(curAvail,cap));
    used[ci]=(used[ci]||0)+q;
    inp.value=q;
  });
  document.querySelectorAll('.cs-qty').forEach(function(inp){csWarn(Number(inp.dataset.li));});
}

function doCallStock(o){
  const used={};const invUpdates=[];const salesUpdates=[];let any=false;
  document.querySelectorAll('.cs-qty').forEach(function(inp){
    const li=Number(inp.dataset.li);

    if(ci<0){alert('第'+(li+1)+'行未选择库存订单');return;}
    const c=__csCands[ci];
    const line=__csLines.find(function(l){return l.i===li;});
    const undel=line.orderQty-line.deliveredQty;
    /* 2026-08-25.20：放开「不超过库存可用量」校验（可超调=库存订单记欠货），仅校验不超过销售未交付 */
    if(q>undel){alert('调用数量 '+q+' 超过销售未交付 '+undel);return;}
    used[ci]=(used[ci]||0)+q;
    invUpdates.push({invOrderId:c.invOrderId,invLineIdx:c.invLineIdx,qty:q});
    salesUpdates.push({lineIdx:li,qty:q});
    any=true;
  });
  if(!any){alert('未填写任何调用数量');return;}
  applyStockMove(o,salesUpdates,invUpdates,'call');
  closeModal();
}

function doReturnStock(o){

    if(ci<0){alert('第'+(li+1)+'行未选择库存订单');return;}
    const line=__csLines.find(function(l){return l.i===li;});
    if(q>line.deliveredQty){alert('退回数量 '+q+' 超过销售已交付 '+line.deliveredQty);return;}

    invUpdates.push({invOrderId:c.invOrderId,invLineIdx:c.invLineIdx,qty:q});

function applyStockMove(salesOrder,salesUpdates,invUpdates,type){
  invUpdates.forEach(function(u){
    const inv=orders.find(function(x){return x.id===u.invOrderId;});
    if(!inv)return;
    const it=(inv.items||[])[u.invLineIdx];
    if(!it)return;
    const delta=type==='call'?-u.qty:u.qty;
    /* 2026-08-25.20：库存订单已交付允许负数（调用超量=欠货，如 30-50=-20）；退回使负值向 0 恢复 */
    it.deliveredQty=num(it.deliveredQty)+delta;
  });
  salesUpdates.forEach(function(u){
    const it=(salesOrder.items||[])[u.lineIdx];
    if(!it)return;
    const delta=type==='call'?u.qty:-u.qty;
    it.deliveredQty=Math.max(0,num(it.deliveredQty)+delta);   /* 销售订单已交付保持非负（发货量不为负） */
    /* 2026-08-25.35：已调用=调用库存累计（调用 +、退回 −，下限 0） */
    it.calledQty=Math.max(0,num(it.calledQty)+delta);
  });
  save('orders',orders);
  syncStockFromInvOrders();
  syncOrderAutoStatus();   // 2026-08-25.3：调拨后按未交付合计自动判定状态（全部交付→已完成 / 未交付>0→执行中）
  const ts=new Date().toLocaleString('zh-CN',{hour12:false});
  const user=(currentUser&&currentUser.name)||(currentUser&&currentUser.username)||'未知';
  salesUpdates.forEach(function(su,idx){
    const iu=invUpdates[idx];
    const inv=orders.find(function(x){return x.id===iu.invOrderId;});
    const invIt=(inv.items||[])[iu.invLineIdx];
    const salesIt=(salesOrder.items||[])[su.lineIdx];
    transfers.unshift({
      id:'TR'+Date.now()+'-'+idx, type:type,
      salesOrderId:salesOrder.id, salesLineIdx:su.lineIdx,
      invOrderId:iu.invOrderId, invLineIdx:iu.invLineIdx,
      productId:salesIt?salesIt.productId:null, invProductId:invIt?invIt.productId:null,
      qty:su.qty, ts:ts, user:user, reversed:false, reverseOf:null,
      /* 2026-08-25.49：台账快照 客户/合同/商品名称/规格/型号（历史记录不随订单后续编辑变化；存量单渲染反查兜底） */
      customer:salesOrder.customer||'', contractNo:salesOrder.contractNo||'',
      productName:salesIt?(salesIt.productName||''):'',
      spec:salesIt?(salesIt.spec||''):'', model:salesIt?(salesIt.model||''):''
    });
  });
  DB.set('transfers',transfers,true).then(function(ok){
    if(ok===false)alert('调拨台账保存失败：订单库存变更已生效，但台账记录未保存，请刷新后核对调拨台账。');
  });
  logOp(type==='call'?'调用库存':'退回库存','订单管理','销售订单 '+salesOrder.id+(type==='call'?' 调用库存':' 退回库存'));
  renderContent();
  /* 2026-08-25.5：状态自动变化后（如全部交付→已完成）若订单被筛选隐藏，清理幽灵勾选（此时 DOM 已按新状态渲染） */
  const _sid=orders.findIndex(function(x){return x.id===salesOrder.id;});
  if(_sid>=0&&!orderRowVisibleInDom(salesOrder.id))clearHiddenOrderSel(_sid);
  invUpdates.forEach(function(u){
    const _ix=orders.findIndex(function(x){return x.id===u.invOrderId;});
    if(_ix>=0&&!orderRowVisibleInDom(orders[_ix].id))clearHiddenOrderSel(_ix);
  });
}
function reverseTransfer(id){
  if(!canWriteKey('transfers')){alert('当前账号无调拨台账编辑权限');return;}
  const t=transfers.find(function(x){return x.id===id;});
  if(!t){alert('未找到记录');return;}
  if(t.reversed){alert('该记录已冲销');return;}
  if(!confirm('确认冲销该调拨记录？将生成一条反向记录。'))return;
  const sales=orders.find(function(x){return x.id===t.salesOrderId;});
  const inv=orders.find(function(x){return x.id===t.invOrderId;});
  if(!sales||!inv){alert('关联订单已不存在，无法冲销');return;}
  const salesIt=(sales.items||[])[t.salesLineIdx];
  const invIt=(inv.items||[])[t.invLineIdx];
  if(!salesIt||!invIt){alert('关联明细已不存在，无法冲销');return;}
  const revType=t.type==='call'?'return':'call';
  /* 2026-08-25.20：库存订单已交付允许负数（冲销时负欠货向 0 恢复）；销售订单保持非负 */
  invIt.deliveredQty=num(invIt.deliveredQty)+(t.type==='call'?t.qty:-t.qty);
  salesIt.deliveredQty=Math.max(0,num(salesIt.deliveredQty)+(t.type==='call'?-t.qty:+t.qty));
  /* 2026-08-25.35：已调用同步冲销（冲销 call → 减、冲销 return → 加，下限 0） */
  salesIt.calledQty=Math.max(0,num(salesIt.calledQty)+(t.type==='call'?-t.qty:+t.qty));
  save('orders',orders);
  syncStockFromInvOrders();
  syncOrderAutoStatus();   // 2026-08-25.3：冲销后按未交付合计自动判定状态
  t.reversed=true;
  transfers.unshift({
    id:'TR'+Date.now(), type:revType,
    salesOrderId:t.salesOrderId, salesLineIdx:t.salesLineIdx,
    invOrderId:t.invOrderId, invLineIdx:t.invLineIdx,
    productId:t.productId, invProductId:t.invProductId,
    qty:t.qty, ts:new Date().toLocaleString('zh-CN',{hour12:false}),
    user:(currentUser&&currentUser.name)||'未知', reversed:false, reverseOf:t.id,
    /* 2026-08-25.49：冲销单复制原单快照（存量原单无快照 → 空，渲染反查兜底） */
    customer:t.customer||'', contractNo:t.contractNo||'',
    productName:t.productName||'', spec:t.spec||'', model:t.model||''
  });
  DB.set('transfers',transfers,true).then(function(ok){
    if(ok===false)alert('调拨台账保存失败：冲销已生效，但台账记录未保存，请刷新后核对调拨台账。');
  });
  logOp('冲销','调拨台账','冲销调拨记录 '+t.id);
  renderContent();
  /* 2026-08-25.5：冲销后状态可能自动变化，清理被筛选隐藏订单的幽灵勾选 */
  const _sid2=orders.findIndex(function(x){return x.id===t.salesOrderId;});
  if(_sid2>=0&&!orderRowVisibleInDom(orders[_sid2].id))clearHiddenOrderSel(_sid2);
  const _iid2=orders.findIndex(function(x){return x.id===t.invOrderId;});
  if(_iid2>=0&&!orderRowVisibleInDom(orders[_iid2].id))clearHiddenOrderSel(_iid2);
}

/* 库存打通（一次性迁移）：把产品主数据现有「库存/已交付数量」反填到对应库存订单的
   「已交付数量」，使 库存 = Σ(库存订单已交付) 在存量数据上立即成立，避免同步后库存被清零。
   仅对「当前已交付合计为 0 且库存>0」的产品执行；已有交付或库存≤0 的跳过（幂等）。 */
function backfillInvDeliveredFromStock(){
  let changed=false;
  products.forEach(p=>{
    if(p.stock==null||num(p.stock)<=0)return;
    const pid=p.id;
    const lines=[];
    orders.forEach(o=>{
      if(orderTypeOf(o)!=='库存订单')return;
      orderItems(o).forEach(it=>{ if(it.productId===pid) lines.push(it); });
    });
    if(!lines.length)return;
    const totalDel=lines.reduce((s,it)=>s+num(it.deliveredQty),0);
    if(totalDel>0)return;                // 已有交付记录，不覆盖（幂等）
    const target=num(p.stock);
    const sumQty=lines.reduce((s,it)=>s+num(it.orderQty),0);
    if(sumQty>0){
      let assigned=0;
      lines.forEach((it,i)=>{
        const d=(i===lines.length-1)?(target-assigned):Math.round(target*num(it.orderQty)/sumQty);
        it.deliveredQty=Math.max(0,d); assigned+=it.deliveredQty;
      });
    }else{
      const base=Math.floor(target/lines.length);
      lines.forEach((it,i)=>{ it.deliveredQty=base+(i===0?(target-base*lines.length):0); });
    }
    changed=true;
  });
  if(changed){
    save('orders',orders);
    logOp('系统','库存打通','将产品现有库存按订单量比例反填到库存订单「已交付数量」（一次性对齐）');
  }
}

/* 库存同步：产品「库存/已交付数量」= 全部「库存订单」明细已交付数量之和。
   业务口径（2026-08-23 用户确认）：库存完全由库存订单驱动——所有库存必须由库存订单支撑；
   无库存订单的产品库存一律归零（期初库存经 backfillInvDeliveredFromStock 反填进订单后走本口径）；
   删除/恢复回滚库存订单后，产品库存自动对齐，杜绝残留孤儿库存。
   后续「销售订单调用库存」功能将在此基础上扣减。 */
function syncStockFromInvOrders(){
  const map={};
  orders.forEach(o=>{
    if(orderTypeOf(o)!=='库存订单')return;
    orderItems(o).forEach(it=>{
      if(it.productId)map[it.productId]=(map[it.productId]||0)+num(it.deliveredQty);
    });
  });
  let changed=false;
  products.forEach(p=>{
    const v=map[p.id]||0;            // 全量对齐：无库存订单的产品 → 0
    if(num(p.stock)!==v){p.stock=v;changed=true;}
  });
  if(changed)save('products',products);
}

      document.getElementById('sp_testAgingPlan').value=cap;

}

/* ================================================================
   生产日报
================================================================ */
function renderDailyReport(){
  let html='<div class="card"><div class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;color:var(--primary)"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>生产日报 <span class="desc">按产品统计每日各工序完成数量</span></div>';

  html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">'+
    '<label style="margin:0"><input type="date" id="reportDate" value="'+reportDate+'" onchange="changeReportDate()" style="width:auto"></label>'+
    '<button class="btn btn-sm" onclick="shiftReportDate(-1)">前一天</button>'+
    '<button class="btn btn-sm" onclick="shiftReportDate(1)">后一天</button>'+
    '</div>';

  // 汇总当日备货+包装数据
  const dayPlans=dailyPlans.filter(p=>fmtDate(p.date)===reportDate);
  const dayPkgs=dailyPkgs.filter(p=>fmtDate(p.date)===reportDate);

  // 合并产品维度
  const productMap={};
  dayPlans.forEach(p=>{
    if(!productMap[p.productId])productMap[p.productId]={productId:p.productId,productName:p.productName,assemblyDone:0,innerPackDone:0,testAgingDone:0,semiInbound:0,packagingDone:0,finishedInbound:0,orderId:''};
    productMap[p.productId].assemblyDone+=num(p.assemblyDone);
    productMap[p.productId].innerPackDone+=num(p.innerPackDone);
    productMap[p.productId].testAgingDone+=num(p.testAgingDone);
    productMap[p.productId].semiInbound+=num(p.semiInbound);
  });
  dayPkgs.forEach(p=>{
    if(!productMap[p.productId])productMap[p.productId]={productId:p.productId,productName:p.productName,assemblyDone:0,innerPackDone:0,testAgingDone:0,semiInbound:0,packagingDone:0,finishedInbound:0,orderId:p.orderId};
    productMap[p.productId].packagingDone+=num(p.pkgDone);
    productMap[p.productId].finishedInbound+=num(p.finInbound);
    if(p.orderId)productMap[p.productId].orderId=p.orderId;
  });

  let rows=Object.values(productMap);
  if(rows.length===0){
    html+='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg><br>当日无生产数据，请先在「日排产」中录入</div>';
  }else{
    TBL_SCHEMAS.report=[
      {key:'productId',label:'产品编码',type:'text'},
      {key:'productName',label:'产品名称',type:'text'},
      {key:'assemblyDone',label:'装配完成',type:'number'},
      {key:'innerPackDone',label:'内包完成',type:'number'},
      {key:'testAgingDone',label:'调试老化完成',type:'number'},
      {key:'semiInbound',label:'半成品入库',type:'number'},
      {key:'packagingDone',label:'包装完成',type:'number'},
      {key:'finishedInbound',label:'成品入库',type:'number'},
      {key:'orderId',label:'关联订单',type:'text'}
    ];
    TBL_ROWS.report=rows;
    rows=applyTable('report',rows);
    html+=filterBar('report');
    html+='<div class="table-wrap"><table><thead><tr>'+TBL_SCHEMAS.report.map(c=>thCol('report',c)).join('')+'</tr></thead><tbody>';
    if(rows.length===0){html+=noMatchRow('report',9);}
    let sumA=0,sumI=0,sumT=0,sumS=0,sumP=0,sumF=0;
    rows.forEach(r=>{
      html+='<tr><td data-key="productId">'+esc(r.productId)+'</td><td data-key="productName">'+esc(r.productName)+'</td>'+
        '<td data-key="assemblyDone" style="text-align:right">'+r.assemblyDone+'</td>'+
        '<td data-key="innerPackDone" style="text-align:right">'+r.innerPackDone+'</td>'+
        '<td data-key="testAgingDone" style="text-align:right">'+r.testAgingDone+'</td>'+
        '<td data-key="semiInbound" style="text-align:right">'+r.semiInbound+'</td>'+
        '<td data-key="packagingDone" style="text-align:right;font-weight:600">'+r.packagingDone+'</td>'+
        '<td data-key="finishedInbound" style="text-align:right;font-weight:600">'+r.finishedInbound+'</td>'+
        '<td data-key="orderId">'+esc(r.orderId)+'</td></tr>';
      sumA+=r.assemblyDone;sumI+=r.innerPackDone;sumT+=r.testAgingDone;sumS+=r.semiInbound;sumP+=r.packagingDone;sumF+=r.finishedInbound;
    });
    html+='<tr style="font-weight:600;background:var(--primary-light)"><td colspan="2">日合计</td><td style="text-align:right">'+sumA+'</td><td style="text-align:right">'+sumI+'</td><td style="text-align:right">'+sumT+'</td><td style="text-align:right">'+sumS+'</td><td style="text-align:right">'+sumP+'</td><td style="text-align:right">'+sumF+'</td><td></td></tr>';
    html+='</tbody></table></div>';
  }
  html+='</div>';

  // 周合计
  const weekStart=getWeekStart(reportDate);
  const weekEnd=getWeekEnd(reportDate);
  const weekPlans=dailyPlans.filter(p=>{const d=fmtDate(p.date);return d>=weekStart&&d<=weekEnd;});
  const weekPkgs=dailyPkgs.filter(p=>{const d=fmtDate(p.date);return d>=weekStart&&d<=weekEnd;});
  const wA=weekPlans.reduce((s,p)=>s+num(p.assemblyDone),0);
  const wI=weekPlans.reduce((s,p)=>s+num(p.innerPackDone),0);
  const wT=weekPlans.reduce((s,p)=>s+num(p.testAgingDone),0);
  const wS=weekPlans.reduce((s,p)=>s+num(p.semiInbound),0);
  const wP=weekPkgs.reduce((s,p)=>s+num(p.pkgDone),0);
  const wF=weekPkgs.reduce((s,p)=>s+num(p.finInbound),0);
  html+='<div class="card"><div class="card-title">本周合计（'+weekStart+' ~ '+weekEnd+'）</div>';
  html+='<div class="stats">'+
    statCard(wA,'装配完成','blue')+
    statCard(wI,'内包完成','blue')+
    statCard(wT,'调试老化完成','blue')+
    statCard(wS,'半成品入库','')+
    statCard(wP,'包装完成','amber')+
    statCard(wF,'成品入库','amber')+
    '</div></div>';

  return html;
}

function getWeekStart(d){
  const date=new Date(d);
  const day=date.getDay()||7;
  date.setDate(date.getDate()-day+1);
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}
function getWeekEnd(d){
  const date=new Date(d);
  const day=date.getDay()||7;
  date.setDate(date.getDate()-day+7);
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}
function changeReportDate(){
  reportDate=document.getElementById('reportDate').value;
  renderContent();
}
function shiftReportDate(delta){
  const d=new Date(reportDate);
  d.setDate(d.getDate()+delta);
  reportDate=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  renderContent();
}

/* ================================================================
   交付计划
================================================================ */
function renderDelivery(){
  let html='<div class="card"><div class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;color:var(--primary)"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 3v5h-7"/></svg>客户交付计划 <span class="desc">由库存管理「生成交付计划」下推 · 本批数量确认（.95 起仅库存订单可生成）</span></div>';

  // 交付计划汇总
  html+='<h3 style="font-size:14px;margin:6px 0 8px">一、交付计划汇总</h3>';
  if(deliveries.length===0){
    html+='<div class="empty">暂无交付计划</div>';
  }else{
    /* 2026-08-25.22：列表改订单管理式多行明细——一单 N 明细 → N 行，单据级列 rowspan 合并。
       明细行只显示「本批计划(planQty)>0」的行（本批不交付的行不展示）；全为 0 时兜底显示全部行（兼容存量老数据无 planQty）。 */
    /* 2026-08-25.24：列表行保留交付计划 items 原索引 li（同产品多行时行级已排产按 li 区分） */
    const dlListRows=(d)=>{const its=deliveryItems(d).map((it,li)=>({it,li}));const pos=its.filter(x=>num(x.it.planQty)>0);return pos.length>0?pos:its;};
    const rows=[];
    deliveries.forEach(d=>dlListRows(d).forEach(x=>rows.push({d,it:x.it,li:x.li,di:deliveries.indexOf(d)})));
    /* 2026-08-25.23：单据级汇总字段（订单总量/本批计划/已排产）拆到明细行——单据级仅保留单据属性 6 列；
       明细级新增「已排产」行级字段（ppPlannedOf 该单据+该产品已排产，排除已取消，不落库实时计算） */
    TBL_SCHEMAS.delivery=[
      {key:'createdAt',label:'单据时间',type:'date',get:r=>r.d.createdAt},
      {key:'orderId',label:'订单编号',type:'text',get:r=>r.d.orderId},
      {key:'customer',label:'客户',type:'text',get:r=>r.d.customer},
      {key:'ppStatus',label:'状态',type:'text',select:true,options:['未下推','部分下推','全部下推'],get:r=>ppDeliveryStatus(r.di),sort:v=>PP_DL_STATUS_W[String(v)]!=null?PP_DL_STATUS_W[String(v)]:0},   /* 2026-08-25.55/.58：状态列恢复复选框多选（select 类列）+ 筛选显示全部状态；.78 选项改名 未下推/部分下推/全部下推 */
      {key:'finalDate',label:'最终交付期',type:'date',get:r=>r.d.finalDate},
      {key:'firstDate',label:'首次交付日',type:'date',get:r=>r.d.firstDate},
      {key:'productId',label:'产品编码',type:'text',get:r=>r.it.productId},
      {key:'productName',label:'产品名称',type:'text',get:r=>r.it.productName||r.it.productId},
      {key:'spec',label:'规格',type:'text',get:r=>r.it.spec},
      {key:'model',label:'型号',type:'text',get:r=>r.it.model},
      {key:'orderQty',label:'订单数量',type:'number',get:r=>r.it.orderQty},
      {key:'deliveredQty',label:'已交付',type:'number',get:r=>r.it.deliveredQty},
      {key:'_undel',label:'未交付',type:'number',get:r=>num(r.it.orderQty)-num(r.it.deliveredQty)},
      {key:'_planQty',label:'本批计划',type:'number',get:r=>r.it.planQty},
      {key:'_ppPlanned',label:'已排产',type:'number',get:r=>ppPlannedOfLine(r.di,r.li!=null?r.li:null,r.it.productId)},
      {key:'lineNotes',label:'商品行备注',type:'text',get:r=>r.it.lineNotes}
    ];
    TBL_ROWS.delivery=rows;
    let shown=applyTable('delivery',rows);
    /* 单据级列合并（订单管理同款）：前 6 列按单据 rowspan 合并；仅未按明细级列排序时合并，避免明细行打散致 rowspan 断裂 */
    const HEAD_COLS=6;
    const manualSort=tState('delivery').sort;
    const sortKey=manualSort?manualSort.key:null;
    const lineKeys=TBL_SCHEMAS.delivery.slice(HEAD_COLS).map(c=>c.key);
    const shouldMerge=!sortKey||!lineKeys.includes(sortKey);
    /* 2026-08-29.82：交付计划默认排序改单据时间（createdAt）降序，同日按单据顺序 di 降序兜底（新单在前）；
       手动排序时保持原聚合行为（di 升序，历史不变）；聚合在分页前（对齐 .80 坑位：默认排序必须先于切片） */
    if(shouldMerge){
      if(!manualSort) shown=[...shown].sort((a,b)=>{
        const da=fmtDate(a.d.createdAt),db=fmtDate(b.d.createdAt);
        if(da!==db)return da<db?1:-1;
        return b.di-a.di;
      });
      else shown=[...shown].sort((a,b)=>a.di-b.di);
    }
    /* 2026-08-25.68：金蝶式分页（按交付计划分组整单不拆，groupKey=r.di） */
    if(PAGED_FORMS.delivery&&shown.length>0)shown=slicePaged('delivery',shown,pageSizeOf('delivery'),r=>r.di).rows;
    const groupMap=new Map();
    shown.forEach((r,i)=>{if(!groupMap.has(r.di))groupMap.set(r.di,{start:i,count:0});groupMap.get(r.di).count++;});
    lastRowIds.delivery=shown.map(r=>r.di);
    html+=bulkBar('delivery');
    html+=filterBar('delivery');
    /* 双表结构（表头 sticky 吸附 + 表体独立），同订单 */
    const _dColN=TBL_SCHEMAS.delivery.length+1;
    const _dColg='<colgroup>'+Array(_dColN).fill('<col>').join('')+'</colgroup>';
    html+='<div class="sticky-head"><div class="head-scroll"><table class="head-tbl">'+_dColg+'<thead><tr><th class="sel-col"></th>'+TBL_SCHEMAS.delivery.map(c=>thCol('delivery',c)).join('')+'</tr></thead></table></div></div>';
    html+='<div class="table-wrap"><table class="body-tbl">'+_dColg+'<tbody>';
    if(shown.length===0){html+=noMatchRow('delivery',_dColN);}
    shown.forEach((r,i)=>{
      const di=r.di, d=r.d, it=r.it, li=r.li!=null?r.li:null;
      const grp=groupMap.get(di);
      const isFirst=grp.start===i;
      const rs=grp.count;
      const selChecked=selSet('delivery').has(String(di))?'checked':'';
      const selCell=shouldMerge?(isFirst?'<td class="sel-col" rowspan="'+rs+'"><input type="checkbox" '+selChecked+' data-sel-id="'+di+'" data-sel-form="delivery" onclick="event.stopPropagation();selRowClick(\'delivery\','+di+')"></td>':''):'<td class="sel-col"><input type="checkbox" '+selChecked+' data-sel-id="'+di+'" data-sel-form="delivery" onclick="event.stopPropagation();selRowClick(\'delivery\','+di+')"></td>';
      let headCells='';
      const headHtml=
        '<td data-key="createdAt" rowspan="'+rs+'">'+fmtDate(d.createdAt)+'</td>'+
        '<td data-key="orderId" rowspan="'+rs+'" style="font-weight:600">'+esc(d.orderId)+'</td>'+
        '<td data-key="customer" rowspan="'+rs+'">'+esc(d.customer)+'</td>'+
        '<td data-key="ppStatus" rowspan="'+rs+'" style="text-align:center"><span class="tag '+ppDlStatusTag(ppDeliveryStatus(di))+'">'+ppDeliveryStatus(di)+'</span></td>'+
        '<td data-key="finalDate" rowspan="'+rs+'">'+fmtDate(d.finalDate)+'</td>'+
        '<td data-key="firstDate" rowspan="'+rs+'">'+fmtDate(d.firstDate)+'</td>';
      if(shouldMerge){
        if(isFirst)headCells=headHtml;
      }else{
        headCells=headHtml;
      }
      const undel=num(it.orderQty)-num(it.deliveredQty);
      html+='<tr onclick="selRowClick(\'delivery\','+di+')">'+selCell+headCells+
        '<td data-key="productId">'+esc(it.productId)+'</td>'+
        '<td data-key="productName">'+esc(it.productName||it.productId)+'</td>'+
        '<td data-key="spec">'+esc(it.spec||'')+'</td>'+
        '<td data-key="model">'+esc(it.model||'')+'</td>'+
        '<td data-key="orderQty" style="font-variant-numeric:tabular-nums;text-align:right">'+money(it.orderQty)+'</td>'+
        '<td data-key="deliveredQty" style="font-variant-numeric:tabular-nums;text-align:right">'+money(it.deliveredQty)+'</td>'+
        '<td data-key="_undel" style="font-variant-numeric:tabular-nums;text-align:right">'+money(undel)+'</td>'+
        '<td data-key="_planQty" style="font-variant-numeric:tabular-nums;text-align:right">'+(it.planQty!=null?money(it.planQty):'')+'</td>'+
        '<td data-key="_ppPlanned" style="font-variant-numeric:tabular-nums;text-align:right;font-weight:600">'+money(ppPlannedOfLine(di,li,it.productId))+'</td>'+
        '<td data-key="lineNotes">'+esc(it.lineNotes||'')+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }

  html+='</div>';
  return html;
}

/* ================================================================
   排产计划（生产排产：交付计划下推 + 工序报工，月/周/日视图）
   数据表 productionPlans（server.js DEFAULT_DATA+BIZ_KEYS 已登记）
   口径：planQty=交付计划行 planQty（1:1）；doneQty=成品入库累计（回写二期）
================================================================ */
let planView='all';           // day / week / month（.85：默认总览，原 day）
let planViewDate=todayStr();  // 周/月视图参照日
let planDateFrom=todayStr();  // 日视图开始日期（.10 起支持时间段；=结束 即单日）
let planDateTo=todayStr();    // 日视图结束日期
let planExpand={};            // 排产计划展开态（planId->true，纯内存，刷新重置）

/* 工序模板（2026-08-24.11）：默认模板 = 新 6 工序（用户确认：装配/瞬时/延时/内包/老化/入库）。
   模板=从预置工序选用 + 可加自定义工序；每工序可设 计划量(plan)/必报(mandatory)。
   排产单下推时按产品模板固化工序快照 items[].stepsDef；存量单无 stepsDef → 用默认模板。 */
const DEFAULT_TPL_STEPS=[
  {key:'assembly',label:'装配',plan:true,mandatory:true},
  {key:'instant',label:'瞬时',plan:true,mandatory:false},
  {key:'delay',label:'延时',plan:true,mandatory:false},
  {key:'innerPack',label:'内包',plan:true,mandatory:false},
  {key:'aging',label:'老化',plan:true,mandatory:true},
  {key:'inbound',label:'入库',plan:false,mandatory:true}
];
/* 预置工序枚举（模板编辑可选） */
const PP_PRESET_STEPS=[
  {key:'assembly',label:'装配',plan:true},
  {key:'instant',label:'瞬时',plan:true},
  {key:'delay',label:'延时',plan:true},
  {key:'innerPack',label:'内包',plan:true},
  {key:'aging',label:'老化',plan:true},
  {key:'inbound',label:'入库',plan:false}
];
/* 老键→新键读取映射（存量排产单兼容：老化←调试老化，入库←成品入库；半成品入库/包装老数据保留不显示） */
const PP_LEGACY_MAP={aging:'testAging',inbound:'finInbound'};
/* 兼容引用：默认模板必报 key 列表（老代码路径；报工必填按单内 stepsDef.mandatory） */
const PP_MANDATORY=DEFAULT_TPL_STEPS.filter(x=>x.mandatory).map(x=>x.key);
/* 导出列定义（排产计划无持久化 fields 配置，导出用内置列；工序完成列动态拼） */
const PP_EXPORT_COLS=[
  {key:'id',label:'排产单号',type:'text'},
  {key:'planDate',label:'计划日期',type:'date'},
  {key:'finalDate',label:'交付期',type:'date'},
  {key:'orderId',label:'订单',type:'text'},
  {key:'customer',label:'客户',type:'text'},

  {key:'spec',label:'规格',type:'text'},
  {key:'model',label:'型号',type:'text'},
  {key:'unit',label:'单位',type:'text'},

];

/* 明细/工序兜底：老/手工结构（顶层平铺字段）自动构造 */
function ppItems(p){ return (Array.isArray(p.items)&&p.items.length)?p.items:[{productId:p.productId||'',productName:p.productName||'',spec:p.spec||'',model:p.model||'',unit:p.unit||'',planQty:num(p.planQty),doneQty:num(p.doneQty),steps:null}]; }
function ppSteps(it){
  if(it&&it.steps)return it.steps;
  const s={assembly:{plan:0,done:0},instant:{plan:0,done:0},delay:{plan:0,done:0},innerPack:{plan:0,done:0},aging:{plan:0,done:0},inbound:0};
  if(it){
    s.assembly.plan=num(it.assemblyPlan);s.innerPack.plan=num(it.innerPackPlan);
    s.assembly.done=num(it.assemblyDone);s.innerPack.done=num(it.innerPackDone);
    s.aging.plan=num(it.testAgingPlan);s.aging.done=num(it.testAgingDone);
    s.inbound=num(it.finInbound);
  }
  return s;
}
/* 工序定义（含 label/plan/mandatory）：行快照 stepsDef > 排产单模板 > 默认模板 */
function tplOf(id){
  if(!processTemplates||!processTemplates.length)return null;
  return processTemplates.find(t=>t.id===id)||null;
}
function stepsDefOf(p,it){
  if(it&&Array.isArray(it.stepsDef)&&it.stepsDef.length)return it.stepsDef;
  if(p&&p.processTplId){const t=tplOf(p.processTplId);if(t&&Array.isArray(t.steps)&&t.steps.length)return t.steps;}
  return DEFAULT_TPL_STEPS;
}
/* 确保 steps 包含工序定义全部键（缺失补 0；老键数据平移：aging←testAging/inbound←finInbound） */
function ppEnsureSteps(it,def){
  if(!it)return;
  const st=it.steps||(it.steps={});
  (def||DEFAULT_TPL_STEPS).forEach(x=>{
    if(st[x.key]===undefined){
      const lv=PP_LEGACY_MAP[x.key]?st[PP_LEGACY_MAP[x.key]]:undefined;
      if(lv!==undefined)st[x.key]=(typeof lv==='object')?{plan:num(lv.plan),done:num(lv.done)}:num(lv);
      else st[x.key]=x.plan?{plan:0,done:0}:0;
    }
  });
  return st;
}
function ppStepRaw(st,key){
  if(st[key]!==undefined)return st[key];
  if(PP_LEGACY_MAP[key]&&st[PP_LEGACY_MAP[key]]!==undefined)return st[PP_LEGACY_MAP[key]];
  return undefined;
}
function ppStepDone(it,key){ const v=ppStepRaw(ppSteps(it),key); return num(typeof v==='object'?v.done:v); }
function ppStepPlan(it,key){ const v=ppStepRaw(ppSteps(it),key); return num(typeof v==='object'?v.plan:v); }
function ppDoneOf(it){ return num(it&&it.doneQty!=null?it.doneQty:ppStepDone(it,'inbound')); }
function ppPlanOf(it){ return num(it&&it.planQty!=null?it.planQty:0); }
function ppProgress(p){ let t=0,d=0; ppItems(p).forEach(it=>{t+=ppPlanOf(it);d+=ppDoneOf(it);}); return t>0?Math.round(d/t*100):0; }
function ppStatusCls(st){ return st==='已完成'?'tag-green':st==='生产中'?'tag-blue':st==='已取消'?'tag-gray':'tag-amber'; }
function ppWeekRange(d){
  const date=new Date(d);
  const day=date.getDay()||7;
  date.setDate(date.getDate()-day+1);
  const start=fmtDate(date);
  date.setDate(date.getDate()+6);
  return [start,fmtDate(date)];
}
/* 需求 2026-08-24.7：同一交付计划 + 同一产品，已下推的排产数量总和（编辑时 excludeIdx 排除自身） */
function ppPlannedOf(deliveryIdx,productId,excludeIdx){
  if(deliveryIdx==null)return 0;
  let s=0;
  productionPlans.forEach((p,idx)=>{
    if(idx===excludeIdx)return;
    if(p.deliveryIdx!==deliveryIdx)return;
    if(p.status==='已取消')return;   /* 2026-08-24.16：已取消排产单不计入已排产（释放额度） */
    ppItems(p).forEach(it=>{ if((it.productId||'')===(productId||'')) s+=num(it.planQty); });
  });
  return s;
}
/* 交付计划某产品行的本批计划（总计划数）；查不到返回 null（独立单不限制） */
function ppTotalOf(deliveryIdx,productId){
  if(deliveryIdx==null)return null;
  const d=deliveries[deliveryIdx];
  if(!d)return null;
  const it=deliveryItems(d).find(x=>(x.productId||'')===(productId||''));
  return it?num(it.planQty):null;
}
/* 2026-08-25.24：行级聚合（同产品多行明细时按交付计划行区分，修复下推数量被取首行/聚合的错误）。
   排产单行带 dlLine（交付计划 items 原索引）→ 按行计算；无 dlLine（存量排产单）→ 回退产品级聚合，行为不变 */
function ppTotalOfLine(deliveryIdx,dlLine,productId){
  if(deliveryIdx==null)return null;
  if(dlLine!=null&&deliveries[deliveryIdx]){
    const lineItems=deliveryItems(deliveries[deliveryIdx]);
    if(lineItems[dlLine]!=null)return num(lineItems[dlLine].planQty);
  }
  return ppTotalOf(deliveryIdx,productId);
}
function ppPlannedOfLine(deliveryIdx,dlLine,productId,excludeIdx){
  if(deliveryIdx==null)return 0;
  if(dlLine==null)return ppPlannedOf(deliveryIdx,productId,excludeIdx);
  /* 同单存在无 dlLine 的存量行（老格式）时无法按行区分 → 回退产品级聚合 */
  const hasLegacy=productionPlans.some((p,idx)=>{
    if(idx===excludeIdx||p.deliveryIdx!==deliveryIdx||p.status==='已取消')return false;
    return ppItems(p).some(it=>it.dlLine==null);
  });
  if(hasLegacy)return ppPlannedOf(deliveryIdx,productId,excludeIdx);
  let s=0;
  productionPlans.forEach((p,idx)=>{
    if(idx===excludeIdx||p.deliveryIdx!==deliveryIdx||p.status==='已取消')return;
    ppItems(p).forEach(it=>{ if(it.dlLine===dlLine)s+=num(it.planQty); });
  });
  return s;
}
/* 交付计划已下推排产数量合计（build 2026-08-24.17）：Σ 名下排产单 items.planQty（排除已取消，同状态口径） */
function ppPlannedTotal(deliveryIdx){
  if(deliveryIdx==null)return 0;
  let planned=0;
  productionPlans.forEach(p=>{
    if(p.deliveryIdx!==deliveryIdx)return;
    if(p.status==='已取消')return;   /* 取消=释放额度，不计入已排产 */
    ppItems(p).forEach(it=>{planned+=num(it.planQty);});
  });
  return planned;
}
/* 交付计划排产状态（build 2026-08-24.16；.78 改名 未排产→未下推/部分排产→部分下推/全部排产→全部下推）：实时计算不可编辑。
   口径：已排产=名下全部排产单（排除已取消，同 ppPlannedOf）items.planQty 合计；总计划=明细行 planQty 合计；
   独立单（deliveryIdx=null）不参与。删除/取消排产单、改排产数量、改交付计划 planQty 均自动反映。 */
const PP_DL_STATUS_W={未下推:0,部分下推:1,全部下推:2};
function ppDeliveryStatus(deliveryIdx){
  const d=deliveries[deliveryIdx];
  if(!d)return '未下推';
  let total=0;
  deliveryItems(d).forEach(it=>{total+=num(it.planQty);});
  if(total<=0)return '未下推';
  const planned=ppPlannedTotal(deliveryIdx);
  if(planned<=0)return '未下推';
  return planned>=total?'全部下推':'部分下推';
}
function ppDlStatusTag(st){ return st==='全部下推'?'tag-green':st==='部分下推'?'tag-blue':'tag-amber'; }
/* ================================================================
   报工明细（productionReports，build 2026-08-24.8）：
   一次报工=一条记录；行内展开（▶）+ 弹窗查看；只读展示
================================================================ */
function prNextId(){
  const today=todayStr().replace(/-/g,'');
  const re=new RegExp('^REP-'+today+'-(\\d+)$');
  let max=0;
  productionReports.forEach(r=>{
    const m=String(r.id||'').match(re);
    if(m)max=Math.max(max,parseInt(m[1],10));
  });
  return 'REP-'+today+'-'+String(max+1).padStart(3,'0');
}
/* 某排产单的报工明细（按时间倒序） */
function ppReportsOf(planId){
  return productionReports.filter(r=>r.planId===planId).sort((a,b)=>((a.createdAt||'')<(b.createdAt||'')?1:-1));
}
/* 展开/收起某排产单 */
function togglePlanExpand(id){
  planExpand[id]=!planExpand[id];
  renderContent();
}
/* 行内展开行：缩进显示报工明细（实时算累计/计划）；.12 起去掉行内删除、按钮改「编辑」 */
function ppExpandRow(p){
  const reps=ppReportsOf(p.id);
  let inner;
  if(reps.length===0){
    let tp=0,td=0;
    ppItems(p).forEach(it=>{tp+=ppPlanOf(it);td+=ppDoneOf(it);});
    inner='<div class="pp-exp-empty">暂无报工明细（当前累计完成 '+money(td)+' / 计划 '+money(tp)+'）</div>';
  }else{
    inner=reps.map(r=>{
      const parts=(r.items||[]).map(x=>{
        const it=ppItems(p).find(z=>(z.productId||'')===(x.productId||''));
        const cur=it?ppStepDone(it,x.step):0;
        const plan=(x.step==='semiInbound'||x.step==='finInbound')?(it?ppPlanOf(it):0):(it?ppStepPlan(it,x.step):0);
        return '<span class="pp-rep-item">'+esc(x.label)+' <b>+'+money(x.qty)+'</b>'+
          (plan>0?('（累计 '+money(cur)+'/'+money(plan)+'）'):('（累计 '+money(cur)+'）'))+'</span>';
      }).join(' · ');
      return '<div class="pp-rep-line"><span class="pp-rep-time">'+esc(r.date||'')+' '+esc(r.time||'')+'</span>'+
        '<span class="pp-rep-worker">'+(r.worker?esc(r.worker):'—')+'</span><div class="pp-rep-parts">'+parts+'</div></div>';
    }).join('');
  }
  return '<tr class="pp-exp-row"><td colspan="'+(TBL_SCHEMAS.prodPlan.length+2)+'"><div class="pp-exp">'+
    '<div class="pp-exp-head"><span>报工明细（'+reps.length+' 条）</span>'+
    '<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();ppReportsModal(\''+esc(p.id)+'\')">编辑</button></div>'+
    inner+'</div></td></tr>';
}
/* 方案 B：报工明细编辑弹窗（.13 起可改报工人与各工序数量；.15 起每行恢复删除按钮；.41 起单道工序数量可改 0（min=0），仅不允许全部工序为 0） */
function ppReportsModal(planId){
  const p=productionPlans.find(x=>x.id===planId);
  const reps=ppReportsOf(planId);
  const canDel=canWriteForm('prodPlan');
  let inner;
  if(reps.length===0){
    inner='<div class="empty">暂无报工明细</div>';
  }else{
    inner='<div style="max-height:420px;overflow:auto">'+reps.map((r,i)=>{
      const qtyInputs=(r.items||[]).map((x,j)=>
        '<div style="display:inline-flex;align-items:center;gap:4px;white-space:nowrap;margin:2px 8px 2px 0"><span style="font-size:12px;color:var(--muted)">'+esc(x.label)+'</span>'+
        '<input type="number" id="rp_q_'+i+'_'+j+'" value="'+num(x.qty)+'" min="0" step="1" style="width:70px"></div>').join('');
      return '<div class="rep-edit-row">'+
        '<span class="pp-rep-time">'+esc(r.date||'')+' '+esc(r.time||'')+'</span>'+
        '<span class="pp-rep-worker" title="报工人"><input type="text" id="rp_w_'+i+'" value="'+esc(r.worker||'')+'" style="width:110px" placeholder="报工人"></span>'+
        '<span class="pp-rep-parts">'+qtyInputs+'</span>'+
        (canDel?'<button class="btn btn-sm btn-danger" style="padding:1px 8px;font-size:12px" onclick="ppDelReport(\''+esc(r.id)+'\')" title="删除该条报工（同步回退累计完成数）">删除</button>':'')+'</div>';
    }).join('')+'</div>';
  }
  showModal('编辑报工明细 · '+esc(p?p.id:planId),
    '<div style="margin-bottom:8px;font-size:13px;color:var(--muted)">可修改每条报工的「报工人」与各工序「本次数量」（最小 1，不可改为 0）；如需移除某条报工请点「删除」（同步回退累计）；保存后，排产单累计完成数将按新数量自动重算（修改后不能超过本次排产数）。</div>'+inner,
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="ppSaveReportEdits(\''+esc(planId)+'\')">保存修改</button>');
}
/* 保存报工明细编辑：更新 worker/qty 并按新数量重算排产单累计（超量拦截；已完成不全完成回退生产中） */
function ppSaveReportEdits(planId){
  if(!ensureWrite('prodPlan'))return;
  const p=productionPlans.find(x=>x.id===planId);
  if(!p)return;
  const reps=ppReportsOf(planId);
  if(reps.length===0)return;
  /* 读取每行输入：worker + 各工序新数量 */
  const updates=reps.map((r,i)=>{
    const worker=String((document.getElementById('rp_w_'+i)||{}).value||'').trim();
    const qtyMap={};
    (r.items||[]).forEach((x,j)=>{
      const el=document.getElementById('rp_q_'+i+'_'+j);
      const v=el?parseFloat(el.value):NaN;
      qtyMap[x.step]=isNaN(v)?num(x.qty):v;
    });
    return {idx:productionReports.indexOf(r),worker:worker,qtyMap:qtyMap};
  });
  for(let i=0;i<updates.length;i++){
    /* 2026-08-29.77：报工人改非必填（移除必填校验） */
    /* 2026-08-25.41：单道工序数量可改 0（≥0 整数）；一条报工至少保留一道工序 >0（全 0=删除该条，走删除按钮） */
    let anyQ=0;
    for(const step in updates[i].qtyMap){
      const q=updates[i].qtyMap[step];
      if(!isFinite(q)||q<0||Math.round(q)!==q){alert('第 '+(i+1)+' 条报工的工序数量无效（须为不小于 0 的整数）');return;}
      if(q>0)anyQ=1;
    }
    if(!anyQ){alert('第 '+(i+1)+' 条报工不能所有工序都为 0（如需撤销该条报工，请点击该行的「删除」按钮）');return;}
  }
  /* 按产品行×工序聚合新累计，并检查是否超过本次排产数。
     2026-08-25.40：行级化——key=productId(+#dlLine)，同产品多行各自聚合（依赖 .40 起报工记录带 dlLine；存量记录回退产品级） */
  const lineKey=x=>(x.productId||'')+(x.dlLine!=null?'#'+x.dlLine:'');
  const itMap={};
  ppItems(p).forEach(it=>{itMap[lineKey(it)]=it;});
  const oldInbound={};                         // 2026-08-25.16：应用前各产品行旧入库累计（doneQty=唯一完成口径）
  ppItems(p).forEach(it=>{oldInbound[lineKey(it)]=ppDoneOf(it);});
  const agg={};
  updates.forEach(u=>{
    const rec=productionReports[u.idx];
    (rec.items||[]).forEach(x=>{
      const k=lineKey(x);
      if(!agg[k])agg[k]={};
      agg[k][x.step]=(agg[k][x.step]||0)+num(u.qtyMap[x.step]);
    });
  });
  const overMsg=[];
  for(const k in agg){
    const it=itMap[k];
    if(!it)continue;
    const def=stepsDefOf(p,it);
    for(const step in agg[k]){
      const stepDef=def.find(s=>s.key===step);
      const limit=(stepDef&&!stepDef.plan)?ppPlanOf(it):ppStepPlan(it,step);
      if(limit>0&&agg[k][step]>limit)overMsg.push('「'+(it.productName||it.productId)+'」'+(stepDef?stepDef.label:step)+'：修改后累计 '+agg[k][step]+' / 本次排产 '+limit);
    }
  }
  if(overMsg.length>0){
    alert('修改后报工累计超过本次排产数：\n'+overMsg.join('\n')+'\n\n请调整后重新保存。');
    return;
  }
  /* 应用：覆盖累计 + 更新记录 */
  const inboundDelta=[];                       // 2026-08-25.16：入库累计 新−旧 → 回写订单；.40 行级化
  for(const k in agg){
    const it=itMap[k];
    if(!it)continue;
    const st=ppSteps(it);
    for(const step in agg[k]){
      if(st[step]===undefined)ppEnsureSteps(it,stepsDefOf(p,it));
      if(typeof st[step]==='object')st[step].done=agg[k][step];else st[step]=agg[k][step];
      if(step==='inbound'||step==='finInbound'){
        it.doneQty=agg[k][step];
        const dlLine=it.dlLine!=null?it.dlLine:null;
        let rec=dlLine!=null?inboundDelta.find(x=>x.productId===it.productId&&x.dlLine===dlLine):inboundDelta.find(x=>x.productId===it.productId&&x.dlLine==null);
        if(!rec){rec={productId:it.productId,dlLine:dlLine,qty:0,orderLine:ppOrderLineOf(p,it)};inboundDelta.push(rec);}
        rec.qty+=(agg[k][step]-num(oldInbound[k]));
      }
    }
  }
  updates.forEach(u=>{
    const rec=productionReports[u.idx];
    rec.worker=u.worker;
    (rec.items||[]).forEach(x=>{x.qty=num(u.qtyMap[x.step]);});
  });
  const allDone=ppItems(p).every(z=>ppPlanOf(z)>0&&ppDoneOf(z)>=ppPlanOf(z));
  if(p.status==='已完成'&&!allDone)p.status='生产中';
  save('productionPlans',productionPlans);
  save('productionReports',productionReports);
  /* 2026-08-25.16：编辑报工后入库累计变化 → 回写订单（.40 行级回写） */
  inboundDelta.forEach(r=>{ if(r.qty)writebackInbound(p.orderId,r.productId,r.qty,r.orderLine); });
  logOp('编辑报工','排产计划','编辑排产单「'+p.id+'」报工明细（报工人/数量）');
  closeModal();
  renderContent();
  /* 2026-08-25.64：编辑报工后状态可能回退（已完成→生产中）导致被筛选隐藏，自动取消勾选 */
  const _rpi=productionPlans.indexOf(p);
  if(_rpi>=0&&!prodPlanRowVisibleInDom(p.id))clearHiddenProdPlanSel(_rpi);
}
/* 删除一条报工明细：同步回退排产单对应工序累计完成数；已完成后回退则状态回到生产中 */
function ppDelReport(id){
  if(!ensureWrite('prodPlan'))return;
  const idx=productionReports.findIndex(r=>r.id===id);
  if(idx<0){alert('未找到该报工记录');return;}
  const rec=productionReports[idx];
  const p=productionPlans.find(x=>x.id===rec.planId);
  const labelParts=(rec.items||[]).map(x=>x.label+'-'+money(x.qty)).join('、');
  if(!confirm('删除该条报工（'+(rec.date||'')+' '+(rec.time||'')+' '+(rec.worker||'')+'：'+labelParts+'）？\n\n将同步回退排产单「'+rec.planId+'」的累计完成数，此操作不可撤销。'))return;
  const inboundDelta={};                       // 2026-08-25.16：删除报工 → 扣回订单已交付
  if(p){
    (rec.items||[]).forEach(x=>{
      const it=ppItems(p).find(z=>(z.productId||'')===(x.productId||''));
      if(!it)return;
      const st=ppSteps(it);
      if(st[x.step]===undefined)ppEnsureSteps(it,stepsDefOf(p,it));   // 防御：确保工序键存在
      const v=st[x.step];
      const cur=num(typeof v==='object'?v.done:v);
      const dec=Math.min(num(x.qty),cur);
      if(typeof v==='object')v.done=Math.max(0,cur-dec);else st[x.step]=Math.max(0,cur-dec);
      if(x.step==='inbound'||x.step==='finInbound'){
        it.doneQty=Math.max(0,num(it.doneQty||0)-dec);   // 兼容老 finInbound 记录
        inboundDelta[it.productId||'']=(inboundDelta[it.productId||'']||0)-dec;
      }
    });
    const allDone=ppItems(p).every(z=>ppPlanOf(z)>0&&ppDoneOf(z)>=ppPlanOf(z));
    if(p.status==='已完成'&&!allDone)p.status='生产中';
    save('productionPlans',productionPlans);
  }
  productionReports.splice(idx,1);
  save('productionReports',productionReports);
  /* 2026-08-25.16：删除报工 → 扣回订单已交付 */
  if(p)for(const pid in inboundDelta){ if(inboundDelta[pid])writebackInbound(p.orderId,pid,inboundDelta[pid]); }
  logOp('删除报工','排产计划','删除排产单「'+rec.planId+'」报工 '+(rec.date||'')+' '+(rec.time||'')+'：'+labelParts+'（累计已回退）');
  closeModal();
  renderContent();
  /* 2026-08-25.64：删除报工后状态可能回退（已完成→生产中）导致被筛选隐藏，自动取消勾选 */
  if(p){
    const _dpi=productionPlans.indexOf(p);
    if(_dpi>=0&&!prodPlanRowVisibleInDom(p.id))clearHiddenProdPlanSel(_dpi);
  }
}

     :('<span style="font-size:13px;color:var(--muted)">'+planViewDate.slice(0,7)+' 月</span><label style="margin:0"><input type="month" id="ppDate" value="'+planViewDate.slice(0,7)+'" onchange="ppChangeMonth()" style="width:auto"></label>'))))+
