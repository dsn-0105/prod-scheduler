<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>生产排单与报表系统</title>
<style>
:root{
  --primary:#4f46e5;--primary-light:#eef2ff;--primary-dark:#4338ca;
  --bg:#f1f5f9;--card:#fff;--text:#1e293b;--muted:#94a3b8;--border:#e2e8f0;
  --green:#10b981;--green-bg:#ecfdf5;--red:#ef4444;--red-bg:#fef2f2;
  --amber:#f59e0b;--amber-bg:#fffbeb;--blue:#3b82f6;--blue-bg:#eff6ff;
  --teal:#14b8a6;--purple:#8b5cf6;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --r:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
/* layout */
.app{display:flex;min-height:100vh}
.sidebar{width:210px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s}
.sidebar-header{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.sidebar-header .sub{font-size:11px;color:var(--muted);margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:13px;color:var(--text);border-left:3px solid transparent;transition:all .15s}
.nav-item:hover{background:var(--primary-light)}
.nav-item.nav-dragging{opacity:.55;background:var(--primary-light);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.nav-item.active{background:var(--primary-light);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600}
/* 侧边栏折叠按钮与折叠态（仅桌面端生效） */
.sidebar-collapse{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;border:none;background:var(--card);border-top:1px solid var(--border);color:var(--muted);font-size:13px;width:100%;transition:all .15s}
.sidebar-collapse:hover{color:var(--primary);background:var(--primary-light)}
.sidebar-collapse svg{width:18px;height:18px;flex-shrink:0;transition:transform .2s}
.sidebar.collapsed{width:56px}
.sidebar.collapsed .sidebar-header{padding:18px 0 14px;text-align:center}
.sidebar.collapsed .sidebar-header h1{justify-content:center}
.sidebar.collapsed .sidebar-header h1 span,.sidebar.collapsed .sidebar-header .sub{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px 0}
.sidebar.collapsed .nav-item span,.sidebar.collapsed .nav-badge{display:none}
.sidebar.collapsed .sidebar-collapse{justify-content:center;padding:12px 0}
.sidebar.collapsed .sidebar-collapse span{display:none}
.sidebar.collapsed .sidebar-collapse svg{transform:rotate(180deg)}
.sidebar.collapsed~.main{margin-left:56px}
.main{flex:1;margin-left:210px;min-width:0}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:12px;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar h2{font-size:16px;font-weight:700}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.content{padding:16px 20px 80px}
/* mobile */
.mobile-header{display:none;background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:60}
.mobile-header h1{font-size:15px;font-weight:700}
.hamburger{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer}
.hamburger svg{width:20px;height:20px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
.overlay.show{display:block}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);width:240px}
  .sidebar.open{transform:translateX(0)}
  .sidebar.collapsed{width:240px}
  .sidebar.collapsed .sidebar-header{padding:18px 16px 14px}
  .sidebar.collapsed .sidebar-header h1 span,.sidebar.collapsed .sidebar-header .sub{display:inline}
  .sidebar.collapsed .nav-item{justify-content:flex-start;padding:10px 16px}
  .sidebar.collapsed .nav-item span{display:inline}
  .sidebar.collapsed .sidebar-collapse{justify-content:flex-start;padding:12px 16px}
  .sidebar.collapsed .sidebar-collapse span{display:inline}
  .sidebar.collapsed .sidebar-collapse svg{transform:none}
  .sidebar.collapsed~.main{margin-left:0}
  .main{margin-left:0}
  .mobile-header{display:flex}
  .content{padding:12px 12px 60px}
  .bulk-bar{top:48px}   /* 移动端顶栏(mobile-header)更矮，吸附位置上移 */
}
/* components */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title .desc{font-size:12px;color:var(--muted);font-weight:400}
/* 订单管理：销售订单 / 库存订单 可收起区块 */
.order-sec{border:1px solid var(--border);border-radius:10px;margin-top:12px;overflow:clip;background:var(--card)}
.order-sec-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none;background:linear-gradient(0deg,var(--card),var(--card))}
.order-sec-head:hover{background:#f5f7ff}
.order-sec-head .chev{font-size:12px;color:var(--muted);width:14px;text-align:center;transition:transform .15s}
.order-sec-head b{font-size:14px}
.order-sec-head .desc{font-size:12px;color:var(--muted);font-weight:400}
.order-sec.collapsed .order-sec-body{display:none}
.count-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 7px;border-radius:11px;background:var(--primary);color:#fff;font-size:12px;font-weight:600}
.order-sec-body{padding:8px 12px 12px;border-top:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:13px;cursor:pointer;color:var(--text);transition:all .15s;min-height:36px;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark);color:#fff}
.btn-danger{color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:4px 10px;min-height:30px;font-size:12px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--primary)}
.btn-ghost:hover{background:var(--primary-light)}
input,select,textarea{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);width:100%;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
input[type=checkbox]{width:auto}
input[type=number]{font-variant-numeric:tabular-nums}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.form-row>div{flex:1;min-width:120px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--primary-light);color:var(--primary);font-weight:600;text-align:left;padding:8px 10px;white-space:nowrap;border-bottom:2px solid var(--border)}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
/* 页面主区表格单元格：超出行宽不换行，超出部分省略号 */
#content .table-wrap table td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#content .table-wrap table td .progress-wrap{max-width:100%}
tr:hover td{background:#f8fafc}
.op-col{position:sticky;right:0;z-index:5;background:#ffffff;border-left:2px solid #e5e7eb}
thead .op-col{background:#eef2ff;z-index:6}
.sel-col{position:sticky;left:0;z-index:5;background:#fff;text-align:center;width:44px;vertical-align:middle;padding:6px 4px}
thead .sel-col{background:#eef2ff;z-index:6}
.sel-col input{cursor:pointer;width:16px;height:16px}
/* 排产计划展开按钮列（build 2026-08-24.8） */
.exp-col{text-align:center;width:36px;vertical-align:middle;padding:4px 2px;background:#fff}
thead .exp-col{background:#eef2ff}
.exp-col .pp-exp-btn{background:none;border:none;cursor:pointer;font-size:12px;color:var(--primary);padding:2px 6px;border-radius:4px;transition:transform .15s;line-height:1}
.exp-col .pp-exp-btn:hover{background:rgba(59,130,246,.12)}
.exp-col .pp-exp-btn.on{transform:rotate(90deg)}
/* 展开行：报工明细（缩进块） */
.pp-exp-row td{background:#f8fafc;padding:10px 16px 10px 56px}
.pp-exp{max-width:900px}
.pp-exp-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px}
.pp-exp-empty{font-size:13px;color:var(--muted);padding:6px 0}
.pp-rep-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:5px 0;border-bottom:1px dashed #e5e7eb;font-size:13px}
.pp-rep-line:last-child{border-bottom:none}
.pp-rep-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:104px}
.pp-rep-worker{font-weight:600;min-width:52px}
.pp-rep-parts{display:flex;flex-wrap:wrap;gap:4px 10px;flex:1}
.pp-rep-item{white-space:nowrap}
.pp-rep-item b{color:var(--primary)}
/* 报工明细编辑行（build 2026-08-24.13） */
.rep-edit-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fff}
.rep-edit-row .pp-rep-time{min-width:96px}
.rep-edit-row .pp-rep-worker{min-width:118px}
.rep-edit-row input{border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:13px}
/* 工序模板卡片（build 2026-08-24.11） */
.tpl-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.tpl-head{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.tpl-head b{font-size:14px}
.tpl-id{font-size:11px;color:var(--muted);background:#f1f5f9;padding:1px 6px;border-radius:4px}
.tpl-steps{display:flex;flex-wrap:wrap;gap:6px}
.tpl-chip{font-size:12px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:6px;padding:3px 8px}
.tpl-chip.mand{background:#fef2f2;color:#dc2626;border-color:#fecaca}
.tpl-notes{font-size:12px;color:var(--muted)}
.tpl-ops{display:flex;gap:6px;margin-top:2px}
.table-wrap tbody tr{cursor:pointer}
.table-wrap tbody tr:hover{background:#f5f7ff}
/* 选中行高亮：透明蓝（row-sel 类由 updateSelUI 切换；td 覆盖含左右吸顶列与 rowspan 合并组） */
#content .table-wrap tbody tr.row-sel td{background:rgba(59,130,246,.16)}
#content .table-wrap tbody tr.row-sel:hover td{background:rgba(59,130,246,.24)}
.bulk-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 6px;position:sticky;top:58px;z-index:40;background:var(--primary-light);border-radius:8px;padding:6px 8px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.bulk-bar .sel-count{font-size:12px;color:var(--primary);margin-left:2px}
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border);scrollbar-width:none}
/* 2026-08-25.8：订单表头随页面滚动固定（借鉴金蝶表头/表体双表结构；表头容器用 div sticky，
   规避 rowspan 合并 + table-layout:fixed 下 sticky thead 的 Chrome 渲染 bug；表头表/表体表列宽经 colgroup 对齐） */
.sticky-head{position:sticky;top:58px;z-index:20;background:var(--primary-light);border-radius:0;overflow:hidden}   /* 2026-08-25.14：去掉负 margin（sticky 吸附不可靠），未滚动贴住改由操作栏 margin-bottom:0 实现 */
/* 2026-08-25.11：订单区块操作栏去阴影+圆角+下margin（与表头未滚动/吸附均 0 空隙贴住，视觉一条带）
   2026-08-25.15：推广到 .card 内区块（产品/交付/排产日视图，操作栏与 sticky 表头融合） */
.order-sec .bulk-bar,.card .bulk-bar{box-shadow:none;border-radius:0;margin-bottom:0}
.head-scroll{overflow-x:auto;scrollbar-width:none}
.head-scroll::-webkit-scrollbar{display:none;height:0}
.head-tbl,.body-tbl{table-layout:fixed}
.sticky-head+.table-wrap{border-radius:0 0 8px 8px;border-top:none}
@media(max-width:768px){.sticky-head{top:48px}}
.table-wrap::-webkit-scrollbar{display:none;height:0}
/* 页面底部固定横向滚动条（不随页面/表格滚动位移） */
.bottom-scrollbar{position:fixed;left:0;right:0;bottom:0;height:14px;overflow-x:auto;overflow-y:hidden;background:#fff;border-top:1px solid var(--border);z-index:150;display:none;scrollbar-width:thin}
.bottom-scrollbar::-webkit-scrollbar{height:10px}
.bottom-scrollbar::-webkit-scrollbar-thumb{background:#c7cdd8;border-radius:5px;border:2px solid #fff}
.bottom-scrollbar::-webkit-scrollbar-thumb:hover{background:#a8b1c0}
.bottom-scrollbar::-webkit-scrollbar-track{background:transparent}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.tag-green{background:var(--green-bg);color:var(--green)}
.tag-red{background:var(--red-bg);color:var(--red)}
.tag-amber{background:var(--amber-bg);color:var(--amber)}
.tag-blue{background:var(--blue-bg);color:var(--blue)}
.tag-gray{background:#f1f5f9;color:var(--muted)}
/* modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
/* 编辑保存后行被筛选/排序隐藏的顶部提示浮条（非阻塞，可一键清除筛选恢复显示） */
.save-notice{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:300;display:flex;gap:10px;align-items:center;background:#fff7ed;border:1px solid #fdba74;color:#9a3412;padding:9px 14px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:13px;max-width:82vw}
.modal{background:var(--card);border-radius:12px;width:66.6667vw;max-width:66.6667vw;min-width:320px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1}
.modal-head h3{font-size:16px;font-weight:700}
.modal-body{padding:18px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--card)}
.close-x{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px;color:var(--muted)}
.close-x:hover{background:#f1f5f9}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);border-left:4px solid var(--primary)}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.stat.green{border-left-color:var(--green)} .stat.red{border-left-color:var(--red)} .stat.amber{border-left-color:var(--amber)} .stat.blue{border-left-color:var(--blue)}
/* alert */
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px}
.alert-red{background:var(--red-bg);color:var(--red);border:1px solid #fecaca}
.alert-amber{background:var(--amber-bg);color:var(--amber);border:1px solid #fde68a}
.alert-blue{background:var(--blue-bg);color:var(--blue);border:1px solid #bfdbfe}
.alert svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
/* section headers in daily plan */
.sec-header{font-size:13px;font-weight:700;padding:8px 12px;border-radius:8px;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.sec-stockup{background:var(--blue-bg);color:var(--blue)}
.sec-packaging{background:var(--amber-bg);color:var(--amber)}
/* field settings */
.fs-layout{display:flex;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.fs-menu{width:200px;border-right:1px solid var(--border);background:#f8fafc;padding:8px}
.fs-menu-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.fs-menu-item:hover{background:var(--primary-light)}
.fs-menu-item.active{background:var(--primary);color:#fff;font-weight:600}
.fs-menu-item svg{width:16px;height:16px}
.fs-body{flex:1;padding:14px}
.fs-menu-item .dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:auto}
.fs-menu-item.active .dot{background:#fff}
@media(max-width:640px){
  .fs-layout{flex-direction:column}
  .fs-menu{width:100%;border-right:none;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:8px}
  .fs-menu-item{white-space:nowrap;margin-bottom:0;margin-right:2px}
}
.lock{width:14px;height:14px;display:inline;vertical-align:-2px;color:var(--muted)}
.fs-auditbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.fs-audit-actions{display:flex;gap:8px;flex-wrap:wrap}
.audit-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 12px;border-radius:20px}
.audit-badge.audited{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.audit-badge.draft{background:#fef3c7;color:#b45309;border:1px solid #fcd34d}
.hide{display:none!important}
.backup-warn{background:var(--amber-bg);border:1px solid #fde68a;color:var(--amber);padding:8px 14px;border-radius:8px;font-size:12px;margin-bottom:10px}
.progress-wrap{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.progress-bar{height:100%;background:var(--primary);border-radius:3px;transition:width .3s}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:13px}
.empty svg{width:40px;height:40px;margin-bottom:8px;opacity:.4}
/* 表格筛选/排序 */
.th-sort{cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden}
.th-sort .th-flex{display:inline-flex;align-items:center;max-width:100%}
.th-sort .th-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;min-width:0}
.th-sort .sort-ico,.th-sort .filt-ico{flex:0 0 auto}
.th-sort:hover{filter:brightness(.96)}
.sort-ico{font-size:9px;margin-left:3px;color:#c7d2fe;display:inline-block}
.sort-ico.on{color:var(--primary)}
.filt-ico{margin-left:5px;display:inline-flex;vertical-align:-2px;cursor:pointer;opacity:.4;border-radius:4px;padding:1px}
.filt-ico:hover{opacity:1;background:rgba(79,70,229,.15)}
.filt-ico.on{opacity:1;color:var(--primary);background:var(--primary-light)}
/* 列头拖拽调序 + 拖拽调宽 */
.th-rs{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;z-index:2}
.th-rs::after{content:'';position:absolute;right:3px;top:25%;bottom:25%;width:2px;border-radius:1px;background:transparent}
.th-sort:hover .th-rs::after,.th-rs:hover::after{background:var(--primary)}
th.th-sort{position:relative}
th.th-dragging{opacity:.45}
th.th-drop-before{box-shadow:inset 3px 0 0 0 var(--primary)}
th.th-drop-after{box-shadow:inset -3px 0 0 0 var(--primary)}
body.col-resizing{cursor:col-resize;user-select:none}
body.col-dragging{cursor:grabbing;user-select:none}

<script>
/* ================================================================
   DB 异步数据层 — 服务器就绪
   现在：localStorage  |  将来：把 API_BASE 填上服务器地址，
   DB.get/set 内部换成 fetch 即可，前端其余逻辑无需改动。
================================================================ */
/* ================================================================
   DB 异步数据层 — 服务器模式（多员工共享，实时同步）
   服务器模式：API_BASE='/api'，数据存服务器，5 秒轮询版本号自动同步
   本地模式：API_BASE=''，数据存 localStorage（单机兜底）
================================================================ */
const API_BASE='/api'; // 服务器模式；本地单机调试可改为 '' 回退 localStorage
const KEY='wb_cb_prod_';
let authToken='';
try{authToken=localStorage.getItem(KEY+'token')||'';}catch(e){}
let serverData=null;
let serverRevs={};
let syncTimer=null;

async function apiReq(path,opts){
  const r=await fetch(API_BASE+path,opts);
  if(r.status===401){showLogin();throw new Error('unauthorized');}
  return r;
}
async function pullAll(){
  const r=await apiReq('/data?token='+authToken);
  const j=await r.json();
  serverData=j.data;serverRevs=j.revs||{};
}
const DB={
  async get(k,def){
    if(API_BASE){
      try{
        if(!serverData)await pullAll();
        return serverData&&serverData[k]!==undefined?serverData[k]:def;
      }catch(e){return def;}
    }
    try{const v=localStorage.getItem(KEY+k);return v?JSON.parse(v):def;}catch(e){return def;}
  },
  async set(k,v,silent){
    if(API_BASE){
      try{
        const r=await apiReq('/save?token='+authToken,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k,value:v})});
        if(!r.ok){
          if(!silent){
            let msg='保存失败('+r.status+')';
            try{const j=await r.json();if(j&&j.error)msg+='：'+j.error;}catch(_e){}
            alert(msg+'，数据可能未同步到服务器，请刷新后检查。');
          }
          return false;
        }
        if(serverData)serverData[k]=v;
        return true;
      }catch(e){if(!silent&&e&&e.message!=='unauthorized')alert('保存失败（网络异常）：'+e.message);return false;}
    }
    localStorage.setItem(KEY+k,JSON.stringify(v));
    return true;
  }
};
/* ---- 实时同步：轮询版本号，有变化自动拉取刷新 ---- */
async function pollRevs(){
  if(!API_BASE||!authToken)return;
  try{
    const r=await fetch(API_BASE+'/revs?token='+authToken);
    if(r.status===401){showLogin();return;}
    const j=await r.json();
    let changed=false;
    for(const k in j.revs){if(j.revs[k]!==(serverRevs[k]||0)){changed=true;break;}}
    if(changed){
      await pullAll();
      if(typeof bootDone!=='undefined'&&bootDone)renderContent();
    }
  }catch(e){}
}
function startSync(){
  if(syncTimer||!API_BASE)return;
  syncTimer=setInterval(pollRevs,5000);
}
/* ---- 登录界面 ---- */
function showLogin(msg){
  let el=document.getElementById('loginBox');
  if(!el){
    el=document.createElement('div');
    el.id='loginBox';
    el.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:300;display:flex;align-items:center;justify-content:center';
    el.innerHTML='<div style="background:#fff;border-radius:12px;padding:28px 30px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.25)">'
      +'<h2 style="font-size:17px;margin-bottom:2px">生产排单系统</h2>'
      +'<div style="font-size:12px;color:#94a3b8;margin-bottom:16px">多员工在线版 · 请登录</div>'
      +'<label>用户名</label><input id="loginUser" style="margin-bottom:10px">'
      +'<label>密码</label><input id="loginPwd" type="password" style="margin-bottom:4px">'
      +'<div id="loginErr" style="color:#ef4444;font-size:12px;min-height:18px;margin-top:4px">'+(msg||'')+'</div>'
      +'<button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doLogin()">登 录</button>'
      +'</div>';
    document.body.appendChild(el);
    el.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  }else{
    const err=el.querySelector('#loginErr');if(err&&msg)err.textContent=msg;
  }
  el.style.display='flex';
}
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPwd').value;
  const err=document.getElementById('loginErr');
  if(!u||!p){err.textContent='请输入用户名和密码';return;}
  try{
    const r=await fetch(API_BASE+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const j=await r.json();
    if(!r.ok){err.textContent=j.error||'登录失败';return;}
    authToken=j.token;
    currentUser={username:j.username,name:j.name,role:j.role,perms:j.perms||{}};
    try{localStorage.setItem(KEY+'token',authToken);}catch(e){}
    serverData=null;serverRevs={};
    const lb=document.getElementById('loginBox');if(lb)lb.style.display='none';
    try{await pullAll();}catch(e){}
    await initApp();
  }catch(e){err.textContent='无法连接服务器';}
}
function logout(){
  if(!confirm('确认退出登录？'))return;
  authToken='';currentUser=null;
  try{localStorage.removeItem(KEY+'token');}catch(e){}
  serverData=null;serverRevs={};
  showLogin();
}
/* ---- 权限：按表单控制写权限（管理员全放行；员工按 perms 逐表单） ---- */
let currentUser=null;
function formToKey(formKey){
  const m={product:'products',order_frame:'orders',order_inv:'orders',dp_stockup:'dailyPlans',dp_pkg:'dailyPkgs',delivery:'deliveries',prodPlan:'dailyPlans',processTpl:'processTemplates',fields:'fields',report:'report',logs:'logs',transfers:'transfers'};
  return m[formKey]||formKey;
}
function canWriteKey(k){
  if(!currentUser)return false;
  if(currentUser.role==='admin')return true;
  return !!(currentUser.perms&&currentUser.perms[k]===true);
}
function canWriteForm(formKey){return canWriteKey(formToKey(formKey));}
function ensureWrite(formKey){
  if(!canWriteForm(formKey)){alert('当前账号无该表单的编辑权限');return false;}
  return true;
}
/* 兼容包装：旧代码 save/load 同步调用 */
function save(k,v){
  DB.set(k,v);
  // 业务数据变更后自动备份（仅本地模式；服务器模式数据已持久化在服务器）
  if(!API_BASE && bootDone && ['products','orders','dailyPlans','dailyPkgs','deliveries','fields'].indexOf(k)>=0){
    try{scheduleAutoBackup();}catch(e){}
  }
  return v;
}
function load(k,def){try{const v=localStorage.getItem(KEY+k);return v?JSON.parse(v):def;}catch(e){return def;}}
// 自动备份状态（可携式 .json 文件，用于链接轮换后一键恢复）
let autoBackupOn=false, bootDone=false, lastAutoBackup=0;
const AUTO_BACKUP_MIN=15; // 两次自动备份最小间隔(分钟)

/* ================================================================
   常量
================================================================ */
const PROCESS_STEPS=['assembly','innerPack','testAging','semiInbound'];
const PROCESS_LABELS={assembly:'装配',innerPack:'内包',testAging:'调试老化',semiInbound:'半成品入库'};
const PKG_STEPS=['packaging','finishedInbound'];
const PKG_LABELS={packaging:'包装',finishedInbound:'成品入库'};
const STOCK_STATUS={normal:{label:'正常',cls:'tag-green'},low:{label:'低于下限',cls:'tag-red'},high:{label:'高于上限',cls:'tag-amber'}};
const ORDER_STATUS=['执行中','已完成','已取消','已暂停'];
const ORDER_TYPES=['销售订单','库存订单'];
const DELIVERY_FREQ=['每周一次(周一)','每周一次(周五)','每三天一次','每日'];
const LOCK='<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

/* ================================================================
   引用字段引擎（字段可引用其它表单的某个字段，录入时自动带出）
================================================================ */
const FORM_DATA={
  product:()=>products,
  order:()=>orders,
  dailyPlan:()=>dailyPlans,
  dailyPkg:()=>dailyPkgs,
  delivery:()=>deliveries
};

/* 在 refForm 中找到 refMatch 字段值等于 keyVal 的记录，返回 refField 的值 */
function lookupRef(refForm,refMatch,keyVal,refField){
  if(!refForm||!refField)return '';
  const data=(FORM_DATA[refForm]&&FORM_DATA[refForm]())||[];
  if(keyVal==null||keyVal==='')return '';
  const rec=data.find(r=>String(r[refMatch]!=null?r[refMatch]:'')===String(keyVal));
  return rec?rec[refField]:'';
}
/* 当前 sec 中，被某个 ref 字段用作关联键(refKey)的字段 key 集合 */
function refKeysOf(sec){
  const set=new Set();
  ((fields[sec]||[]).filter(f=>f.type==='ref')).forEach(f=>{ if(f.refKey)set.add(f.refKey); });
  return set;
}
function fieldLabel(sec,key){
  const f=(fields[sec]||[]).find(x=>x.key===key);
  return f?f.label:key;
}
/* 通用控件生成：支持 ref 类型（只读带出）与关联键 onchange 绑定 */
function genControl(f,prefix,val,sec,disabled){
  const id=prefix+f.key;
  const isRefKey=(sec&&refKeysOf(sec).has(f.key));
  const onch=isRefKey?' onchange="refKeyTrigger(this)"':'';
  const dis=disabled?' disabled':'';
  if(f.type==='ref'){
    return '<input type="text" id="'+id+'" class="ref-field" data-key="'+f.key+'" data-ref-form="'+esc(f.refForm||'')+'" data-ref-match="'+esc(f.refMatch||'')+'" data-ref-field="'+esc(f.refField||'')+'" data-ref-key="'+esc(f.refKey||'')+'" value="'+esc(val)+'" readonly style="background:#f6f8fa;color:var(--muted)">';
  }
  if(f.type==='select'){
    return '<select id="'+id+'"'+dis+onch+'>'+(f.options||[]).map(o=>'<option '+(o===val?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  }
  if(f.type==='textarea'){
    return '<textarea id="'+id+'" rows="2"'+dis+onch+'>'+esc(val)+'</textarea>';
  }
  const tp=f.type==='number'?'number':(f.type==='date'?'date':'text');
  return '<input type="'+tp+'" id="'+id+'" value="'+esc(f.type==='date'?fmtDate(val):val)+'"'+(f.required?' required':'')+dis+onch+'>';
}
/* 关联键变化时，带出同容器内所有依赖它的引用字段 */
function refKeyTrigger(el){
  const root=el.closest('tr')||el.closest('form')||el.closest('.modal-body')||el.parentElement;
  const key=el.getAttribute('data-key');
  if(!root||!key)return;
  root.querySelectorAll('.ref-field').forEach(rf=>{
    if(rf.getAttribute('data-ref-key')===key){
      const refForm=rf.getAttribute('data-ref-form');
      const refMatch=rf.getAttribute('data-ref-match');
      const refField=rf.getAttribute('data-ref-field');
      const kvEl=root.querySelector('[data-key="'+key+'"]');
      const kv=kvEl?kvEl.value:'';
      rf.value=lookupRef(refForm,refMatch,kv,refField);
    }
  });
}

/* ================================================================
   操作日志
================================================================ */
function logOp(action,target,detail,field,oldv,newv){
  var entry={time:new Date().toLocaleString('zh-CN',{hour12:false}),action:action,target:target,detail:detail,
    field:field||'', oldv:(oldv===undefined?'':oldv), newv:(newv===undefined?'':newv)};
  logs.unshift(entry);
  if(logs.length>500)logs=logs.slice(0,500);
  save('logs',logs);
}
/* 字段级日志增强：硬编码表单(排产/交付)的字段名映射 */
const HARD_FIELDS={
  dailyPlan:[
    {key:'date',label:'日期'},{key:'productId',label:'产品编码'},{key:'productName',label:'产品名称'},
    {key:'assemblyPlan',label:'装配计划'},{key:'assemblyDone',label:'装配实际'},{key:'innerPackPlan',label:'内包装计划'},
    {key:'innerPackDone',label:'内包装实际'},{key:'testAgingPlan',label:'测试老化计划'},{key:'testAgingDone',label:'测试老化实际'},
    {key:'semiInbound',label:'半成品入库'},{key:'notes',label:'备注'}
  ],
  dailyPkg:[
    {key:'date',label:'日期'},{key:'productId',label:'产品编码'},{key:'productName',label:'产品名称'},
    {key:'orderId',label:'关联订单'},{key:'pkgPlan',label:'包装计划'},{key:'pkgDone',label:'包装实际'},
    {key:'finInbound',label:'成品入库'},{key:'orderTotal',label:'订单总量'},{key:'delivered',label:'已交付'},
    {key:'undelivered',label:'未交付'},{key:'notes',label:'备注'}
  ],
  delivery:[
    {key:'orderId',label:'订单编号'},{key:'customer',label:'客户'},{key:'productId',label:'产品编码'},
    {key:'productName',label:'产品名称'},{key:'orderTotal',label:'订单总量'},{key:'delivered',label:'已交付'},
    {key:'undelivered',label:'未交付'},{key:'planQty',label:'本批计划'},{key:'finalDate',label:'最终交付期'},
    {key:'firstDate',label:'首次交付日'},{key:'notes',label:'备注'}
  ],
  prodPlan:[
    {key:'planDate',label:'计划生产日期'},{key:'materialReadyDate',label:'物料齐套时间'},{key:'finalDate',label:'交付期'},{key:'status',label:'状态'},
    {key:'notes',label:'备注'}
  ]
};
function fmtLogVal(v){ if(v===undefined||v===null||v==='')return '空'; return String(v); }
function logFieldEdit(formLabel,fieldLabel,oldv,newv,recLabel){
  var d='记录「'+(recLabel||'')+'」：'+fmtLogVal(oldv)+' → '+fmtLogVal(newv);
  logOp('编辑',formLabel,d,fieldLabel,oldv,newv);
}
/* 逐字段对比旧/新记录并记录变更 */
function logFieldDiffs(formLabel,fieldDefs,oldRec,newRec,recLabel){
  if(!fieldDefs||!fieldDefs.length)return;
  fieldDefs.forEach(f=>{
    var k=f.key;
    var ov=oldRec&&oldRec[k]!=null?oldRec[k]:'';
    var nv=newRec&&newRec[k]!=null?newRec[k]:'';
    if(String(ov)!==String(nv)) logFieldEdit(formLabel,f.label,ov,nv,recLabel);
  });
}
/* 订单明细行逐行对比 */
function logOrderLineDiffs(formLabel,oldItems,newItems,recLabel){
  var lineDefs=orderLineFields();
  var n=Math.max(oldItems?oldItems.length:0,newItems?newItems.length:0);
  for(var i=0;i<n;i++){
    var oldIt=oldItems&&oldItems[i]?oldItems[i]:null;
    var newIt=newItems&&newItems[i]?newItems[i]:null;
    var prefix='第'+(i+1)+'行·';
    if(!oldIt&&newIt){ logFieldEdit(formLabel,prefix+'明细', '', '(新增明细行)', recLabel); continue; }
    if(oldIt&&!newIt){ logFieldEdit(formLabel,prefix+'明细', '(删除明细行)', '', recLabel); continue; }
    lineDefs.forEach(f=>{
      var k=f.key;
      var ov=oldIt[k]!=null?oldIt[k]:'';
      var nv=newIt[k]!=null?newIt[k]:'';
      if(String(ov)!==String(nv)) logFieldEdit(formLabel,prefix+f.label,ov,nv,recLabel);
    });
  }
}

/* ================================================================
   表格筛选/排序引擎（所有表格通用）
   - 点击列头：排序（升 → 降 → 取消）
   - 点击列头漏斗：弹出筛选面板
================================================================ */
var tblState={};      // tblState[模块]={sort:{key,dir},filters:{key:{mode,val,vals}}}
var TBL_SCHEMAS={};   // 每个表格的列定义（渲染时注册）
var TBL_ROWS={};      // 每个表格当前数据（渲染时注册，供筛选面板取唯一值）

function tState(m){if(!tblState[m])tblState[m]={sort:null,filters:{}};return tblState[m];}
function colVal(col,r){return col.get?col.get(r):(r[col.key]!=null?r[col.key]:'');}

function filterRows(m,rows){
  const s=tState(m),schema=TBL_SCHEMAS[m]||[];
  return rows.filter(r=>{
    for(const key of Object.keys(s.filters)){
      const f=s.filters[key];if(!f)continue;
      const hasVals=f.vals&&f.vals.length>0;
      const hasVal=f.val!==''&&f.val!=null;
      const isEmptyMode=f.mode==='is_empty'||f.mode==='not_empty'||dateQuickMode(f);   /* 2026-08-25.42/.43：为空/不为空/日期快捷模式 val 恒空，须绕过 hasVal 判定 */
      if(!hasVals&&!hasVal&&!isEmptyMode)continue;
      const col=schema.find(c=>c.key===key);if(!col)continue;
      const v=colVal(col,r);
      if(col.type==='number'){
        const nv=num(v);
        if(hasVals){if(f.vals.map(x=>num(x)).indexOf(nv)<0)return false;}
        else{
          const fv=num(f.val);
          if(f.mode==='gte'&&!(nv>=fv))return false;
          if(f.mode==='lte'&&!(nv<=fv))return false;
          if(f.mode==='eq'&&nv!==fv)return false;
          if(f.mode==='neq'&&nv===fv)return false;
        }
      }else if(col.type==='date'){
        const dv=fmtDate(v);
        if(hasVals){if(f.vals.indexOf(dv)<0)return false;}
        else{
          if(f.mode==='gte'&&!(dv>=f.val))return false;
          if(f.mode==='lte'&&!(dv<=f.val))return false;
          if(f.mode==='eq'&&dv!==f.val)return false;
          if(f.mode==='neq'&&dv===f.val)return false;
          /* 2026-08-25.43：金蝶日期快捷模式（order_frame）——今天/本周/本月/上月/过去一月/过去三月/从…到… */
          const t=todayStr();
          if(f.mode==='today'&&dv!==t)return false;
          if(f.mode==='this_week'&&getWeekStart(dv)!==getWeekStart(t))return false;
          if(f.mode==='this_month'&&dv.slice(0,7)!==t.slice(0,7))return false;
          if(f.mode==='last_month'&&dv.slice(0,7)!==addMonthsStr(t,-1).slice(0,7))return false;
          if(f.mode==='last_1m'&&dv<addMonthsStr(t,-1))return false;
          if(f.mode==='last_3m'&&dv<addMonthsStr(t,-3))return false;
          if(f.mode==='range'&&(dv<f.from||dv>f.to))return false;
        }
      }else{
        const sv=String(v);
        if(hasVals){if(f.vals.indexOf(sv)<0)return false;}
        else{
          const fv=String(f.val);
          /* 2026-08-25.42：金蝶式 8 模式（含 不包含/以…开始/以…结束/为空/不为空；为空/不为空用原始值判定，避免 String(null)='null' 失真） */
          if(f.mode==='eq'&&sv!==fv)return false;
          if(f.mode==='neq'&&sv===fv)return false;
          if((f.mode==='contains'||!f.mode)&&sv.toLowerCase().indexOf(fv.toLowerCase())<0)return false;
          if(f.mode==='not_contains'&&sv.toLowerCase().indexOf(fv.toLowerCase())>=0)return false;
          if(f.mode==='startswith'&&sv.toLowerCase().indexOf(fv.toLowerCase())!==0)return false;
          if(f.mode==='endswith'&&sv.toLowerCase().lastIndexOf(fv.toLowerCase())!==sv.length-fv.length)return false;
          if(f.mode==='is_empty'&&!(v==null||v===''))return false;
          if(f.mode==='not_empty'&&(v==null||v===''))return false;
        }
      }
    }
    return true;
  });
}

function sortRows(m,rows){
  const s=tState(m);
  if(!s.sort)return rows;
  const col=(TBL_SCHEMAS[m]||[]).find(c=>c.key===s.sort.key);
  if(!col)return rows;
  const dir=s.sort.dir;
  return [...rows].sort((a,b)=>{
    let va=colVal(col,a),vb=colVal(col,b);
    if(typeof col.sort==='function')return (col.sort(va)-col.sort(vb))*dir;   /* 自定义语义排序（如交付计划状态权重） */
    if(col.type==='number')return (num(va)-num(vb))*dir;
    if(col.type==='date'){va=fmtDate(va);vb=fmtDate(vb);return va<vb?-dir:(va>vb?dir:0);}
    va=String(va);vb=String(vb);
    return va.localeCompare(vb,'zh-CN')*dir;
  });
}

function applyTable(m,rows){return sortRows(m,filterRows(m,rows));}

/* ================================================================
   2026-08-25.66：金蝶式表单分页（order_frame 试点）；.68 泛化推广：order_frame/order_inv/delivery/prodPlan
   （行模型带分组=整单不拆）/product/transfers/logs（单行模型直接切行）。每页条数 10/100/1000（localStorage 记忆）；
   排序/筛选后回第 1 页
================================================================ */
var tblPage={};   // tblPage[formKey]={page,size,total,maxPage,groupCount}
const PAGE_SIZES=[10,100,1000];
/* 2026-08-25.68：启用分页的表单；组模型（rowspan 合并）用 groupKey 整组不拆，单行模型直接切行 */
const PAGED_FORMS={order_frame:1,order_inv:1,product:1,delivery:1,prodPlan:1,transfers:1,logs:1};
const PAGED_GROUP_LABEL={order_frame:'张',order_inv:'张',delivery:'张',prodPlan:'张'};
function pageSizeOf(m){
  const t=tblPage[m];
  if(t&&t.size)return t.size;
  let v=100;
  try{v=parseInt(localStorage.getItem(KEY+'pageSize_'+m)||'100',10)||100;}catch(e){}
  if(!t)tblPage[m]={page:1,size:v};else t.size=v;
  return v;
}
function pageOf(m){const t=tblPage[m];return t&&t.page?t.page:1;}
function pagerGo(m,to){
  if(!tblPage[m])tblPage[m]={page:1,size:pageSizeOf(m)};
  const max=tblPage[m].maxPage||1;
  tblPage[m].page=Math.min(Math.max(1,to),max);
  renderContent();
}
function pagerSize(m,v){
  const s=parseInt(v,10)||100;
  tblPage[m]={page:1,size:s};
  try{localStorage.setItem(KEY+'pageSize_'+m,String(s));}catch(e){}
  renderContent();
}
function pagerJump(m,inp){
  const v=parseInt(inp.value,10);
  if(!isNaN(v))pagerGo(m,v);
  else{inp.value=pageOf(m);}
}
/* 泛化分页切片（.68）：groupKey=分组函数（组模型整组不拆，如订单按 r.order.id、交付按 r.di、排产按 r.p.id）；
   无 groupKey=单行模型直接按行切。页码越界自动回 1；返回 {rows,maxPage,total,groupCount} */
function slicePaged(m,shown,size,groupKey){
  const total=shown.length;
  if(!total)return {rows:[],maxPage:1,total:0,groupCount:0};
  const pages=[];let gc=0;
  if(groupKey){
    const gmap=new Map();
    shown.forEach(r=>{const gk=groupKey(r);if(!gmap.has(gk))gmap.set(gk,[]);gmap.get(gk).push(r);});
    let cur=[],cnt=0;
    gmap.forEach(g=>{if(cnt>0&&cnt+g.length>size){pages.push(cur);cur=[];cnt=0;}cur=cur.concat(g);cnt+=g.length;});
    if(cur.length)pages.push(cur);
    gc=gmap.size;
  }else{
    for(let i=0;i<shown.length;i+=size)pages.push(shown.slice(i,i+size));
  }
  const maxPage=pages.length||1;
  let page=pageOf(m);if(page>maxPage)page=1;
  if(!tblPage[m])tblPage[m]={page:1,size:size};
  tblPage[m].page=page;tblPage[m].maxPage=maxPage;tblPage[m].total=total;tblPage[m].groupCount=gc;
  return {rows:pages[page-1]||[],maxPage:maxPage,total:total,groupCount:gc};
}
/* 金蝶式分页栏 HTML（放操作栏最右侧；组模型显示 (M 张)，单行模型仅「共 N 条明细」；信息区单 span 防换行） */
function pagerHtml(m){
  const t=tblPage[m];
  if(!PAGED_FORMS[m]||!t||!t.total)return '';
  const sz=t.size||pageSizeOf(m);
  const pg=Math.min(t.page||1,t.maxPage||1);
  const disF=pg<=1,disL=pg>=(t.maxPage||1);
  const gl=PAGED_GROUP_LABEL[m]&&t.groupCount>0?(' ('+t.groupCount+' '+PAGED_GROUP_LABEL[m]+')'):'';
  return '<span class="tbl-pager" style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-size:12px;color:var(--muted)">'+
    '<span>共 '+t.total+' 条明细'+gl+' · 第 <input type="text" value="'+pg+'" style="width:38px;text-align:center;padding:1px 2px;border:1px solid var(--border);border-radius:4px" onkeydown="if(event.key===\'Enter\')pagerJump(\''+m+'\',this)" onchange="pagerJump(\''+m+'\',this)"> 页 / 共 '+t.maxPage+' 页</span>'+
    '<button class="btn btn-sm" '+(disF?'disabled':'')+' onclick="pagerGo(\''+m+'\',1)" title="第一页">|◀</button>'+
    '<button class="btn btn-sm" '+(disF?'disabled':'')+' onclick="pagerGo(\''+m+'\','+(pg-1)+')" title="上一页">◀</button>'+
    '<button class="btn btn-sm" '+(disL?'disabled':'')+' onclick="pagerGo(\''+m+'\','+(pg+1)+')" title="下一页">▶</button>'+
    '<button class="btn btn-sm" '+(disL?'disabled':'')+' onclick="pagerGo(\''+m+'\','+(t.maxPage||1)+')" title="最后一页">▶|</button>'+
    '<select style="padding:1px 2px;border:1px solid var(--border);border-radius:4px" onchange="pagerSize(\''+m+'\',this.value)">'+PAGE_SIZES.map(s=>'<option value="'+s+'" '+(s===sz?'selected':'')+'>'+s+'条/页</option>').join('')+'</select></span>';
}

/* 2026-08-25.63：库存状态 4 档（数量 vs 上下限）——red(数量<0 欠货)/amber(0<数量<最小 缺货风险)/green(最小~最大 正常)/gray(数量>最大 积压)；未设限或限=0 时落 green，0 值落 green（用户口径：>0 且<最小才黄色） */
function invStockLevel(v,min,max){
  if(num(v)<0)return 'red';
  if(num(v)>0&&min!=null&&min!==''&&num(min)>0&&num(v)<num(min))return 'amber';
  if(max!=null&&max!==''&&num(max)>0&&num(v)>num(max))return 'gray';
  return 'green';
}
/* 2026-08-30.92：订单行数量（库存订单=最大库存量 stockMax，销售订单=orderQty；历史空 stockMax 回退 orderQty） */
function invQtyOf(o,it){return (o.orderType==='库存订单'&&it.stockMax!=null&&it.stockMax!=='')?num(it.stockMax):num(it.orderQty);}
/* 2026-08-30.90：库存订单行「一句话总结」（用户口径：已交付=当前实物库存余量，结余=未来预期库存）——
   组合覆盖 7 种状态：欠货+计划补足/欠货+计划不足/欠货+计划过量/缺货无计划/缺货有计划/正常/积压；欠货统一加「需要尽快生产」 */
function invRowSummary(dq,balance,min,max,lvD,lvB){
  var s;
  if(lvD==='red')s='当前欠货 '+money(Math.abs(dq))+' 件，需要尽快生产';
  else if(lvD==='amber')s='库存 '+money(dq)+' 件低于最小库存 '+money(min)+'，有缺货风险';
  else if(lvD==='gray')s='库存 '+money(dq)+' 件超出最大库存 '+money(max)+'，积压';
  else s='库存 '+money(dq)+' 件处于上下限之间，库存正常';
  /* 同档简化：绿/绿=正常（无需结余补充）；灰/灰=积压（结余同向，追加重复语义） */
  if((lvD==='green'&&lvB==='green'))return s+'，排产合理';
  if(lvD==='gray'&&lvB==='gray')return s;
  if(lvB==='red')s+='；排产计划严重不足（结余 '+money(balance)+' 件为负），需尽快安排计划';
  else if(lvB==='amber')s+='；未来仍不足（结余 '+money(balance)+' 件低于下限 '+money(min)+'），需增加计划量';
  else if(lvB==='gray')s+='；计划过量（结余 '+money(balance)+' 件超出上限 '+money(max)+'），未来将积压';
  else s+='；排产补足后未来库存正常';
  return s;
}

const ENHANCED_FILT_MODES={product:true,order_frame:true,order_inv:true,dp_stockup:true,dp_pkg:true,delivery:true,prodPlan:true,report:true,logs:true,transfers:true};

/* 2026-08-25.43：日期列金蝶快捷模式（今天/本周/本月/上月/过去一月/过去三月/从…到…/等于） */
const ENH_DATE_MODES_LIST=[['today','今天'],['this_week','本周'],['this_month','本月'],['last_month','上月'],['last_1m','过去一个月'],['last_3m','过去三个月'],['range','从…到…'],['eq','等于']];
/* 日期加减月（返回 YYYY-MM-DD；目标月天数不足钳到月末） */
function addMonthsStr(dateStr,n){
  const d=new Date(dateStr);
  if(isNaN(d.getTime()))return dateStr;
  const y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
  const last=new Date(y,m+n+1,0).getDate();
  const r=new Date(y,m+n,Math.min(day,last));
  return r.getFullYear()+'-'+String(r.getMonth()+1).padStart(2,'0')+'-'+String(r.getDate()).padStart(2,'0');
}

/* ================================================================
   列布局引擎：表头左右拖拽调序 + 右缘拖拽调宽（每表独立记忆）
================================================================ */
var tblLayout={};   // tblLayout[模块]={order:[key...],widths:{key:px}}
function layoutOf(m){if(!tblLayout[m])tblLayout[m]={order:null,widths:{}};return tblLayout[m];}
function saveLayout(){DB.set('tblLayout',tblLayout);}

/* 渲染后调用：按已保存的顺序/宽度重排 DOM 中所有带 data-m 的表格 */
function applyTableLayout(){
  document.querySelectorAll('#content table').forEach(function(tbl){
    var thead=tbl.tHead;
    var headCells=null,fromBody=false;
    if(thead&&thead.rows.length){
      headCells=[...thead.rows[0].cells];
    }else{
      /* 2026-08-25.9：表体表（body-tbl 无 thead）→ 取同区块表头表（sticky-head）的列顺序，仅重排列、不设宽度（宽度由 syncHeadBody 对齐） */
      var hd=tbl.closest('.table-wrap');
      var prev=hd?hd.previousElementSibling:null;
      if(!prev||!prev.classList.contains('sticky-head'))return;
      var ht=prev.querySelector('table.head-tbl');
      if(!ht||!ht.tHead||!ht.tHead.rows.length)return;
      headCells=[...ht.tHead.rows[0].cells];fromBody=true;
    }
    var firstM=null;
    headCells.forEach(function(th){if(!firstM&&th.getAttribute&&th.getAttribute('data-m'))firstM=th.getAttribute('data-m');});
    if(!firstM)return;
    var lo=layoutOf(firstM);
    /* 需要重排的可拖列槽位（列索引） */
    var slots=[];
    headCells.forEach(function(th,i){if(th.getAttribute&&th.getAttribute('data-key'))slots.push(i);});
    if(slots.length<2)return;
    var curKeys=slots.map(function(i){return headCells[i].getAttribute('data-key');});
    /* 目标顺序 = 已存顺序(过滤仍存在的) + 新增列按当前顺序 */
    var order=(lo.order||[]).filter(function(k){return curKeys.indexOf(k)>=0;});
    curKeys.forEach(function(k){if(order.indexOf(k)<0)order.push(k);});
    /* 重排所有行（含表头/表体）：
       优先按 data-key 匹配重排（支持订单表格 rowspan 合并行——每行只移动该行实际存在的列，数据跟随表头移动）；
       无 data-key 的行（其他表格）退化为按物理索引重排，仅当列数与表头一致时执行。 */
    [...tbl.rows].forEach(function(row){
      if(row.cells.length<2)return;
      var cells=[...row.cells];
      var keyed=cells.filter(function(c){return c.getAttribute&&c.getAttribute('data-key');});
      if(keyed.length>=2){
        var curKeys=keyed.map(function(c){return c.getAttribute('data-key');});
        var target=order.filter(function(k){return curKeys.indexOf(k)>=0;});
        curKeys.forEach(function(k){if(target.indexOf(k)<0)target.push(k);});
        var same=target.length===curKeys.length&&target.every(function(k,i){return k===curKeys[i];});
        if(same)return;
        target.forEach(function(k){
          var idx=curKeys.indexOf(k);
          row.appendChild(keyed[idx]);
        });
        return;
      }
      /* 兼容：无 data-key 且列数一致 → 按物理索引重排（含 colspan 的汇总/展开行跳过，如排产小计行/报工展开行） */
      if(row.cells.length!==headCells.length)return;
      var hasSpan=false;
      for(var _ci=0;_ci<row.cells.length;_ci++){if((row.cells[_ci].getAttribute&&(row.cells[_ci].getAttribute('colspan')||''))!==''){hasSpan=true;break;}}
      if(hasSpan)return;
      var keyedCells=slots.map(function(i){return cells[i];});
      slots.forEach(function(slot,j){
        var key=order[j];
        var src=curKeys.indexOf(key);
        if(row.cells[slot]!==keyedCells[src])row.replaceChild(keyedCells[src],row.cells[slot]);
      });
    });
    if(fromBody)return;   /* 2026-08-25.9：表体表只重排列，宽度由 syncHeadBody 从表头表对齐 */
    /* 先记录 auto 布局下的内容宽度，作为未拖过列的默认宽度（须在切换 fixed 之前读取） */
    var curW=headCells.map(function(th){return th.offsetWidth||0;});
    /* 切换 fixed 布局：列宽完全由表头决定（auto 布局下列宽下限=最宽单元格内容宽，
       导致表头缩窄但表体被长内容撑住；fixed 后内容超宽自动省略号，列宽可缩至最小） */
    tbl.style.tableLayout='fixed';
    headCells.forEach(function(th,i){
      var k=th.getAttribute('data-key');
      var cur=curW[i]||0;
      if(k){
        var saved=lo.widths&&lo.widths[k]?lo.widths[k]:null;
        var w=saved!=null?Math.max(minThWidth(th),saved):Math.max(minThWidth(th),cur||120);
        th.style.width=w+'px';
      }else{
        /* 无 data-key 的固定列（选择列/操作列）：按内容宽度，保底 36px */
        th.style.width=Math.max(36,cur)+'px';
      }
    });
    /* fixed 布局下表宽=列宽总和，不再需要 minW 撑开 */
  });
}

/* 统一鼠标交互入口：右缘手柄=调宽，其余=拖拽调序 */
document.addEventListener('mousedown',function(e){
  if(e.button!==0)return;
  var th=e.target.closest?e.target.closest('th.th-sort'):null;
  if(!th||!th.getAttribute('data-key'))return;
  if(e.target.classList&&e.target.classList.contains('th-rs')){startColResize(e,th);return;}
  if(e.target.closest&&e.target.closest('.filt-ico'))return;
  startColDrag(e,th);
});

/* ---- 拖拽调序 ---- */
var colDrag=null;
function startColDrag(e,th){
  colDrag={th:th,m:th.getAttribute('data-m'),key:th.getAttribute('data-key'),x:e.clientX,moved:false,targets:[],marker:null};
  var move=function(ev){
    if(!colDrag)return;
    if(!colDrag.moved&&Math.abs(ev.clientX-colDrag.x)<6)return;
    if(!colDrag.moved){
      colDrag.moved=true;
      document.body.classList.add('col-dragging');
      th.classList.add('th-dragging');
      colDrag.targets=[...document.querySelectorAll('#content th.th-sort[data-m="'+colDrag.m+'"][data-key]')];
    }
    /* 清除旧指示 */
    colDrag.targets.forEach(function(t){t.classList.remove('th-drop-before','th-drop-after');});
    var el=document.elementFromPoint(ev.clientX,ev.clientY);
    var t=el&&el.closest?el.closest('th.th-sort[data-m="'+colDrag.m+'"]'):null;
    if(t&&t!==th){
      var r=t.getBoundingClientRect();
      var before=(ev.clientX-r.left)<r.width/2;
      t.classList.add(before?'th-drop-before':'th-drop-after');
      colDrag.marker={key:t.getAttribute('data-key'),before:before};
    }else colDrag.marker=null;
  };
  var up=function(){
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    if(colDrag&&colDrag.moved&&colDrag.marker){
      /* 2026-08-25.36/.37：记录布局应用前横向滚动位置。
         .37：恢复改 requestAnimationFrame 延迟执行——applyTableLayout 切 fixed/重设列宽后 scrollWidth 需 reflow 才稳定，
         同步设回会被浏览器按未稳定宽度提前钳制（跳到最前）；rAF 等布局稳定后再设回，精确复原。 */
      var scPos=[];
      document.querySelectorAll('#content .table-wrap,#content .head-scroll').forEach(function(sc){if(sc.scrollLeft>0)scPos.push({el:sc,left:sc.scrollLeft});});
      var mk=colDrag.marker;
      /* 从当前 DOM 顺序计算新顺序 */
      var curOrder=[...document.querySelectorAll('#content thead th.th-sort[data-m="'+colDrag.m+'"][data-key]')].map(function(t){return t.getAttribute('data-key');});
      /* 注意库存表等多表同模块：以第一张表为准 */
      var idx=curOrder.indexOf(colDrag.key);
      if(idx>=0)curOrder.splice(idx,1);
      var ti=curOrder.indexOf(mk.key);
      if(ti<0)ti=curOrder.length;
      curOrder.splice(mk.before?ti:ti+1,0,colDrag.key);
      layoutOf(colDrag.m).order=curOrder;
      saveLayout();
      applyTableLayout();
      syncHeadBody();   /* 2026-08-25.8：拖拽调序后同步表体列宽 */
      /* 2026-08-25.38：统一恢复滚动位置（双 rAF + 150ms 兜底，替代 .37 单 rAF——布局完全稳定后精确设回） */
      restoreTableScroll(scPos);
    }
    if(colDrag){
      colDrag.targets.forEach(function(t){t.classList.remove('th-drop-before','th-drop-after');});
      th.classList.remove('th-dragging');
    }
    if(colDrag&&colDrag.moved)window.__colDragTS=Date.now();
    document.body.classList.remove('col-dragging');
    colDrag=null;
  };
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
}

/* ---- 拖拽调宽 ---- */
/* 表头可拖至的最小宽度：字段名第一个字 + “..”(省略号) + 排序符号 + 筛选符号（含 padding 与余量） */
function minThWidth(th){
  try{
    var lb=th.querySelector('.th-label');
    var label=lb?(lb.textContent||'').trim():'';
    var cs=getComputedStyle(th);
    var ctx=document.createElement('canvas').getContext('2d');
    ctx.font=cs.fontSize+' '+cs.fontFamily;
    var firstW=label?ctx.measureText(label.charAt(0)).width:0;
    var dotsW=ctx.measureText('..').width;
    ctx.font='9px '+cs.fontFamily;                       // 排序符号字号 9px
    var sortW=ctx.measureText('⇅').width;                // 最宽排序符号
    if(sortW<6)sortW=9;
    sortW+=3;                                            // sort-ico 左间距
    var extra=th.querySelector('.lock')?18:0;            // 锁定字段多留锁图标宽
    return Math.ceil(firstW+dotsW+sortW+19+20+extra+4);  // 19=筛选图标12+左距5+padding2; 20=th左右padding; 4=余量
  }catch(e){return 60;}
}
function startColResize(e,th){
  e.preventDefault();e.stopPropagation();
  var m=th.getAttribute('data-m'),key=th.getAttribute('data-key');
  var tbl=th.closest('table');
  /* 2026-08-25.10：预取表体表 col/总宽（拖动中实时同步列宽，松开不再跳变；fixed 布局下表宽=列宽总和，须同步总宽防压缩） */
  var _btCols=null,_btTbl=null,_btTotal=0,_idx=-1;
  var hd2=tbl.closest('.sticky-head');
  if(hd2){
    var _bw=hd2.nextElementSibling;
    if(_bw&&_bw.classList.contains('table-wrap')){
      _btTbl=_bw.querySelector('table.body-tbl');
      var _cg=_btTbl?_btTbl.querySelector('colgroup'):null;
      if(_cg)_btCols=_cg.querySelectorAll('col');
      var _ths=Array.prototype.slice.call(tbl.tHead.rows[0].cells);
      _idx=_ths.indexOf(th);
      _btTotal=_btTbl?(parseFloat(_btTbl.style.width)||0):0;
    }
  }
  var startX=e.clientX,startW=th.offsetWidth;
  var minW=minThWidth(th);           // 最小宽度：第一个字+“..”+排序+筛选
  document.body.classList.add('col-resizing');
  var move=function(ev){
    var w=Math.max(minW,startW+ev.clientX-startX);
    th.style.width=w+'px';
    /* fixed 布局下表宽=各列宽之和，自动随列宽变化 */
    if(_btCols&&_idx>=0&&_btCols[_idx]){
      _btCols[_idx].style.width=w+'px';
      if(_btTbl&&_btTotal>0)_btTbl.style.width=(_btTotal+(w-startW))+'px';
    }
  };
  var up=function(){
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    document.body.classList.remove('col-resizing');
    window.__colDragTS=Date.now();
    /* 2026-08-25.36/.37：记录并 rAF 延迟恢复横向滚动位置（调宽改变列宽→scrollWidth 变化，布局稳定后再设回，避免早钳制跳最前） */
    var scPos=[];
    document.querySelectorAll('#content .table-wrap,#content .head-scroll').forEach(function(sc){if(sc.scrollLeft>0)scPos.push({el:sc,left:sc.scrollLeft});});
    layoutOf(m).widths[key]=Math.round(th.getBoundingClientRect().width);
    saveLayout();
    if(tbl&&tbl.style.tableLayout==='fixed'){syncHeadBody();}   /* 2026-08-25.8：调宽后同步表体列宽 */
    /* 2026-08-25.38：统一恢复滚动位置（双 rAF + 150ms 兜底，替代 .37 单 rAF——布局完全稳定后精确设回） */
    restoreTableScroll(scPos);
  };
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
}

/* 恢复默认列布局 */
function resetTableLayout(m){
  if(!m){tblLayout={};}
  else delete tblLayout[m];
  saveLayout();
  renderContent();
}

function renderNav(){
  const nav=document.getElementById('nav');
  let items=NAV.filter(n=>{
    if(n.id==='users')return currentUser&&currentUser.role==='admin';
    return true;
  });
  /* 应用已保存的菜单顺序（长按拖动调整），新增/无权限项自动跟随默认顺序 */
  try{
    const saved=JSON.parse(localStorage.getItem(KEY+'navOrder')||'null');
    if(Array.isArray(saved)&&saved.length){
      const savedIds=saved.filter(id=>items.some(n=>n.id===id));
      if(savedIds.length){
        const rest=items.filter(n=>savedIds.indexOf(n.id)<0);
        items=savedIds.map(id=>items.find(n=>n.id===id)).concat(rest);
      }
    }
  }catch(e){}
  nav.innerHTML=items.map(n=>{
    let badge='';
    if(n.id==='dashboard'){
      const alerts=countAlerts();
      if(alerts>0)badge='<span class="nav-badge">'+alerts+'</span>';
    }
    return '<div class="nav-item'+(activeTab===n.id?' active':'')+'" data-id="'+n.id+'" onclick="switchTab(\''+n.id+'\')">'+n.icon+'<span>'+n.label+'</span>'+badge+'</div>';
  }).join('');
}

function switchTab(id){
  activeTab=id;
  window.__skipScrollRestore=true;   // 切换页面：不恢复上一页的表格滚动位置
  for(const k in selRows)selRows[k].clear();
  renderNav();
  const item=NAV.find(n=>n.id===id);
  document.getElementById('pageTitle').textContent=item?item.label:'';
  document.getElementById('mobileTitle').textContent=item?item.label:'';
  renderContent();
  if(window.innerWidth<=768)closeSidebar();
}

/* ---- 侧边栏导航：长按拖动调整菜单顺序 ---- */
var navDrag=null;
var navDragSuppress=false;
function initNavDrag(){
  const nav=document.getElementById('nav');
  if(!nav)return;
  /* 拖动结束后抑制本次 click（防止松手后误切页） */
  nav.addEventListener('click',function(e){
    if(navDragSuppress){navDragSuppress=false;e.preventDefault();e.stopPropagation();}
  },true);
  nav.addEventListener('mousedown',function(e){
    if(e.button!==0)return;
    if(document.getElementById('sidebar').classList.contains('collapsed'))return;  // 折叠模式禁用
    const item=e.target.closest?e.target.closest('.nav-item'):null;
    if(!item)return;
    const startY=e.clientY;
    let timer=setTimeout(function(){
      navDrag={item:item,moved:false,entered:true};
      item.classList.add('nav-dragging');
    },400);
    const mv=function(ev){
      if(!navDrag)return;
      if(!navDrag.moved&&Math.abs(ev.clientY-startY)<6)return;
      navDrag.moved=true;
      const el=document.elementFromPoint(ev.clientX,ev.clientY);
      const t=el&&el.closest?el.closest('.nav-item'):null;
      if(t&&t!==navDrag.item){
        const r=t.getBoundingClientRect();
        if(ev.clientY<r.top+r.height/2)nav.insertBefore(navDrag.item,t);
        else nav.insertBefore(navDrag.item,t.nextSibling);
      }
    };
    const up=function(){
      clearTimeout(timer);
      document.removeEventListener('mousemove',mv);
      document.removeEventListener('mouseup',up);
      if(navDrag){
        navDrag.item.classList.remove('nav-dragging');
        if(navDrag.moved||navDrag.entered)navDragSuppress=true;
        if(navDrag.moved){
          const order=[...nav.querySelectorAll('.nav-item')].map(x=>x.getAttribute('data-id')).filter(Boolean);
          try{localStorage.setItem(KEY+'navOrder',JSON.stringify(order));}catch(err){}
          renderNav();
        }
        navDrag=null;
      }
    };
    document.addEventListener('mousemove',mv);
    document.addEventListener('mouseup',up);
  });
}

/* ================================================================
   内容渲染
================================================================ */
function renderContent(){
  const c=document.getElementById('content');
  /* 渲染会重建 DOM → 表格横向滚动位置将复位为 0。
     这里在渲染前记录各表格滚动位置、渲染后按索引恢复（仅同一页面内的重渲染；
     switchTab 切换页面会置 __skipScrollRestore=true 跳过恢复） */
  var restoreScroll=!window.__skipScrollRestore;
  window.__skipScrollRestore=false;
  var savedScroll=[];
  if(restoreScroll){
    Array.prototype.forEach.call(c.querySelectorAll('.table-wrap'),function(w){
      savedScroll.push([w.scrollLeft,w.scrollTop]);
    });
  }
  switch(activeTab){
    case 'dashboard':c.innerHTML=renderDashboard();break;
    case 'product':c.innerHTML=renderProducts();break;
    case 'order':c.innerHTML=renderOrders();break;
    case 'inv':c.innerHTML=renderInvOrders();break;   /* 2026-08-25.65：库存管理独立页签 */
    case 'dailyPlan':c.innerHTML=renderDailyPlan();break;
    case 'dailyReport':c.innerHTML=renderDailyReport();break;
    case 'prodPlan':c.innerHTML=renderProdPlan();break;
    case 'delivery':c.innerHTML=renderDelivery();break;
    case 'processTpl':c.innerHTML=renderProcessTpl();break;
    case 'logs':c.innerHTML=renderLogs();break;
    case 'guide':c.innerHTML=renderGuide();break;   /* 2026-08-25.69：使用说明 */
    case 'transfers':c.innerHTML=renderTransfers();break;
    case 'users':c.innerHTML=renderUsers();break;
    default:c.innerHTML='<div class="empty">未知模块</div>';
  }
  if(restoreScroll){
    /* .38：记录保存，恢复统一移到 applyTableLayout 之后（原位置在布局重算前恢复会被切 fixed/重设列宽二次钳制跳最前） */
    var _scWraps=Array.prototype.slice.call(c.querySelectorAll('.table-wrap'));
  }
  if(products.length+orders.length>=30){
    showBackupWarn();
  }
  applyTableLayout();
  syncHeadBody();   // 2026-08-25.8：订单表头/表体列宽对齐（renderContent 后）
  fixStickyHeadTop();   // 2026-08-25.9：表头吸附位置避开操作栏
  syncBottomScrollbar();
  /* 2026-08-25.38：布局重算完成后恢复滚动位置（双 rAF + 150ms 兜底，布局稳定后精确设回不再被钳制） */
  if(restoreScroll&&_scWraps){
    var scRecs=savedScroll.map(function(r,i){return {el:_scWraps[i],left:r[0],top:r[1]};}).filter(function(r){return !!r.el;});
    restoreTableScroll(scRecs);
  }
  /* 渲染后同步选中态：恢复复选框勾选与选中行高亮（row-sel，含 rowspan 合并组） */
  ['product','order_frame','order_inv','dp_stockup','dp_pkg','delivery','prodPlan'].forEach(function(m){
    if(document.querySelector('#content input[data-sel-form="'+m+'"]'))updateSelUI(m);
  });
  /* 布局完成后再次校正（字体/图片等加载可能改变表格宽度，避免滚动条不出现或错位） */
  requestAnimationFrame(function(){syncBottomScrollbar();});
}

/* ================================================================
   侧边栏折叠 + 页面底部固定横向滚动条
================================================================ */
function toggleSidebarCollapse(){
  const sb=document.getElementById('sidebar');
  const collapsed=sb.classList.toggle('collapsed');
  try{localStorage.setItem('sidebarCollapsed',collapsed?'1':'0');}catch(e){}
  syncBottomScrollbar();
}
var __bsWrap=null;   // 最近一次被操作的横向溢出表格
var __bsWraps=[];    // 当前页面内所有横向溢出的可见表格（底部滚动条统一驱动）
var __bsRange=0;     // 这些表格中最大的可滚动距离，作为底部条的滚动范围
/* 收集页面内所有横向溢出的表格，让底部固定滚动条统一驱动它们（多表并存时均可左右移动） */
function syncBottomScrollbar(){
  const sb=document.getElementById('bottomScrollbar');
  const inner=document.getElementById('bottomScrollbarInner');
  if(!sb||!inner)return;
  const wraps=Array.prototype.slice.call(document.querySelectorAll('#content .table-wrap'));
  const targets=[];
  for(let i=0;i<wraps.length;i++){
    const w=wraps[i];
    if(w.offsetParent===null)continue;              // 隐藏（如折叠区块）跳过
    if(w.scrollWidth>w.clientWidth+2)targets.push(w);
  }
  if(!targets.length){
    sb.style.display='none';__bsWraps=[];__bsRange=0;__bsWrap=null;return;
  }
  let range=0;
  targets.forEach(function(w){const r=w.scrollWidth-w.clientWidth;if(r>range)range=r;});
  __bsWraps=targets;__bsRange=range;
  sb.style.display='block';
  /* 滚动条可滚动范围 = 各表最大可滚动距离（均以「视口宽 + 最大可滚动距离」铺 inner），
     保证底部条与所有表格按相同比例一一对应 */
  inner.style.width=(sb.clientWidth+range)+'px';
  /* 首次绑定底部条拖动事件（只绑一次） */
  if(!sb._barBound){sb._barBound=true;sb.addEventListener('scroll',function(){
    if(sb._sync)return;sb._sync=true;
    const R=__bsRange||1;
    __bsWraps.forEach(function(w){
      const wr=w.scrollWidth-w.clientWidth;
      if(wr>0)w.scrollLeft=Math.round((sb.scrollLeft/R)*wr);
    });
    sb._sync=false;
  });}
  /* 用最近操作的（或第一个）表格位置来定位底部滚动条 */
  const active=(__bsWrap&&targets.indexOf(__bsWrap)>=0)?__bsWrap:targets[0];
  __bsWrap=active;
  if(sb._sync)return;sb._sync=true;
  const ar=active.scrollWidth-active.clientWidth;
  sb.scrollLeft=ar>0?(active.scrollLeft/ar)*range:0;
  sb._sync=false;
}
/* 2026-08-25.38：统一恢复表格横向/纵向滚动位置——双 rAF + 150ms 兜底（布局完全稳定后精确设回，
   避免 applyTableLayout 切 fixed/重设列宽后 scrollWidth 未稳定导致浏览器提前钳制 scrollLeft 跳最前；
   程序设回触发 scroll 事件自动联动表头/表体/底部条）。records=[{el,left,top}] */
function restoreTableScroll(records){
  if(!records||!records.length)return;
  const apply=function(){
    records.forEach(function(r){
      if(!r.el)return;
      if(r.left!=null)r.el.scrollLeft=r.left;
      if(r.top!=null)r.el.scrollTop=r.top;
    });
    syncBottomScrollbar();
  };
  requestAnimationFrame(function(){
    apply();
    requestAnimationFrame(function(){
      apply();
      setTimeout(apply,150);   /* 兜底：字体/图片/悬停态等延迟 reflow 后再校正一次 */
    });
  });
}

/* 任一表格自身横向滚动（capture 捕获不冒泡的 scroll）→ 回写底部滚动条 */
document.addEventListener('scroll',function(e){
  const t=e.target;
  if(!t||!t.classList||!t.classList.contains('table-wrap'))return;
  /* 2026-08-25.8：订单表体横向滚动 → 表头容器跟随（双表结构列对齐） */
  const hd=t.previousElementSibling;
  if(hd&&hd.classList.contains('sticky-head')){
    const hs=hd.querySelector('.head-scroll');
    if(hs&&hs.scrollLeft!==t.scrollLeft)hs.scrollLeft=t.scrollLeft;
  }
  const sb=document.getElementById('bottomScrollbar');
  if(sb&&sb.style.display==='block'&&__bsWraps&&__bsWraps.indexOf(t)>=0){
    __bsWrap=t;
    if(sb._sync)return;sb._sync=true;
    const wr=t.scrollWidth-t.clientWidth;
    sb.scrollLeft=(__bsRange>0&&wr>0)?(t.scrollLeft/wr)*__bsRange:0;
    sb._sync=false;
  }
},true);
window.addEventListener('resize',function(){syncBottomScrollbar();syncHeadBody();fixStickyHeadTop();});

/* 2026-08-25.9：sticky-head 吸附位置 = 顶栏 + 操作栏实际高度（避免与 bulk-bar 同 top:58 重叠被盖住；操作栏换行时自适应）
   2026-08-25.16：存在筛选条（.tbl-fbar）时也吸附在 操作栏与表头 之间（三者连成一条吸附带） */
function fixStickyHeadTop(){
  var base=window.innerWidth<=768?48:58;
  document.querySelectorAll('#content .sticky-head').forEach(function(hd){
    var bb=hd.previousElementSibling;
    while(bb&&!bb.classList.contains('bulk-bar'))bb=bb.previousElementSibling;
    var top=base;
    if(bb){
      var mT=parseFloat(getComputedStyle(bb).marginTop)||0;
      var mB=parseFloat(getComputedStyle(bb).marginBottom)||0;
      /* 2026-08-25.11：sticky top 是 margin box 顶 → 顶栏+操作栏上下margin+高度，贴住操作栏边框盒底。
         2026-08-25.14：订单/卡片区块操作栏 margin-bottom 已为 0（CSS 覆盖），此公式 mB=0 精确贴住；负 margin 方案已废弃 */
      top+=mT+bb.offsetHeight+mB;
      /* 2026-08-25.16：筛选条（bulk-bar 与 sticky-head 之间，可能隔着 stats 汇总卡）同样吸附在操作栏下方 */
      var fbar=bb.nextElementSibling;
      while(fbar&&fbar!==hd&&!fbar.classList.contains('tbl-fbar'))fbar=fbar.nextElementSibling;
      if(fbar&&fbar!==hd&&fbar.classList.contains('tbl-fbar')){
        fbar.style.position='sticky';
        fbar.style.margin='0';    /* 2026-08-25.19：去掉上下 margin（原 8px 吸附时上下间距过大），贴住操作栏与表头 */
        fbar.style.top=top+'px';
        fbar.style.zIndex=30;
        var fT=parseFloat(getComputedStyle(fbar).marginTop)||0;
        var fB=parseFloat(getComputedStyle(fbar).marginBottom)||0;
        top+=fT+fbar.offsetHeight+fB;
      }
    }
    hd.style.top=top+'px';
  });
}

/* 2026-08-25.8：订单表头/表体列宽同步——表头表 th 实际宽度写入表体表 colgroup，
   并令表体表总宽=表头表总宽（table-layout:fixed 下两表列宽一致，保证滚动对齐） */
function syncHeadBody(){
  document.querySelectorAll('#content .sticky-head').forEach(function(hd){
    var ht=hd.querySelector('table.head-tbl');
    var bw=hd.nextElementSibling;
    if(!bw||!bw.classList.contains('table-wrap'))return;
    var bt=bw.querySelector('table.body-tbl');
    if(!ht||!bt)return;
    var hc=ht.tHead&&ht.tHead.rows[0]?Array.prototype.slice.call(ht.tHead.rows[0].cells):[];
    var cg=bt.querySelector('colgroup');
    if(!cg||!hc.length)return;
    var cols=cg.querySelectorAll('col');
    var total=0;
    hc.forEach(function(th,i){
      var w=th.offsetWidth||0;
      if(cols[i])cols[i].style.width=w+'px';
      total+=w;
    });
    if(total>0)bt.style.width=total+'px';
  });
}

function saveProduct(idx){
  const cols=fields.product;
  const p={};
  cols.forEach(f=>{
    if(f.key==='stock'){ p.stock=(idx>=0)?num(products[idx].stock):0; return; }   // 2026-08-25.16：库存只读由库存订单已交付推算，忽略输入
    const el=document.getElementById('pf_'+f.key);
    p[f.key]=f.type==='number'?num(el.value):el.value;
  });
  cols.forEach(f=>{ if(f.type==='ref'){ p[f.key]=lookupRef(f.refForm,f.refMatch,p[f.refKey],f.refField); } });
  if(!p.id){alert('请填写产品编码');return;}
  if(!p.name){alert('请填写产品名称');return;}
  if(!p.processTplId){alert('请选择工序模板（产品必须关联工序模板）');return;}

function orderUndelTotal(o){return orderItems(o).reduce((s,i)=>s+Math.max(0,(o.orderType==='库存订单'&&i.stockMax!=null&&i.stockMax!==''?num(i.stockMax):num(i.orderQty))-num(i.deliveredQty)),0);}
/* 订单状态自动规则（2026-08-25.3）：
   仅对「执行中/已完成」生效；「已取消/已暂停」为手动状态，自动规则不覆盖。
   整单未交付合计 = 0（全部交付完成）→ 已完成；否则 → 执行中。
   变更落库并记操作日志（silent=true 用于存量初始化，仅统计不逐条记）。 */
function syncOrderAutoStatus(silent){
  const changed=[];
  orders.forEach(o=>{
    if(o.status==='已取消'||o.status==='已暂停')return;
    const target=orderUndelTotal(o)<=0?'已完成':'执行中';
    if(o.status!==target){changed.push({id:o.id,from:o.status,to:target});o.status=target;}
  });
  if(changed.length){
    save('orders',orders);
    if(!silent)changed.forEach(c=>logOp('状态变更','订单管理','订单「'+c.id+'」'+c.from+' → '+c.to+'（系统自动）'));
  }
  return changed.length;
}
/* 迁移（2026-08-25.3）：存量订单状态对齐——旧「待排产」→「执行中」；
   并按自动规则初始化存量执行中/已完成订单（全部交付完成的旧单直接标已完成，幂等）。 */
/* 2026-08-25.35：存量销售订单明细行回填 calledQty（已调用=调用库存累计）。
   从调拨台账（未冲销 reversed=false 记录）统计：type=call 累加、type=return 扣减，下限 0；幂等（已有 calledQty 的行跳过）。 */
function migrateOrderCalledQty(){
  if(!Array.isArray(transfers)||!transfers.length)return;
  const map={};   // orderId|lineIdx → qty
  transfers.forEach(t=>{
    if(t.reversed)return;                       /* 已冲销原记录不计；冲销生成的反向记录（revType）正常参与 */
    if(t.type!=='call'&&t.type!=='return')return;
    if(!t.salesOrderId||t.salesLineIdx==null)return;
    const k=t.salesOrderId+'|'+t.salesLineIdx;
    map[k]=(map[k]||0)+(t.type==='call'?num(t.qty):-num(t.qty));
  });
  let changed=false;
  orders.forEach(o=>{
    if(!Array.isArray(o.items))return;
    o.items.forEach((it,li)=>{
      if(it.calledQty!=null&&it.calledQty!=='')return;      /* 已有不覆盖 */
      const v=Math.max(0,map[o.id+'|'+li]||0);
      if(v>0){it.calledQty=v;changed=true;}
      else if(it.deliveredQty!=null){it.calledQty=0;changed=true;}   /* 无调拨记录也补 0 兜底（已交付行为主） */
    });
  });
  if(changed){save('orders',orders);logOp('系统','订单管理','系统迁移：销售订单明细回填已调用数量 calledQty');}
}
function migrateOrderStatusData(){  let changed=false;
  orders.forEach(o=>{ if(o.status==='待排产'){o.status='执行中';changed=true;} });
  if(changed){
    save('orders',orders);
    logOp('系统','订单管理','系统迁移：存量「待排产」订单状态改为「执行中」');
  }
  const n=syncOrderAutoStatus(true);
  if(n)logOp('系统','订单管理','系统迁移：按交付情况初始化订单状态，'+n+' 单自动调整为已完成');

  const pq=fields.delivery.find(f=>f.key==='planQty');

/* 2026-08-25.34：存量交付计划行回填 orderLine（来源订单行索引，幂等，initApp 自动跑）。
   策略：①索引直配（交付计划行 li ↔ 订单 items[li]，productId 一致）；②同 productId 顺序消费匹配（订单/交付计划行曾增删场景）；
   ③仍不匹配不设（保持回退产品级）；已有 orderLine 不覆盖。解决存量同产品多行订单「已计划未交付」显示总数问题。 */
function migrateDeliveryOrderLine(){
  let changed=false;
  deliveries.forEach(d=>{
    if(!Array.isArray(d.items)||!d.items.length)return;
    const o=orders.find(x=>x.id===d.orderId);
    if(!o||!Array.isArray(o.items)||!o.items.length)return;
    const oItems=orderItems(o);
    const cnt={};
    d.items.forEach((it,li)=>{
      if(it.orderLine!=null&&it.orderLine!=='')return;   /* 已有不覆盖 */
      let ol=null;
      if(oItems[li]&&(oItems[li].productId||'')===(it.productId||''))ol=li;   /* ① 索引直配 */
      if(ol==null){                                                             /* ② 同 productId 顺序消费 */
        const pid=it.productId||'';
        const n=cnt[pid]=(cnt[pid]||0)+1;
        let seen=0;
        for(let k=0;k<oItems.length;k++){
          if((oItems[k].productId||'')===pid){seen++;if(seen===n){ol=k;break;}}
        }
      }
      if(ol!=null){it.orderLine=ol;changed=true;}
    });
  });
  if(changed){save('deliveries',deliveries);logOp('系统','交付计划','系统迁移：存量交付计划行回填来源订单行索引 orderLine');}
}

/* 订单管理：存量库存订单单号前缀 XSDD- → KCDD-，避免与销售订单单号冲突（已为 KCDD- 的跳过；自定义单号按 startDate 重排） */
function migrateInventoryOrderIds(){
  var changed=false;
  // 第一遍：XSDD- 前缀直接替换为 KCDD-（保留日期与序号，确保唯一）
  orders.forEach(function(o){
    if(orderTypeOf(o)!=='库存订单')return;
    var id=o.id||'';
    if(id.indexOf('XSDD-')===0){o.id='KCDD-'+id.slice(5);changed=true;}
  });
  // 第二遍：非 KCDD- 的库存订单（自定义单号），按 startDate 重新生成 KCDD-YYYYMMDD-XXXXX，序号递增防重
  var invMax={};
  function kcSeq(dateStr){
    if(invMax[dateStr]==null){
      var max=0;
      orders.forEach(function(o){
        if(orderTypeOf(o)==='库存订单'&&o.id&&typeof o.id==='string'&&o.id.indexOf('KCDD-'+dateStr+'-')===0){
          var n=parseInt(o.id.slice(('KCDD-'+dateStr+'-').length),10);
          if(!isNaN(n)&&n>max)max=n;
        }
      });
      invMax[dateStr]=max;
    }
    invMax[dateStr]++;
    return String(invMax[dateStr]).padStart(5,'0');
  }
  orders.forEach(function(o){
    if(orderTypeOf(o)!=='库存订单')return;
    var id=o.id||'';
    if(id.indexOf('KCDD-')===0)return;
    var d=String(o.startDate||todayStr()).replace(/-/g,'');
    o.id='KCDD-'+d+'-'+kcSeq(d);
    changed=true;
  });
  if(changed){save('orders',orders);logOp('迁移','订单管理','存量库存订单单号前缀 XSDD- 统一改为 KCDD-');}
}
