  m.innerHTML='<div class="modal-head"><h3>'+title+'</h3><div class="close-x" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M18 6L6 18M6 6l12 12"/></svg></div></div><div class="modal-body">'+body+'</div><div class="modal-foot">'+foot+'</div>';
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('show');
}

/* ================================================================
   XLSX 原生读写引擎（零依赖，纯 JS）
================================================================ */
var XLSX=(function(){
  /* --- CRC32 --- */
  var T=(function(){var t=new Uint32Array(256);for(var i=0;i<256;i++){var c=i;for(var j=0;j<8;j++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c;}return t;})();
  function crc32(d){var c=0xFFFFFFFF;for(var i=0;i<d.length;i++)c=T[(c^d[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
  /* --- 编码工具 --- */
  function u8(s){return new TextEncoder().encode(s);}
  function u8s(d){return new TextDecoder().decode(d);}
  function xe(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function colName(idx){var s='';idx++;while(idx>0){var r=(idx-1)%26;s=String.fromCharCode(65+r)+s;idx=Math.floor((idx-1)/26);}return s;}
  /* --- ZIP 写入 (STORE, Excel 兼容) --- */
  function zipWrite(files){
    var parts=[],cd=[],offset=0;
    files.forEach(function(f){
      var nm=u8(f.name),dat=f.data,crc=crc32(dat);
      var lh=new Uint8Array(30+nm.length),dv=new DataView(lh.buffer);
      dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);
      dv.setUint16(8,0,true);dv.setUint32(14,crc,true);
      dv.setUint32(18,dat.length,true);dv.setUint32(22,dat.length,true);
      dv.setUint16(26,nm.length,true);lh.set(nm,30);
      var ch=new Uint8Array(46+nm.length),cv=new DataView(ch.buffer);
      cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
      cv.setUint16(10,0,true);cv.setUint32(16,crc,true);
      cv.setUint32(20,dat.length,true);cv.setUint32(24,dat.length,true);
      cv.setUint16(28,nm.length,true);cv.setUint32(42,offset,true);ch.set(nm,46);
      parts.push(lh,dat);cd.push(ch);offset+=lh.length+dat.length;
    });
    var cdLen=cd.reduce(function(s,h){return s+h.length;},0);
    var eo=new Uint8Array(22),ev=new DataView(eo.buffer);
    ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);
    ev.setUint16(10,files.length,true);ev.setUint32(12,cdLen,true);ev.setUint32(16,offset,true);
    var tot=parts.reduce(function(s,p){return s+p.length;},0)+cdLen+22;
    var out=new Uint8Array(tot),pos=0;
    parts.forEach(function(p){out.set(p,pos);pos+=p.length;});
    cd.forEach(function(h){out.set(h,pos);pos+=h.length;});
    out.set(eo,pos);return out;
  }
  /* --- ZIP 读取 (STORE + DEFLATE) --- */
  async function zipRead(buf){
    var ab=buf instanceof ArrayBuffer?buf:buf.buffer;
    var dv=new DataView(ab),eocd=-1;
    for(var i=dv.byteLength-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
    if(eocd<0)throw new Error('无效 ZIP 文件');
    var cdOff=dv.getUint32(eocd+16,true),n=dv.getUint16(eocd+10,true);
    var files={},pos=cdOff;
    for(var i=0;i<n;i++){
      if(dv.getUint32(pos,true)!==0x02014b50)break;
      var comp=dv.getUint16(pos+10,true),compSz=dv.getUint32(pos+20,true);
      var nmLen=dv.getUint16(pos+28,true),exLen=dv.getUint16(pos+30,true),cmLen=dv.getUint16(pos+32,true);
      var loff=dv.getUint32(pos+42,true);
      var nm='';for(var j=0;j<nmLen;j++)nm+=String.fromCharCode(dv.getUint8(pos+46+j));
      var lNm=dv.getUint16(loff+26,true),lEx=dv.getUint16(loff+28,true);
      var dOff=loff+30+lNm+lEx;
      var raw=new Uint8Array(ab,dOff,compSz);
      var data;
      if(comp===0){data=raw;}
      else if(comp===8){
        if(typeof DecompressionStream==='undefined')throw new Error('浏览器不支持 DEFLATE 解压，请使用 Chrome 80+');
        var ds=new DecompressionStream('deflate-raw');
        var w=ds.writable.getWriter();w.write(raw);w.close();
        var r=ds.readable.getReader(),chunks=[],len=0;
        while(true){var res=await r.read();if(res.done)break;chunks.push(res.value);len+=res.value.length;}
        data=new Uint8Array(len);var p=0;chunks.forEach(function(c){data.set(c,p);p+=c.length;});
      }else throw new Error('不支持的压缩方式: '+comp);
      files[nm]=data;pos+=46+nmLen+exLen+cmLen;
    }
    return files;
  }
  /* --- 构建 XLSX (多 Sheet) --- */
  /* 单元格样式：索引0默认，索引1红色字体（用于导入模板必填表头） */
  var STYLE_XML='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><color theme="1"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFF0000"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  function build(sheets){
    var ssArr=[],ssMap={};
    function ss(str){str=String(str==null?'':str);if(Object.prototype.hasOwnProperty.call(ssMap,str))return ssMap[str];var idx=ssArr.length;ssMap[str]=idx;ssArr.push(str);return idx;}
    var wsXmls=[];
    sheets.forEach(function(sh){
      var x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
      x+='<row r="1">';
      sh.headers.forEach(function(h,c){
        var text,red=false;
        if(h&&typeof h==='object'){text=h.t;red=!!h.red;}else{text=String(h==null?'':h);}
        x+='<c r="'+colName(c)+'1" t="s"'+(red?' s="1"':'')+'><v>'+ss(text)+'</v></c>';
      });
      x+='</row>';
      sh.rows.forEach(function(row,r){
        var rn=r+2;x+='<row r="'+rn+'">';
        row.forEach(function(val,c){
          var ref=colName(c)+rn;
          if(typeof val==='number'&&!isNaN(val)){x+='<c r="'+ref+'"><v>'+val+'</v></c>';}
          else{x+='<c r="'+ref+'" t="s"><v>'+ss(val)+'</v></c>';}
        });
        x+='</row>';
      });
      x+='</sheetData></worksheet>';wsXmls.push(x);
    });
    var files=[];
    var ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>';
    sheets.forEach(function(s,i){ct+='<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';});
    ct+='<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>';
    ct+='</Types>';files.push({name:'[Content_Types].xml',data:u8(ct)});
    files.push({name:'_rels/.rels',data:u8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')});
    var wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
    sheets.forEach(function(s,i){wb+='<sheet name="'+xe(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';});
    wb+='</sheets></workbook>';files.push({name:'xl/workbook.xml',data:u8(wb)});
    var rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
    sheets.forEach(function(s,i){rels+='<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';});
    rels+='<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/>';
    rels+='<Relationship Id="rId'+(sheets.length+2)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
    files.push({name:'xl/_rels/workbook.xml.rels',data:u8(rels)});
    var sst='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="'+ssArr.length+'" uniqueCount="'+ssArr.length+'">';
    ssArr.forEach(function(str){sst+='<si><t xml:space="preserve">'+xe(str)+'</t></si>';});
    sst+='</sst>';files.push({name:'xl/sharedStrings.xml',data:u8(sst)});
    wsXmls.forEach(function(x,i){files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:u8(x)});});
    files.push({name:'xl/styles.xml',data:u8(STYLE_XML)});
    return zipWrite(files);
  }
  /* --- 解析 XLSX --- */
  async function parse(arrayBuffer){
    var zfiles=await zipRead(arrayBuffer);
    var strings=[];
    var ssFile=zfiles['xl/sharedStrings.xml'];
    if(ssFile){var ssDoc=new DOMParser().parseFromString(u8s(ssFile),'text/xml');var siEls=ssDoc.getElementsByTagName('si');for(var i=0;i<siEls.length;i++){var t=siEls[i].getElementsByTagName('t')[0];strings.push(t?t.textContent:'');}}
    var wbDoc=new DOMParser().parseFromString(u8s(zfiles['xl/workbook.xml']),'text/xml');
    var sheetEls=wbDoc.getElementsByTagName('sheet');
    var relsDoc=new DOMParser().parseFromString(u8s(zfiles['xl/_rels/workbook.xml.rels']),'text/xml');
    var relEls=relsDoc.getElementsByTagName('Relationship');
    var result=[];
    for(var s=0;s<sheetEls.length;s++){
      var name=sheetEls[s].getAttribute('name');
      var rid=sheetEls[s].getAttribute('r:id');
      var target='';for(var j=0;j<relEls.length;j++){if(relEls[j].getAttribute('Id')===rid){target=relEls[j].getAttribute('Target');break;}}
      var fullPath=target.startsWith('/')?target.slice(1):('xl/'+target);
      var wsFile=zfiles[fullPath];if(!wsFile)continue;
      var wsDoc=new DOMParser().parseFromString(u8s(wsFile),'text/xml');
      var rows=wsDoc.getElementsByTagName('row');
      var sd={name:name,headers:[],rows:[]};
      for(var r=0;r<rows.length;r++){
        var cells=rows[r].getElementsByTagName('c');var rowData=[];
        for(var c=0;c<cells.length;c++){
          var cell=cells[c];var t=cell.getAttribute('t');
          var vEl=cell.getElementsByTagName('v')[0];var isEl=cell.getElementsByTagName('is')[0];
          var val='';
          if(t==='s'){val=strings[parseInt(vEl?vEl.textContent:0)]||'';}
          else if(t==='inlineStr'&&isEl){var tt=isEl.getElementsByTagName('t')[0];val=tt?tt.textContent:'';}
          else if(t==='str'){val=vEl?vEl.textContent:'';}
          else if(vEl){var nv=parseFloat(vEl.textContent);val=isNaN(nv)?vEl.textContent:nv;}
          rowData.push(val);
        }
        if(r===0){sd.headers=rowData;}
        else{if(rowData.some(function(v){return v!==''&&v!=null;}))sd.rows.push(rowData);}
      }
      result.push(sd);
    }
    return result;
  }
  return {build:build,parse:parse};
})();

  {sheet:'交付计划',varName:'deliveries',formKey:'delivery'}
];

/* varName -> 实际变量 的映射（不能用 window[name]，因为数组用 let 声明不挂到 window） */
function dataByVar(name){
  switch(name){
    case 'products':return products;
    case 'orders':return orders;
    case 'inventory':return inventory;
    case 'dailyPlans':return dailyPlans;
    case 'dailyPkgs':return dailyPkgs;
    case 'deliveries':return deliveries;
    case 'logs':return logs;
  }
  return [];
}
function setDataByVar(name,arr){
  switch(name){
    case 'products':products=arr;break;
    case 'orders':orders=arr;break;
    case 'inventory':inventory=arr;break;
    case 'dailyPlans':dailyPlans=arr;break;
    case 'dailyPkgs':dailyPkgs=arr;break;
    case 'deliveries':deliveries=arr;break;
    case 'logs':logs=arr;break;
  }
}

/* 订单导出：每行一种产品（表头字段随每行重复） */
function orderFlatRows(){
  var rows=[];
  orders.forEach(function(o){
    orderItems(o).forEach(function(it){
      var r={};
      (fields.order||[]).forEach(function(f){
        r[f.key]=isLineField(f)?it[f.key]:o[f.key];
      });
      rows.push(r);
    });
  });
  return rows;
}
/* 订单导入：按订单编号聚合多行 → 一个订单多明细 */
function groupOrderRows(rows){
  var map={},list=[];
  var lineDefs=orderLineFields();   // 表体字段动态构成明细行
  rows.forEach(function(r){
    if(!r.id)return;
    if(!map[r.id]){
      var o={};                      // 表头字段取自首次出现的行
      orderHeadFields().forEach(function(f){o[f.key]=r[f.key];});
      o.items=[];
      map[r.id]=o;list.push(o);
    }
    var it={};
    lineDefs.forEach(function(f){
      var v=r[f.key];
      it[f.key]=f.type==='number'?num(v):(v==null?'':v);
    });
    map[r.id].items.push(it);
  });
  return list;
}

function exportXLSX(){
  var sheets=XLSX_SHEETS.map(function(cfg){
    var farr=fields[cfg.formKey]||[];
    var headers=farr.map(function(f){return f.label;});
    var data=cfg.formKey==='order'?orderFlatRows():dataByVar(cfg.varName);
    var rows=data.map(function(item){
      return farr.map(function(f){
        var val=item[f.key];
        if(f.type==='date'&&val)return fmtDate(val);
        if(f.type==='number')return num(val);
        return val==null?'':val;
      });
    });
    return {name:cfg.sheet,headers:headers,rows:rows};
  });
  var bytes=XLSX.build(sheets);
  var blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='生产排单系统_全量_'+todayStr()+'.xlsx';a.click();
  URL.revokeObjectURL(url);
  logOp('导出','全量数据','全量导出 '+XLSX_SHEETS.length+' 个表单');
}

/* 单表单导出（rows 提供则导出选中行；否则导出全量） */
function exportForm(formKey,rows){
  var cfg=XLSX_SHEETS.find(function(c){return c.formKey===formKey;});
  if(!cfg)return;
  var farr=fields[cfg.formKey]||[];
  var headers=farr.map(function(f){return f.label;});
  var isSel=(rows!=null);
  if(!isSel)rows=formKey==='order'?orderFlatRows():dataByVar(cfg.varName);
  var data=rows.map(function(item){
    return farr.map(function(f){
      var val=item[f.key];
      if(f.type==='date'&&val)return fmtDate(val);
      if(f.type==='number')return num(val);
      return val==null?'':val;
    });
  });
  var bytes=XLSX.build([{name:cfg.sheet,headers:headers,rows:data}]);
  var blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=cfg.sheet+(isSel?('_选中'+data.length+'条'):'')+'_'+todayStr()+'.xlsx';a.click();
  URL.revokeObjectURL(url);
  logOp('导出',cfg.sheet,(isSel?'导出选中 ':'导出 ')+data.length+' 条记录');
}

/* 下载导入模板：表头与导出一致，必填字段标红 */
function downloadTemplate(formKey){
  var cfg=XLSX_SHEETS.find(function(c){return c.formKey===formKey;});
  if(!cfg)return;
  var farr=fields[cfg.formKey]||[];
  if(farr.length===0){alert('该表单尚未配置字段，无法生成模板。');return;}
  var headers=farr.map(function(f){return {t:f.label,red:!!f.required};});
  var bytes=XLSX.build([{name:cfg.sheet,headers:headers,rows:[]}]);
  var blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=cfg.sheet+'_导入模板_'+todayStr()+'.xlsx';a.click();
  URL.revokeObjectURL(url);
  logOp('模板',cfg.sheet,'下载「'+cfg.sheet+'」导入模板（必填字段已标红）');
  var req=farr.filter(function(f){return f.required;}).map(function(f){return '「'+f.label+'」';}).join('、');
  alert('已下载「'+cfg.sheet+'」导入模板。\n\n• 红色表头为必填字段，导入时不可为空：'+req+'；\n• 请严格按表头列填写，不要改动表头文字；\n• 填写完成后用本表单的「导入」按钮导入即可。');
}

/* 单表单/全量导入入口 */
var importFormKey='';
function triggerImport(formKey){
  importFormKey=formKey||'';
  document.getElementById('importFile').click();
}

function importXLSX(e){
  var file=e.target.files[0];
  if(!file){importFormKey='';return;}
  var reader=new FileReader();
  reader.onload=async function(){
    try{
      var sheets=await XLSX.parse(reader.result);
      if(importFormKey){
        /* 单表单导入 */
        var cfg=XLSX_SHEETS.find(function(c){return c.formKey===importFormKey;});
        if(!cfg){alert('未找到对应表单配置');importFormKey='';e.target.value='';return;}
        var sh=sheets[0];
        if(!sh||!sh.headers.length){alert('未识别到有效数据');importFormKey='';e.target.value='';return;}
        var farr=fields[cfg.formKey]||[];
        var labelToKey={};
        farr.forEach(function(f){labelToKey[f.label]=f.key;});
        var colKeys=sh.headers.map(function(label){return labelToKey[label]||null;});
        var newData=sh.rows.map(function(row){
          var obj={};
          colKeys.forEach(function(key,c){
            if(key){
              var fdef=farr.find(function(f){return f.key===key;});
              var val=row[c];
              if(fdef&&fdef.type==='number')val=num(val);
              obj[key]=val;
            }
          });
          return obj;
        });
        if(newData.length===0){alert('未识别到有效数据。请确认表头与导出时一致。');}
        else{
          if(cfg.formKey==='order')newData=groupOrderRows(newData);
          setDataByVar(cfg.varName,newData);
          save(cfg.varName,newData);
          logOp('导入',cfg.sheet,'导入 '+newData.length+' 条记录到「'+cfg.sheet+'」');
          renderAll();
          alert('导入成功！共导入 '+newData.length+' 条记录到「'+cfg.sheet+'」。');
        }
      }else{
        /* 全量导入 */
        var imported=0;
        sheets.forEach(function(sh){
          var cfg=XLSX_SHEETS.find(function(c){return c.sheet===sh.name;});
          if(!cfg||!sh.headers.length)return;
          var farr=fields[cfg.formKey]||[];
          var labelToKey={};
          farr.forEach(function(f){labelToKey[f.label]=f.key;});
          var colKeys=sh.headers.map(function(label){return labelToKey[label]||null;});
          var newData=sh.rows.map(function(row){
            var obj={};
            colKeys.forEach(function(key,c){
              if(key){
                var fdef=farr.find(function(f){return f.key===key;});
                var val=row[c];
                if(fdef&&fdef.type==='number')val=num(val);
                obj[key]=val;
              }
            });
            return obj;
          });
          if(newData.length>0){
            if(cfg.formKey==='order')newData=groupOrderRows(newData);
            setDataByVar(cfg.varName,newData);
            save(cfg.varName,newData);
            logOp('导入',cfg.sheet,'全量导入 '+newData.length+' 条记录');
            imported++;
          }
        });
        if(imported===0){alert('未识别到有效数据。请确认文件包含正确的 Sheet 名称和表头。');}
        else{renderAll();alert('导入成功！共导入 '+imported+' 个表单的数据。');}
      }
    }catch(err){alert('导入失败：'+err.message+'\n\n请确认文件为 .xlsx 格式。');}
    importFormKey='';
    e.target.value='';
  };
  reader.readAsArrayBuffer(file);
}

/* ================================================================
   批量操作：行选择 + 上方工具栏（编辑/复制/删除/导出选中/导入/全选）
   说明：可编辑表单的"操作"改为「先勾选行 → 点上方按钮」；
   编辑/复制/生成排期等仅支持单条的操作，多选时自动拒绝。
================================================================ */
var selRows={};        // selRows[模块] = Set(行标识字符串)
var lastRowIds={};     // lastRowIds[模块] = 本次渲染的所有行标识（用于全选去重）
function selSet(m){if(!selRows[m])selRows[m]=new Set();return selRows[m];}
function selCount(m){return selSet(m).size;}
function clearSel(m){if(selRows[m])selRows[m].clear();}
/* 点击表格任意位置切换该行选中状态（复选框点击需 stopPropagation 避免双重切换） */
function selRowClick(m,id){
  id=String(id);
  const s=selSet(m);
  if(s.has(id))s.delete(id);else s.add(id);
  renderContent();
}
/* 全选复选框：点击切换——若当前已全选则清空，否则全选 */
function toggleSelAll(m){
  const s=selSet(m);
  const ids=lastRowIds[m]||[];
  const allSelected=ids.length>0 && ids.every(id=>s.has(String(id)));
  if(allSelected)s.clear();
  else ids.forEach(id=>s.add(String(id)));
  renderContent();
}

/* 各模块动作映射：edit/del 复用现有函数；copy 为新增；gen 仅交付计划有 */
var FORM_ACTIONS={
  product:{formKey:'product',get:function(i){return products[i];},edit:function(i){productModal(i);},del:function(i){delProduct(i);},copy:function(i){copyProduct(i);}},
  order:{formKey:'order',get:function(i){return orders[i];},edit:function(i){orderModal(i);},del:function(i){delOrder(i);},copy:function(i){copyOrder(i);}},
  inventory:{formKey:'inventory',get:function(i){return inventory[i];},edit:function(i){inventoryModal(i);},del:function(i){delInventory(i);},copy:function(i){copyInventory(i);}},
  dp_stockup:{formKey:'dailyPlan',get:function(i){return dailyPlans[i];},edit:function(i){planModal('stockup',i);},del:function(i){delPlan(i);},copy:function(i){copyPlan('stockup',i);}},
  dp_pkg:{formKey:'dailyPkg',get:function(i){return dailyPkgs[i];},edit:function(i){planModal('packaging',i);},del:function(i){delPkg(i);},copy:function(i){copyPkg('packaging',i);}},
  delivery:{formKey:'delivery',get:function(i){return deliveries[i];},edit:function(i){deliveryModal(i);},del:function(i){delDelivery(i);},copy:function(i){copyDelivery(i);},gen:function(i){genBatches(i);}}
};

/* 表单上方批量操作工具栏 */
function bulkBar(m){
  const a=FORM_ACTIONS[m];if(!a)return '';
  const btns=[];
  const ids=lastRowIds[m]||[];
  const allChecked=ids.length>0 && ids.every(id=>selSet(m).has(String(id)));
  btns.push('<label class="btn btn-sm" style="margin-right:2px"><input type="checkbox" '+(allChecked?'checked':'')+' onchange="toggleSelAll(\''+m+'\')"> 全选</label>');
  btns.push('<button class="btn btn-sm" onclick="bulkSingle(\''+m+'\',\'edit\')">编辑</button>');
  btns.push('<button class="btn btn-sm" onclick="bulkSingle(\''+m+'\',\'copy\')">复制</button>');
  if(a.gen)btns.push('<button class="btn btn-sm" onclick="bulkSingle(\''+m+'\',\'gen\')">生成排期</button>');
  btns.push('<button class="btn btn-sm btn-danger" onclick="bulkDelete(\''+m+'\')">删除</button>');
  btns.push('<button class="btn btn-sm" onclick="bulkExport(\''+m+'\')">导出选中</button>');
  btns.push('<button class="btn btn-sm" onclick="downloadTemplate(\''+a.formKey+'\')" title="下载导入模板（必填字段标红）">模板</button>');
  btns.push('<button class="btn btn-sm" onclick="triggerImport(\''+a.formKey+'\')" title="导入此表单数据">导入</button>');
  const cnt=selCount(m)>0?(' <span class="sel-count">已选 '+selCount(m)+' 项</span>'):'';
  return '<div class="bulk-bar">'+btns.join('')+cnt+'</div>';
}

/* 单选操作（编辑/复制/生成排期）：多选或空选时拒绝 */
function bulkSingle(m,act){
  const s=selSet(m);
  const label={edit:'编辑',copy:'复制',gen:'生成排期'}[act];
  if(s.size===0){alert('请先在左侧勾选要'+label+'的记录');return;}
  if(s.size>1){alert('「'+label+'」仅支持选中单条记录，当前已选 '+s.size+' 条。请只勾选一条再操作。');return;}
  const i=Number([...s][0]);
  const a=FORM_ACTIONS[m];
  if(act==='edit')a.edit(i);
  else if(act==='copy')a.copy(i);
  else if(act==='gen'&&a.gen)a.gen(i);
}

/* 多选删除（一次确认） */
function bulkDelete(m){
  const s=selSet(m);
  if(s.size===0){alert('请先在左侧勾选要删除的记录');return;}
  if(!confirm('确认删除选中的 '+s.size+' 条记录？此操作不可撤销。'))return;
  const idxs=[...s].map(Number).sort((x,y)=>y-x);
  idxs.forEach(i=>{
    const rec=FORM_ACTIONS[m].get(i);
    if(rec&&rec.id)logOp('删除',m,'删除「'+rec.id+'」');
    else if(rec&&rec.orderId)logOp('删除',m,'删除「'+rec.orderId+'」');
    else logOp('删除',m,'删除记录');
  });
  if(m==='product'){idxs.forEach(i=>products.splice(i,1));save('products',products);}
  else if(m==='order'){idxs.forEach(i=>orders.splice(i,1));save('orders',orders);}
  else if(m==='inventory'){idxs.forEach(i=>inventory.splice(i,1));save('inventory',inventory);}
  else if(m==='dp_stockup'){idxs.forEach(i=>dailyPlans.splice(i,1));save('dailyPlans',dailyPlans);}
  else if(m==='dp_pkg'){idxs.forEach(i=>dailyPkgs.splice(i,1));save('dailyPkgs',dailyPkgs);}
  else if(m==='delivery'){idxs.forEach(i=>deliveries.splice(i,1));save('deliveries',deliveries);}
  clearSel(m);
  renderContent();
}

/* 导出选中条目（需求：表单导出改为导出选中） */
function bulkExport(m){
  const a=FORM_ACTIONS[m];if(!a)return;
  const s=selSet(m);
  if(s.size===0){alert('请先勾选要导出的记录');return;}
  const idxs=[...s].map(Number);
  let rows=idxs.map(i=>a.get(i)).filter(Boolean);
  if(m==='order')rows=orderFlatRowsOf(idxs.map(i=>orders[i]));
  exportForm(a.formKey,rows);
  logOp('导出',a.formKey,'导出选中 '+rows.length+' 条记录');
}

/* 生成不冲突的复制主键（id 类字段） */
function suggestCopyId(baseId,exists){
  if(!exists(baseId))return baseId;
  let i=2;
  while(exists(baseId+'_'+i))i++;
  return baseId+'_'+i;
}
function copyProduct(i){const c={...products[i]};c.id=suggestCopyId(c.id,id=>products.some(p=>p.id===id));productModal(-1,c);}
function copyOrder(i){const c=JSON.parse(JSON.stringify(orders[i]));c.id=suggestCopyId(c.id,id=>orders.some(o=>o.id===id));orderModal(-1,c);}
function copyInventory(i){const c={...inventory[i]};c.date=todayStr();inventoryModal(-1,c);}
function copyPlan(type,i){
  if(type==='stockup'){const c={...dailyPlans[i]};c.date=planDate;planModal('stockup',-1,c);}
  else{const c={...dailyPkgs[i]};c.date=planDate;planModal('packaging',-1,c);}
}
function copyDelivery(i){const c={...deliveries[i]};c.orderId=suggestCopyId(c.orderId,id=>deliveries.some(d=>d.orderId===id));deliveryModal(-1,c);}

/* 订单按选中订单列表展开为多商品行（供导出选中用） */
function orderFlatRowsOf(list){
  var rows=[];
  (list||[]).forEach(function(o){
    orderItems(o).forEach(function(it){
      var r={};
      (fields.order||[]).forEach(function(f){r[f.key]=isLineField(f)?it[f.key]:o[f.key];});
      rows.push(r);
    });
  });
  return rows;
}

/* ================================================================
   自动备份（可携式 .json，用于链接轮换/换设备后一键恢复）
================================================================ */
function autoBackupNow(force){
  if(!autoBackupOn)return;
  var now=Date.now();
  if(!force && now-lastAutoBackup < AUTO_BACKUP_MIN*60000)return;
  lastAutoBackup=now;
  var data={
    version:2,exportDate:new Date().toISOString(),
    products:products,orders:orders,inventory:inventory,
    dailyPlans:dailyPlans,dailyPkgs:dailyPkgs,deliveries:deliveries,
    logs:logs,fields:fields,meta:meta
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='生产排单系统_自动备份_'+todayStr()+'_'+new Date().toISOString().slice(11,16).replace(':','')+'.json';
  a.click();
  URL.revokeObjectURL(url);
  var t=new Date().toLocaleTimeString('zh-CN',{hour12:false});
  logOp('自动备份','全部数据','自动备份 '+
    ((products.length||0)+(orders.length||0)+(inventory.length||0)+
     (dailyPlans.length||0)+(dailyPkgs.length||0)+(deliveries.length||0))+' 条记录');
  updateAutoBackupStatus(t);
}
function scheduleAutoBackup(){ if(autoBackupOn) autoBackupNow(false); }
function updateAutoBackupStatus(t){
  var s=document.getElementById('autoBackupStatus');
  if(s)s.textContent='上次 '+t;
}
function toggleAutoBackup(){
  autoBackupOn=!autoBackupOn;
  save('autoBackupOn',autoBackupOn);
  var b=document.getElementById('autoBackupBtn');
  if(b)b.textContent='自动备份：'+(autoBackupOn?'开':'关');
  if(autoBackupOn)alert('已开启自动备份：数据变更时会自动下载 .json 备份文件，链接轮换后用顶部「恢复」即可还原。');
}

function restoreBackup(e){
  var file=e.target.files[0];
  if(!file)return;
  if(!confirm('恢复将覆盖当前所有数据，且不可撤销。确定继续？')){e.target.value='';return;}
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      if(!data||typeof data!=='object')throw new Error('文件格式不正确');
      if(data.products)products=data.products;
      if(data.orders)orders=data.orders;
      if(data.inventory)inventory=data.inventory;
      if(data.dailyPlans)dailyPlans=data.dailyPlans;
      if(data.dailyPkgs)dailyPkgs=data.dailyPkgs;
      if(data.deliveries)deliveries=data.deliveries;
      if(data.logs)logs=data.logs;
      if(data.fields)fields=data.fields;
      if(data.meta)meta=data.meta;
      // 恢复后重置审核状态：草稿作废，字段直接进入已审核
      fieldsAudit='audited';fieldsDraft=null;
      save('fieldsAudit','audited');save('fieldsDraft',null);
      normalizeFields();   // 兼容旧版字段：补齐 level 标记
      migrateOrders();   // 兼容旧版平铺订单备份
      save('products',products);save('orders',orders);save('inventory',inventory);
      save('dailyPlans',dailyPlans);save('dailyPkgs',dailyPkgs);save('deliveries',deliveries);
      save('logs',logs);save('fields',fields);save('meta',meta);
      renderAll();
      logOp('恢复','全部数据','从备份文件恢复 '+
        ((products.length||0)+(orders.length||0)+(inventory.length||0)+
         (dailyPlans.length||0)+(dailyPkgs.length||0)+(deliveries.length||0))+' 条记录');
      alert('恢复成功！共恢复 ' +
        ((products.length||0)+(orders.length||0)+(inventory.length||0)+
         (dailyPlans.length||0)+(dailyPkgs.length||0)+(deliveries.length||0)) + ' 条记录。');
    }catch(err){
      alert('恢复失败：'+err.message+'\n\n请确认文件为系统导出的 .json 备份文件。');
    }
    e.target.value='';
  };
  reader.readAsText(file);
}

function confirmClear(){
  if(!confirm('确认清空所有数据？此操作不可恢复，建议先导出备份！'))return;
  if(!confirm('再次确认：所有产品、订单、库存、排产、交付数据将被删除！'))return;
  products=[];orders=[];inventory=[];dailyPlans=[];dailyPkgs=[];deliveries=[];
  save('products',products);save('orders',orders);save('inventory',inventory);
  save('dailyPlans',dailyPlans);save('dailyPkgs',dailyPkgs);save('deliveries',deliveries);
  logOp('清空','全部数据','清空所有业务数据');
  renderAll();
}

/* ================================================================
   初始化
================================================================ */
async function bootstrap(){
  products=await DB.get('products',[]);
  orders=await DB.get('orders',[]);
  inventory=await DB.get('inventory',[]);
  dailyPlans=await DB.get('dailyPlans',[]);
  dailyPkgs=await DB.get('dailyPkgs',[]);
  deliveries=await DB.get('deliveries',[]);
  logs=await DB.get('logs',[]);
  fields=await DB.get('fields',JSON.parse(JSON.stringify(defaultFields)));
  fieldsAudit=await DB.get('fieldsAudit','audited');
  fieldsDraft=await DB.get('fieldsDraft',null);
  meta=await DB.get('meta',{seq:0});
  tblLayout=await DB.get('tblLayout',{})||{};
  autoBackupOn=false;

  // 兼容旧字段：为订单字段补齐 level 标记（表头/表体）
  normalizeFields();
  // 产品主数据：规格型号 → 规格 + 型号（字段配置 + 数据迁移）
  migrateSpecSplit();
  // 产品主数据：删除"库存上下限"4个字段（配置迁移）
  migrateRemoveProductFields();
  // 产品主数据：日产能2字段改为非必填（配置迁移）
  migrateProductFieldsOptional();

  // 仅当"从未成功保存过任何数据"的纯净环境才灌入示例；一旦有过数据(meta.seeded)绝不重置，避免覆盖
  if(!meta.seeded && products.length===0&&orders.length===0&&inventory.length===0&&dailyPlans.length===0&&dailyPkgs.length===0&&deliveries.length===0){
    seed();
    meta.seeded=true; save('meta',meta);
  }

  // 旧版平铺订单数据 → 多行明细结构
  migrateOrders();

  bootDone=true;
  var ab=document.getElementById('autoBackupBtn');
  if(ab)ab.textContent='自动备份：'+(autoBackupOn?'开':'关');
  renderAll();
}

bootstrap();
</script>
