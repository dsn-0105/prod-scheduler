function ppSetView(v){
  if(v!=='day'&&v!=='all')planViewDate=planDateTo;   // 切到周/月：以日视图结束日为参照（总览不过滤日期）
  planView=v;
  renderContent();
}
function ppChangeDate(){planViewDate=document.getElementById('ppDate').value||planViewDate;renderContent();}
function ppChangeFrom(){const v=document.getElementById('ppFrom').value;if(v)planDateFrom=v;renderContent();}
function ppChangeTo(){const v=document.getElementById('ppTo').value;if(v)planDateTo=v;renderContent();}
function ppChangeMonth(){const v=document.getElementById('ppDate').value;if(v)planViewDate=v+'-01';renderContent();}
function ppShiftDate(delta){
  if(planView==='all')return;      // 总览模式：无日期可移动
  if(planView==='day'){
    if(planDateFrom<planDateTo)return;      // 时间段模式：上/下一天禁用
    const d=new Date(planDateFrom);
    d.setDate(d.getDate()+delta);
    const nd=fmtDate(d);
    planDateFrom=nd;planDateTo=nd;planViewDate=nd;
  }else{
    const d=new Date(planViewDate);
    if(planView==='month'){d.setMonth(d.getMonth()+delta);planViewDate=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';}
    else if(planView==='week'){d.setDate(d.getDate()+delta*7);planViewDate=fmtDate(d);}
    else{d.setDate(d.getDate()+delta);planViewDate=fmtDate(d);}
  }
  renderContent();
}

/* 周/月聚合视图：按产品汇总计划量/完成量/进度 */
function ppInRange(p,view){
  const d=fmtDate(p.planDate);
  if(view==='week'){const w=ppWeekRange(planViewDate);return d>=w[0]&&d<=w[1];}
  return d.slice(0,7)===planViewDate.slice(0,7);
}
function renderProdPlanAgg(view,writable){
  const inRange=productionPlans.filter(p=>ppInRange(p,view));
  if(inRange.length===0)return '<div class="empty" style="padding:18px">'+(view==='week'?('本周（'+ppWeekRange(planViewDate)[0]+' ~ '+ppWeekRange(planViewDate)[1]+'）'):(planViewDate.slice(0,7)+' 月'))+'无排产计划</div>';
  const agg={};
  inRange.forEach(p=>{ppItems(p).forEach(it=>{
    const pid=it.productId||'';
    /* 2026-08-29.83：周/月聚合视图新增「型号」「规格」（取排产明细行 it.model/it.spec，同产品多行一致） */
    if(!agg[pid])agg[pid]={productId:pid,productName:it.productName||'',model:it.model||'',spec:it.spec||'',planQty:0,doneQty:0,count:0};
    agg[pid].planQty+=ppPlanOf(it);agg[pid].doneQty+=ppDoneOf(it);agg[pid].count++;
  });});
  const list=Object.values(agg).sort((a,b)=>b.planQty-a.planQty);
  const tPlan=list.reduce((s,a)=>s+a.planQty,0),tDone=list.reduce((s,a)=>s+a.doneQty,0);
  let html='<div class="stats">'+
    statCard(inRange.length,'排产单数','blue')+
    statCard(tPlan,'计划总量','blue')+
    statCard(tDone,'累计完成','amber')+
    statCard(tPlan>0?Math.round(tDone/tPlan*100):0,'整体进度%','')+
    '</div>';
  html+='<div class="table-wrap"><table><thead><tr><th>产品编码</th><th>产品名称</th><th>型号</th><th>规格</th><th style="text-align:right">计划数量</th><th style="text-align:right">累计完成</th><th style="text-align:right">进度</th><th style="text-align:right">排产单数</th></tr></thead><tbody>';
  list.forEach(a=>{
    const pct=a.planQty>0?Math.round(a.doneQty/a.planQty*100):0;
    html+='<tr><td>'+esc(a.productId)+'</td><td>'+esc(a.productName)+'</td>'+
      '<td>'+esc(a.model||'')+'</td><td>'+esc(a.spec||'')+'</td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right">'+money(a.planQty)+'</td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right;font-weight:600">'+money(a.doneQty)+'</td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right">'+(a.planQty>0&&a.doneQty>=a.planQty?'<span class="tag tag-green">100%</span>':pct+'%')+'</td>'+
      '<td style="text-align:right">'+a.count+'</td></tr>';
  });
  html+='</tbody></table></div>';
  return html;
}

/* 交付计划 → 下推排产计划（仅限 1 条；planQty=0 行跳过；可重复下推支持分批生产） */
function genProdPlan(){
  const s=selSet('delivery');
  if(s.size===0){alert('请先勾选 1 条交付计划');return;}
  if(s.size>1){alert('「下推排产计划」一次只能选择 1 条交付计划，当前已选 '+s.size+' 条。请只勾选一条再操作。');return;}
  const di=Number([...s][0]);
  const d=deliveries[di];
  if(!d){alert('未找到该交付计划');return;}
  /* 2026-08-25.24：逐行记录 dlLine（交付计划 items 原索引）——同产品多行明细下推时按行区分，数量不再被聚合/取首行 */
  const items=deliveryItems(d).map((it,li)=>({it,li})).filter(x=>num(x.it.planQty)>0).map(x=>{
    const it=x.it,li=x.li;
    const prod=products.find(p=>p.id===it.productId)||{};
    const q=num(it.planQty);
    /* 工序模板（.11）：按产品主数据 processTplId 取模板，固化工序快照 stepsDef + 初始化 steps */
    const tpl=prod.processTplId?tplOf(prod.processTplId):null;
    const def=(tpl&&Array.isArray(tpl.steps)&&tpl.steps.length)?tpl.steps:DEFAULT_TPL_STEPS;
    const stepsDef=def.map(x=>({key:x.key,label:x.label,plan:!!x.plan,mandatory:!!x.mandatory}));
    const steps={};
    def.forEach(x=>{steps[x.key]=x.plan?{plan:q,done:0}:0;});
    return {productId:it.productId||'',productName:it.productName||'',spec:it.spec||prod.spec||'',model:it.model||prod.model||'',unit:prod.unit||'',planQty:q,doneQty:0,lineNotes:it.lineNotes||'',dlLine:li,stepsDef:stepsDef,steps:steps};
  });
  if(items.length===0){alert('该交付计划无「本批计划>0」的明细行，无法下推');return;}
  /* 2026-08-29.86：全部下推=已排产覆盖全部计划量→拦截（alert 无法下推）；部分下推=还有未排数量→直接继续（去掉分批确认框，分批为常态操作） */
  if(ppDeliveryStatus(di)==='全部下推'){alert('该交付计划已全部下推，无法再下推排产计划。');return;}
  const np={id:ppNextId(),deliveryIdx:di,orderId:d.orderId,customer:d.customer||'',finalDate:fmtDate(d.finalDate),planDate:fmtDate(d.finalDate)||todayStr(),status:'待排产',notes:'',items:items};
  window.__ppPending=np;
  switchTab('prodPlan');
  prodPlanModal(-1,np);
}
function ppNextId(){
  const today=todayStr().replace(/-/g,'');
  const re=new RegExp('^PSCD-'+today+'-(\\d+)$');
  let max=0;
  productionPlans.forEach(p=>{
    const m=String(p.id||'').match(re);
    if(m)max=Math.max(max,parseInt(m[1],10));
  });
  return 'PSCD-'+today+'-'+String(max+1).padStart(3,'0');
}

/* 排产计划编辑弹窗（下推确认 / 编辑）：明细只读，可改计划日期/交付期/状态/备注 */
function prodPlanModal(idx,prefill){
  if(!ensureWrite('prodPlan'))return;
  const isNew=(prefill!=null);
  const p=isNew?prefill:(idx!=null?JSON.parse(JSON.stringify(productionPlans[idx])):null);
  if(!p)return;
  const items=ppItems(p);
  /* 明细行：总计划数=交付计划行 planQty；已排产=同交付计划同产品其他排产单之和（编辑排除自身）；
     未排产=总−已排产；本次排产数可编辑（默认：下推/复制=未排产，编辑=当前 planQty；独立单不限制显示 —） */
  let rows='';
  items.forEach((it,i)=>{
    const stepsDef=stepsDefOf(p,it);
    /* 2026-08-25.24：同产品多行明细时按行级 dlLine 计算总计划/已排产（存量无 dlLine 自动回退产品级） */
    const dlLine=it.dlLine!=null?it.dlLine:null;
    const total=ppTotalOfLine(p.deliveryIdx,dlLine,it.productId);
    const already=ppPlannedOfLine(p.deliveryIdx,dlLine,it.productId,idx>=0?idx:null);
    const remain=(total!=null)?Math.max(0,total-already):null;
    let defVal;
    if(!isNew)defVal=ppPlanOf(it);                      // 编辑已有单：当前数量
    else if(remain!=null)defVal=remain>0?remain:0;      // 下推：默认=未排产
    else defVal=ppPlanOf(it);                           // 独立单（复制）：原数量
    rows+='<tr>'+
      '<td>'+esc(it.productId)+'</td><td>'+esc(it.productName)+'</td><td>'+esc(it.model||'')+'</td><td>'+esc(it.spec||'')+'</td><td>'+esc(it.unit||'')+'</td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right">'+(total!=null?money(total):'—')+'</td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right">'+(total!=null?money(already):'—')+'</td>'+

      '<td style="text-align:center"><input type="number" class="pp_qty" data-li="'+i+'" min="0" '+(remain!=null?('max="'+remain+'"'):'')+' value="'+defVal+'" style="width:88px"></td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right;font-weight:600">'+money(ppDoneOf(it))+'</td>'+
      stepsDef.map(x=>'<td style="font-variant-numeric:tabular-nums;text-align:right;font-size:12px">'+money(ppStepDone(it,x.key))+'</td>').join('')+
      '<td style="font-size:12px;color:var(--muted);max-width:160px">'+esc(it.lineNotes||'')+'</td></tr>';
  });
  const srcTxt=(p.deliveryIdx!=null)?('#'+(p.deliveryIdx+1)+' · 订单 '+esc(p.orderId)):'';
  const body='<div class="form-row">'+
    '<div><label>排产单号'+(isNew?'（保存后自动生成）':'')+' *</label><input type="text" id="pp_id" value="'+(isNew?'待生成':esc(p.id))+'" readonly style="background:#f6f8fa;color:var(--muted)"></div>'+
    '<div><label>来源交付计划</label><input type="text" value="'+srcTxt+'" readonly style="background:#f6f8fa;color:var(--muted)"></div>'+
    '<div><label>客户</label><input type="text" value="'+esc(p.customer)+'" readonly style="background:#f6f8fa;color:var(--muted)"></div>'+
    '</div><div class="form-row">'+
    '<div><label>计划生产日期 *</label><input type="date" id="pp_planDate" value="'+fmtDate(p.planDate)+'"></div>'+
    '<div><label>物料齐套时间</label><input type="date" id="pp_materialReadyDate" value="'+fmtDate(p.materialReadyDate)+'" title="选填，预计物料齐备可投产的日期"></div>'+
    '<div><label>交付期</label><input type="date" id="pp_finalDate" value="'+fmtDate(p.finalDate)+'"></div>'+
    '<div><label>状态（系统自动）</label><input type="text" value="'+esc(p.status)+'" readonly style="background:#f6f8fa;color:var(--muted)"></div>'+
    '</div><div class="form-row">'+
    '<div style="flex:1"><label>备注</label><input type="text" id="pp_notes" value="'+esc(p.notes)+'"></div>'+
    '</div>'+
    '<div style="margin-bottom:6px;font-size:12px;color:var(--muted)">本次排产数量可修改（留空或 0 = 该行本次不排）；同一交付计划多次排产合计不能超过「未排产」数<br><b style="color:var(--primary)">下推保存后：每个「本次排产数量>0」的明细行将生成一张独立排产单（单号自动区分）</b></div>'+
    '<div class="table-wrap" style="max-height:300px;overflow:auto"><table><thead><tr><th>产品编码</th><th>产品名称</th><th>型号</th><th>规格</th><th>单位</th>'+
      '<th style="text-align:right">总计划数</th><th style="text-align:right">已排产</th><th style="text-align:right">未排产</th><th style="text-align:center">本次排产数量</th><th style="text-align:right">累计完成</th>'+
      (items.length?stepsDefOf(p,items[0]).map(x=>'<th style="text-align:right;font-size:12px">'+esc(x.label)+'<br>完成</th>').join(''):'')+'<th style="text-align:left;font-size:12px">行备注</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  showModal(isNew?'下推排产计划（确认）':'编辑排产计划',body,
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveProdPlan('+(idx!=null?idx:-1)+')">保存</button>');
}
function saveProdPlan(idx){
  const id=(document.getElementById('pp_id')||{}).value;
  if(!id){alert('排产单号缺失');return;}
  const planDate=document.getElementById('pp_planDate').value;
  if(!planDate){alert('请填写计划生产日期');return;}
  const finalDate=document.getElementById('pp_finalDate').value;
  const materialReadyDate=(document.getElementById('pp_materialReadyDate')||{}).value||'';   /* 2026-08-29.81：物料齐套时间（选填，默认空） */
  const notes=document.getElementById('pp_notes').value;
  const p=(idx>=0)?productionPlans[idx]:(window.__ppPending||null);
  if(!p){alert('下推数据缺失，请重新操作');return;}
  const status=p.status;   /* 2026-08-25.27：状态不可手动编辑，由系统自动转变（投产/报工完工） */
  const srcItems=ppItems(p);
  /* 逐行读取本次排产数量：留空/0=该行本次不排；校验 ≤ 未排产、且不能低于已完成数 */
  const finalItems=[];
  for(let i=0;i<srcItems.length;i++){
    const it=srcItems[i];
    const el=document.querySelector('.pp_qty[data-li="'+i+'"]');
    const raw=el?String(el.value||'').trim():'';
    if(raw==='')continue;
    const q=parseFloat(raw);
    if(isNaN(q)||q<=0)continue;
    /* 2026-08-25.24：同产品多行明细时按行级 dlLine 校验（存量无 dlLine 自动回退产品级） */
    const dlLine=it.dlLine!=null?it.dlLine:null;
    const total=ppTotalOfLine(p.deliveryIdx,dlLine,it.productId);
    const already=ppPlannedOfLine(p.deliveryIdx,dlLine,it.productId,idx>=0?idx:null);
    const remain=(total!=null)?Math.max(0,total-already):null;
    if(remain!=null&&q>remain){
      alert('产品「'+(it.productName||it.productId)+'」本次排产 '+money(q)+' 超过未排产 '+money(remain)+'，请调整（同一交付计划多次排产合计不能超过总计划数）。');
      return;
    }
    const stepsDef=stepsDefOf(p,it);
    for(let k=0;k<stepsDef.length;k++){
      const d=ppStepDone(it,stepsDef[k].key);
      if(d>q){
        alert('产品「'+(it.productName||it.productId)+'」本次排产 '+money(q)+' 低于该工序「'+stepsDef[k].label+'」已完成 '+money(d)+'，请调整。');
        return;
      }
    }
    const ni=JSON.parse(JSON.stringify(it));
    ni.planQty=q;
    if(!ni.steps)ni.steps={};
    ppEnsureSteps(ni,stepsDef);
    if(!ni.stepsDef)ni.stepsDef=stepsDef.map(x=>({key:x.key,label:x.label,plan:!!x.plan,mandatory:!!x.mandatory}));
    stepsDef.forEach(x=>{ if(x.plan&&typeof ni.steps[x.key]==='object')ni.steps[x.key].plan=q; });
    finalItems.push(ni);
  }
  if(finalItems.length===0){alert('请至少保留一行「本次排产数量>0」的明细');return;}
  if(idx>=0){
    const old=JSON.parse(JSON.stringify(p));
    /* 2026-08-25.16：改为「已取消」→ 扣回已回写的订单交付（已取消不占交付额度）；恢复（已取消→非取消）→ 重新加回 */
    if(status!==old.status){
      const cancelTo=(status==='已取消'),cancelFrom=(old.status==='已取消');
      ppItems(old).forEach(it=>{
        const d=ppDoneOf(it);
        if(d>0&&(cancelTo||cancelFrom))writebackInbound(p.orderId,it.productId,cancelTo?-d:d,ppOrderLineOf(p,it));
      });
    }
    p.planDate=planDate;p.finalDate=finalDate;p.status=status;p.notes=notes;p.materialReadyDate=materialReadyDate;p.items=finalItems;
    logFieldDiffs('排产计划',HARD_FIELDS.prodPlan,old,p,p.id);
    logOp('编辑','排产计划','排产单「'+p.id+'」调整排产数量/信息');
  }else{
    /* 2026-08-25.25：下推拆单——每个「本次排产数量>0」的明细行生成一张独立排产单（单号连续递增区分） */
    p.planDate=planDate;p.finalDate=finalDate;p.status=status;p.notes=notes;p.materialReadyDate=materialReadyDate;
    const today=todayStr().replace(/-/g,'');
    const re=new RegExp('^PSCD-'+today+'-(\\d+)$');
    let maxSeq=0;
    productionPlans.forEach(pp=>{const m=String(pp.id||'').match(re);if(m)maxSeq=Math.max(maxSeq,parseInt(m[1],10));});
    finalItems.forEach(it=>{
      maxSeq++;
      const np={id:'PSCD-'+today+'-'+String(maxSeq).padStart(3,'0'),
        deliveryIdx:p.deliveryIdx,orderId:p.orderId,customer:p.customer||'',
        finalDate:fmtDate(finalDate),planDate:fmtDate(planDate),status:status,notes:notes,
        items:[it]};
      productionPlans.push(np);
      logOp('新增','排产计划','新增「'+np.id+'」（订单'+p.orderId+'）');
    });
    window.__ppPending=null;
  }
  save('productionPlans',productionPlans);
  closeModal();
  renderContent();
  /* 2026-08-25.64：编辑后若被当前筛选/排序隐藏（如改了计划日期/数量），自动取消勾选防幽灵选择（下推新单 idx<0 无需处理） */
  if(idx>=0&&!prodPlanRowVisibleInDom(p.id))clearHiddenProdPlanSel(idx);
}
function copyProdPlan(i){
  const c=JSON.parse(JSON.stringify(productionPlans[i]));
  c.id=ppNextId();
  c.planDate=todayStr();
  c.status='待排产';
  c.notes='';
  c.deliveryIdx=null;   /* 复制单为独立排产（不占原交付计划额度，本次排产数量可自由调整） */
  c.items.forEach(it=>{
    const q=num(it.planQty);
    const def=Array.isArray(it.stepsDef)&&it.stepsDef.length?it.stepsDef:DEFAULT_TPL_STEPS;
    it.doneQty=0;
    it.steps={};
    def.forEach(x=>{it.steps[x.key]=x.plan?{plan:q,done:0}:0;});
  });
  window.__ppPending=c;
  prodPlanModal(-1,c);
}
/* 2026-08-25.27：排产计划禁止复制/新增，只能从交付计划下推——copyProdPlan 保留定义无入口（FORM_ACTIONS 无 copy 映射、批量栏无复制按钮） */
function delProdPlan(i){
  /* 2026-08-25.29：只有「待排产」的排产计划才能删除（生产中/已完成禁止，防破坏报工/订单回写） */
  if(productionPlans[i].status!=='待排产'){alert('仅「待排产」的排产计划可以删除（当前：'+productionPlans[i].status+'）');return;}
  if(!confirm('确认删除该排产计划「'+productionPlans[i].id+'」？'))return;
  const p=productionPlans[i];
  /* 2026-08-25.16：删除已报工（有入库累计）的排产单 → 扣回已回写的订单交付（防虚增交付）；.40 行级扣回 */
  ppItems(p).forEach(it=>{const d=ppDoneOf(it);if(d>0)writebackInbound(p.orderId,it.productId,-d,ppOrderLineOf(p,it));});
  logOp('删除','排产计划','删除「'+p.id+'」');
  productionPlans.splice(i,1);
  save('productionPlans',productionPlans);
  renderContent();
  /* 2026-08-25.64：删除后清理勾选，防 splice 索引漂移幽灵选择 */
  selSet('prodPlan').delete(String(i));
}

/* 2026-08-25.27/28：投产——支持多选批量投产（选中多条「待排产」排产计划 → 置「生产中」）；
   非待排产（生产中/已完成）自动跳过并在完成后提示；全部不可投产则拦截 */
function ppLaunch(){
  const s=selSet('prodPlan');
  if(s.size===0){alert('请先勾选要投产的排产计划');return;}
  const idxs=[...s].map(Number);
  let launched=0,skipped=0;
  const skippedIds=[];
  idxs.forEach(pi=>{
    const p=productionPlans[pi];
    if(!p)return;
    if(p.status!=='待排产'){skipped++;skippedIds.push(p.id);return;}
    p.status='生产中';
    launched++;
    logOp('投产','排产计划','排产单「'+p.id+'」投产（待排产→生产中）');
  });
  if(launched===0){alert('所选排产计划均不可投产（需为「待排产」状态）'+(skippedIds.length?('：\n'+skippedIds.join('、')):''));return;}
  save('productionPlans',productionPlans);
  renderContent();
  /* 2026-08-25.64：投产改变状态后若被当前筛选隐藏（如筛「待排产」→ 已投产行不再显示），自动取消勾选防幽灵选择 */
  idxs.forEach(pi=>{const p=productionPlans[pi];if(p&&!prodPlanRowVisibleInDom(p.id))clearHiddenProdPlanSel(pi);});
  if(skipped>0)alert('已投产 '+launched+' 条；跳过 '+skipped+' 条（非待排产）：'+skippedIds.join('、'));
}
/* 2026-08-25.29：投产下拉菜单开关（▾ 箭头） */

}
/* 点击投产下拉以外区域自动关闭（全局注册一次） */

/* ================================================================
   2026-08-29.73：排产计划「延后/提前」——批量调整 planDate（样式复用投产|▾ 融合按钮规范 .30/.31）；
   主按钮=±1 天，▾ 下拉=3 天/7 天/自定义（1~365）；多选；已完成/已取消跳过；提前不低于今天（钳制+提示）
================================================================ */
/* 延后/提前融合按钮（.30/.31 规范）；plain=true 为白底常规样式（2026-08-29.74：提前/报工按钮白色化） */
function ppShiftBtnHtml(type,label,plain){
  const act=type==='delay'?'延后':'提前';
  const menuId=type==='delay'?'ppDelayMenu':'ppAdvanceMenu';
  const wrapId=type==='delay'?'ppDelayWrap':'ppAdvanceWrap';
  const wrapStyle=plain?'position:relative;display:inline-flex;align-items:stretch;background:#fff;border:1px solid var(--border);border-radius:6px;vertical-align:middle':'position:relative;display:inline-flex;align-items:stretch;background:var(--primary);border:1px solid var(--primary);border-radius:6px;vertical-align:middle';
  const btnStyle=plain?'border:none;border-radius:5px 0 0 5px;margin:0;color:var(--text);background:transparent;padding:5px 10px':'border:none;border-radius:5px 0 0 5px;margin:0;color:#fff;background:transparent;padding:5px 10px';
  const sepStyle=plain?'width:1px;background:rgba(0,0,0,.12)':'width:1px;background:rgba(255,255,255,.45)';
  const arrowStyle=plain?'border:none;border-radius:0 5px 5px 0;margin:0;color:var(--text);background:transparent;padding:5px 7px':'border:none;border-radius:0 5px 5px 0;margin:0;color:#fff;background:transparent;padding:5px 7px';
  const itemCls=plain?'btn btn-sm':'btn btn-sm btn-primary';
  return '<span id="'+wrapId+'" style="'+wrapStyle+'">'+
    '<button class="btn btn-sm" style="'+btnStyle+'" onclick="ppShiftDays(\''+type+'\',1)" title="'+act+'选中的排产计划 1 天（多选，待排产/生产中）">'+label+'</button>'+
    '<span style="'+sepStyle+'"></span>'+
    '<button class="btn btn-sm" style="'+arrowStyle+'" onclick="event.stopPropagation();ppToggleShiftMenu(\''+type+'\')" title="更多'+act+'天数">▾</button>'+
    '<div id="'+menuId+'" style="display:none;position:absolute;right:0;top:100%;margin-top:2px;min-width:100%;background:#fff;border:1px solid #d1d5db;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:70">'+
    '<button class="'+itemCls+'" style="display:block;width:100%;border-radius:6px;text-align:left;padding:6px 10px" onclick="event.stopPropagation();ppToggleShiftMenu(\''+type+'\');ppShiftDays(\''+type+'\',3)">'+act+' 3 天</button>'+
    '<button class="'+itemCls+'" style="display:block;width:100%;border-radius:6px;text-align:left;padding:6px 10px" onclick="event.stopPropagation();ppToggleShiftMenu(\''+type+'\');ppShiftDays(\''+type+'\',7)">'+act+' 7 天</button>'+
    '<div style="display:flex;gap:4px;padding:6px 10px"><input type="number" id="ppShiftCustom_'+type+'" min="1" max="365" placeholder="自定义天数(1~365)" style="flex:1;min-width:60px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px"><button class="'+itemCls+'" onclick="event.stopPropagation();ppShiftCustom(\''+type+'\',document.getElementById(\'ppShiftCustom_'+type+'\'))">确定</button></div>'+
    '</div></span>';
}
/* 延后/提前菜单开关（互斥：打开一个关闭另一个） */
function ppToggleShiftMenu(type){
  ['delay','advance'].forEach(function(t){
    const el=document.getElementById(t==='delay'?'ppDelayMenu':'ppAdvanceMenu');
    if(el)el.style.display=(t===type&&el.style.display!=='block')?'block':'none';
  });
}
/* 点击延后/提前菜单以外区域自动关闭（全局注册一次） */
if(!window.__ppShiftMenuBound){window.__ppShiftMenuBound=true;document.addEventListener('click',function(e){
  ['delay','advance'].forEach(function(t){
    const menu=document.getElementById(t==='delay'?'ppDelayMenu':'ppAdvanceMenu');
    const wrap=document.getElementById(t==='delay'?'ppDelayWrap':'ppAdvanceWrap');
    if(menu&&wrap&&!e.target.closest('#'+wrap.id))menu.style.display='none';
  });
});}
/* 自定义天数：1~365 正整数校验 */
function ppShiftCustom(type,inp){
  const v=parseInt(inp.value,10);
  if(isNaN(v)||v<1||v>365){alert('请输入 1~365 的整数天数');inp.focus();return;}
  ppShiftDays(type,v);
}
/* 批量延后/提前：待排产/生产中可操作，已完成/已取消跳过；提前不低于今天（钳制+提示）；执行后幽灵勾选清理（.64） */
function ppShiftDays(type,days){
  const s=selSet('prodPlan');
  if(s.size===0){alert('请先勾选要'+(type==='delay'?'延后':'提前')+'的排产计划');return;}
  const idxs=[...s].map(Number);
  const dir=type==='delay'?1:-1;
  const act=type==='delay'?'延后':'提前';
  const today=todayStr();
  let done=0,skipped=0,clamped=0;
  const skippedIds=[],clampedIds=[];
  idxs.forEach(pi=>{
    const p=productionPlans[pi];
    if(!p)return;
    if(p.status==='已完成'||p.status==='已取消'){skipped++;skippedIds.push(p.id);return;}
    const d=new Date(String(p.planDate)+'T00:00:00');
    if(isNaN(d.getTime())){skipped++;skippedIds.push(p.id);return;}
    const oldDate=fmtDate(p.planDate);
    d.setDate(d.getDate()+dir*days);
    let nd=fmtDate(d);
    if(type==='advance'&&nd<today){nd=today;clamped++;clampedIds.push(p.id);}
    p.planDate=nd;
    done++;
    logOp(act,'排产计划','排产单「'+p.id+'」计划日期 '+oldDate+' → '+nd);
  });
  if(done===0){alert('所选排产计划均不可'+act+'（需为「待排产」或「生产中」）'+(skippedIds.length?('：\n'+skippedIds.join('、')):''));return;}
  save('productionPlans',productionPlans);
  renderContent();
  /* 2026-08-25.64：改 planDate 后若被当前筛选隐藏（如日视图日期范围外），自动取消勾选防幽灵选择 */
  idxs.forEach(pi=>{const p=productionPlans[pi];if(p&&!prodPlanRowVisibleInDom(p.id))clearHiddenProdPlanSel(pi);});
  let msg='已'+act+' '+done+' 条';
  if(skipped>0)msg+='；跳过 '+skipped+' 条（已完成/已取消）：'+skippedIds.join('、');
  if(clamped>0)msg+='；'+clamped+' 条已'+act+'到今天（原计划日期早于今天）：'+clampedIds.join('、');
  if(skipped>0||clamped>0)alert(msg);
}
/* 2026-08-25.29：反投产——选中多条「生产中」排产计划转回「待排产」；
   已报工（有报工明细记录 或 任一行累计完成>0）无法反投产；仅生产中可反投产（待排产/已完成跳过） */
function ppReverseLaunch(){
  const s=selSet('prodPlan');
  if(s.size===0){alert('请先勾选要反投产的排产计划');return;}
  const idxs=[...s].map(Number);
  let done=0,skipped=0;
  const skippedIds=[],badIds=[];
  idxs.forEach(pi=>{
    const p=productionPlans[pi];
    if(!p)return;
    if(p.status!=='生产中'){skipped++;skippedIds.push(p.id);return;}
    const hasReport=productionReports.some(r=>r.planId===p.id)||ppItems(p).some(it=>ppDoneOf(it)>0);
    if(hasReport){skipped++;skippedIds.push(p.id);badIds.push(p.id);return;}
    p.status='待排产';
    done++;
    logOp('反投产','排产计划','排产单「'+p.id+'」反投产（生产中→待排产）');
  });
  if(done===0){
    alert('所选排产计划均不可反投产（需为「生产中」且未报工）'+(badIds.length?('；已报工不可反投产：'+badIds.join('、')):''));
    return;
  }
  save('productionPlans',productionPlans);
  renderContent();
  /* 2026-08-25.64：反投产改变状态后若被当前筛选隐藏（如筛「生产中」→ 已反投产行不再显示），自动取消勾选防幽灵选择 */
  idxs.forEach(pi=>{const p=productionPlans[pi];if(p&&!prodPlanRowVisibleInDom(p.id))clearHiddenProdPlanSel(pi);});
  if(skipped>0)alert('已反投产 '+done+' 条；跳过 '+skipped+' 条：'+skippedIds.join('、')+(badIds.length?('（其中已报工无法反投产：'+badIds.join('、')+'）'):''));
}

/* 生产报工：选中 1 条排产计划 → 按产品工序模板（stepsDef）填本次完成数（增量累计）；
   必报工序=模板 mandatory（可填 0，填 0 视为已填写）；报工累计硬性不能超过本次排产数（超量直接拦截）；
   首次报工自动置「生产中」 */
function reportProdPlan(){
  const s=selSet('prodPlan');
  if(s.size===0){alert('请先勾选 1 条排产计划');return;}
  if(s.size>1){alert('「报工」一次只能选择 1 条排产计划，当前已选 '+s.size+' 条。请只勾选一条再操作。');return;}
  const pi=Number([...s][0]);
  const p=productionPlans[pi];
  if(!p){alert('未找到该排产计划');return;}
  if(p.status==='已取消'){alert('已取消的排产计划不能报工');return;}
  /* 2026-08-25.27：待排产（未投产）禁止报工 */
  if(p.status==='待排产'){alert('该排产计划尚未投产，请先在操作栏点「投产」后再报工');return;}
  const items=ppItems(p);
  /* 工序列 = 各产品行 stepsDef 的并集（不同产品模板列一致展示，缺工序行显示 —） */
  const union=[];
  items.forEach(it=>stepsDefOf(p,it).forEach(x=>{if(!union.find(u=>u.key===x.key))union.push({key:x.key,label:x.label,plan:!!x.plan,mandatory:!!x.mandatory});}));
  let rows='';
  items.forEach((it,i)=>{
    const myDef=stepsDefOf(p,it);
    rows+='<tr data-li="'+i+'"><td>'+esc(it.productId)+'</td><td>'+esc(it.productName)+'</td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right;font-weight:600">'+money(ppPlanOf(it))+'</td>'+
      '<td style="font-variant-numeric:tabular-nums;text-align:right;font-weight:600">'+money(ppDoneOf(it))+'</td>'+
      union.map(x=>{
        const stepDef=myDef.find(s=>s.key===x.key);
        if(!stepDef)return '<td style="text-align:center;color:var(--muted);font-size:11px">—</td>';
        const done=ppStepDone(it,x.key),plan=ppStepPlan(it,x.key);
        const isMand=!!stepDef.mandatory;
        return '<td style="text-align:center"><div style="font-size:11px;color:var(--muted)">'+(plan>0?('计划'+money(plan)):'—')+'<br>已报 '+money(done)+'</div>'+
          '<input type="number" class="rp_qty" data-li="'+i+'" data-step="'+x.key+'" min="0" placeholder="本次" style="width:72px">'+(isMand?' <span style="color:var(--red)">*</span>':'')+'</td>';
      }).join('')+
      '<td style="font-size:12px;color:var(--muted);max-width:140px">'+esc(it.lineNotes||'')+'</td></tr>';
  });
  const body='<div class="form-row">'+
    '<div><label>报工人</label><input type="text" id="rp_worker" placeholder="选填，最多 20 字" maxlength="20"></div>'+
    '<div style="flex:1"><span style="font-size:12px;color:var(--muted)">报工人为选填，填写后记录到报工明细中</span></div>'+
    '</div>'+
    '<div style="margin-bottom:8px;font-size:13px;color:var(--muted)">'+esc(p.id)+' · 订单 '+esc(p.orderId)+' · 客户 '+esc(p.customer)+' · 计划 '+fmtDate(p.planDate)+'（未填写的工序默认为 0；* 为关键工序提示；本次数量为增量，且不能超过本次排产数；「入库」工序报工后将自动回写订单已交付数量）</div>'+
    '<div class="table-wrap" style="max-height:340px;overflow:auto"><table><thead><tr><th>产品编码</th><th>产品名称</th><th style="text-align:right">计划数量</th><th style="text-align:right">累计完成</th>'+union.map(x=>'<th style="text-align:center">'+esc(x.label)+(x.mandatory?'<span style="color:var(--red)">*</span>':'')+'</th>').join('')+'<th style="text-align:left">行备注</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  showModal('生产报工（'+esc(p.id)+'）',body,
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveReport('+pi+')">提交报工</button>');
}
function saveReport(pi){
  const p=productionPlans[pi];
  if(!p)return;
  const worker=String((document.getElementById('rp_worker')||{}).value||'').trim();
  /* 2026-08-29.77：报工人改非必填（空则存 ''，明细展示 —） */
  const items=ppItems(p);
  const inputs=Array.prototype.slice.call(document.querySelectorAll('.rp_qty'));
  const entries=[];
  inputs.forEach(inp=>{
    const raw=String(inp.value||'').trim();
    if(raw==='')return;                        // 留空=不填
    const v=parseFloat(raw);
    if(isNaN(v))return;
    entries.push({li:parseInt(inp.getAttribute('data-li'),10),step:inp.getAttribute('data-step'),qty:v});  // 含 0：视为已填写
  });
  if(entries.length===0){alert('请至少填写一个工序的本次完成数');return;}
  if(!entries.some(e=>e.qty>0)){alert('请至少填写一个大于 0 的本次完成数（仅填 0 无法报工）');return;}
  /* .14 起：未填写的工序默认视为 0（不再强制必报工序填写，避免频繁弹窗；* 仅作关键工序提示） */
  /* 硬性上限（需求 2026-08-24.7）：报工累计不能超过本次排产数。
     入库类工序（plan=false）上限=本批排产数 planQty，其余工序上限=工序计划量 */
  const overRows=[];
  entries.forEach(e=>{
    if(e.qty<=0)return;
    const it=items[e.li];
    const def=stepsDefOf(p,it);
    const stepDef=def.find(x=>x.key===e.step);
    const cur=ppStepDone(it,e.step);
    const plan=(stepDef&&!stepDef.plan)?ppPlanOf(it):ppStepPlan(it,e.step);
    if(plan>0&&cur+e.qty>plan)overRows.push({name:it.productName||it.productId,step:(stepDef?stepDef.label:e.step),qty:e.qty,plan:plan,cur:cur});
  });
  if(overRows.length>0){
    alert('报工数量不能超过本次排产数量：\n\n'+overRows.map(o=>'• '+o.name+' · '+o.step+'：本次排产 '+o.plan+'，已报 '+o.cur+'，本次 '+o.qty+' → 合计 '+(o.cur+o.qty)).join('\n')+'\n\n请调整本次数量后重新提交。');
    return;
  }
  applyReport(pi,entries,items,worker);
}
/* 2026-08-25.40：排产单行 → 来源订单行索引（经 交付计划行 orderLine；.24 dlLine → .33/.34 orderLine 链路）。
   无 dlLine（存量排产单）/ 独立单（deliveryIdx=null）/ 交付计划行无 orderLine → 返回 null（回退产品级首行） */
function ppOrderLineOf(p,it){
  if(p.deliveryIdx==null||it.dlLine==null)return null;
  const dl=deliveries[p.deliveryIdx];
  if(!dl)return null;
  const drow=deliveryItems(dl)[it.dlLine];
  return (drow&&drow.orderLine!=null)?drow.orderLine:null;
}
/* 2026-08-25.49：订单管理「调拨查询」——跳转调拨台账并预设本订单筛选（调用+退回+冲销全包含），时间倒序
   2026-08-25.59：参数化——order_frame 筛 salesOrderId（销售订单）、order_inv 筛 invOrderId（库存订单）；
   只读导航操作，按钮置于写权限块外（只读账号同样可用） */
function queryTransfersOfOrder(m){
  m=m||'order_frame';
  const s=selSet(m);
  const label=(m==='order_inv')?'库存订单':'销售订单';
  if(s.size===0){alert('请先勾选 1 张'+label);return;}
  if(s.size>1){alert('「调拨查询」只能选择 1 张'+label+'，当前已选 '+s.size+' 张。');return;}
  const o=orders[Number([...s][0])];
  if(!o){alert('未找到订单');return;}
  const key=(m==='order_inv')?'invOrderId':'salesOrderId';
  const filters={};filters[key]={mode:'eq',val:o.id};
  tState('transfers').filters=filters;
  tState('transfers').sort={key:'ts',dir:-1};
  switchTab('transfers');
}
/* 2026-08-29.76：订单「计划查询」——跳转交付计划列表并预设 orderId=本订单筛选（销售/库存订单共用；
   交付计划头带 orderId 单据级列，筛选后显示该订单全部交付计划明细） */
function queryDeliveryOfOrder(m){
  m=m||'order_frame';
  const s=selSet(m);
  const label=(m==='order_inv')?'库存订单':'销售订单';
  if(s.size===0){alert('请先勾选 1 张'+label);return;}
  if(s.size>1){alert('「计划查询」只能选择 1 张'+label+'，当前已选 '+s.size+' 张。');return;}
  const o=orders[Number([...s][0])];
  if(!o){alert('未找到订单');return;}
  tState('delivery').filters={orderId:{mode:'eq',val:o.id}};
  switchTab('delivery');
}
/* 报工入库回写订单（2026-08-25.16 二期口径）：排产单「入库」工序报工增量 → 订单对应明细行 deliveredQty。
   匹配：排产单.orderId + 产品行 productId → 订单行；delta 可为负（编辑/删除报工、删除/取消排产单回退）；
   deliveredQty 下限 0、允许超过订单数量 orderQty（用户拍板 2026-08-25.16，进度% 可 >100%）；
   销售订单 → syncOrderAutoStatus（整单未交付=0 自动「已完成」）；库存订单 → syncStockFromInvOrders（产品库存=Σ库存订单已交付自动跟随）；
   独立单（deliveryIdx=null）保留 orderId 照常回写。
   2026-08-25.40：加可选 orderLine 参数——同产品多行订单精确回写对应明细行；无/不匹配回退 productId 首行（存量兼容） */
function writebackInbound(orderId,productId,delta,orderLine){
  if(!orderId||!productId||!delta)return;
  const o=orders.find(x=>x.id===orderId);
  if(!o)return;
  const oi=orderItems(o);
  let it=null;
  if(orderLine!=null&&oi[orderLine]&&String(oi[orderLine].productId)===String(productId))it=oi[orderLine];
  if(!it)it=oi.find(x=>String(x.productId)===String(productId));
  if(!it)return;
  /* 2026-08-25.20：库存订单已交付允许负数（欠货向 0 恢复）；销售订单保持非负 */
  it.deliveredQty=orderTypeOf(o)==='库存订单'?num(it.deliveredQty)+delta:Math.max(0,num(it.deliveredQty)+delta);
  save('orders',orders);
  if(orderTypeOf(o)==='库存订单')syncStockFromInvOrders();
  else syncOrderAutoStatus();
  logOp('系统','库存打通','报工入库回写订单「'+o.id+'」'+(it.productName||productId)+' 已交付 '+(delta>0?'+':'')+delta);
}
function applyReport(pi,entries,items,worker){
  const p=productionPlans[pi];
  if(!p)return;
  const logParts=[];
  const repItems=[];
  /* 2026-08-25.16：入库工序增量 → 回写订单已交付；.40 行级化——同产品多行各自记录 dlLine/orderLine，不再按 productId 合并 */
  const inboundDelta=[];
  entries.forEach(e=>{
    if(e.qty<=0)return;                        // 填 0 的工序无增量、不进日志/明细
    const it=items[e.li];
    const st=ppSteps(it);
    if(st[e.step]===undefined)ppEnsureSteps(it,stepsDefOf(p,it));   // 存量单首次写入新工序键
    const v=st[e.step];
    if(typeof v==='object')v.done=num(v.done)+e.qty;else st[e.step]=num(v)+e.qty;
    if(e.step==='inbound'||e.step==='finInbound'){
      it.doneQty=num(it.doneQty||0)+e.qty;
      const dlLine=it.dlLine!=null?it.dlLine:null;
      let rec=dlLine!=null?inboundDelta.find(x=>x.productId===it.productId&&x.dlLine===dlLine):inboundDelta.find(x=>x.productId===it.productId&&x.dlLine==null);
      if(!rec){rec={productId:it.productId,dlLine:dlLine,qty:0,orderLine:null};inboundDelta.push(rec);}
      rec.qty+=e.qty;
      if(rec.orderLine==null)rec.orderLine=ppOrderLineOf(p,it);
    }
    const stepLabel=(stepsDefOf(p,it).find(x=>x.key===e.step)||{}).label||e.step;
    logParts.push((it.productName||it.productId)+'·'+stepLabel+'+'+e.qty);
    repItems.push({productId:it.productId,productName:it.productName,step:e.step,label:stepLabel,qty:e.qty,dlLine:it.dlLine!=null?it.dlLine:null});
  });
  if(p.status==='待排产')p.status='生产中';
  const allDone=items.every(x=>ppPlanOf(x)>0&&ppDoneOf(x)>=ppPlanOf(x));
  save('productionPlans',productionPlans);
  /* 2026-08-25.16：报工入库 → 回写订单已交付（销售/库存订单都回写；库存订单联动产品库存）；.40 行级回写 */
  inboundDelta.forEach(r=>{ if(r.qty)writebackInbound(p.orderId,r.productId,r.qty,r.orderLine); });
  /* 报工明细记录（build 2026-08-24.8）：一次报工=一条记录，含本次各工序；报工人为弹窗必填输入（.9） */
  if(repItems.length>0){
    const now=new Date();
    const rec={
      id:prNextId(),planId:p.id,
      date:todayStr(),
      time:now.getHours()+':'+String(now.getMinutes()).padStart(2,'0'),
      worker:worker||'',
      items:repItems,createdAt:now.toISOString()
    };
    productionReports.push(rec);
    save('productionReports',productionReports);
  }
  logOp('报工','排产计划','排产单「'+p.id+'」报工：'+logParts.join('、'));
  closeModal();
  renderContent();
  if(allDone&&p.status!=='已完成'){
    if(confirm('该排产计划所有产品均已完工（累计完成≥计划数量），是否标记为「已完成」？')){
      p.status='已完成';
      save('productionPlans',productionPlans);
      logOp('完成','排产计划','排产单「'+p.id+'」标记为已完成');
      renderContent();
    }
  }
  /* 2026-08-25.64：报工/完工后状态变化（待排产→生产中 / →已完成）若被当前筛选隐藏（如筛「生产中」后全完工→已完成），自动取消勾选 */
  if(!prodPlanRowVisibleInDom(p.id))clearHiddenProdPlanSel(pi);
}

/* 排产计划导出平铺行（每产品一行） */
function prodPlanFlatRows(list){
  const rows=[];
  (list||[]).forEach(p=>{
    ppItems(p).forEach(it=>{
      const t=ppPlanOf(it),d=ppDoneOf(it);
      rows.push({
        id:p.id,planDate:fmtDate(p.planDate),finalDate:fmtDate(p.finalDate),orderId:p.orderId,customer:p.customer,status:p.status,
        productId:it.productId,productName:it.productName,spec:it.spec||'',model:it.model||'',unit:it.unit||'',
        planQty:t,assemblyDone:ppStepDone(it,'assembly'),innerPackDone:ppStepDone(it,'innerPack'),testAgingDone:ppStepDone(it,'testAging'),
        semiInbound:ppStepDone(it,'semiInbound'),pkgDone:ppStepDone(it,'pkg'),finInbound:ppStepDone(it,'finInbound'),
        doneQty:d,progress:t>0?Math.round(d/t*100):0,notes:p.notes||''
      });
    });
  });
  return rows;
}

/* 交付计划明细行：新结构 items[]（含规格/型号/商品行备注）；旧数据（单产品平铺）自动构造单行 */
function deliveryItems(d){
  if(Array.isArray(d.items)&&d.items.length)return d.items;
  return [{productId:d.productId||'',productName:d.productName||'',spec:d.spec||'',model:d.model||'',orderQty:num(d.orderTotal),deliveredQty:num(d.delivered),lineNotes:(d.lineNotes!=null?d.lineNotes:(d.notes||''))}];
}
/* 交付明细行渲染：产品/规格/型号/订单数量/已交付数量由订单带出（只读），本批计划可编辑（留空=本批不交付），商品行备注可编辑 */
function deliveryItemRow(it){
  return '<tr>'+
    '<td style="display:none"><input type="hidden" class="di_field" data-key="orderLine" value="'+(it.orderLine!=null?it.orderLine:'')+'"></td>'+ /* 2026-08-25.33：来源订单行索引，隐藏随保存落库 */
    '<td><input type="text" class="di_field" data-key="productId" value="'+esc(it.productId||'')+'" readonly style="width:100%;background:#f6f8fa;color:var(--muted)"></td>'+    '<td><input type="text" class="di_field" data-key="productName" value="'+esc(it.productName||'')+'" readonly style="width:100%;background:#f6f8fa;color:var(--muted)"></td>'+
    '<td><input type="text" class="di_field" data-key="spec" value="'+esc(it.spec||'')+'" readonly style="width:100%;background:#f6f8fa;color:var(--muted)"></td>'+
    '<td><input type="text" class="di_field" data-key="model" value="'+esc(it.model||'')+'" readonly style="width:100%;background:#f6f8fa;color:var(--muted)"></td>'+
    '<td><input type="number" class="di_field" data-key="orderQty" value="'+num(it.orderQty)+'" readonly style="width:100%;background:#f6f8fa;color:var(--muted)"></td>'+
    '<td><input type="number" class="di_field" data-key="deliveredQty" value="'+num(it.deliveredQty)+'" readonly style="width:100%;background:#f6f8fa;color:var(--muted)"></td>'+
    '<td><input type="number" class="di_field" data-key="planQty" value="'+(it.planQty!=null&&it.planQty!==''?num(it.planQty):'')+'" min="0" oninput="recalcDeliveryTotals()" placeholder="0" style="width:100%"></td>'+
    '<td><input type="text" class="di_field" data-key="lineNotes" value="'+esc(it.lineNotes||'')+'" style="width:100%"></td>'+
    '<td style="text-align:center"><button class="btn btn-sm btn-danger" onclick="removeDeliveryItemRow(this)" title="删除此行">✕</button></td></tr>';
}

/* 订单下拉（按订单列出，明细在表体带出） */

/* 选择订单 → 带出客户 + 明细行（规格/型号/商品行备注由订单明细带出） */
function deliveryOrderChange(){

          deliveredQty:it.deliveredQty,

        }));

  recalcDeliveryTotals();
}
/* 明细汇总：订单总量 / 已交付 / 未交付 / 本批合计 实时计算 */
function recalcDeliveryTotals(){
  let total=0,delivered=0,plan=0;
  document.querySelectorAll('#dlItemsTbl tbody tr').forEach(tr=>{

function saveDelivery(idx){
  const d={
    orderId:document.getElementById('dl_orderId').value,
    customer:document.getElementById('dl_customer').value,
    finalDate:document.getElementById('dl_finalDate').value,
    firstDate:document.getElementById('dl_firstDate').value,
    notes:document.getElementById('dl_notes').value,
    createdAt:(idx>=0)?(deliveries[idx].createdAt||'2026-08-23'):todayStr(),   /* 单据时间：新增=当天，编辑保留原值（老数据缺失兜底回填值） */
    items:[]
  };
  let total=0,delivered=0,plan=0;
  const overRows=[];
  document.querySelectorAll('#dlItemsTbl tbody tr').forEach(tr=>{
    const it={};
    tr.querySelectorAll('.di_field').forEach(el=>{it[el.dataset.key]=el.value||'';});
    it.orderQty=num(it.orderQty);it.deliveredQty=num(it.deliveredQty);it.planQty=num(it.planQty);
    total+=it.orderQty;delivered+=it.deliveredQty;plan+=it.planQty;
    if(it.planQty>it.orderQty-it.deliveredQty){
      overRows.push('「'+(it.productName||it.productId||'未知产品')+'」本批 '+it.planQty+' > 该行未交付 '+(it.orderQty-it.deliveredQty));
    }
    d.items.push(it);
  });
  d.orderTotal=total;d.delivered=delivered;d.undelivered=total-delivered;
  d.planQty=plan; /* 表头本批计划 = 各行汇总（自动计算） */
  if(!d.orderId){alert('请选择订单');return;}
  if(d.items.length===0){alert('请选择订单以带出交付明细');return;}
  if(plan<=0){alert('请至少填写一行的本批计划数量');return;}
  /* 行级超量校验：某行本批计划 > 该行未交付数量 → 确认浮层：取消退回表单，确认保存继续 */
  if(overRows.length>0){
    showConfirmOverlay(
      '以下明细本批计划大于该行未交付数量：<br><b>'+overRows.join('<br>')+'</b><br><br>是否确认保存？',
      null,
      function(){doSaveDelivery(d,idx);},
      '取消','确认保存'
    );
    return;
  }
  doSaveDelivery(d,idx);
}
function doSaveDelivery(d,idx){
  if(idx>=0){const oldD=deliveries[idx];deliveries[idx]=d;logFieldDiffs('交付计划',HARD_FIELDS.delivery,oldD,d,d.orderId+'('+d.customer+')');}
  else{deliveries.push(d);logOp('新增','交付计划','新增交付计划「'+d.orderId+'」('+d.customer+')，本批计划交付'+d.planQty);}
  save('deliveries',deliveries);
  closeModal();
  renderContent();
}

function delDelivery(idx){
  if(!confirm('确认删除该交付计划？'))return;
  logOp('删除','交付计划','删除交付计划「'+deliveries[idx].orderId+'」('+deliveries[idx].customer+')');
  deliveries.splice(idx,1);
  save('deliveries',deliveries);
  renderContent();
}

      +thCol('logs',TBL_SCHEMAS.logs[0],'min-width:140px')

/* ================================================================
   2026-08-25.69：使用说明页（系统内帮助文档）——内容为 Markdown 文本（GUIDE_MD），
   运行时经 mdRender 渲染成 HTML；功能迭代时同步更新 GUIDE_MD 对应小节与「最近更新」表
================================================================ */
/* 简易 Markdown 渲染：支持 #/##/### 标题、- 无序、1. 有序、| 表格（首行表头+--- 分隔行）、**粗体**、`行内码`、空行分段 */
function mdInline(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code style="background:#f1f5f9;padding:1px 5px;border-radius:3px;font-size:12px">$1</code>');
}
function mdRender(md){
  const lines=String(md||'').split('\n');
  let out='',listType='',inTable=false,tblHead=false;
  lines.forEach(line=>{
    const t=line.trim();
    /* 2026-08-25.71：空行须先闭合当前列表/表格再重置（原直接清 listType/inTable → <ul>/<table> 悬空未闭合，浏览器容错嵌套缩进逐级加深） */
    if(!t){if(listType){out+='</'+listType+'>';listType='';}if(inTable){out+='</table>';inTable=false;}tblHead=false;return;}
    /* 2026-08-25.71：进入非列表行前先关闭上一个列表（列表被标题/表格/引用打断时同理闭合） */
    if(listType&&!/^[-*]\s+/.test(t)&&!/^\d+\.\s+/.test(t)){out+='</'+listType+'>';listType='';}
    if(t.startsWith('|')){
      const cells=t.split('|').slice(1,-1).map(c=>c.trim());
      if(cells.length&&/^[-: ]+$/.test(cells.join('')))return;   // 表头分隔行 |---|---| 跳过（不置 tblHead）
      if(!inTable){inTable=true;tblHead=false;out+='<table style="width:100%;border-collapse:collapse;margin:6px 0;font-size:13px">';}
      if(!tblHead){tblHead=true;out+='<tr>'+cells.map(c=>'<th style="border:1px solid var(--border);padding:4px 8px;text-align:left;background:var(--primary-light)">'+mdInline(c)+'</th>').join('')+'</tr>';}
      else{out+='<tr>'+cells.map(c=>'<td style="border:1px solid var(--border);padding:4px 8px;text-align:left">'+mdInline(c)+'</td>').join('')+'</tr>';}
      return;
    }
    if(inTable){out+='</table>';inTable=false;tblHead=false;}
    if(/^###\s+/.test(t)){out+='<h4 style="margin:14px 0 6px;font-size:14px;color:var(--primary-dark)">'+mdInline(t.slice(4))+'</h4>';return;}
    /* 2026-08-25.70：h3 去 border-left+padding-left（标题 0 缩进与正文对齐，改下划线分隔）；引用块 > 常规引用样式 */
    if(/^##\s+/.test(t)){out+='<h3 style="margin:18px 0 8px;font-size:15px;border-bottom:1px solid var(--border);padding-bottom:4px">'+mdInline(t.slice(3))+'</h3>';return;}
    if(/^#\s+/.test(t)){out+='<h2 style="margin:20px 0 8px;font-size:16px">'+mdInline(t.slice(2))+'</h2>';return;}
    if(/^>\s+/.test(t)){out+='<blockquote style="margin:8px 0;padding:6px 12px;background:var(--primary-light);border-left:3px solid var(--primary);font-size:13px;color:var(--muted)">'+mdInline(t.slice(2))+'</blockquote>';return;}
    if(/^[-*]\s+/.test(t)){
      if(listType!=='ul'){listType='ul';out+='<ul style="margin:6px 0;padding-left:20px;font-size:13px;line-height:1.8">';}
      out+='<li>'+mdInline(t.slice(2))+'</li>';return;
    }
    if(/^\d+\.\s+/.test(t)){
      if(listType!=='ol'){listType='ol';out+='<ol style="margin:6px 0;padding-left:20px;font-size:13px;line-height:1.8">';}
      out+='<li>'+mdInline(t.replace(/^\d+\.\s+/,''))+'</li>';return;
    }
    if(listType){out+='</'+listType+'>';listType='';}
    out+='<p style="margin:6px 0;font-size:13px;line-height:1.8">'+mdInline(t)+'</p>';
  });
  if(inTable)out+='</table>';
  if(listType)out+='</'+listType+'>';
  return out;
}

let __tplSteps=[];   // 模板编辑弹窗中的临时工序数组

    html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px">'+
      processTemplates.map((t,i)=>{
        const refCount=products.filter(p=>p.processTplId===t.id).length;
        const usedDefault=t.id==='default';
        const stepsHtml=(t.steps||[]).map(s=>
          '<span class="tpl-chip'+(s.mandatory?' mand':'')+'" title="'+(s.plan?'有计划量（报工上限=工序计划量）':'无计划量（入库类，上限=本批排产数）')+(s.mandatory?' · 必报':'')+'">'+esc(s.label)+(s.mandatory?' *':'')+'</span>').join('');

          '<b>'+esc(t.name)+'</b><span class="tpl-id">'+esc(t.id)+'</span>'+(usedDefault?'<span class="tag tag-blue">系统默认</span>':'')+
          '<span style="margin-left:auto;font-size:12px;color:var(--muted)">'+refCount+' 个产品使用</span></div>'+
          '<div class="tpl-steps">'+stepsHtml+'</div>'+
          (t.notes?'<div class="tpl-notes">'+esc(t.notes)+'</div>':'')+
          (writable?'<div class="tpl-ops"><button class="btn btn-sm" onclick="tplModal('+i+')">编辑</button><button class="btn btn-sm" onclick="copyTpl('+i+')">复制</button><button class="btn btn-sm btn-danger" onclick="delTpl('+i+')">删除</button></div>':'')+
          '</div>';
      }).join('')+'</div>';
  }
  html+='</div>';

}
function tplModal(idx,prefill){
  if(!ensureWrite('processTpl'))return;
  const isNew=(prefill!=null)||idx==null;   // 无参=新增；prefill=复制；idx>=0=编辑
  const t=(prefill!=null)?prefill:(idx!=null?JSON.parse(JSON.stringify(processTemplates[idx])):null);
  __tplSteps=(t&&Array.isArray(t.steps))?JSON.parse(JSON.stringify(t.steps)):[];
  const body='<div class="form-row">'+
    '<div><label>模板编码 *</label><input type="text" id="tpl_id" value="'+esc((t&&t.id)||'')+'"'+(isNew||idx<0?' placeholder="如 ACB、MCCB"':' readonly style="background:#f6f8fa;color:var(--muted)"')+'></div>'+
    '<div><label>模板名称 *</label><input type="text" id="tpl_name" value="'+esc((t&&t.name)||'')+'" placeholder="如 框架断路器工艺"></div>'+
    '<div style="flex:1"><label>备注</label><input type="text" id="tpl_notes" value="'+esc((t&&t.notes)||'')+'"></div>'+
    '</div>'+
    '<div style="margin:10px 0 6px;font-size:13px;color:var(--muted)">工序列表（可填预置名 装配/瞬时/延时/内包/老化/入库，或输入任意自定义工序名）：</div>'+
    '<div class="table-wrap" style="max-height:300px;overflow:auto"><div id="tplStepsBox">'+tplStepsBoxHtml()+'</div></div>'+
    '<div style="margin-top:8px"><button class="btn btn-sm btn-primary" onclick="tplAddStep()">+ 添加工序</button>'+
    '<span style="margin-left:8px;font-size:12px;color:var(--muted)">「计划量」勾选=报工上限按该工序计划量；「必报」勾选=关键工序标记（仅提示，不强制填写，未填默认为 0）</span></div>';
  showModal(isNew?'新增工序模板':'编辑工序模板',body,
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveTpl('+(idx!=null?idx:-1)+')">保存</button>');
}
function tplStepsBoxHtml(){
  const arr=__tplSteps||[];
  if(!arr.length)return '<div class="empty" style="padding:12px">尚未添加工序</div>';
  return '<table><thead><tr><th>工序名称</th><th style="width:70px;text-align:center">计划量</th><th style="width:60px;text-align:center">必报</th><th style="width:130px;text-align:center">操作</th></tr></thead><tbody>'+
    arr.map((s,i)=>
      '<tr>'+
      '<td><input type="text" class="tpl_step_name" data-idx="'+i+'" value="'+esc(s.label)+'" style="width:130px"></td>'+
      '<td style="text-align:center"><input type="checkbox" class="tpl_step_plan" data-idx="'+i+'" '+(s.plan?'checked':'')+'></td>'+
      '<td style="text-align:center"><input type="checkbox" class="tpl_step_mand" data-idx="'+i+'" '+(s.mandatory?'checked':'')+'></td>'+
      '<td style="text-align:center;white-space:nowrap"><button class="btn btn-sm" style="padding:1px 6px" onclick="tplMoveStep('+i+',-1)" title="上移">↑</button> <button class="btn btn-sm" style="padding:1px 6px" onclick="tplMoveStep('+i+',1)" title="下移">↓</button> <button class="btn btn-sm btn-danger" style="padding:1px 6px" onclick="tplDelStep('+i+')" title="删除">✕</button></td>'+
      '</tr>').join('')+'</tbody></table>';
}
function tplStepsRender(){const el=document.getElementById('tplStepsBox');if(el)el.innerHTML=tplStepsBoxHtml();}
function tplAddStep(){
  const name=prompt('工序名称（预置：装配/瞬时/延时/内包/老化/入库；或输入自定义工序名）','');
  if(name==null)return;
  const label=String(name||'').trim();
  if(!label)return;
  const preset=PP_PRESET_STEPS.find(x=>x.label===label);
  const key=preset?preset.key:('c'+(__tplSteps.length+1));
  __tplSteps.push({key:key,label:label,plan:preset?(preset.plan!==false):true,mandatory:false});
  tplStepsRender();
}
function tplMoveStep(i,d){
  const j=i+d;
  if(j<0||j>=__tplSteps.length)return;
  const a=__tplSteps,tmp=a[i];a[i]=a[j];a[j]=tmp;
  tplStepsRender();
}
function tplDelStep(i){__tplSteps.splice(i,1);tplStepsRender();}
function saveTpl(idx){
  const id=String((document.getElementById('tpl_id')||{}).value||'').trim();
  const name=String((document.getElementById('tpl_name')||{}).value||'').trim();
  const notes=String((document.getElementById('tpl_notes')||{}).value||'');
  if(!id){alert('请填写模板编码');return;}
  if(!name){alert('请填写模板名称');return;}
  if(idx<0&&processTemplates.some(t=>t.id===id)){alert('模板编码「'+id+'」已存在');return;}
  const rows=Array.prototype.slice.call(document.querySelectorAll('.tpl_step_name'));
  const steps=[];
  rows.forEach((inp,i)=>{
    const label=String(inp.value||'').trim();
    if(!label)return;
    const plan=!!(document.querySelector('.tpl_step_plan[data-idx="'+i+'"]')||{}).checked;
    const mandatory=!!(document.querySelector('.tpl_step_mand[data-idx="'+i+'"]')||{}).checked;
    const preset=PP_PRESET_STEPS.find(x=>x.label===label);
    steps.push({key:preset?preset.key:('c'+(i+1)),label:label,plan:plan,mandatory:mandatory});
  });
  if(steps.length===0){alert('请至少添加一个工序');return;}
  const seen={};let dup=false;
  steps.forEach(s=>{if(seen[s.key])dup=true;seen[s.key]=1;});
  if(dup){alert('存在重复工序：请勿使用多个相同名称（自定义工序名请勿与预置工序重名）');return;}
  if(idx>=0){
    const t=processTemplates[idx];
    const oldId=t.id;
    if(oldId!=='default'&&id!==oldId&&products.some(p=>p.processTplId===oldId)){alert('该模板已被产品引用，模板编码不可修改');return;}
    t.id=id;t.name=name;t.notes=notes;t.steps=steps;
    logOp('编辑','工序模板','编辑「'+id+'」工序模板');
  }else{
    processTemplates.push({id:id,name:name,notes:notes,steps:steps});
    logOp('新增','工序模板','新增「'+id+'」工序模板');
  }
  save('processTemplates',processTemplates);
  closeModal();
  renderContent();
}
function copyTpl(i){
  const c=JSON.parse(JSON.stringify(processTemplates[i]));
  c.id=suggestCopyId(c.id+'副本',id=>processTemplates.some(t=>t.id===id));
  c.name=c.name+'（副本）';
  tplModal(-1,c);
}
function delTpl(i){
  const t=processTemplates[i];
  if(!t)return;
  if(t.id==='default'){alert('系统默认模板不可删除');return;}
  const ref=products.filter(p=>p.processTplId===t.id).length;
  if(ref>0){alert('该模板正被 '+ref+' 个产品使用，请先在产品主数据中改用其他模板后再删除。');return;}
  if(!confirm('确认删除工序模板「'+t.id+'」？'))return;
  logOp('删除','工序模板','删除「'+t.id+'」工序模板');
  processTemplates.splice(i,1);
  save('processTemplates',processTemplates);
  renderContent();
}

/* 调拨台账：只读流水，逐条可冲销 */
/* 2026-08-25.49：调拨单 客户/合同/商品名称/规格/型号 —— 已快照直接取；存量无快照反查订单兜底 */
function trSnapshot(t){
  if(!t)return {customer:'',contractNo:'',productName:'',spec:'',model:''};
  if(t.customer!=null&&t.productName!=null)return t;
  const o=orders.find(x=>x.id===t.salesOrderId);
  const it=o&&(o.items||[])[t.salesLineIdx];
  return {
    customer:o?(o.customer||''):'', contractNo:o?(o.contractNo||''):'',
    productName:it?(it.productName||it.productId||''):'',
    spec:it?(it.spec||''):'', model:it?(it.model||''):''
  };
}
/* 2026-08-25.49：调拨台账改可筛选结构（TBL_SCHEMAS + thCol 表头 + filterBar + applyTable）；
   保留行内「冲销」按钮；金蝶式筛选随 ENHANCED_FILT_MODES.transfers 生效 */
function renderTransfers(){
  TBL_SCHEMAS.transfers=[
    {key:'ts',label:'时间',type:'text'},
    {key:'type',label:'类型',type:'text',select:true,options:['调用','退回'],get:r=>r.type==='call'?'调用':'退回'},
    {key:'salesOrderId',label:'销售订单',type:'text'},
    {key:'invOrderId',label:'库存订单',type:'text'},
    {key:'customer',label:'客户',type:'text',get:r=>trSnapshot(r).customer},
    {key:'contractNo',label:'合同',type:'text',get:r=>trSnapshot(r).contractNo},
    {key:'productName',label:'商品名称',type:'text',get:r=>trSnapshot(r).productName},
    {key:'spec',label:'规格',type:'text',get:r=>trSnapshot(r).spec},
    {key:'model',label:'型号',type:'text',get:r=>trSnapshot(r).model},
    {key:'productId',label:'产品/料号',type:'text'},
    {key:'qty',label:'数量',type:'number'},
    {key:'user',label:'操作人',type:'text'}
  ];
  TBL_ROWS.transfers=transfers||[];
  let shown=applyTable('transfers',TBL_ROWS.transfers);
  /* 2026-08-25.68：金蝶式分页（单行模型直接切行） */
  if(PAGED_FORMS.transfers&&shown.length>0)shown=slicePaged('transfers',shown,pageSizeOf('transfers')).rows;
  let html='<div class="page">';
  html+='<div class="bulk-bar"><span style="color:var(--muted);font-size:13px">调拨台账：记录每次「调用库存 / 退回库存」及冲销。记录不可修改，仅可逐条冲销。</span>'+pagerHtml('transfers')+'</div>';
  html+=filterBar('transfers');
  html+='<div class="table-wrap"><table><thead><tr>'
    +TBL_SCHEMAS.transfers.map(c=>thCol('transfers',c)).join('')
    +'<th style="width:80px">操作</th>'
    +'</tr></thead><tbody>';
  if(!shown.length){html+='<tr><td colspan="13" class="empty">暂无调拨记录</td></tr>';}
  else{
    shown.forEach(function(t){
      const isCall=t.type==='call';
      const typeCls=isCall?'tag-green':'tag-amber';
      const cross=t.invProductId&&t.productId&&t.invProductId!==t.productId;
      /* 2026-08-25.50：替代产品编码后补 名称/型号/规格（库存订单行优先，产品主数据兜底，格式同调用库存弹窗 [型号 / 规格]） */
      let prodHtml=esc(t.productId||'');
      if(cross){
        const _io=orders.find(function(o){return o.id===t.invOrderId;});
        const _iit=_io&&(_io.items||[])[t.invLineIdx];
        const _ii=(_iit&&String(_iit.productId)===String(t.invProductId))?_iit:null;   /* 订单行编码须与替代编码一致，否则走主数据兜底 */
        const _ip=products.find(function(p){return p.id===t.invProductId;});
        const _nm=(_ii&&_ii.productName)||(_ip?_ip.name:_ip?_ip.id:'')||'';
        const _pm=[(_ii&&_ii.model)||(_ip?_ip.model:''),(_ii&&_ii.spec)||(_ip?_ip.spec:'')].filter(Boolean).join(' / ');
        prodHtml+=' <span style="color:var(--red)">←替代 '+esc(t.invProductId||'')+(_nm?' '+esc(_nm):'')+(_pm?' ['+esc(_pm)+']':'')+'</span>';
      }
      const btn=t.reversed?'<span style="color:var(--muted)">已冲销</span>'
        :'<button class="btn btn-sm" onclick="reverseTransfer(\''+esc(t.id)+'\')">冲销</button>';
      html+='<tr>'+TBL_SCHEMAS.transfers.map(function(c){
        const v=colVal(c,t);
        let txt;
        if(c.key==='type')txt='<span class="tag '+typeCls+'">'+(v||'')+'</span>';
        else if(c.key==='productId')txt=prodHtml;   /* 含替代料提示 */
        else txt=esc(v);
        const st=c.type==='number'?' style="font-variant-numeric:tabular-nums;text-align:right"':'';
        return '<td data-key="'+c.key+'"'+st+'>'+txt+'</td>';
      }).join('')+'<td>'+btn+'</td></tr>';
    });
  }
  html+='</tbody></table></div>';
  html+='</div>';
  return html;
}

  let html='<div class="card"><div class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;color:var(--primary)"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>员工管理 <span class="desc">账号 · 角色 · 按表单写权限（勾选=可编辑，不勾=只读）</span> <button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="userModal()">新增员工</button></div>';

    loadUsers().then(function(){renderContent();});

  }
  html+='<div class="table-wrap"><table><thead><tr><th>用户名</th><th>姓名</th><th>角色</th><th>状态</th><th>表单写权限</th><th style="width:130px">操作</th></tr></thead><tbody>';
  window.__usersCache.forEach(u=>{

function userModal(username){

  let body='<div class="form-row"><div><label>用户名（登录名）</label><input id="uf_user" '+(u?'readonly':'')+' value="'+esc(p.username)+'" placeholder="2-20位字母数字下划线"></div>'

async function saveUser(username){
  const uname=document.getElementById('uf_user').value.trim();
  const name=document.getElementById('uf_name').value.trim();
  const role=document.getElementById('uf_role').value;
  const status=document.getElementById('uf_status').value;
  const pwd=document.getElementById('uf_pwd').value;
  const perms={};
  document.querySelectorAll('#modal input[data-perm]').forEach(c=>{perms[c.dataset.perm]=c.checked;});
  const payload={username:uname||username,name:name||uname||username,role:role,status:status,perms:perms};
  if(pwd)payload.password=pwd;
  try{
    const r=await apiReq('/users?token='+authToken,{method:username?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const j=await r.json();
    if(!r.ok){alert(j.error||'保存失败');return;}
    closeModal();
    await loadUsers();
    if(currentUser&&currentUser.username===uname&&role==='staff')currentUser.role='staff';
    renderContent();
  }catch(e){alert('保存失败，请检查网络');}
}
async function delUser(username){
  if(!confirm('确认删除员工「'+username+'」？此操作不可恢复。'))return;
  try{
    const r=await apiReq('/users?token='+authToken+'&username='+encodeURIComponent(username),{method:'DELETE'});
    const j=await r.json();
    if(!r.ok){alert(j.error||'删除失败');return;}
    await loadUsers();renderContent();
  }catch(e){alert('删除失败');}
}
/* 修改本人密码 */
function pwdModal(){
  const body='<div class="form-row"><div><label>原密码</label><input id="cp_old" type="password"></div></div>'
    +'<div class="form-row"><div><label>新密码</label><input id="cp_new" type="password"></div></div>'
    +'<div class="form-row"><div><label>确认新密码</label><input id="cp_new2" type="password"></div></div>';
  showModal('修改密码',body,'<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="savePwd()">保存</button>');
}
async function savePwd(){
  const old=document.getElementById('cp_old').value;
  const n1=document.getElementById('cp_new').value;
  const n2=document.getElementById('cp_new2').value;
  if(!old||!n1){alert('请填写完整');return;}
  if(n1.length<6){alert('新密码至少6位');return;}
  if(n1!==n2){alert('两次新密码不一致');return;}
  try{
    const r=await apiReq('/change-pwd?token='+authToken,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old:old,new:n1})});
    const j=await r.json();
    if(!r.ok){alert(j.error||'修改失败');return;}
    alert('密码已修改');closeModal();
  }catch(e){alert('修改失败');}
}

/* ================================================================
   Modal
================================================================ */
function showModal(title,body,foot){
  /* 2026-08-25.53：弹窗内滚轮不穿透主界面（scroll chaining）——阻断冒泡到 body，弹窗内滚动区正常滚动 */
  const bg=document.getElementById('modalBg');
  if(bg&&!bg.__wheelBound){
    bg.addEventListener('wheel',function(e){e.stopPropagation();},{passive:false});
    bg.__wheelBound=true;
  }
  const m=document.getElementById('modal');
  m.innerHTML='<div class="modal-head"><h3>'+title+'</h3><div class="close-x" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M18 6L6 18M6 6l12 12"/></svg></div></div><div class="modal-body">'+body+'</div><div class="modal-foot">'+foot+'</div>';
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){
  const el=document.getElementById('modalBg');
  if(el)el.classList.remove('show');
}
/* 二级确认浮层：浮在弹窗之上（z-index 300），不替换底层弹窗 DOM。
   点「取消」/遮罩 → onCancel（退回原弹窗）；点「确认」→ onOk */
function showConfirmOverlay(msg,onCancel,onOk,cancelText,okText){
  closeConfirmOverlay();
  var ov=document.createElement('div');
  ov.className='modal-bg show';
  ov.id='confirmOverlay';
  ov.style.zIndex=300;
  ov.innerHTML='<div class="modal" style="max-width:440px;width:90%;min-width:0">'+
    '<div class="modal-head"><h3>提示</h3></div>'+
    '<div class="modal-body" style="font-size:14px;line-height:1.8">'+msg+'</div>'+
    '<div class="modal-foot">'+
    '<button class="btn" id="co_cancel">'+esc(cancelText||'取消')+'</button>'+
    '<button class="btn btn-primary" id="co_ok">'+esc(okText||'确认')+'</button>'+
    '</div></div>';
  document.body.appendChild(ov);
  /* 点击遮罩不关闭（弹窗仅通过按钮操作），与主弹窗行为一致 */
  ov.querySelector('#co_cancel').onclick=function(){closeConfirmOverlay();if(onCancel)onCancel();};
  ov.querySelector('#co_ok').onclick=function(){closeConfirmOverlay();if(onOk)onOk();};
}
function closeConfirmOverlay(){
  var ov=document.getElementById('confirmOverlay');
  if(ov)ov.remove();
}

          else if(t==='str'){val=vEl?vEl.textContent:'';}
          else if(vEl){var nv=parseFloat(vEl.textContent);val=isNaN(nv)?vEl.textContent:nv;}
          var ci=parseRef(cell.getAttribute('r'));ci=ci?ci.c:c;
          colMap[ci]=val;if(ci>maxC)maxC=ci;
        }
        var rowData=[];for(var ci2=0;ci2<=maxC;ci2++)rowData.push(colMap[ci2]!=null?colMap[ci2]:'');
        if(r===0){sd.headers=rowData;}
        else{if(rowData.some(function(v){return v!==''&&v!=null;}))sd.rows.push(rowData);}
      }
      result.push(sd);
    }
    return result;
  }
  return {build:build,parse:parse};
})();

var XLSX_SHEETS=[
  {sheet:'产品主数据',varName:'products',formKey:'product'},
  {sheet:'订单管理',varName:'orders',formKey:'order'},
  {sheet:'备货排产',varName:'dailyPlans',formKey:'dailyPlan'},
  {sheet:'包装排产',varName:'dailyPkgs',formKey:'dailyPkg'},
  {sheet:'交付计划',varName:'deliveries',formKey:'delivery'},
  {sheet:'排产计划',varName:'productionPlans',formKey:'prodPlan'}
];

/* varName -> 实际变量 的映射（不能用 window[name]，因为数组用 let 声明不挂到 window） */
function dataByVar(name){
  switch(name){
    case 'products':return products;
    case 'orders':return orders;
    case 'dailyPlans':return dailyPlans;
    case 'dailyPkgs':return dailyPkgs;
    case 'deliveries':return deliveries;
    case 'productionPlans':return productionPlans;
    case 'logs':return logs;
  }
  return [];
}
function setDataByVar(name,arr){
  switch(name){
    case 'products':products=arr;break;
    case 'orders':orders=arr;break;
    case 'dailyPlans':dailyPlans=arr;break;
    case 'dailyPkgs':dailyPkgs=arr;break;
    case 'deliveries':deliveries=arr;break;
    case 'productionPlans':productionPlans=arr;break;
    case 'logs':logs=arr;break;
  }
}

/* 订单导出：每行一种产品（表头字段随每行重复） */
function orderFlatRows(){
  var rows=[];
  orders.forEach(function(o){
    orderItems(o).forEach(function(it){
      var r={};
      (fields.order||[]).forEach(function(f){
        r[f.key]=isLineField(f)?it[f.key]:o[f.key];
      });
      rows.push(r);
    });
  });
  return rows;
}
/* 订单导入：按订单编号聚合多行 → 一个订单多明细 */
function groupOrderRows(rows){
  var map={},list=[];
  var lineDefs=orderLineFields();   // 表体字段动态构成明细行
  rows.forEach(function(r){
    if(!r.id)return;
    if(!map[r.id]){
      var o={};                      // 表头字段取自首次出现的行
      orderHeadFields().forEach(function(f){o[f.key]=r[f.key];});
      o.items=[];
      map[r.id]=o;list.push(o);
    }
    var it={};
    lineDefs.forEach(function(f){
      var v=r[f.key];
      it[f.key]=f.type==='number'?num(v):(v==null?'':v);
    });
    map[r.id].items.push(it);
  });
  return list;
}

function exportXLSX(){
  var sheets=XLSX_SHEETS.map(function(cfg){
    var cols,data;
    if(cfg.formKey==='prodPlan'){
      cols=PP_EXPORT_COLS;
      data=prodPlanFlatRows(dataByVar(cfg.varName));
    }else{
      cols=(fields[cfg.formKey]||[]).map(function(f){return {key:f.key,label:f.label,type:f.type};});
      data=cfg.formKey==='order'?orderFlatRows():dataByVar(cfg.varName);
    }
    var headers=cols.map(function(c){return c.label;});
    var rows=data.map(function(item){
      return cols.map(function(c){
        var val=item[c.key];
        if(c.type==='date'&&val)return fmtDate(val);
        if(c.type==='number')return num(val);
        return val==null?'':val;
      });
    });
    return {name:cfg.sheet,headers:headers,rows:rows};
  });
  var bytes=XLSX.build(sheets);
  var blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='生产排单系统_全量_'+todayStr()+'.xlsx';a.click();

}

/* 取某表单当前记录数（用于覆盖确认提示） */
function currentDataCount(varName){
  switch(varName){
    case 'products':return (products||[]).length;
    case 'orders':return (orders||[]).length;
    case 'dailyPlans':return (dailyPlans||[]).length;
    case 'dailyPkgs':return (dailyPkgs||[]).length;
    case 'deliveries':return (deliveries||[]).length;
  }
  return 0;
