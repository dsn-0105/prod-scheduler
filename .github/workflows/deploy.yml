name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject build version
        run: |
          VER="$(date +%Y-%m-%d).${{ github.run_number }}"
          sed -i -E "s|build [0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+|build ${VER}|" index.html

      # ============ 安全白名单：只发布前端运行所需的静态文件 ============
      # 【安全 P0】此前这里是 `path: .`，会把整个仓库发布到公网 Pages，泄露：
      #   server/server.js（后端逻辑+默认凭据）、docs/系统知识.md（业务知识文档）、
      #   docs/ai/（架构手册）、_backfill_direct.js / _migrate_transfers.js（运维脚本）、
      #   backups/、deploy.sh / deploy.bat / rollback.sh、.workbuddy/、deploy_tencent/。
      # 现改为显式白名单：未列出的文件一律不上线（默认拒绝）。
      #
      # ⚠️ 维护约定：新增前端静态资源（新的 .html / js 模块 / css / 图标等）时，
      #    必须同步把该文件（或目录）加进下面的 cp 列表，否则线上会出现 404。
      - name: Stage site (safe whitelist)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # 1) 前端主页面（唯一入口）
          cp index.html _site/

          # 2) 前端 JS 模块目录（index.html 的 <script src="js/..."> 依赖）
          cp -r js _site/js

          # 3) .nojekyll —— 防止 GitHub Pages 运行 Jekyll 处理（会忽略下划线开头文件）
          cp .nojekyll _site/.nojekyll

      - name: Verify staged site (fail fast on leak / missing asset)
        run: |
          set -euo pipefail
          # 必需文件缺失 → 直接失败，避免把坏包发上线
          for f in index.html js/guide.js js/logs.js js/import.js js/prodplan-core.js js/transfer.js .nojekyll; do
            if [ ! -f "_site/$f" ]; then
              echo "::error::白名单发布缺少必需文件: $f —— 请检查 Stage site 步骤"
              exit 1
            fi
          done
          # 敏感目录/文件若意外出现在 _site → 直接失败（防再次误发布）
          for bad in server backups docs deploy_tencent _backfill_direct.js _migrate_transfers.js deploy.sh deploy.bat rollback.sh; do
            if [ -e "_site/$bad" ]; then
              echo "::error::_site 中检测到不应发布的内容: $bad"
              exit 1
            fi
          done
          echo "===== 待发布文件清单（白名单） ====="
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
