# ============================================================================
# invariants.yaml —— 业务不变量
# 系统：辰微生产排产系统（prod-scheduler）
# 对应 build：2026-09-09.122
#
# 用途：回答「哪些规则不能破」。改动前必须对照本表，明确本次改动是否使某条
#       从 enforced 退化为 partial / gap。
#
# status 语义：
#   enforced —— 有明确代码保证（并给出保证函数 + file:行号）
#   partial  —— 有部分防护（前端拦了、后端没拦 / 只在某路径上保证 / 有已知绕过口）
#   gap      —— 现状缺陷：规则在业务上成立，但代码没有防护，或已知会被破坏
#
# 铁律：绝不把「建议」写成现状。gap 就是 gap。
# ============================================================================
version: 1
updated: '2026-09-09'
build: '2026-09-09.122'

invariants:

  # ===== 库存域 =====
  - id: INV-001
    domain: order-inventory
    name: 产品库存 == Σ(库存订单行已交付)
    rule: 'products[].stock === Σ(所有订单中 orderType==="库存订单" 且 items[].productId===p.id 的行 deliveredQty)'
    expression: 'products.stock = Σ(库存订单行 deliveredQty)'
    guaranteed_by: syncStockFromInvOrders()
    file: 'index.html:3494-3505'
    enforcement_type: 全量对齐（非增量）
    status: enforced
    violation_consequence: '库存与实际不符；看板/订单/交付/排产全部读到错误的库存基数'
    consumers: [renderProducts, renderOrderTable, renderDeliveryTable, applyTransfers(库存候选/上下限警示), kdDoImport]
    note: |
      幂等：可安全重复执行（每次全量重算）。
      因是「全量对齐」，手工直接写 products.stock 会在下一次任何触发重算的操作后被抹掉。

  - id: INV-002
    domain: order-inventory
    name: 库存订单已交付允许为负（欠货）
    rule: 'orderType==="库存订单" 的明细行 deliveredQty 无下限约束，可为负数（表示欠货，向 0 恢复）'
    expression: 'invOrderItem.deliveredQty ∈ ℝ（无下限）'
    guaranteed_by: 'applyTransfers 的 out.inv 分支、writebackInbound 均不做下限截断'
    file: 'js/transfer.js:322-324 / index.html:4581'
    status: enforced
    violation_consequence: '若给库存订单 deliveredQty 加下限 0，会导致「调出超过实有」的欠货被静默吞掉，台账与库存永久错账'
    note: '该口径来自 2026-08-25.20 用户拍板。changes to this invariant MUST be routed through an Impact Report.'

  - id: INV-003
    domain: order-inventory
    name: 库存订单「数量」语义 = 最大库存量
    rule: '库存订单明细的数量字段以 stockMax 为准（orderQty 在同表但语义被 stockMax 取代）'
    expression: "库存订单行数量 = it.stockMax != null && it.stockMax !== '' ? num(it.stockMax) : num(it.orderQty)"
    guaranteed_by: [orderUndelTotal, saveOrder._oqOf]
    file: 'index.html:2262 / 3320'
    enforcement_type: 代码内的双处独立实现
    status: partial
    violation_consequence: '两处实现若不一致，会出现「订单列表显示未交付 X，状态机判定用 Y」的错位'
    note: |
      ⚠️ 同一口径在 orderUndelTotal（:2262）与 saveOrder 的 _oqOf（:3320）中各写了一遍，
      属重复实现（未被抽成单一函数）。改口径时必须同时改两处。

  - id: INV-004
    domain: production
    name: 报工入库回写金额可超过订单数量
    rule: '排产单「入库」工序报工 → 库存订单行 deliveredQty += delta；允许超过订单数量（进度% 可 >100%）'
    expression: 'it.deliveredQty += delta（无上限）'
    guaranteed_by: writebackInbound
    file: 'index.html:4581'
    status: enforced
    violation_consequence: '加上限会导致正常超产报工被拦，报工流程中断'
    note: '2026-08-25.16 用户拍板「允许超过」。'

  - id: INV-005
    domain: order-sales
    name: 销售订单已调用数量 calledQty 下限 0
    rule: 'orderType==="销售订单" 的明细行 calledQty >= 0 恒成立'
    expression: 'salesOrderItem.calledQty = max(0, calledQty ± qty)'
    guaranteed_by: applyTransfers
    file: 'js/transfer.js:323 / 325'
    status: partial
    violation_consequence: '截断会静默吞掉差额，导致 calledQty 与实际调拨台账 Σ 不相等'
    gap_detail: |
      ⚠️ status=partial 的原因：向下限 0 截断是「静默」的，且 projections.order.calledQty
      没有任何全量重算函数（只有一次性迁移 migrateOrderCalledQty）。
      一旦 applyTransfers 中途失败（见 INV-020），calledQty 无法通过重算自愈。
    remediation_hint: '若引入自愈机制，建议新增 calledQty 全量重算函数（口径参考 migrateOrderCalledQty）。'
    status_note: 现状有下限保护，但缺自愈能力 → partial

  - id: INV-006
    domain: order-sales
    name: 期初直接交付基数 directDelivered 不被消费为调用额度（.130 起导入不再写入该字段）
    rule: ".130 起：金蝶导入不写入 directDelivered（Excel「已交付/已出库数量」不落库 → 新导入单 items[].deliveredQty ≡ 0），该路径不再产生期初基数；对【存量行】（.130 前导入 / .97 历史迁移带入）与「交付-退货」链路，本不变量仍成立——行级可调用余量按 calledQty − max(0, deliveredQty − directDelivered) 计算，避免把期初已交付当作已消耗调用额度"
    expression: "saleMaxCallable: Math.max(0, num(it.calledQty) - Math.max(0, num(it.deliveredQty) - num(it.directDelivered))) ；.130 前导入的写入式（已废止，仅解释存量数据成因）：if(_impDq>0 && !(num(it.calledQty)>0)) _impItem.directDelivered = _impDq"
    guaranteed_by: saleMaxCallable（口径单一来源）+ kdDoImport（.130 前为写入方；.130 起不再写入）
    file: 'index.html:3038-3039'
    supporting_code: 'saveOrder 按行序从旧行补回 directDelivered（须产品一致）'
    supporting_file: 'index.html:3601（注释 index.html:3590）'
    status: partial
    violation_consequence: '存量行/退货链路的后续交付会被行级上限拦截；若误把（存量）期初已交付当作已消耗调用额度，同样会误拦后续交付'
    gap_detail: |
      ⚠️ partial 的原因：directDelivered 靠「按行序补回」维护（index.html:3601），
      订单编辑增删行后行序漂移 → directDelivered 可能挂到错误行上或被丢弃（字段重建会丢未在弹窗中出现的字段）。
      代码注释自陈该风险（同 .24/.33/.40 已知）。仅存量行涉及（.130 起新导入单无该字段）。
    status_note: '.130 起导入不再写入 directDelivered（新单无基数可言）；本不变量仅对存量行与交付-退货链路有约束力（详见 change-log .130 条目）'

  # ===== 报工 / 交付域 =====
  - id: INV-007
    domain: production
    name: writebackInbound 仅服务库存订单
    rule: "仅当 orderTypeOf(o)==='库存订单' 时才回写 deliveredQty；销售订单的已交付由「交付/退货」驱动，排产单不回写"
    expression: "if(orderTypeOf(o)!=='库存订单') return;"
    guaranteed_by: writebackInbound
    file: 'index.html:4580'
    status: enforced
    violation_consequence: '若放开，销售订单会被排产单二次计价（交付已加一次、报工再加一次），交付量虚增'
    note: |
      ⚠️ 注释与代码矛盾：index.html:4615 的注释写「销售/库存订单都回写」，
      与 4580 行代码矛盾。以代码为准，注释为滞后文本（见 flows.yaml#productionReport.complete.known_defects）。

  - id: INV-008
    domain: production
    name: 只有「待排产」的排产单可删除
    rule: "productionPlans[].status !== '待排产' 时禁止删除"
    expression: "if(productionPlans[i].status !== '待排产') → alert + return"
    guaranteed_by: delProdPlan
    file: 'index.html:4295-4296'
    status: enforced
    violation_consequence: '删掉「生产中/已完成」的排产单会破坏报工记录与订单已交付回写（虚增交付无法追溯）'
    note: '2026-08-25.29 引入。'

  - id: INV-009
    domain: production
    name: 报工记录只追加，不改写业务主体
    rule: 'productionReports 为 appendonly：只 push；「编辑报工」通过覆盖 rec.items[].qty 实现，不删除原记录'
    guaranteed_by: 'applyReport（push）/ ppSaveReportEdits（原地改 qty）/ ppDelReport（唯一删除入口）'
    file: 'index.html:4627-4628 / 3844-3848 / 3889-3890'
    status: partial
    violation_consequence: '报工历史不可追溯，工序累计无法回退到正确值'
    gap_detail: 'ppDelReport 会 physical splice 删除记录（:3889），因此不是纯 appendonly；改为「软删除 + 冲销」可提升可追溯性。'

  # ===== 订单状态机 =====
  - id: INV-010
    domain: order-sales
    name: 订单状态合法取值集合
    rule: "orders[].status ∈ {执行中, 已完成, 已取消, 已暂停}"
    expression: "ORDER_STATUS = ['执行中','已完成','已取消','已暂停']"
    guaranteed_by: 'ORDER_STATUS 常量 + saveOrder 状态机校验 + 字段设置选项'
    file: 'index.html:1271（ORDER_STATUS）/ 3293-3302（校验）'
    status: enforced
    violation_consequence: '状态值越界会使订单在两个区块都不可见（既有事故：历史残留「框架订单」类型）'

  - id: INV-011
    domain: order-sales
    name: 整单未交付 = 0 → 自动「已完成」
    rule: 'orderUndelTotal(o) <= 0 时，非「已取消/已暂停」的订单状态自动置为「已完成」'
    expression: "target = orderUndelTotal(o) <= 0 ? '已完成' : '执行中'"
    guaranteed_by: syncOrderAutoStatus
    file: 'index.html:2266-2278'
    status: enforced
    violation_consequence: '状态与实际交付不符，看板与筛选结果失真'
    note: 'orderUndelTotal 对每行取 max(0, 数量 - deliveredQty)，因此库存订单的欠货（负 deliveredQty）会算进未交付。'

  - id: INV-012
    domain: order-sales
    name: 「已取消」/「已暂停」为手动状态，不被自动规则覆盖
    rule: 'syncOrderAutoStatus 跳过 status 为「已取消」或「已暂停」的订单'
    expression: "if(o.status==='已取消'||o.status==='已暂停') return;"
    guaranteed_by: syncOrderAutoStatus
    file: 'index.html:2269'
    status: enforced
    violation_consequence: '自动规则会「复活」已终止订单，绕过状态机'

  - id: INV-013
    domain: order-sales
    name: 「已完成」不可手动设置，「已取消/已暂停」仅可改回「执行中」
    rule: 'saveOrder 状态机校验：已完成不可手改；已取消/已暂停仅可改回执行中；执行中不可手设已完成'
    guaranteed_by: saveOrder
    file: 'index.html:3293-3302'
    status: enforced
    violation_consequence: '绕过状态机导致订单状态与交付数据脱节'
    note: '前端弹窗选项已限制，saveOrder 内为兜底防篡改。'

  # ===== 下推链 / 状态守卫 =====
  - id: INV-014
    domain: delivery
    name: 计划数量不得超过订单未交付数量
    rule: '交付计划本批计划 ≤ 该行未交付数量（超出时弹确认浮层，可人工确认放行）'
    expression: 'if(it.planQty > it.orderQty - it.deliveredQty) → showConfirmOverlay'
    guaranteed_by: saveDelivery
    file: 'index.html:4786-4797'
    status: partial
    violation_consequence: '计划超量导致「已计划未交付」计算出现负值 / 排产无额度可下'
    gap_detail: '⚠️ 仅软提示（用户点「确认保存」即放行），不是硬约束。'

  - id: INV-015
    domain: delivery
    name: 交付计划只能从订单下推；排产单只能从交付计划下推
    rule: 'deliveries 不能凭空新增（必须选订单带出明细）；productionPlans 不能新增/复制（copyProdPlan 保留定义但无入口）'
    guaranteed_by: [saveDelivery(orderId 必填 + items 非空校验), 'prodPlanModal 仅由交付计划下推入口触发', "copyProdPlan 无 UI 入口（FORM_ACTIONS 无 copy 映射）"]
    file: 'index.html:4791-4793 / 4291（注释）/ 4292'
    status: enforced
    violation_consequence: '产生无订单来源的孤儿交付/排产，全链路关联断裂'

  - id: INV-016
    domain: delivery
    name: 已取消/已暂停订单禁生成交付计划
    rule: "order.status ∈ {已取消, 已暂停} 时禁止下推交付计划"
    guaranteed_by: '前端下推入口校验'
    file: '未核实'
    status: gap
    violation_consequence: '已终止订单被重新激活业务流'
    gap_detail: |
      ⚠️ 业务规则明确（见交付/调拨相关提示文案），但本次未定位到该守卫的精确代码位置。
      同时注意：/api/save 是整键替换且无业务校验，后端不可能兜住此规则。
      标为 gap 是因为「未找到证据」——若人工确认守卫存在，请补 file:行号并改为 enforced。

  - id: INV-017
    domain: order-sales
    name: 已取消/已暂停订单禁调拨退回
    rule: "doReturnStock 内校验 o.status，已取消/已暂停订单禁止退回库存"
    guaranteed_by: doReturnStock
    file: 'js/transfer.js:239-240'
    status: enforced
    violation_consequence: '已终止订单的库存被改动'

  - id: INV-018
    domain: order-sales
    name: 已取消/已暂停订单禁被导入覆盖
    rule: 'kdDoImport 覆盖分支：若目标订单 status 为已取消/已暂停 → 加入 blockedCancel、skipCount++、跳过'
    guaranteed_by: kdDoImport
    file: 'js/import.js:476-477'
    status: enforced
    violation_consequence: '绕过状态机恢复已终止订单'

  - id: INV-019
    domain: field-engine
    name: 表单可用字段由 fields 配置决定（元数据驱动）
    rule: '每个表单的可编辑字段集合 = fields[formKey]；saveXxx 遍历该配置收集数据'
    expression: 'fields[formKey] → isLineField / orderHeadFields / orderLineFields → saveXxx 收集'
    guaranteed_by: '字段引擎 + saveXxx 系列'
    file: 'index.html:3271-3283'
    status: partial
    violation_consequence: '在「字段设置」删/改字段会静默改变所有表单的渲染与保存行为，可能静默丢数据'
    gap_detail: |
      ⚠️ partial 的原因：删除关键字段（如 orderType / contractNo / stockMax）会破坏下游逻辑，
      目前靠「字段锁定（locked）」与若干迁移函数（migrateOrderTypeField / migrateOrderContractNo）打补丁，
      但没有通用防护。已发生过的症状：.88 隐藏 orderType → .93 需专门兜底代码（index.html:3282）。
    note: '这是本系统最容易被低估的耦合面：改 fields 等价于改所有表单。'

  # ===== 一致性 / 存储层 =====
  - id: INV-020
    domain: system-ui
    name: 多表写入无事务保证【现状缺陷】
    rule: '若某命令写入多张表，则「全部成功」或「全部失败」应同时成立'
    expression: 'atomic(command.write_set)'
    guaranteed_by: '无'
    file: 'server/server.js:169-170（整键替换，无 CAS/无事务）+ 各命令的多次独立 save'
    status: gap
    violation_consequence: |
      部分成功 → 数据永久不一致，且无自愈路径（projections.order.calledQty 无全量重算函数）。
      已知实例：
        - applyTransfers：save('orders')(js/transfer.js:327) 与 DB.set('transfers')(js/transfer.js:348)
          之间失败 → orders 已改、台账未落账，仅 alert 提示，不回滚。
        - applyReport：至少 5 次独立网络写（index.html:4614 / 4616→4582 / 4628 / 4630 / 4633-4636）。
        - kdDoImport：3+ 次独立网络写（js/import.js:484 / 485 / 493），且中途有 orders.splice。
    evidence: [HR-001, HR-002, HR-003]
    remediation_hint: |
      建议方向（目标，非现状）：① server 增加批量保存端点 /api/save-batch，一次写多键一次落盘；
      ② 或在前端引入写入队列 + 失败重放日志。任何方案都需配套「不一致检测」脚本。
    note: '本条是整个手册中最重要的 gap。改动涉及多表写入的命令前，必须评估此条。'

  - id: INV-021
    domain: system-ui
    name: 表必须在 server 注册表中登记，否则静默丢数据【现状缺陷】
    rule: '新增数据表必须同时登记 server/server.js 的 DEFAULT_DATA + （BIZ_KEYS 或 SYSTEM_KEYS）'
    expression: 'key ∈ Object.keys(DEFAULT_DATA)'
    guaranteed_by: '/api/save 的兜底：若 key 在 DEFAULT_DATA 中则自动补键，真未知表返回 400'
    file: 'server/server.js:16-26 / 159-167'
    status: partial
    violation_consequence: |
      🔴 静默丢数据。历史事故：transfers 曾漏登记 DEFAULT_DATA，丢失 103 条台账。
      注：.122 起 /api/save 增加了「DEFAULT_DATA 已注册则自动补键」的加固（:161-163），
      缓解了「线上旧 data.json 缺键」场景，但**未解决**「新表未登记」场景（仍返回 400 → 前端 save 失败）。
    gap_detail: |
      ⚠️ partial：兜底只覆盖「已登记但实例缺键」，不覆盖「未登记」。
      未登记时前端 DB.set 会 alert 失败提示（index.html:391-398），但若调用方传 silent=true（如 transfers）则完全静默。
    remediation_hint: '建议新增 CI 检查：扫描前端 save(''key'') / DB.set(''key'') 的 key 集合，与 DEFAULT_DATA 求差集。'

  - id: INV-022
    domain: system-ui
    name: 所有持久化键必须在 initApp 中加载
    rule: 'server 侧登记的键，前端 initApp 必须 DB.get 一次，否则内存中为 undefined → 后续 save 会用 undefined 覆盖服务器'
    expression: 'DB.get(key) 出现在 initApp 中'
    guaranteed_by: initApp
    file: 'index.html:5970-5982'
    status: partial
    violation_consequence: |
      🔴 若某键未在 initApp 加载，内存中无该全局变量 → 引用即 ReferenceError 或 undefined；
      一旦以 undefined/空值 save，会整键替换掉服务器数据。
    gap_detail: '⚠️ 无自动校验。当前 initApp 加载了 products/orders/deliveries/productionPlans/productionReports/processTemplates/logs/transfers/fields/fieldsAudit/fieldsDraft/meta/tblLayout，共 13 个键，与 DEFAULT_DATA 一致，但一致性靠人工维护。'
    note: '与 INV-021 是同一类「注册表一致性」问题，建议合并为一个检测脚本。'

