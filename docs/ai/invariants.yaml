    status: gap
    violation_consequence: |
      🔴 delDelivery 使用 deliveries.splice(idx,1) 物理删除后，
      所有 > idx 的 productionPlans[].deliveryIdx 全部指向**错误的交付计划**，
      导致 buildPlannedUndelMap 把 doneQty 归到别的订单行上 → 「已计划未交付」静默算错，
      且 saveProdPlan 的「不超过未排产」校验也会用错基数。
      目前**没有任何重建/修复函数**。
    gaps: ['delDelivery 未同步修正其他排产单的 deliveryIdx', '无 deliveryIdx 完整性校验', '无修复脚本']
    remediation_hint: |
      目标形态建议：① 给 deliveries 加稳定主键（如 deliveryId），productionPlans 改引用该主键；
      ② 或 delDelivery 内联追加重编号逻辑；③ 提供一次性修复脚本扫描悬空/错位引用。
      任何方案都需先做存量数据体检（见 change-log.yaml 的体检项）。

  - id: INV-024
    domain: system-ui
    name: 索引即主键带来的漂移风险
    rule: '依赖数组索引的字段（orderLine / dlLine / deliveryIdx / directDelivered / 勾选集合）在数组增删后应保持有效'
    expression: '索引一致性'
    guaranteed_by: '若干局部补丁（clearSel / clearGhostSel / clearHiddenOrderSel / clearHiddenProdPlanSel / 按行序补回 directDelivered）'
    file: 'index.html:3590-3601（directDelivered 按行序补回）/ 3652 / 3666 / 5984（clearSel 定义）/ js/import.js:539（clearSel 调用）/ js/transfer.js:353-358'
    status: partial
    violation_consequence: '关联数据挂到错误的行/单上（静默错账）'
    gap_detail: |
      ⚠️ partial：已有 4 组补丁处理「勾选幽灵」与「directDelivered 按行序补回」，
      但 orderLine（交付计划行→订单行）与 deliveryIdx（排产单→交付计划）**无对应补丁**。
      代码注释在多处自陈该风险：index.html:2660（orderLine 漂移）、:3591（directDelivered 漂移）。
    related: [INV-023, INV-006]

  - id: INV-025
    domain: auth
    name: 表单写权限双层控制
    rule: '写业务表需通过 server 的 canWrite(user, key)（表单级）；前端另有 canWriteForm（表单级）+ canAct（按钮级 FORM_ACTS）'
    guaranteed_by: [canWrite(server), canWriteKey/canWriteForm/canAct/needAct(前端)]
    file: 'server/server.js:116-123 / index.html:480-516'
    status: partial
    violation_consequence: '越权写入业务数据'
    gap_detail: |
      ⚠️ 以下三处使前端门控可被绕过（前端门控不是安全边界）：
        1. SYSTEM_KEYS（logs / meta / tblLayout / fieldsAudit / fieldsDraft / transfers / productionReports）
           在 server 侧对**所有登录用户放行**（server.js:119）→ transfers 与 productionReports 后端无权限。
        2. orders 表在 server 侧只要 saleOrders 或 invOrders 任一为 true 即可整表写（server.js:121）
           → 有销售权限的人可通过 /api/save 直接覆盖库存订单。
        3. 历史键 perms.orders 仍被 canWrite 接受（server.js:121 与 index.html:487）→ 迁移期口径不一致。
    note: '前端门控只用于 UI 体验；真正的权限边界在 server，而 server 的粒度粗于前端。'

  - id: INV-026
    domain: system-ui
    name: 认证 token 与会话生命周期
    rule: 'token 校验、TTL 7 天、会话存于内存'
    expression: 'tokens: Map<token, username>；TOKEN_TTL = 7*24*3600*1000'
    guaranteed_by: 'auth() + setInterval 清理'
    file: 'server/server.js:95-96 / 107-115 / 238-241'
    status: partial
    violation_consequence: |
      服务重启 → 全部 token 失效（用户被强制重新登录，功能上可接受但不优雅）；
      且**存在默认凭据**（server.js:61-66：admin/admin123、pmc/chejian/zongjingli = 123456），
      若未在生产环境改密，构成实质风险。
    gap_detail: '⚠️ 默认凭据硬编码在源码中；未强制首次登录改密；token 走 URL query（可能进 access log）。'

  - id: INV-027
    domain: system-ui
    name: 实时同步为「整量拉取 + 整量重渲染」，无并发冲突检测
    rule: '多端并发写时，后写覆盖先写（lost update），且无提示'
    expression: 'revs[key]++ 仅用于「是否变化」判断，不用于冲突检测'
    guaranteed_by: '无'
    file: 'server/server.js:169-170（data[b.key]=b.value 无条件覆盖）+ index.html:409-419（pollRevs 5 秒）'
    status: gap
    violation_consequence: |
      A、B 两端同时编辑不同订单：B 端 5 秒轮询前 A 的修改在 B 端内存中不存在，
      B 端 save('orders') 会用 B 的完整数组覆盖 → A 的修改永久丢失。
      约 10 个用户的规模下已具备发生条件。
    gaps: ['无 CAS（rev 未参与写入校验）', '无冲突提示', '无自动合并']
    remediation_hint: |
      目标形态建议：① /api/save 增加 expectedRev 参数，不匹配则 409；
      ② 前端收到 409 后提示「数据已被他人修改，请刷新后重试」；
      ③ 或改为字段级 patch 端点。现状 revs 已在服务器维护（server.js:170），改造成本不高。

  # ===== 计数类（易随代码演进失效，注明核对方式）=====
  - id: INV-028
    domain: system-ui
    name: 操作日志上限 500 条
    rule: 'logs.length 不超过 500，超出时保留最新 500 条'
    expression: 'if(logs.length>500) logs = logs.slice(0,500)'
    guaranteed_by: logOp
    file: 'js/logs.js:6'
    status: enforced
    violation_consequence: '日志表膨胀（logs 为整键替换，膨胀会放大每次写的网络与磁盘开销）'

  # ===== 销售订单交付/退货域 =====
  - id: INV-029
    domain: order-sales
    name: 销售订单交付/退货不改变产品库存
    rule: '销售订单行 deliveredQty 的增减（交付/退货）只驱动订单状态，不参与库存投影；products.stock 仅由「库存订单行 deliveredQty」汇总而来'
    expression: "saleDeliverSave/saleReturnSave 改 orders.items[].deliveredQty 后【不】调 syncStockFromInvOrders();\nsyncStockFromInvOrders 只汇总 orderTypeOf(o)==='库存订单' 的行"
    guaranteed_by: [saleDeliverSave, saleReturnSave, syncStockFromInvOrders]
    file: 'index.html:2844-2846（交付）/ 2891-2898（退货）/ 3496-3499（投影只取库存订单）'
    status: enforced
    violation_consequence: |
      若误把销售交付接入库存同步（或在 syncStockFromInvOrders 里放开 orderType 过滤），
      会把「客户提货」当成「库存变动」→ 库存被销售订单重复计量，全系统库存口径崩溃。
    note: |
      这是与调拨（E-003）/报工回写（E-019）的关键区别：那两条路径确实联动库存（库存订单行），
      而销售交付/退货【只写单表 orders】。反查 deliveredQty 写入方时必须按 orderType 区分。
      相关边：E-042/E-043/E-044（交付）、E-046/E-047/E-048（退货）。

  - id: INV-030
    domain: order-sales
    name: 销售订单交付行级上限 = min(未交付, 可调用余量)
    rule: 'saleDeliverSave 行级校验：本次交付 ≤ min(未交付(=orderQty−deliveredQty), saleMaxCallable(it))；越限整批拒绝'
    expression: 'maxRow = min(max(0, orderQty−deliveredQty), max(0, calledQty − max(0, deliveredQty−directDelivered)))'
    guaranteed_by: [saleDeliverSave, saleMaxCallable]
    file: 'index.html:3120-3133（行级校验）/ 3111-3140（saleDeliverSave）'
    status: enforced
    violation_consequence: '放行会允许交付量超过已调用库存，形成无库存支撑的交付（账实不符）'
    note: |
      saleMaxCallable 口径（.108，.130 未变）：期初直接交付基数 directDelivered 不消耗调用额度，
      只有超出 directDelivered 的已交付才从 calledQty 扣减。退货会下调 directDelivered（index.html:3185），
      因此「退货 → 交付上限」存在联动，改动任一侧都需重新验证本不变量。
      注：.130 起金蝶导入不再写入 directDelivered（新导入单 deliveredQty≡0、无基数），本行口径仅对存量行生效。

  - id: INV-031
    domain: order-inventory
    name: 库存打通迁移必须「先反填、后对齐」
    rule: 'backfillInvDeliveredFromStock 必须在 syncStockFromInvOrders 之前执行（initApp 与 restoreBackup 均如此）'
    expression: 'initApp: backfillInvDeliveredFromStock() → syncStockFromInvOrders()（行序即执行序）'
    guaranteed_by: 'initApp / restoreBackup 的语句行序（无显式断言）'
    file: 'index.html:6033-6034 / 5920-5921'
    status: enforced
    violation_consequence: |
      顺序颠倒 → syncStockFromInvOrders 先按「库存订单行 deliveredQty 合计 = 0」把有订单产品的 stock 归零，
      backfill 随后把 0 反填回去 → 存量库存永久丢失（不可逆，且幂等机制会「记住」已反填的 0）。
    note: |
      ⚠️ 本不变量【仅靠代码行序保证】，无测试、无断言、无注释强制。
      重构 initApp / restoreBackup 的迁移顺序时极易被无意破坏。相关边：E-054/E-055/E-058。
      对应既有注释在 index.html:6032（「先反填…再同步」）与 3453-3455。

