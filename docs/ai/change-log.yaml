  - date: '2026-08-25'
    build: '2026-08-25.35'
    type: data-migration
    summary: '存量销售订单明细行回填「已调用数量」calledQty：从调拨台账（未冲销记录）统计，type=call 累加、type=return 扣减，下限 0。'
    affected_ids: [entities.orders.items.calledQty, entities.transfers, projections.order.calledQty, INV-005]
    migration:
      function: migrateOrderCalledQty()
      file: 'index.html:2286-2317'
      strategy: |
        map[orderId|lineIdx] += (type==='call' ? +qty : -qty)，跳过 reversed=true 的原记录。
        回填时机为启动迁移链（initApp，index.html:6038）。
        幂等策略：**已有 calledQty 的行直接跳过**（`if(it.calledQty!=null&&it.calledQty!=='')return;`）。
        无调拨记录但有 deliveredQty 的行 → 补 0 兜底。
    rollback: '无。calledQty 为增量维护字段，回滚需从备份恢复。'
    author: 依据代码注释推断（build .35）
    verification:
      - '对每个销售订单行：calledQty === max(0, Σ(未冲销 call 台账 qty) − Σ(未冲销 return 台账 qty))'
    known_gap: |
      ⚠️ 幂等策略是「已有值则跳过」——这意味着**一旦写入错误值，后续启动不会自动修正**。
      且系统没有 calledQty 的全量重算函数（对照 syncStockFromInvOrders 有），
