  - date: '2026-08-23'
    build: '2026-08-23'
    type: rule
    summary: '确立「库存完全由库存订单驱动」口径：products.stock 恒等于 Σ(库存订单行 deliveredQty)，无库存订单的产品库存一律归零。'
    affected_ids: [entities.products, entities.orders, projections.products.stock, INV-001]
    migration:
      function: backfillInvDeliveredFromStock()
      file: 'index.html:3456-3487（调用点 :6033 initApp / :5920 restoreBackup）'
      strategy: |
        先把产品现有库存反填到对应的库存订单已交付数量（使不变量立即成立），
        再执行 syncStockFromInvOrders() 全量对齐。
        幂等策略：仅对「当前已交付合计为 0 且库存 > 0」的产品执行；已有交付或库存 ≤ 0 的跳过。
        分配算法：按各库存订单行 orderQty 比例分配；sumQty=0 时平均分配（余数给第一行）。
    rollback: '无自动回滚。回滚需从备份恢复订单数据（backups/ 目录或 system.restore）。'
    author: 依据代码注释推断（2026-08-23 用户确认口径）
    verification:
      - '对每个产品：Σ(库存订单行 deliveredQty) === products[].stock'
      - '不存在「无库存订单但 stock > 0」的产品'
    note: '这是当前库存模型的地基。改此口径会牵动 INV-001/002/003 与全部读库存的渲染路径。'

