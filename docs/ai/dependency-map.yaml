# ============================================================================
# dependency-map.yaml —— 依赖索引（本手册最重要的一份）
# 系统：辰微生产排产系统（prod-scheduler）
# 对应 build：2026-09-09.122
#
# 用途：按 changed id 直接反查出受影响方，不用扫全仓库。
# 用法：先在 reverse_index 里查 changed id → 拿到边 id → 只展开这些边 → 得到受影响节点。
#
# kind 语义（边类型）：
#   derives  —— from 的数据被 to 全量/增量推导出来（to 是投影）
#   writes   —— from 的执行会修改 to 的持久化数据
#   reads    —— to 在执行时需要读取 from 的数据（只读，但改 from 的字段会改变 to 的行为）
#   guards   —— from 的取值会阻断/放行 to 的执行（校验/闸门）
#   triggers —— from 的变化会触发 to 执行（副作用调用）
#
# sync: true = 同一调用栈内同步完成（但不等于同事务！本系统无事务，见 invariants.yaml#INV-020）
# risk: high / medium / low
# 每条边必须带 file:行号 证据。
# ============================================================================
version: 1
updated: '2026-09-09'
build: '2026-09-09.122'
transaction_model: 无（每次 save/DB.set 都是一次独立的整键替换网络写，失败不回滚）

# ----------------------------------------------------------------------------
# 节点（与 domain-map.yaml 的实体/投影 id 对应，便于交叉引用）
# ----------------------------------------------------------------------------
nodes:
  - { id: entities.products, map: domain-map.yaml#entities.products, kind: fact }
  - { id: entities.orders, map: domain-map.yaml#entities.orders, kind: fact }
  - { id: entities.orders.items.deliveredQty, kind: field, of: entities.orders }
  - { id: entities.orders.items.calledQty, kind: field, of: entities.orders }
  - { id: entities.orders.items.stockMax, kind: field, of: entities.orders }
  - { id: entities.orders.items.directDelivered, kind: field, of: entities.orders }
  - { id: entities.orders.status, kind: field, of: entities.orders }
  - { id: entities.deliveries, map: domain-map.yaml#entities.deliveries, kind: fact }
  - { id: entities.deliveries.items.orderLine, kind: field, of: entities.deliveries }
  - { id: entities.productionPlans, map: domain-map.yaml#entities.productionPlans, kind: fact }
  - { id: entities.productionPlans.items.doneQty, kind: field, of: entities.productionPlans }
  - { id: entities.productionPlans.items.dlLine, kind: field, of: entities.productionPlans }
  - { id: entities.productionReports, map: domain-map.yaml#entities.productionReports, kind: appendonly }
  - { id: entities.transfers, map: domain-map.yaml#entities.transfers, kind: appendonly }
  - { id: entities.logs, map: domain-map.yaml#entities.logs, kind: appendonly }
  - { id: entities.processTemplates, map: domain-map.yaml#entities.processTemplates, kind: fact }
  - { id: entities.fields, map: domain-map.yaml#entities.fields, kind: fact }
  - { id: projections.products.stock, map: domain-map.yaml#projections.products.stock, kind: projection }
  - { id: projections.orders.status, map: domain-map.yaml#projections.orders.status, kind: projection }
  - { id: projections.order.plannedUndelivered, map: domain-map.yaml#projections.order.plannedUndelivered, kind: projection }
  - { id: projections.order.calledQty, map: domain-map.yaml#projections.order.calledQty, kind: projection }
  - { id: entities.products.stock, map: domain-map.yaml#projections.products.stock, kind: field, of: entities.products, note: '别名：products[].stock 字段，语义等于 projections.products.stock（落到事实表同一字段的投影）' }
  - { id: commands.transfer.apply, map: flows.yaml#transfer.apply, kind: command }
  - { id: commands.productionReport.complete, map: flows.yaml#productionReport.complete, kind: command }
  - { id: commands.jindie.import, map: flows.yaml#jindie.import, kind: command }
  - { id: commands.order.upsert, map: flows.yaml#order.upsert, kind: command }
  - { id: commands.order.delete, map: flows.yaml#order.delete, kind: command }
  - { id: commands.order.deliver, map: flows.yaml#order.deliver, kind: command }
  - { id: commands.order.return, map: flows.yaml#order.return, kind: command }
  - { id: commands.system.bootstrap, map: flows.yaml#system.bootstrap, kind: command }
  - { id: commands.system.restore, map: flows.yaml#system.restore, kind: command }
  - { id: commands.system.clear, map: flows.yaml#system.clear, kind: command }
  - { id: migrations.backfillInvDeliveredFromStock, map: flows.yaml#system.bootstrap, kind: command, note: '一次性迁移：按订单量比例把 products.stock 反填到库存订单行 deliveredQty（幂等）' }

# ----------------------------------------------------------------------------
# 边（依赖关系）
# ----------------------------------------------------------------------------
edges:

  # ===== A. 库存投影链（最高频，风险最高）=====
  - id: E-001
    from: entities.orders.items.deliveredQty
    to: projections.products.stock
    kind: derives
    mechanism: "syncStockFromInvOrders()：map[p.id] += num(it.deliveredQty)（仅库存订单） → products[].stock = map[p.id] || 0（全量对齐）"
    sync: true
    full_alignment: true
    file: 'index.html:3494'
    risk: high
    note: '全量对齐而非增量：无库存订单支撑的产品库存会被归零。手工改 products.stock 会在下次重算时被抹掉。'
    invariant_refs: [INV-001, INV-002]

  - id: E-002
    from: projections.products.stock
    to: entities.products
    kind: writes
    mechanism: "syncStockFromInvOrders() 末尾 if(changed) save('products', products)"
    sync: true
    file: 'index.html:3503-3507'
    risk: high
    note: '投影回写事实表——products.stock 是唯一「投影落到事实表同一个字段」的案例'

  - id: E-003
    from: commands.transfer.apply
    to: entities.orders.items.deliveredQty
    kind: writes
    mechanism: "applyTransfers：out.inv → deliveredQty -= qty；in.inv → deliveredQty += qty（允许负数=欠货）"
    sync: true
    file: 'js/transfer.js:322-324'
    risk: high
    invariant_refs: [INV-002, INV-003]

  - id: E-004
    from: commands.transfer.apply
    to: projections.order.calledQty
    kind: writes
    mechanism: "applyTransfers：out.sales → calledQty = max(0, calledQty - qty)；in.sales → calledQty = max(0, calledQty + qty)"
    sync: true
    file: 'js/transfer.js:323 / 325'
    risk: high
    note: '向下限 0 截断 —— 截断会静默吞掉差额，导致 calledQty 与实际调拨台账 Σ 不一致（不可自愈，无全量重算函数）'
    invariant_refs: [INV-005]

  - id: E-005
    from: commands.transfer.apply
    to: projections.products.stock
    kind: triggers
    mechanism: "applyTransfers 内联调 syncStockFromInvOrders()"
    sync: true
    file: 'js/transfer.js:328'
    risk: high
    chain_of: E-003
    note: '传递链：applyTransfers → orders.deliveredQty → products.stock'

  - id: E-006
    from: commands.transfer.apply
    to: projections.orders.status
    kind: triggers
    mechanism: "applyTransfers 内联调 syncOrderAutoStatus()"
    sync: true
    file: 'js/transfer.js:329'
    risk: medium
    chain_of: E-003

  - id: E-007
    from: commands.transfer.apply
    to: entities.transfers
    kind: writes
    mechanism: "moves.forEach → transfers.unshift({...}) → DB.set('transfers', transfers, true)"
    sync: false
    file: 'js/transfer.js:336-348'
    risk: high
    note: |
      ⚠️ 这是本系统最典型的一致性缺口：save('orders') 在 :325（独立网络写 A），
      DB.set('transfers') 在 :348（独立网络写 B）。两者之间失败 → orders 已改、台账未落账，
      :349-351 仅有 alert 提示，无回滚。见 invariants.yaml#INV-020。

  - id: E-008
    from: entities.transfers
    to: projections.order.calledQty
    kind: reads
    mechanism: "migrateOrderCalledQty()：从 transfers（未冲销记录）统计 type=call 累加 / type=return 扣减 → 回填 calledQty"
    sync: true
    file: 'index.html:2286'
    risk: medium
    note: '启动期一次性迁移（幂等：已有 calledQty 的行跳过）。改了 transfers 的结构/类型枚举必须同步改这里。'
    invariant_refs: [INV-005]

  - id: E-009
    from: projections.order.calledQty
    to: entities.orders
    kind: writes
    mechanism: "migrateOrderCalledQty / applyTransfers 均最终 save('orders', orders)"
    sync: true
    file: 'index.html:2311 / js/transfer.js:327'
    risk: medium

  # ===== B. 订单状态机链 =====
  - id: E-010
    from: entities.orders.items.deliveredQty
