    sync: true
    file: 'index.html:3038-3039 / js/import.js:503-504'
    risk: medium
    note: |
      .108 引入（导入时标记期初基数，写入式见下）；.130 起导入不再写入该字段——Excel「已交付/已出库数量」不落库，
      新导入单 items[].deliveredQty ≡ 0，无基数可言（见 change-log .130 条目）。
      存量行仍然成立：if(_impDq>0 && !(num(it.calledQty)>0)) _impItem.directDelivered=_impDq 生成的基数继续生效，
      删除 directDelivered 或改变其语义会让（存量）期初已交付被误判为「已消耗调用额度」，导致后续交付被拦。
    invariant_refs: [INV-006]

  - id: E-017
    from: entities.orders
    to: entities.products
    kind: reads
    mechanism: "lookupRef + 渲染期 prodMap 反查产品（saveOrder 引字段重算、renderOrderTable 显示规格/型号/单位）"
    sync: true
    file: 'index.html:3327-3328'
    risk: low

  - id: E-018
    from: entities.fields
    to: entities.orders
    kind: guards
    mechanism: "saveOrder 遍历 fields.order 收集表头/表体字段；isLineField 区分；orderType 字段缺失时靠代码兜底补回"
    sync: true
    file: 'index.html:3271-3283'
    risk: high
    note: |
      强耦合：saveOrder 的「收集什么」完全由 fields.order 决定。在「字段设置」里删/改字段会静默改变订单保存效果。
      .88 隐藏了 orderType 控件后，.93 需要专门兜底代码；.92 把库存订单数量改成取 stockMax，同样是 fields 驱动。
    invariant_refs: [INV-019]

  # ===== D. 报工回写链（最长跨表链）=====
  - id: E-019
