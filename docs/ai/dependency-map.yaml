# ----------------------------------------------------------------------------
# 三条高风险链路的完整写集与影响面（AI 必读）
# ----------------------------------------------------------------------------
high_risk_chains:

  - id: HR-001
    name: 调拨执行（transfer.apply）
    command: commands.transfer.apply
    entry: 'js/transfer.js:308'
    callers:
      - { file: 'js/transfer.js:224', type: call,    desc: '库存 → 销售（调用库存）' }
      - { file: 'js/transfer.js:291', type: return,  desc: '销售 → 库存（退回库存）' }
      - { file: 'js/transfer.js:379', type: reverse, desc: '冲销（方向对调 + 类型翻转，reverseOf=原记录 id）' }
      - { file: 'js/transfer.js:594', type: 'null',  desc: '库存 → 库存（conv 改装 / move 移库，自动判定）' }
    write_set:
      - { order: 1, target: entities.orders.items.deliveredQty, via: 'in-memory（out.inv 减 / in.inv 加，可为负）', file: 'js/transfer.js:322-324' }
      - { order: 2, target: entities.orders.items.calledQty,    via: 'in-memory（out.sales 减 / in.sales 加，下限 0）', file: 'js/transfer.js:323 / 325' }
      - { order: 3, target: entities.orders,                    via: "save('orders', orders)  ← 独立网络写 A", file: 'js/transfer.js:327' }
      - { order: 4, target: projections.products.stock,         via: 'syncStockFromInvOrders()', file: 'js/transfer.js:328' }
      - { order: 5, target: projections.orders.status,          via: 'syncOrderAutoStatus()', file: 'js/transfer.js:329' }
      - { order: 6, target: entities.transfers,                 via: "transfers.unshift(...) → DB.set('transfers', transfers, true)  ← 独立网络写 B", file: 'js/transfer.js:336-348' }
    perspective_recompute: [projections.products.stock, projections.orders.status]
    log: '由调用方 logOp（applyTransfers 自身不记日志）'
    failure_behavior: "网络写 A 成功 + 写 B 失败 → :349-351 仅 alert 提示，不回滚（orders 已改、台账未落账）"
    known_defects:
      - '两次独立网络写，无事务、无补偿（INV-020）'
      - 'calledQty 向下限 0 截断，静默吞差额，无全量重算函数（projections.order.calledQty 不可自愈）'
    guards: ['前置校验：全部参与方订单/明细须存在，任一缺失整批放弃（:311-319）']

  - id: HR-002
    name: 生产报工（applyReport）
    command: commands.productionReport.complete
    entry: 'index.html:4586'
    write_set:
      - { order: 1, target: entities.productionPlans,            via: "in-memory（steps[step].done += qty / it.doneQty += qty / p.status='生产中'）", file: 'index.html:4593-4606 / 4612' }
      - { order: 2, target: entities.productionPlans,            via: "save('productionPlans', productionPlans)  ← 独立网络写 1", file: 'index.html:4614' }
      - { order: 3, target: entities.orders.items.deliveredQty,  via: 'inboundDelta.forEach → writebackInbound()', file: 'index.html:4616' }
      - { order: 4, target: entities.orders,                     via: "writebackInbound 内 save('orders', orders)  ← 独立网络写 2", file: 'index.html:4582' }
      - { order: 5, target: projections.products.stock,          via: 'writebackInbound 内 syncStockFromInvOrders()', file: 'index.html:4583' }
      - { order: 6, target: entities.productionReports,          via: "productionReports.push(rec) + save('productionReports', productionReports)  ← 独立网络写 3", file: 'index.html:4627-4628' }
      - { order: 7, target: entities.logs,                       via: "logOp('报工', ...)  ← 独立网络写 4", file: 'index.html:4630' }
      - { order: 8, target: entities.productionPlans,            via: "若 allDone 且用户 confirm → p.status='已完成' + save('productionPlans')  ← 独立网络写 5", file: 'index.html:4633-4636' }
    perspective_recompute: [projections.products.stock, projections.orders.status（经 writebackInbound→syncStockFromInvOrders）]
    failure_behavior: '至少 5 次独立网络写，任意一步失败即不一致（INV-020；本次未验证——见 unverified）'
    known_defects:
      - '多次独立 save，无事务'
      - '⚡ 注释矛盾：index.html:4615 注释写「销售/库存订单都回写」，实际 :4580 只回写库存订单'
    guards:
      - 'e.qty<=0 的工序跳过（:4589）'
      - '存量单首次写入新工序键时 ppEnsureSteps 补键（:4592）'

  - id: HR-003
    name: 金蝶导入（kdDoImport）
    command: commands.jindie.import
    entry: 'js/import.js:456'
    write_set:
      - { order: 1, target: entities.orders,   via: '覆盖时 orders.splice(exIdx, 1)（原地删除旧单，触发索引漂移）', file: 'js/import.js:516' }
      - { order: 2, target: entities.products, via: "products.push.apply(newProducts)（仅新建产品时）→ 并入同一次 /api/tx 的 products op（.124 起原子化，原独立 save 已废止）", file: 'js/import.js:522 / 526' }
      - { order: 3, target: entities.orders,   via: "orders.push.apply(newOrders) → 并入同一次 /api/tx 的 orders op（.124 起原子化）", file: 'js/import.js:521 / 529' }
      - { order: 4, target: projections.orders.status, via: 'recomputeOrderAutoStatus()（.124 起写盘前内存重算，随 orders 同一次提交）', file: 'js/import.js:525' }
      - { order: 5, target: entities.logs,     via: "logOp('导入', ...)  ← best-effort 独立通道（silent，不入 tx）", file: 'js/import.js:537' }
    idempotency_key: "src='kingdee' + srcFile + 原始行号（三元组判重）"
    unknown_code_state_machine: ['未决策（不导入）', '新建（黄）', '替换（绿）', '忽视（红）']
    empty_value_rules:
      - '日期空 = 错误（blocked）'
      - '数字空 = 0 + 警告'
      - '文本空 = "空"'
      - '商品编码空 = 跳过该行'
      - '已交付 / 已出库数量（.130 起）= 不落库：落库 items[].deliveredQty ≡ 0、不写 directDelivered（字段保留、存量不动），该数字仅进预检报告提示'
    failure_behavior: '一次 /api/tx 原子提交（.124 起）：任一失败 → 一字不写，DB.tx 已 pullAll + rehydrateFromServer 复原内存。.124 之前为「多表多步网络写、无事务」，splice 后失败会留下「旧单已删、新单未加」的中间态（历史语义，已废止）'
    known_defects:
      - 'orders.splice 导致全局索引漂移（既有补丁：clearSel 清勾选，js/import.js:539）'
      - '新建产品 stock=0/dailyCap=0 需人工补全，无后续提醒机制'
    guards:
      - '未知编码全部决策后才允许导入（js/import.js:459-461）'
      - '已取消/已暂停订单禁覆盖（js/import.js:515）'

  - id: HR-004
    name: 销售订单交付 / 退货（saleDeliverSave / saleReturnSave）
    command: commands.order.deliver / commands.order.return
    entry: 'index.html:2821（saleDeliverSave）/ index.html:2874（saleReturnSave）'
    callers:
      - { file: 'index.html:2785', type: deliver, desc: '销售订单区块「交付」按钮 → 弹窗 → 确认交付' }
      - { file: 'index.html:2871', type: return,  desc: '销售订单区块「退货」按钮 → 弹窗 → 确认退货' }
    write_set:
      - { order: 1, target: entities.orders.items.deliveredQty, via: 'in-memory：交付 +qty（行级上限 min(未交付, saleMaxCallable)）；退货 −qty 并下调 directDelivered', file: 'index.html:2844 / 2891-2895' }
