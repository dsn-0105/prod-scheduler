    sync: true
    file: 'index.html（openDeliveryModal / 交付下推入口）'
    risk: medium
    invariant_refs: [INV-016]
    status: 未核实
    note: '本次未逐行定位该守卫的精确行号；已确认业务规则存在（见 inv-spec 铁律与 delOrder 相关提示），落笔前需补 file:行号'

  - id: E-013
