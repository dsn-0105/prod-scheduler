# ===== I. 销售订单「交付 / 退货」链（单表命令，但触发订单状态投影重算）=====
# 说明：这一类是「只写 orders 单表」的命令，不跨表、不写库存，
#       因此容易被「跨表命令」视角遗漏；但它们会触发 syncOrderAutoStatus()
#       （投影重算），属于必须登记的写入方。
  - id: E-042
    from: commands.order.deliver
    to: entities.orders.items.deliveredQty
    kind: writes
    mechanism: "saleDeliverSave：o.items[u.li].deliveredQty = num(...) + u.qty（行级增量 +，仅销售订单）"
    sync: true
    file: 'index.html:2844'
    risk: high
    invariant_refs: [INV-030]
    note: |
      ⚠️ 销售订单交付【不改库存】：与 E-003（调拨）/ E-019（报工回写）的关键区别——
      本路径只改 orders.items[].deliveredQty，随后【不调用】syncStockFromInvOrders()，
      因此对 products.stock 无影响（销售订单行本来就参与库存投影）。
      行级校验（.108）：本次交付 ≤ min(未交付, saleMaxCallable(it))，见 index.html:2831-2843。

  - id: E-043
    from: commands.order.deliver
    to: entities.orders
    kind: writes
    mechanism: "saleDeliverSave 内 save('orders', orders)"
    sync: true
    file: 'index.html:2845'
    risk: high

  - id: E-044
    from: commands.order.deliver
    to: projections.orders.status
    kind: triggers
    mechanism: "saleDeliverSave 末尾内联调 syncOrderAutoStatus()（交付使未交付合计降至 0 → 自动「已完成」）"
    sync: true
    file: 'index.html:2846'
    risk: high
    chain_of: E-042
    invariant_refs: [INV-011]

  - id: E-045
    from: commands.order.deliver
    to: entities.logs
    kind: writes
    mechanism: "logOp('新增','销售订单','交付「'+o.id+'」...')"
    sync: false
    file: 'index.html:2847'
    risk: low

  - id: E-046
    from: commands.order.return
    to: entities.orders.items.deliveredQty
    kind: writes
    mechanism: "saleReturnSave：_it.deliveredQty = max(0, num(...) - u.qty)；并同步下调 directDelivered = min(directDelivered, deliveredQty)（防负基数/超额豁免）"
    sync: true
    file: 'index.html:2891-2895'
    risk: high
    invariant_refs: [INV-006, INV-030]
    note: '同类关键区别：退货同样【不改库存】。可退货上限 = 当前已交付（maxR = num(it.deliveredQty)），见 index.html:2883。'

  - id: E-047
    from: commands.order.return
    to: entities.orders
    kind: writes
    mechanism: "saleReturnSave 内 save('orders', orders)"
    sync: true
    file: 'index.html:2897'
    risk: high

  - id: E-048
    from: commands.order.return
    to: projections.orders.status
    kind: triggers
    mechanism: "saleReturnSave 末尾内联调 syncOrderAutoStatus()（退货使未交付合计回升 → 「已完成」可能退回「执行中」）"
    sync: true
    file: 'index.html:2898'
    risk: high
    chain_of: E-046

  - id: E-060
    from: commands.order.upsert
    to: entities.orders.items.deliveredQty
    kind: writes
    mechanism: "saveOrder：遍历 #orderItemsTbl 重建 items，行内 deliveredQty 取自表单（f.type==='number' → num(el.value)），整体替换 o.items"
    sync: true
    file: 'index.html:3305-3314'
    risk: high
    invariant_refs: [INV-024]
    note: |
      订单保存是 deliveredQty 的「整体重建」写入方：它不是增量、而是把弹窗里的值直接覆盖到该行。
      因此订单编辑会【覆盖】该行此前的交付累计——这正是「订单编辑也会改变已交付量」的隐藏入口，
      容易被「只有交付/调拨/报工才改 deliveredQty」的直觉误导。
      相关：E-015（重建时按行序补回 directDelivered，防索引漂移）。

  - id: E-049
    from: commands.order.upsert
    to: projections.orders.status
    kind: triggers
    mechanism: "saveOrder 末尾 syncOrderAutoStatus()（:3345）——按未交付合计兜底校正状态"
    sync: true
    file: 'index.html:3345'
    risk: medium
    note: '该调用点已见于 flows.yaml#order.upsert（write_set order 5），此处补登记为依赖边。'

  - id: E-050
    from: commands.order.upsert
    to: projections.products.stock
    kind: triggers
    mechanism: "saveOrder：if(o.orderType==='库存订单') syncStockFromInvOrders()"
    sync: true
    file: 'index.html:3346'
    risk: high

  - id: E-051
    from: commands.order.delete
    to: projections.products.stock
    kind: triggers
    mechanism: "delOrder：if(del && orderTypeOf(del)==='库存订单') syncStockFromInvOrders()（删除库存订单后重算产品库存）"
    sync: true
    file: 'index.html:3442'
    risk: high

# ===== J. 库存打通一次性迁移（写单表 orders，但触发投影重算）=====
  - id: E-052
    from: migrations.backfillInvDeliveredFromStock
    to: entities.orders.items.deliveredQty
    kind: writes
    mechanism: "按订单量比例把 products.stock 反填到库存订单行 deliveredQty（无 orderQty 时均分，余数给首行）"
    sync: true
    file: 'index.html:3456-3482'
    risk: high
    invariant_refs: [INV-001]
    note: |
      幂等条件：仅对「该产品全部库存订单行 deliveredQty 合计为 0 且 products.stock>0」执行；
      已有交付（totalDel>0）或库存≤0 的产品跳过（index.html:3459,3468）。
      目的：使 INV-001（库存 = Σ(库存订单已交付)）在存量数据上立即成立，
      防止随后的 syncStockFromInvOrders 全量对齐把存量库存清零。

  - id: E-053
    from: migrations.backfillInvDeliveredFromStock
    to: entities.orders
    kind: writes
    mechanism: "if(changed) save('orders', orders) + logOp('系统','库存打通',...)"
    sync: true
    file: 'index.html:3483-3486'
    risk: high

  - id: E-054
    from: migrations.backfillInvDeliveredFromStock
    to: projections.products.stock
    kind: triggers
    mechanism: "同一迁移链内由 syncStockFromInvOrders() 紧随其后执行（先反填 → 后对齐，顺序有语义）"
    sync: true
    file: 'index.html:6033-6034 / 5920-5921'
    risk: high
    note: |
      ⚠️ 顺序语义：backfill 必须在 syncStockFromInvOrders 之前。
      顺序颠倒（先对齐后反填）会让「无库存订单支撑的产品」在 syncStock 阶段被归零，
      之后反填无处可填 → 存量库存永久丢失。见 invariants.yaml#INV-031。

# ===== K. 启动/恢复/清空 迁移链的依赖边 =====
  - id: E-055
    from: commands.system.bootstrap
    to: entities.orders.items.deliveredQty
    kind: writes
    mechanism: "initApp 迁移链：backfillInvDeliveredFromStock → syncStockFromInvOrders → migrateOrderStatusData → migrateOrderCalledQty 均会改 orders（内存+save）"
    sync: true
    file: 'index.html:6033-6038'
    risk: high
    note: '整条启动迁移链写 orders 单表，属「单表命令」家族；须与跨表命令一同登记。'

  - id: E-056
    from: commands.system.bootstrap
    to: projections.products.stock
    kind: writes
    mechanism: "initApp：syncStockFromInvOrders() 全量对齐 products.stock"
    sync: true
    file: 'index.html:6034'
    risk: high

  - id: E-057
    from: commands.system.bootstrap
    to: projections.orders.status
    kind: triggers
    mechanism: "initApp：migrateOrderStatusData() 内调 syncOrderAutoStatus(true)（静默，仅统计）"
    sync: true
    file: 'index.html:6036 / 2319'
    risk: medium

  - id: E-058
    from: commands.system.restore
    to: entities.orders.items.deliveredQty
    kind: writes
    mechanism: "restoreBackup(e)：覆盖内存 orders → 重跑迁移链（backfillInvDeliveredFromStock + syncStockFromInvOrders）→ 批量 save"
    sync: true
    file: 'index.html:5916-5924'
    risk: high
    note: 'restoreBackup(e) 定义于 index.html:5894（入口 onclick=restoreBackup(event) @ :330）。恢复路径内联 backfill（:5920）+ syncStock（:5921），顺序与 initApp 一致。'

  - id: E-059
    from: commands.system.clear
    to: entities.orders.items.deliveredQty
    kind: writes
    mechanism: "confirmClear：products=[];orders=[];… → save('orders',orders)（整体清空）"
    sync: true
    file: 'index.html:5943-5944'
    risk: high
    note: 'confirmClear 定义于 index.html:5940；:5943 置空全部业务数组，:5944 起为 6 次 save。'

