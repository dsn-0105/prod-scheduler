    sync: true
    file: 'index.html:3590-3601'
    risk: medium
    note: '字段重建会丢未在弹窗中出现的内部字段（directDelivered），必须靠行序补回——这是索引漂移风险的来源之一。.130 起新导入单不再带该字段，本边仅对存量行（.130 前导入/历史迁移）生效'

