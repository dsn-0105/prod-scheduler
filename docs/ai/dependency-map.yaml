    mechanism: "writebackInbound 内 if(orderTypeOf(o)!=='库存订单')return —— 仅回写库存订单"
    sync: true
    file: 'index.html:4580'
    risk: high
    note: |
      ⚠️ 注释与代码矛盾：index.html:4615 的注释写「销售/库存订单都回写」，
      但 4580 行代码实际只回写库存订单（.97 起销售订单由「交付/退货」驱动）。
