    sync: true
    file: 'index.html:4616'
    risk: high
    note: 'inboundDelta 行级聚合键 = productId + dlLine（dlLine=null 时按 productId 合并）'

  - id: E-024
    from: commands.productionReport.complete
    to: entities.productionReports
    kind: writes
    mechanism: "productionReports.push(rec) → save('productionReports')"
    sync: true
    file: 'index.html:4627-4628'
    risk: high
    note: '与 E-022 / E-023 是三次独立网络写，任一失败即不一致（见 INV-020）'

  - id: E-025
