# ============================================================================
# flows.yaml —— 关键命令流程
# 系统：辰微生产排产系统（prod-scheduler）
# 对应 build：2026-09-09.122
#
# 用途：回答「一次操作按什么顺序写了哪些表、失败会怎样」。
#       排查数据不一致时，对照 write_set 的 order 找「哪一步可能断」。
#
# 通用前提（所有命令共享，不再逐条重复）：
#   - 持久化模型：save(key, value) → DB.set → POST /api/save?token=... {key, value}
#     server 侧 data[key] = value（整键替换）、revs[key]++、saveJson()。无事务、无 CAS。
#   - 前端 save(k,v) 是同步签名但内部异步（DB.set 返回 Promise），调用方不 await → 只能 fire-and-forget。
#   - logOp 内部 save('logs') 亦是独立网络写。
#   - 权限：前端 ensureWrite(表单) + needAct(动作)；server 侧 canWrite(表单)。
# ============================================================================
version: 1
updated: '2026-09-09'
build: '2026-09-09.122'

# ----------------------------------------------------------------------------
flows:

  # ===== 1. 调拨执行（含 5 个入口）=====
  - id: transfer.apply
    name: 调拨执行 —— 唯一的调拨写入器
    entry: applyTransfers(type, moves, opts)
    file: 'js/transfer.js:308-352'
    entry_points:
      - id: transfer.call
        name: 调用库存（库存 → 销售）
        trigger_ui: '销售订单区块 → 勾选 1 张 → 「调用库存」按钮 → 弹窗填量 → 确认调用'
        func_chain: 'openCallStock() → doCallStock(o) → applyTransfers(''call'', moves)'
        file: 'js/transfer.js:207 → 224'
        permission: { form: order_frame, act: 'order_frame.saleCall' }
        precheck: ['必须恰好勾选 1 张销售订单', '每行调用数量 ≤ 该行未交付（放开库存可用量校验，可超调=库存订单记欠货）']
      - id: transfer.return
        name: 退回库存（销售 → 库存）
        trigger_ui: '销售订单区块 → 勾选 1 张 → 「退回库存」按钮'
        func_chain: 'openReturnStock() → doReturnStock(o) → applyTransfers(''return'', moves)'
        file: 'js/transfer.js:271 → 291'
        permission: { form: order_frame, act: 'order_frame.saleReturnStock' }
        precheck: ['订单必须是销售订单', '订单状态不得为 已取消/已暂停', '至少一行 deliveredQty > 0', '退回数量 ≤ 该行销售已交付']
      - id: transfer.conv
        name: 改装（库存 → 库存，跨料号）
        trigger_ui: '库存订单区块 → 调用库存补库 → 跨料号行自动判定为 conv'
        func_chain: 'openInvCallStock() → doInvCallStock() → applyTransfers(null, moves)（moves[i].type=''conv''）'
        file: 'js/transfer.js:594（type 判定在 :584）'
        permission: { form: order_inv, act: 'order_inv.invCall' }
        precheck: ['调用数量不可为负', '每行须选择调出库存订单']
      - id: transfer.move
        name: 移库（库存 → 库存，同料号）
        trigger_ui: 同 transfer.conv（同料号时自动判定为 move）
        func_chain: 'doInvCallStock() → applyTransfers(null, moves)（moves[i].type=''move''）'
        file: 'js/transfer.js:594'
        permission: { form: order_inv, act: 'order_inv.invCall' }
        precheck: 同 transfer.conv
      - id: transfer.reverse
        name: 冲销（生成反向记录）
        trigger_ui: '调拨台账 → 某行「冲销」按钮'
        func_chain: 'reverseTransfer(id) → applyTransfers(revType, [反转的 move], {reverseOf: t.id})'
        file: 'js/transfer.js:355-386'
        permission: { form: transfers, act: null }
        precheck: ['记录存在', '未被冲销（reversed=false）', 'trSide 可取到双侧 orderId', 'trRevType 能映射出反向类型', '关联订单与明细仍存在']

    direction_model: |
      .115 双侧方向模型：每条记录存 out*（调出）/ in*（调入）两侧，
      各带 orderType（'sales'|'inv'）+ lineIdx + productId。
      台账快照：参与方含销售订单 → 取销售侧（客户/合同/商品名）；纯库存互调 → 取调入侧库存行。
      旧键 salesOrderId / invOrderId 已废止（2026-09-06 迁移 122 条）。
    type_enum: [call, return, conv, move, conv_back, move_back]
    aux_functions:
      - { name: trRevType(type), file: 'js/transfer.js:23', desc: '冲销类型映射：call↔return? 见代码；conv→conv_back、move→move_back' }
      - { name: trSide(t, side), file: 'js/transfer.js:33', desc: '取侧（含旧结构推导兜底）' }
      - { name: trSnapOf(t), file: 'js/transfer.js:48', desc: '台账快照兜底（存量单渲染反查）' }
      - { name: TR_TYPE_LABEL, file: 'js/transfer.js:19', desc: '类型中文标签' }

    prechecks:
      - 'moves 非空'
      - '全部参与方订单存在且 items 为数组（缺任一 → 整批 return false，不改任何数据）'
      - '全部 out/in 明细行存在（同上，整批放弃）'

    write_set:
      - { order: 1, step: '改内存：out 侧', detail: 'out.inv → deliveredQty -= qty；out.sales → calledQty = max(0, calledQty - qty)', file: 'js/transfer.js:322-323' }
      - { order: 2, step: '改内存：in 侧',  detail: 'in.inv → deliveredQty += qty；in.sales → calledQty = max(0, calledQty + qty)',  file: 'js/transfer.js:324-325' }
      - { order: 3, step: "save('orders')", detail: '整键替换 orders —— 【独立网络写 A】', file: 'js/transfer.js:327' }
      - { order: 4, step: 'syncStockFromInvOrders()', detail: '重算 products.stock（内部可能再 save(''products'')）', file: 'js/transfer.js:328' }
      - { order: 5, step: 'syncOrderAutoStatus()', detail: '重算订单状态（内部可能再 save(''orders'')）', file: 'js/transfer.js:329' }
      - { order: 6, step: 'transfers.unshift(记录)', detail: '逐 move 生成一条记录（含台账快照 customer/contractNo/productName/spec/model）', file: 'js/transfer.js:337-346' }
      - { order: 7, step: "DB.set('transfers', transfers, true)", detail: '整键替换 transfers（silent=true）—— 【独立网络写 B】', file: 'js/transfer.js:348' }
    perspective_recompute: [projections.products.stock, projections.orders.status]
    log: '由调用方 logOp（applyTransfers 自身不记）；冲销在 reverseTransfer 内 logOp(''冲销'',...)'
    idempotency: '无。重复执行会重复增减（唯一防重是 UI 层 confirm + transfers[].reversed 标记）'
    failure_behavior: |
      【独立网络写 A 成功 + 写 B 失败】→ js/transfer.js:349-351 仅 alert
      「调拨台账保存失败：订单库存变更已生效，但台账记录未保存，请刷新后核对调拨台账。」
      **不回滚**。结果：orders 已改、transfers 未落账 → 库存已变但无台账痕迹，无法追溯。
    rollback: '无自动回滚。人工手段：冲销（但台账缺失时无记录可冲销）→ 只能手工改订单行 + 补录台账。'
    known_defects:
      - '两次独立网络写，无事务/无补偿（invariants.yaml#INV-020）'
      - 'calledQty 向下限 0 截断静默吞差额，无全量重算函数（INV-005）'
      - '前置校验通过后到实际写入之间无并发保护（INV-027）'
    sync: '同步执行，但含异步网络写（不 await）'

  # ===== 2. 生产报工 =====
  - id: productionReport.complete
    name: 生产报工（一次报工 = 一条记录）
    entry: applyReport(pi, entries, items, worker)
    file: 'index.html:4586-4643'
    trigger_ui: '排产计划 → 某排产单「报工」按钮 → 弹窗逐工序填量 + 报工人（必填）→ 确认'
    permission: { form: prodPlan, act: 'prodPlan.ppReport' }
    prechecks:
      - 'productionPlans[pi] 存在'
      - '报工人为弹窗必填'
      - 'entries 中 e.qty<=0 的工序跳过（无增量、不进日志/明细）'

    write_set:
      - { order: 1, step: '改内存：工序累计', detail: 'entries.forEach → st[e.step].done += e.qty（或 st[e.step] += qty）；存量单首次写新键时 ppEnsureSteps 补键', file: 'index.html:4593-4599' }
      - { order: 2, step: '改内存：入库累计 + 行级聚合', detail: "e.step ∈ {inbound, finInbound} → it.doneQty += e.qty 并累积 inboundDelta（键 = productId + dlLine）", file: 'index.html:4600-4607' }
      - { order: 3, step: "p.status='生产中'", detail: "if(p.status==='待排产') → '生产中'", file: 'index.html:4612' }
      - { order: 4, step: "save('productionPlans')", detail: '【独立网络写 1】', file: 'index.html:4614' }
      - { order: 5, step: 'inboundDelta.forEach → writebackInbound()', detail: '逐产品行回写订单 deliveredQty（仅库存订单），内部再 save(''orders'') + syncStockFromInvOrders()', file: 'index.html:4616' }
      - { order: 6, step: "productionReports.push(rec) + save('productionReports')", detail: '【独立网络写 2】rec = {id: prNextId(), planId, date, time, worker, items, createdAt}', file: 'index.html:4618-4628' }
      - { order: 7, step: "logOp('报工', ...)", detail: '【独立网络写 3，写 logs】', file: 'index.html:4630' }
      - { order: 8, step: 'renderContent()', detail: '整量重渲染', file: 'index.html:4632' }
      - { order: 9, step: '若 allDone → confirm → 标记已完成', detail: "p.status='已完成' + save('productionPlans') + logOp（【独立网络写 4/5】，需用户确认）", file: 'index.html:4620-4626' }
    perspective_recompute: [projections.products.stock（经 writebackInbound）, projections.orders.status（经 syncStockFromInvOrders 链路）]
    log: "logOp('报工', '排产计划', '排产单「id」报工：产品·工序+qty、…')"
    idempotency: '无。重复提交会重复累加（依赖用户不重复点击；已报工的修正需走「编辑报工」）'
    failure_behavior: |
      【至少 5 次独立网络写】，任意一步失败即不一致：
        - 写 1 失败 → 已有报工明细但工序累计未保存
        - 写 1 成功 + writebackInbound 失败 → 工序累计已增、订单已交付未增（库存少）
        - writebackInbound 成功 + 写 2 失败 → 库存已变、无报工记录可追溯（无法通过删除报工回退）
      无任何回滚。
    rollback: '无自动回滚。人工手段：删除该条报工（ppDelReport）或改回数量（ppSaveReportEdits），但无报工记录时无入口可回退。'
    known_defects:
      - '多次独立 save，无事务（INV-020）'
      - '⚡ 注释矛盾：index.html:4615 注释写「销售/库存订单都回写」，实际 :4580 代码 if(orderTypeOf(o)!==''库存订单'')return 只回写库存订单（.97 起销售订单由交付/退货驱动）'
      - 'inboundDelta 聚合键用 dlLine 区分（dlLine=null 时按 productId 合并）→ 存量无 dlLine 的多行同产品订单会被合并回写'
    related_flows: [productionReport.delete, productionReport.edit, prodPlan.upsert]
    note: 'inboundDelta 中 rec.orderLine = ppOrderLineOf(p, it)，即「排产行 → 交付行 → 订单行」三级索引传递（invariants.yaml#INV-024）'

  # ===== 3. 删除单条报工 =====
  - id: productionReport.delete
    name: 删除单条报工（同步回退工序累计 + 扣回订单已交付）
    entry: ppDelReport(id)
    file: 'index.html:3856-3900'
    trigger_ui: '排产计划 → 报工明细 → 某行「删除」'
    permission: { form: prodPlan, act: 'prodPlan.ppReportEdit' }
    prechecks:
      - ensureWrite('prodPlan')
      - needAct('prodPlan.ppReportEdit')
      - 'productionReports.findIndex(r => r.id===id) 命中'
      - '用户 confirm（提示会同步回退累计，不可撤销）'

    write_set:
      - { order: 1, step: '改内存：工序累计回退', detail: 'dec = min(record.qty, 当前累计)；st[step] = max(0, 当前 - dec)；入库类工序同时 it.doneQty -= dec', file: 'index.html:3873-3883' }
      - { order: 2, step: '若 p.status===''已完成'' 且 !allDone → 状态回退为 ''生产中''', file: 'index.html:3886-3887' }
      - { order: 3, step: "save('productionPlans')", detail: '【独立网络写 1】', file: 'index.html:3888' }
      - { order: 4, step: 'productionReports.splice(idx,1)', detail: '物理删除（注意：非软删除）', file: 'index.html:3889' }
      - { order: 5, step: "save('productionReports')", detail: '【独立网络写 2】', file: 'index.html:3890' }
      - { order: 6, step: 'inboundDelta → writebackInbound(负增量)', detail: '扣回订单 deliveredQty（内部再 save(''orders'') + syncStockFromInvOrders()）', file: 'index.html:3892' }
      - { order: 7, step: "logOp('删除报工', ...)", detail: '【独立网络写 3】', file: 'index.html:3893' }
    perspective_recompute: [projections.products.stock, projections.orders.status]
    log: "logOp('删除报工', '排产计划', '删除排产单「planId」报工 日期 时间：明细（累计已回退）')"
    idempotency: '幂等性由「记录存在性」保证（删除后 findIndex 返回 -1 → 提前 return）'
    failure_behavior: '3 次独立网络写；若写 3（writebackInbound）失败 → 报工记录已删但订单已交付未扣回（订单虚增交付），且无入口再回退'
    rollback: '无。需手工改订单行 deliveredQty'
    known_defects:
      - '物理 splice 删除报工记录（有损可追溯性，invariants.yaml#INV-009）'
      - 'inboundDelta 用对象键聚合（inboundDelta[productId]）→ 同产品多行会被合并为一次回写（产品级，非行级）'
      - 'planId 悬空：若排产单已不存在，p=undefined → 只删报工记录，不回退工序累计与订单（静默跳过）'

  # ===== 4. 编辑报工明细 =====
  - id: productionReport.edit
    name: 编辑报工明细（报工人 / 各工序数量）
    entry: ppSaveReportEdits(id, updates, agg, oldInbound, itMap)
    file: 'index.html:3764 / 3860-3890'
    trigger_ui: '排产计划 → 报工明细 → 「编辑报工」'
    permission: { form: prodPlan, act: 'prodPlan.ppReportEdit' }
    prechecks: ['修改后累计不得超过本次排产量（overMsg 校验）']
    write_set:
      - { order: 1, step: '改内存：覆盖累计', detail: 'st[step].done = agg[k][step]；入库类同时 it.doneQty = agg[k][step]，inboundDelta 记 (新-旧)', file: 'index.html:3874-3884' }
      - { order: 2, step: '覆盖报工记录', detail: 'rec.worker = u.worker；(rec.items||[]).forEach → x.qty = num(u.qtyMap[x.step])', file: 'index.html:3885-3887' }
      - { order: 3, step: '状态回退', detail: "若 p.status==='已完成' 且 !allDone → '生产中'", file: 'index.html:3889-3890' }
      - { order: 4, step: "save('productionPlans')", detail: '【独立网络写 1】', file: 'index.html:3891' }
      - { order: 5, step: "save('productionReports')", detail: '【独立网络写 2】', file: 'index.html:3892' }
      - { order: 6, step: 'inboundDelta → writebackInbound()', detail: '回写订单（内部再 save(''orders'')）', file: 'index.html:3894' }
      - { order: 7, step: "logOp('编辑报工', ...)", detail: '【独立网络写 3】', file: 'index.html:3895' }
    perspective_recompute: [projections.products.stock, projections.orders.status]
    failure_behavior: '同 productionReport.complete：多次独立写，无事务'
    known_defects: ['inboundDelta 按产品聚合（非行级）', '报工记录的 qty 被原地覆盖，历史值不可追溯（仅 logOp 留一条汇总日志）']

  # ===== 5. 排产单下推（新建）=====
  - id: prodPlan.upsert
    name: 下推/编辑排产单（拆单 + 状态机 + 回写回滚）
    entry: saveProdPlan(idx)
    file: 'index.html:4185-4282'
    trigger_ui:
      - '交付计划 → 勾选 → 「下推排产计划」→ 弹窗填本次排产数量 → 保存（idx<0，新建）'
      - '排产计划 → 某单「编辑」→ 改数量/日期/备注 → 保存（idx>=0）'
    permission: { form: prodPlan, act: 'delivery.delPushPlan（下推）/ prodPlan.ppEdit（编辑）' }

    prechecks:
      - 'pp_id 非空、pp_planDate 非空'
      - "本次排产 ≤ 未排产（total - already，按 dlLine 行级；存量无 dlLine 回退产品级）→ 超出则 alert 并 return"
      - '本次排产不低于已完成（ppStepDone > q 则 alert 并 return）'
      - '至少保留一行「本次排产数量 > 0」的明细'
    splitting_logic: |
      .25 拆单：每个「本次排产数量 > 0」的明细行生成一张独立排产单。
      单号格式 PSCD-YYYYMMDD-NNN（当日最大序号 +1，padStart(3,'0')）。
      （目标：已定稿为现状实现，非建议）

    write_set:
      - order: 1
        step: '（编辑场景）状态变化 → 回滚/重加订单已交付'
        detail: |
          if(status !== old.status)：
            cancelTo = (status === '已取消')；cancelFrom = (old.status === '已取消')
            对旧单每行：d = ppDoneOf(it)；若 d>0 且 (cancelTo||cancelFrom)
              → writebackInbound(p.orderId, it.productId, cancelTo ? -d : d, ppOrderLineOf(p, it))
          （内部再 save('orders') + syncStockFromInvOrders()）
        file: 'index.html:4235-4241'
      - { order: 2, step: '改内存：覆盖排产单', detail: 'p.planDate/finalDate/status/notes/materialReadyDate/items = finalItems', file: 'index.html:4242-4243' }
      - { order: 3, step: "save('productionPlans')", detail: '【独立网络写 1】（新建场景为 push 多张新单后保存）', file: 'index.html:4275' }
      - { order: 4, step: "logOp('编辑'/'新增', ...) + logFieldDiffs", detail: '【独立网络写 2】（写 logs）', file: 'index.html:4244 / 4272' }
      - { order: 5, step: 'closeModal() + renderContent()', detail: '整量重渲染', file: 'index.html:4276-4277' }
    perspective_recompute: [projections.order.plannedUndelivered（渲染期）, projections.products.stock（当触发回滚时）, projections.orders.status]
    log: "logOp('编辑'|'新增', '排产计划', '排产单「id」调整排产数量/信息' | '新增「id」（订单xxx）')"
    idempotency: '无。编辑为覆盖式（幂等）；下推为追加式（重复下推会多次拆单，靠 UI 入口 + 未排产上限校验收窄）'
    failure_behavior: '多次独立网络写；回滚分支（writebackInbound）失败 → 排产单已取消但订单已交付未回退（订单虚增交付）'
    rollback: '编辑场景可再改回原状态（会触发反向回滚）；但若中途失败产生的不一致无自动修复'
    known_defects:
      - 'status 不可手动编辑（:4198）——由投产/报工自动转变，但 saveProdPlan 仍会把 status 写入（值来自原对象）'
      - '回滚粒度基于 ppDoneOf(old) 全量（不是差量），若历史上其他路径已部分回滚，会重复扣减'
      - 'deliveryIdx 为数组索引（INV-023）；新建时由 p.deliveryIdx 继承自交付计划下推上下文'
    note: '排产单禁新增/复制：copyProdPlan 保留定义但无 UI 入口（FORM_ACTIONS 无 copy 映射、批量栏无复制按钮），见 index.html:4291 注释'

  - id: prodPlan.cancel
    name: 取消 / 恢复排产单
    entry: saveProdPlan(idx>=0) 内的状态分支
    file: 'index.html:4235-4241'
    trigger_ui: '排产计划 → 编辑弹窗（状态下拉相关分支）'
    permission: { form: prodPlan, act: 'prodPlan.ppEdit' }
    write_set:
      - { order: 1, step: '非取消 → 已取消', detail: 'writebackInbound(orderId, productId, -d, orderLine) —— 扣回已回写交付（已取消不占交付额度）', file: 'index.html:4239' }
      - { order: 2, step: '已取消 → 非取消', detail: 'writebackInbound(orderId, productId, +d, orderLine) —— 重新加回', file: 'index.html:4239' }
      - { order: 3, step: "save('productionPlans')", detail: '回滚写之后', file: 'index.html:4275' }
    note: '回滚发生在 save 之前（先改 orders 再改 plans）——顺序意味着若 orders 写失败，plans 仍会被保存为已取消，产生不一致'
    failure_behavior: |
      回滚写（writebackInbound → save('orders')）先行，save('productionPlans') 后行。
      若回滚写失败 → 订单 deliveredQty 未回退，但后续 save('productionPlans') 仍会把状态改为「已取消」/恢复
      → 状态与交付数据背离。无回滚机制。
    rollback: '再次触发生态变化（改回原状态）会执行反向回滚；若已产生不一致，需人工核算订单 deliveredQty。'

