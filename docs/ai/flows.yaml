  # ===== 8b. 销售订单交付 / 退货（单表命令，但触发状态投影重算）=====
  # 这一类是「只写 orders 单表、不跨表、不改库存」的命令，容易被「跨表命令」视角遗漏。
  - id: order.deliver
    name: 销售订单交付（saleDeliverSave）
    entry: saleDeliverDlg() → saleDeliverSave(oi)
    file: 'index.html:2751（弹窗 2751-2799）/ 2821（保存 2821-2850）'
    trigger_ui: '订单管理 → 销售订单区块 → 勾选 1 张 → 「交付」按钮 → 弹窗逐行填本次交付数量 → 确认交付'
    permission: { form: order_frame, act: 'order_frame.saleDeliver' }
    prechecks:
      - '必须恰好勾选 1 张销售订单（saleDeliverDlg：2754-2755）'
      - '订单存在且状态不得为 已取消/已暂停（:2759）'
      - '订单有明细行（:2760-2761）'
      - '至少一行本次交付数量 > 0（:2842）'
      - '行级上限：本次交付 ≤ min(未交付, saleMaxCallable(it))；越限则整批拒绝（:2831-2843）'
    write_set:
      - { order: 1, step: '改内存：行级增量', detail: 'updates.forEach(u => o.items[u.li].deliveredQty = num(...) + u.qty)', file: 'index.html:2844' }
      - { order: 2, step: "save('orders')", detail: '【独立网络写 1】', file: 'index.html:2845' }
      - { order: 3, step: 'syncOrderAutoStatus()', detail: '交付使未交付合计降到 0 → 自动「已完成」—— 【条件性写 2】', file: 'index.html:2846' }
      - { order: 4, step: "logOp('新增','销售订单','交付「id」N 台（M 行）')", detail: '【独立网络写 3】（写 logs）', file: 'index.html:2847' }
    perspective_recompute: [projections.orders.status]
    NOT_in_write_set:
      - '⚠️ products.stock —— 本命令【不写库存】、不调用 syncStockFromInvOrders()。销售订单 deliveredQty 只驱动订单状态，不参与库存投影（库存只由库存订单行汇总）。'
    idempotency: '不幂等（每次点确认都是一次增量交付）；重复提交会重复累加 deliveredQty'
    failure_behavior: "save('orders') 成功 + syncOrderAutoStatus 失败 → 行已交付、订单状态未跟随（下次启动由 migrateOrderStatusData 兜底纠正）"
    rollback: '无自动回滚；人工手段：用「退货」反向冲减（可退上限=当前已交付）'
    known_defects:
      - '与「调拨/报工」的混淆风险：两者都会改 deliveredQty，但只有调拨/报工联动库存。改动时勿把交付误接进 syncStockFromInvOrders'
      - '行级上限依赖 saleMaxCallable（calledQty − max(0, deliveredQty − directDelivered)），口径与 directDelivered 强耦合（INV-006）'
    related_edges: [E-042, E-043, E-044, E-045]

  - id: order.return
    name: 销售订单退货（saleReturnSave）
    entry: saleReturnDlg(orderId) → saleReturnSave(orderId)
    file: 'index.html:2852（弹窗 2852-2873）/ 2874（保存 2874-2902）'
    trigger_ui: '订单管理 → 销售订单区块 → 「退货」按钮 → 弹窗逐行填退货数量 → 确认退货'
    permission: { form: order_frame, act: 'order_frame.saleReturn' }
    prechecks:
      - '订单存在且有明细行（:2854-2856）'
      - '至少一行退货数量 > 0（:2889）'
      - '行级上限：退货 ≤ 可退货 = 当前已交付 max(0, num(it.deliveredQty))（:2883, :2890）'
    write_set:
      - { order: 1, step: '改内存：行级减量', detail: '_it.deliveredQty = max(0, num(...) - u.qty)', file: 'index.html:2893' }
      - { order: 2, step: '改内存：直接交付基数下调', detail: 'if(directDelivered != null) _it.directDelivered = min(num(directDelivered), num(deliveredQty))（防负基数/超额豁免；.108）', file: 'index.html:2895' }
      - { order: 3, step: "save('orders')", detail: '【独立网络写 1】', file: 'index.html:2897' }
      - { order: 4, step: 'syncOrderAutoStatus()', detail: '退货使未交付合计回升 → 「已完成」可能退回「执行中」—— 【条件性写 2】', file: 'index.html:2898' }
      - { order: 5, step: "logOp('新增','销售订单','退货「id」N 台（M 行）')", detail: '【独立网络写 3】', file: 'index.html:2899' }
    perspective_recompute: [projections.orders.status]
    NOT_in_write_set:
      - '⚠️ products.stock —— 与 order.deliver 同：退货不改库存。'
    idempotency: '不幂等（每次确认都是减量）；可退上限由当前已交付兜住，不会退到负数'
    failure_behavior: '同 order.deliver：save 成功 + syncOrderAutoStatus 失败 → 状态未跟随（启动迁移兜底）'
    rollback: '无自动回滚；人工手段：重新「交付」补回（受 saleMaxCallable 上限约束）'
    known_defects:
      - '退货同时下调 directDelivered（:2895）——改这里会改变后续所有交付的行级上限，属高影响改动'
    related_edges: [E-046, E-047, E-048]

  # ===== 9. 启动迁移链 =====
  - id: system.bootstrap
    name: 启动迁移链（每次打开页面执行，全部应幂等）
    entry: bootstrap() → initApp()
    file: 'index.html:5953-5966 / 5966-6047'
    trigger_ui: '页面加载 / 登录成功'
    steps:
      - { order: 1, step: '服务器模式：pullAll() 全量拉取', file: 'index.html:5957' }
      - { order: 2, step: '/api/me 恢复 currentUser（权限）', file: 'index.html:5968-5974' }
      - { order: 3, step: 'DB.get 加载 13 个键', detail: 'products/orders/deliveries/productionPlans/productionReports/processTemplates/logs/transfers/fields/fieldsAudit/fieldsDraft/meta/tblLayout', file: 'index.html:5975-5987' }
      - { order: 4, step: '字段类迁移', detail: 'normalizeFields → migrateSpecSplit → migrateRemoveProductFields → migrateProductFieldsOptional → migrateProductDailyCap', file: 'index.html:5995-6004' }
      - { order: 5, step: 'seed（仅 meta.seeded 未置且三表皆空）', detail: '避免覆盖已有数据', file: 'index.html:6007-6010' }
      - { order: 6, step: '数据迁移', detail: 'migrateOrders → migrateOrderStockRange → migrateOrderItemProductAttrs → migrateOrderItemLineNotes → migrateOrderTypeField → migrateOrderContractNo → migrateOrderStatusField → migrateDeliveryFields → migrateDeliveryCreatedAt → migrateDeliveryOrderLine → migrateInventoryOrderIds → migrateFrameworkToSales', file: 'index.html:6013-6030' }
      - { order: 7, step: 'backfillInvDeliveredFromStock()', detail: '产品库存按订单量比例反填到库存订单已交付（幂等：已有交付或库存≤0 跳过）', file: 'index.html:6033（定义 3456-3487）' }
      - { order: 8, step: 'syncStockFromInvOrders()', detail: '库存全量对齐（必须在反填之后，见 notes.step_order_semantics）', file: 'index.html:6034' }
      - { order: 9, step: 'migrateOrderStatusData()', detail: '待排产→执行中 + 按未交付初始化状态（内部调 syncOrderAutoStatus(true)，见 :2319）—— 须在反填之后', file: 'index.html:6036' }
      - { order: 10, step: 'migrateOrderCalledQty()', detail: '从调拨台账回填 calledQty', file: 'index.html:6038' }
      - { order: 11, step: 'ensureDefaultTpl() → migrateProductProcessTpl()', detail: '工序模板', file: 'index.html:6040-6041' }
      - { order: 12, step: 'bootDone=true → renderAll() → initNavDrag() → startSync()', detail: '启动 5 秒轮询', file: 'index.html:6043-6047' }
    notes:
      step_order_semantics: |
        ⚠️ 步骤 7 → 8 的顺序【有语义】，不可颠倒：
        backfillInvDeliveredFromStock 先把存量 products.stock 反填进库存订单行 deliveredQty，
        使「库存 = Σ(库存订单已交付)」（INV-001）立刻成立；
        随后 syncStockFromInvOrders 做全量对齐时，「无库存订单支撑的产品」才会被归零（本就无库存），
        而「有库存订单支撑的产品」因已反填而不会被清零。
        若颠倒（先对齐后反填）：syncStock 阶段会先把有订单产品的 stock 按「交付合计=0」清零，
        反填随后把 0 反填回去 → 存量库存永久丢失（不可逆）。
        同理步骤 9（migrateOrderStatusData）也须在反填之后，否则状态按未反填的未交付量算错。
    idempotency: '设计上全部幂等（各迁移函数自带 changed 判断与「已有值不覆盖」逻辑）'
    failure_behavior: '每个迁移函数内部独立 save；中途失败 → 部分迁移生效。但下次启动会重新执行（幂等），通常可自愈'
    write_set:
      - { order: 1, step: 'backfillInvDeliveredFromStock（内存）', detail: '按订单量比例反填库存订单行 deliveredQty', target: entities.orders.items.deliveredQty, file: 'index.html:3456-3482' }
      - { order: 2, step: "backfill 内 save('orders')", detail: '仅 changed 时', target: entities.orders, file: 'index.html:3484' }
      - { order: 3, step: 'syncStockFromInvOrders()', detail: '全量对齐 products.stock', target: projections.products.stock, file: 'index.html:6034' }
      - { order: 4, step: 'syncOrderAutoStatus(true)', detail: '经 migrateOrderStatusData 静默初始化状态', target: projections.orders.status, file: 'index.html:6036 / 2319' }
      - { order: 5, step: 'migrateOrderCalledQty()', detail: '从 transfers 回填 calledQty', target: entities.orders.items.calledQty, file: 'index.html:6038' }
    known_defects:
      - '迁移链较长（约 20 步），每次打开页面都跑一遍——新增迁移时必须保证幂等，否则会反复改写数据'
      - 'migrateOrderCalledQty 的幂等性是「已有 calledQty 则跳过」，因此一旦写入错误值，后续启动不会修正'
      - '反填与对齐的顺序语义仅靠代码行序保证，无显式断言；重构 initApp 时极易被无意颠倒'
    related_edges: [E-052, E-053, E-054, E-055, E-056, E-057]

  # ===== 10. 全量恢复 / 清空（运维命令）=====
  - id: system.restore
    name: 从备份文件恢复全部数据
    entry: restoreBackup（文件 input change 处理）
    file: 'index.html:5905-5940'
    trigger_ui: '系统 → 恢复备份 → 选 .json'
    write_set:
      - { order: 1, step: '覆盖内存全局数组', detail: 'products/orders/deliveries/... 从备份赋值', file: 'index.html:5908-5912' }
      - { order: 2, step: 'fieldsAudit=''audited''；fieldsDraft=null', detail: '草稿作废', file: 'index.html:5914' }
      - { order: 3, step: 'normalizeFields → migrateOrders → migrateFrameworkToSales → backfillInvDeliveredFromStock → syncStockFromInvOrders', detail: '重跑关键迁移', file: 'index.html:5916-5921' }
      - { order: 4, step: '批量 save 全部键', detail: "save('products'/'orders'/'deliveries'/'productionPlans'/'productionReports'/'processTemplates'/'logs'/'fields'/'meta')", file: 'index.html:5922-5924' }
      - { order: 5, step: 'renderAll() + logOp(''恢复'',...)', detail: '', file: 'index.html:5925-5930' }
    known_defects: ['未恢复 transfers / fieldsDraft / tblLayout（恢复后这些键保持当前服务器值，可能与备份不匹配）', '9 次独立 save，无事务']
    failure_behavior: |
      9 次独立 save 无事务。中途失败 → 部分键已恢复、部分未恢复（例如 orders 已换为备份值而 products 仍是当前值）
      → products.stock 与 orders 的库存订单行不再满足 INV-001，需重新执行 syncStockFromInvOrders 对齐。
      另：transfers / fieldsDraft / tblLayout 不在恢复范围内，恢复后可能形成跨表引用错位。
    rollback: '从备份文件再恢复一次；或在恢复后手工执行 syncStockFromInvOrders / backfillInvDeliveredFromStock 对齐。'

  - id: system.clear
    name: 清空全部业务数据
    entry: confirmClear()
    file: 'index.html:5944-5950'
    trigger_ui: '系统 → 清空数据（两次 confirm）'
    write_set:
      - { order: 1, step: '置空全局数组', detail: 'products/orders/deliveries/productionPlans/productionReports/processTemplates = []', file: 'index.html:5946' }
      - { order: 2, step: '批量 save', detail: "6 次 save（不含 logs/fields/meta/transfers/tblLayout）", file: 'index.html:5947-5948' }
      - { order: 3, step: "logOp('清空','全部数据')", detail: '', file: 'index.html:5949' }
    known_defects: ['⚠️ 不清 transfers / logs / fields / meta —— 清空后调拨台账仍在（悬空引用），meta.seeded 仍为 true']
    failure_behavior: |
      6 次独立 save 无事务；中途失败 → 部分业务表已清空、部分未清空（残留孤儿数据）。
      另：不清 transfers，清空后调拨台账仍引用已不存在的订单（悬空引用）；
      不清 meta → meta.seeded 仍为 true，因此「重新初始化示例数据」不会再次触发（清空后系统为空白而非示例态，属预期但易误解）。
    rollback: '不可逆。只能从备份文件恢复（system.restore）；清空前的自动备份（本地模式，AUTO_BACKUP_MIN=15 分钟间隔）是主要保障。'

# ----------------------------------------------------------------------------
# 跨命令一致性总览（按 write_set 反查：谁的写集重叠谁就可能互相破坏）
# ----------------------------------------------------------------------------
write_set_overlap:
  entities.orders:
    writers: [order.upsert, order.delete, order.deliver, order.return, transfer.apply, productionReport.complete(经 writebackInbound), productionReport.edit, productionReport.delete, prodPlan.upsert, prodPlan.cancel, prodPlan.delete, jindie.import, system.bootstrap(迁移:backfillInvDeliveredFromStock/migrateOrderStatusData/migrateOrderCalledQty), system.restore, system.clear]
    risk: high
    note: |
      orders 是全系统竞争最激烈的表：15+ 个写入方，全部走整键替换。并发/中断场景下极易互相覆盖。
      ⚠️ 注意「单表命令」家族（order.deliver / order.return / backfillInvDeliveredFromStock）：
      它们只写 orders、不跨表，但会触发 syncOrderAutoStatus（投影重算）——容易被「只盯跨表命令」的反查遗漏。
  entities.products:
    writers: [product.upsert, syncStockFromInvOrders(投影), jindie.import, system.bootstrap, system.restore, system.clear]
    risk: high
    note: |
      products 的 stock 字段被投影函数全量覆写；人工编辑 stock 会被静默抹掉。
      ⚠️ 但「改 stock 的原始数据」另有入口：backfillInvDeliveredFromStock（库存打通迁移）会把 stock 反填进订单，
      之后由 syncStockFromInvOrders 回写——即 stock 的最终值 = Σ(库存订单已交付)，反填只是首次对齐（见 INV-031）。
  entities.productionPlans:
    writers: [prodPlan.upsert, prodPlan.delete, productionReport.complete, productionReport.edit, productionReport.delete, system.restore, system.clear]
    risk: high
  entities.transfers:
    writers: [transfer.apply(唯一)]
    risk: medium
    note: '唯一写入器，相对集中；但写入方与 orders 的写入不是同一事务（关键缺口）。'
  entities.deliveries:
    writers: [delivery.upsert, delDelivery, system.restore, system.clear]
    risk: medium
  entities.productionReports:
    writers: [productionReport.complete, productionReport.edit, productionReport.delete, system.restore, system.clear]
    risk: medium
  entities.logs:
    writers: [logOp —— 全系统 73 处调用]
    risk: low
    note: 'logs 为整键替换（最多 500 条），每次 logOp 都是一次完整表写入；高频操作下网络开销不可忽略。'

