      - { order: 2, step: 'products.push.apply(newProducts)', detail: '未知编码选「新建」时构造产品 {id,name,spec,model,unit,stock:0,dailyCap:0,stockMin:0,status:''启用''}', file: 'js/import.js:455-458' }
      - { order: 3, step: "save('products')", detail: '【独立网络写 1，仅当有新产品的条件性写】', file: 'js/import.js:484' }
      - { order: 4, step: 'orders.push.apply(newOrders) + save(''orders'')', detail: '【独立网络写 2】新单固定 orderType=销售订单、status=执行中、src=kingdee、srcFile', file: 'js/import.js:483-485' }
      - { order: 5, step: 'syncOrderAutoStatus()', detail: '按未交付合计自动判定（Excel 已交付全量 → 已完成）—— 【条件性写 3】', file: 'js/import.js:486' }
      - { order: 6, step: "logOp('导入', '订单管理', detail)", detail: '【独立网络写 4】（写 logs）detail 含导入单数/行数/覆盖数/忽视数/新建产品数/跳过数', file: 'js/import.js:493' }
      - { order: 7, step: "clearSel('order_frame')", detail: '清理勾选（因 splice 导致索引漂移，.5 修复）', file: 'js/import.js:495' }
    perspective_recompute: [projections.orders.status]
    item_construction:
      - 'productName/spec/model 以产品主数据为准回填（不是 Excel 原值）'
      - 'deliveredQty > 0 且 calledQty 无值 → 标记 directDelivered（.108）'
      - 'stockMax / stockMin 置空字符串（销售订单不用）'
    failure_behavior: |
      3~4 次独立网络写 + 中途 splice：
        若 splice 成功、save('orders') 失败 → 旧单已从内存数组中删除但未落库（服务器仍是旧数据，下一次 pullAll 会恢复）——
        但内存与服务器不一致期间若发生其他 save('orders')，会把「已删旧单」的版本写上去 → 静默丢单。
    rollback: '无。人工手段：从备份恢复（restoreBackup）。'
    known_defects:
      - 'orders.splice 触发索引漂移（既有补丁：clearSel）'
      - '新建产品 stock=0/dailyCap=0 需人工补全，导入完成仅 alert 提示，无后续待办机制'
      - '「覆盖」是「删旧 + 插新」（splice + push），不是原地更新 → 订单数组顺序改变，加剧索引漂移'

  # ===== 7. 库存全量重算 =====
  - id: inventory.rebuild
    name: 库存全量重算（投影幂等重建）
    entry: syncStockFromInvOrders()
    file: 'index.html:3494-3505'
    trigger_ui: '无直接 UI 按钮；由 saveOrder / delOrder / writebackInbound / applyTransfers / restoreBackup / initApp 调用'
    permission: null
    read_set: [entities.orders（orderType=库存订单 的行）, entities.products]
    write_set:
      - { order: 1, step: '聚合 map', detail: 'orders.forEach → 仅 orderTypeOf(o)===''库存订单'' → it.productId → map[pid] += num(it.deliveredQty)', file: 'index.html:3495-3500' }
      - { order: 2, step: '全量对齐 products.stock', detail: 'products.forEach: v = map[p.id] || 0（无库存订单 → 0）；if(num(p.stock)!==v){p.stock=v;changed=true}', file: 'index.html:3501-3502' }
      - { order: 3, step: "save('products')", detail: '仅当 changed —— 【独立网络写】', file: 'index.html:3503' }
    idempotency: '完全幂等。可安全重复执行，是系统的「自愈函数」。'
    failure_behavior: 'save 失败 → 内存已对齐、服务器未更新（下次 pullAll 回滚）'
    callers:
      - { file: 'index.html:3346', context: 'saveOrder（库存订单）→ 见 flows#order.upsert / 边 E-050' }
      - { file: 'index.html:3442', context: 'delOrder（删除库存订单）→ 见 flows#order.delete / 边 E-051' }
      - { file: 'index.html:4583', context: 'writebackInbound → 见 flows#productionReport.complete / 边 E-021' }
      - { file: 'index.html:5921', context: 'restoreBackup（从备份恢复）→ 见 flows#system.restore / 边 E-058' }
      - { file: 'index.html:6034', context: 'initApp 启动迁移链（backfillInvDeliveredFromStock 之后）→ 见 flows#system.bootstrap / 边 E-056' }
      - { file: 'js/transfer.js:328', context: 'applyTransfers → 见 flows#transfer.apply / 边 E-005' }
    related_migration: backfillInvDeliveredFromStock（index.html:3456-3487，定义）—— 把产品现有库存按订单量比例反填到库存订单已交付，使本不变量在存量数据上立即成立（幂等：已有交付或库存≤0 的跳过）。调用点：initApp :6033 / restoreBackup :5920。见 flows#system.bootstrap / 边 E-052~E-054。
    note: |
      ⚠️ 本系统唯一「可自愈」的投影。对照 projections.order.calledQty —— 那个没有全量重算函数，
      一旦损坏无法自愈（invariants.yaml#INV-005）。若做健壮性改造，建议以本函数为范式补齐其他投影的重算能力。

