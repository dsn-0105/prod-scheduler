    unknown_code_state_machine:
      states: ['未决策（默认不导入）', '新建（黄）', '替换（绿）', '忽视（红）']
      guard: '全部未知编码决策完毕后才允许导入（未决策 → alert + 滚动定位到第一个未决策行）'
    empty_value_rules:
