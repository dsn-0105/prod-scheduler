# ============================================================================
# 生产站点 nginx 配置（基础骨架 · 真源）
# ----------------------------------------------------------------------------
# ⚠️ 禁直接覆盖服务器！服务器上 /etc/nginx/sites-available/default 还会被
#    deploy-qa.sh 幂等注入一段「# >>> qa-system BEGIN ... END」质量系统 location
#    (/api/qa/ + /quality/)。直接 cp 本文件过去 = 把质量系统配置整段删掉。
#    改配置一律「精准插入」并先备份，见 2026-11-26 性能优化作业记录。
#
# 【perf-20261126】传输层性能优化（A 方案，纯配置、0 行业务代码）
#   根因：nginx.conf 中 gzip_types / gzip_proxied 均被注释
#         => 默认仅压 text/html，application/json 与 application/javascript 全程裸传
#         => 且 /api 走 proxy_pass 时 gzip_proxied 默认 off，补了 types 也压不上代理响应
#   另：listen 缺 http2 => HTTP/1.1 六连接上限，8 个静态资源排队两轮
#   实测收益（线上，本机网络）：
#     传输总量 1003KB -> 132KB（-87%）
#     /api/data 842927B/1716ms -> 69145B/40ms（-92%）
#     点登录→首屏出表 2104ms -> 约 420ms；整体进入 2479ms -> 约 730ms（-70%）
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;
    root /var/www/html;
    index index.html;
    ssl_certificate /etc/nginx/ssl/prod.crt;
    ssl_certificate_key /etc/nginx/ssl/prod.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Cache-Control "no-cache";
    # ===== perf-20261126 (方案A：传输压缩) =====
    # gzip_proxied any 是 /api 生效的**必要**条件，缺它则 gzip_types 形同虚设。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml text/javascript image/svg+xml;
    # ===== /perf-20261126 =====
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # 质量系统 location (/api/qa/、/quality/) 由 deploy-qa.sh 幂等注入，不在此文件维护
    location / {
        try_files $uri $uri/ =404;
    }
}
