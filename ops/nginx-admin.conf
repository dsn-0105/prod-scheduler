# >>> admin-system BEGIN (managed by deploy-admin.sh — do not edit manually) >>>
# 管理员后台（/admin/）· 由 deploy-admin.sh 幂等插入。删除本块前请先跑 rollback-qa.sh 的同款思路手工回滚。
#
# 【本块只有一条 location —— 静态资源交给服务端既有 root 直接服务】
#   依据线上实际配置（见 ops/nginx-current.conf）：
#       root /var/www/html;  index index.html;  location / { try_files $uri $uri/ =404; }
#   ⇒ 请求 /admin/ 时：$uri（/admin/）不是文件 ⇒ 试 $uri/（=/admin/）
#      命中真实目录 ⇒ nginx 内部重定向到 /admin/ ⇒ index 指令命中
#      /var/www/html/admin/index.html ⇒ **200，服务端自带 root 已够用**。
#   ⇒ 再加 location /admin/ { alias … } 属冗余：多一条配置就多一条出错面，
#      且 alias 与 root 并存容易在后续维护中引出「到底哪个生效」的歧义。
#   ⇒ /api/*（含 /api/me、/api/users、/api/perm-meta）沿用既有 location /api → 生产 3000，
#      本块**不新增任何反代规则**（管理员后台是纯静态页，不新建后端进程/端口/数据文件）。
#
# 【为什么必须显式写 /admin（无尾斜杠）→ 301】
#   若不写这一条，location / 的 try_files $uri/ 会「内部重定向」到 /admin/ 并直接返回 200，
#   此时**浏览器地址栏仍是 /admin**（没有尾斜杠），页面里的相对路径 src="admin-app.js"
#   会被解析成 /admin-app.js ⇒ 404，后台白屏（且顶栏/导航都没有，看起来像"打不开"）。
#   301 把地址栏修正为 /admin/ 才能让相对资源正常解析 —— 与 /quality 那条同因同果。
#   deploy-admin.sh 的断言②专门守这条（期望恰好 301）。
location = /admin {
    return 301 /admin/;
}
# <<< admin-system END <<<
