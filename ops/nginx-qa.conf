# >>> qa-system BEGIN (managed by deploy-qa.sh — do not edit manually) >>>
# 质量系统 · 由 deploy-qa.sh 幂等插入。删除本块前请先跑 rollback-qa.sh。
# 【匹配优先级说明】nginx 前缀 location 一律「最长前缀优先」，与书写顺序无关；
#   故 /api/qa/ (8 chars) 恒优先于 /api (4 chars)，不会被写作顺序影响。
#   置于 location /api 之前仅为可读性。
#
# 【本块只有两条 location —— 第 ③ 段「质量系统静态资源」被刻意省略】
#   依据线上实际配置（见 ops/nginx-current.conf）：
#       root /var/www/html;  index index.html;  location / { try_files $uri $uri/ =404; }
#   ⇒ 请求 /quality/ 时：$uri（/quality/）不是文件 ⇒ 试 $uri/（=/quality/，合并双斜杠后）
#      命中真实目录 ⇒ nginx 内部重定向到 /quality/ ⇒ index 指令命中
#      /var/www/html/quality/index.html ⇒ **200，服务端自带 root 已够用**。
#   ⇒ 再加 location /quality/ { alias … } 属冗余：多一条配置就多一条出错面，
#      且 alias 与 root 并存容易在后续维护中引出「到底哪个生效」的歧义。
#   服务器级 add_header Cache-Control "no-cache" 已覆盖 /quality/，故不另设 expires。

# ① 质量系统 API → qa-server:3001
location /api/qa/ {
    proxy_pass            http://127.0.0.1:3001;
    proxy_http_version    1.1;
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    # 显式转发 Bearer（nginx 默认会转发客户端头，但写明可防未来有人误加 proxy_set_header Authorization ""）
    proxy_set_header      Authorization     $http_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;
    client_max_body_size  1m;
}

# ② /quality 无尾斜杠 → 301（**必须显式写**，不是为了好看）
#   若不写这一条，location / 的 try_files $uri/ 会「内部重定向」到 /quality/ 并直接返回 200，
#   此时**浏览器地址栏仍是 /quality**（没有尾斜杠），页面里的相对路径 src="qa-core.js"
#   会被解析成 /qa-core.js ⇒ 404，质量系统白屏。301 把地址栏修正为 /quality/ 才能让
#   相对资源正常解析。deploy-qa.sh 的断言②专门守这条（期望恰好 301）。
location = /quality {
    return 301 /quality/;
}
# <<< qa-system END <<<
